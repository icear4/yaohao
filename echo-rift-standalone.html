<script>
/* ===========================================================
   map.js — 程序生成的房间地图（网格 / 节点结构）
   - Start 房固定
   - Boss 房位于地图末端
   - 所有房间由「从已有房间生长」产生 → 天然连通，无孤立房间
   - 相同 Seed + 相同层数 → 完全相同地图
   =========================================================== */
'use strict';

const ROOM_TYPE = {
  START: 'start',
  COMBAT: 'combat',
  TREASURE: 'treasure',
  ELITE: 'elite',
  SHOP: 'shop',
  EVENT: 'event',
  BOSS: 'boss',
  SECRET: 'secret'
};

const ROOM_META = {
  start:    { cn: '起点',   color: '#7dffb0', glyph: 'S' },
  combat:   { cn: '战斗',   color: '#8fa3b5', glyph: '·' },
  treasure: { cn: '宝库',   color: '#ffd35e', glyph: 'T' },
  elite:    { cn: '精英',   color: '#ff8a5c', glyph: 'E' },
  shop:     { cn: '商栈',   color: '#7fe4ff', glyph: '$' },
  event:    { cn: '异象',   color: '#c08bff', glyph: '?' },
  boss:     { cn: '首领',   color: '#ff4d6b', glyph: 'B' },
  secret:   { cn: '秘室',   color: '#c08bff', glyph: '*' }
};

const DIRS = [
  { side: 'top', dc: 0, dr: -1 },
  { side: 'bottom', dc: 0, dr: 1 },
  { side: 'left', dc: -1, dr: 0 },
  { side: 'right', dc: 1, dr: 0 }
];

class GameMap {
  constructor(seed, floor) {
    this.seed = seed;
    this.floor = floor || 1;
    this.rng = new Rng(hashSeed(seed) ^ hashSeed('floor:' + this.floor));
    this.cols = 0;
    this.rows = 0;
    this.cells = [];
    this.grid = {};        // key "c,r" -> cell
    this.visited = {};
    this.current = null;
    this.start = null;
    this.boss = null;
    this.generate();
  }

  /* ---------------------------------------------------------
     生成
     --------------------------------------------------------- */
  generate() {
    const rng = this.rng;
    /* 章节决定地图规模（每层的主场尺寸不同） */
    const ch = ChapterOf(this.floor);
    const sz = ch.size || { cols: 5, rows: 5 };
    this.cols = clamp(sz.cols, 5, 7);
    this.rows = clamp(sz.rows, 5, 6);
    const cols = this.cols, rows = this.rows;

    /* 1. 起点固定在最左列（纵向居中附近） */
    const startR = rows >= 5 ? 2 + rng.int(-1, 1) : Math.floor(rows / 2);
    const start = this._add(0, clamp(startR, 0, rows - 1));
    this.start = start;
    start.type = ROOM_TYPE.START;

    /* 2. 主路径：从起点一路向右生长到最右列 → 末端即 Boss */
    let cur = start;
    let guard = 0;
    const mainPath = [start];
    while (cur.c < cols - 1 && guard++ < 200) {
      /* 先在当前列纵向游走 0~2 格，再向右推进一格。
         注意：纵向漂移必须在「尚未进入最右列」时完成，
         否则会在最右列留下比 Boss 更远的房间，破坏 Boss 的末端性。 */
      const vSteps = rng.int(0, 2);
      const vDir = rng.chance(0.5) ? -1 : 1;
      for (let i = 0; i < vSteps; i++) {
        const nr = cur.r + vDir;
        if (nr < 0 || nr >= rows) break;
        cur = this._add(cur.c, nr);
        mainPath.push(cur);
      }
      /* 向右推进（最后一次推进一定落在最右列，其后不再漂移 → 末端即 Boss） */
      cur = this._add(cur.c + 1, cur.r);
      mainPath.push(cur);
    }

    /* 3. Boss = 主路径末端（一定在最右列） */
    this.boss = cur;
    cur.type = ROOM_TYPE.BOSS;

    /* 4. 分支：从主路径上的房间长出 2~4 条短支线 */
    const branchCount = clamp(2 + rng.int(0, 2), 2, 4);
    const branchRoots = rng.shuffle(mainPath.slice(0, Math.max(1, mainPath.length - 1)));
    let made = 0;
    for (let i = 0; i < branchRoots.length && made < branchCount; i++) {
      const root = branchRoots[i];
      if (root === this.start || root === this.boss) continue;
      /* 支线不从末端附近长出，保证 Boss 房始终是地图尽头 */
      if (root.c >= this.boss.c - 1) continue;
      const len = rng.int(1, 2);
      let node = root;
      for (let s = 0; s < len; s++) {
        const dirs = rng.shuffle(DIRS);
        let placed = null;
        for (const d of dirs) {
          const nc = node.c + d.dc, nr = node.r + d.dr;
          if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) continue;
          if (this.grid[nc + ',' + nr]) continue;
          if (nc >= this.boss.c) continue;          // 不越过 Boss 所在列
          /* 支线房间只能挂在自己父节点上：避免支线互相粘连后比 Boss 更远 */
          let otherNeighbors = 0;
          for (const dd of DIRS) {
            const nb = this.grid[(nc + dd.dc) + ',' + (nr + dd.dr)];
            if (nb && nb !== node) otherNeighbors++;
          }
          if (otherNeighbors > 0) continue;
          placed = this._add(nc, nr);
          break;
        }
        if (!placed) break;
        node = placed;
      }
      made++;
    }

    /* 5. 分配房间类型 */
    this._assignTypes(mainPath);

    /* 6. 建立连接（四方向相邻即连通） */
    this._linkAll();

    /* 7. 保险：确保 Boss 一定是离 Start 最远的房间（末端） */
    this._ensureBossTerminal();

    /* 8. 隐藏房：放在保险之后，避免被剪枝逻辑误删 */
    this._placeSecretRooms();
  }

  /* ---------------------------------------------------------
     隐藏房
     - 挂在一个普通房间的空邻位上（死路尽头）
     - 未发现前：地图不显示，父房间也不开门
     - 发现条件：击碎父房间墙上那道可疑裂缝
     --------------------------------------------------------- */
  _placeSecretRooms() {
    const rng = this.rng;
    const want = this.floor <= 1
      ? (rng.chance(0.55) ? 1 : 0)
      : (rng.chance(0.45) ? 2 : 1);

    /* 父房间必须离 Start 足够近：秘室 = 父房间距离 +1，
       所以要保证 秘室距离 < Boss 距离，Boss 才始终是地图尽头 */
    const d0 = this.distancesFromStart();
    const bd = d0[this.boss.c + ',' + this.boss.r];
    const parents = rng.shuffle(this.cells.filter(c => {
      if (c === this.start || c === this.boss || c.type === ROOM_TYPE.BOSS) return false;
      if (c.c >= this.boss.c - 1) return false;        // 也要远离 Boss 所在列
      const dd = d0[c.c + ',' + c.r];
      return dd !== undefined && dd + 1 < bd;
    }));

    let made = 0;
    for (const parent of parents) {
      if (made >= want) break;
      const sides = rng.shuffle(DIRS.slice());
      let ok = false;
      for (const d of sides) {
        if (parent.links[d.side]) continue;                 // 该方向已有房间
        const nc = parent.c + d.dc, nr = parent.r + d.dr;
        if (nc < 0 || nc >= this.cols || nr < 0 || nr >= this.rows) continue;
        if (this.grid[nc + ',' + nr]) continue;
        /* 新格子除了父房间外不能有别的邻居（保持死路尽头） */
        let extra = 0;
        for (const dd of DIRS) {
          const nb = this.grid[(nc + dd.dc) + ',' + (nr + dd.dr)];
          if (nb && nb !== parent) extra++;
        }
        if (extra > 0) continue;

        const cell = this._add(nc, nr);
        cell.type = ROOM_TYPE.SECRET;
        cell.hidden = true;
        cell.discovered = false;
        cell.branch = true;
        /* 记录裂缝开在哪一侧（父房间视角） */
        parent.secretSide = d.side;
        parent.secretCell = cell;
        cell.parentCell = parent;
        this._linkAll();
        ok = true;
        made++;
        break;
      }
      if (!ok) continue;
    }
  }

  /* BFS 距离表（以 Start 为原点） */
  distancesFromStart() {
    const d = {};
    d[this.start.c + ',' + this.start.r] = 0;
    const q = [this.start];
    while (q.length) {
      const cur = q.shift();
      for (const dir of DIRS) {
        const n = cur.links[dir.side];
        if (!n) continue;
        const k = n.c + ',' + n.r;
        if (d[k] !== undefined) continue;
        d[k] = d[cur.c + ',' + cur.r] + 1;
        q.push(n);
      }
    }
    return d;
  }

  /* 若存在比 Boss 更远的房间，整批剪掉。
     安全性说明：BFS 最短路经过的中间房间距离严格递减，
     因此「距离 > Boss 距离」的房间被删除后，剩下的房间仍全部连通（无孤立）。 */
  _ensureBossTerminal() {
    for (let pass = 0; pass < 12; pass++) {
      const d = this.distancesFromStart();
      const bd = d[this.boss.c + ',' + this.boss.r];
      const doomed = this.cells.filter(c => {
        if (c === this.boss || c === this.start) return false;
        const dd = d[c.c + ',' + c.r];
        return dd === undefined || dd > bd;      // 不可达 或 比 Boss 更远
      });
      if (!doomed.length) break;
      for (const cell of doomed) {
        delete this.grid[cell.c + ',' + cell.r];
        const idx = this.cells.indexOf(cell);
        if (idx >= 0) this.cells.splice(idx, 1);
      }
      this._linkAll();
    }
  }

  _add(c, r) {
    const key = c + ',' + r;
    if (this.grid[key]) return this.grid[key];
    const cell = {
      id: this.cells.length,
      c: c, r: r,
      type: ROOM_TYPE.COMBAT,
      links: {},             // side -> cell
      branch: false
    };
    this.grid[key] = cell;
    this.cells.push(cell);
    return cell;
  }

  _assignTypes(mainPath) {
    const rng = this.rng;

    /* 主路径（含起点/Boss）上的中间房间：多为战斗，偶尔精英 / 异象 */
    for (const cell of mainPath) {
      if (cell === this.start || cell === this.boss) continue;
      const roll = rng.next();
      if (roll < 0.16) cell.type = ROOM_TYPE.ELITE;
      else if (roll < 0.30) cell.type = ROOM_TYPE.EVENT;
      else cell.type = ROOM_TYPE.COMBAT;
    }

    /* 支线房间：宝库 / 商栈 / 异象为主 */
    const branches = this.cells.filter(c => c !== this.start && c !== this.boss &&
      !mainPath.includes(c));
    const shuffled = rng.shuffle(branches);

    /* 保证：至少一间宝库；房间多时保证一间商栈 */
    const want = [];
    want.push(ROOM_TYPE.TREASURE);
    if (shuffled.length >= 3) want.push(ROOM_TYPE.SHOP);
    if (shuffled.length >= 5) want.push(ROOM_TYPE.TREASURE);
    if (this.floor >= 2 && shuffled.length >= 4) want.push(ROOM_TYPE.ELITE);

    for (let i = 0; i < shuffled.length; i++) {
      const cell = shuffled[i];
      if (i < want.length) {
        cell.type = want[i];
      } else {
        const roll = rng.next();
        if (roll < 0.34) cell.type = ROOM_TYPE.TREASURE;
        else if (roll < 0.56) cell.type = ROOM_TYPE.EVENT;
        else if (roll < 0.78) cell.type = ROOM_TYPE.ELITE;
        else cell.type = ROOM_TYPE.COMBAT;
      }
      cell.branch = true;
    }

    /* 兜底：如果没有宝库（支线太少），把某个非 Boss 战斗房改成宝库 */
    if (!this.cells.some(c => c.type === ROOM_TYPE.TREASURE)) {
      const cand = this.cells.filter(c => c !== this.start && c !== this.boss &&
        c.type === ROOM_TYPE.COMBAT);
      if (cand.length) cand[rng.int(0, cand.length - 1)].type = ROOM_TYPE.TREASURE;
    }
  }

  _linkAll() {
    for (const cell of this.cells) {
      cell.links = {};
      for (const d of DIRS) {
        const n = this.grid[(cell.c + d.dc) + ',' + (cell.r + d.dr)];
        if (n) cell.links[d.side] = n;
      }
    }
  }

  /* ---------------------------------------------------------
     查询
     --------------------------------------------------------- */
  /* 门的连接：未发现的隐藏房不出现在父房间的门列表里 */
  connectionsOf(cell) {
    const out = {
      top: !!cell.links.top,
      bottom: !!cell.links.bottom,
      left: !!cell.links.left,
      right: !!cell.links.right
    };
    for (const d of DIRS) {
      const n = cell.links[d.side];
      if (n && n.hidden && !n.discovered) out[d.side] = false;
    }
    return out;
  }

  /* 揭示整张地图（回廊残图） */
  revealAll() {
    for (const c of this.cells) {
      if (c.hidden && !c.discovered) continue;
      this.visit(c);
    }
  }

  secretCells() { return this.cells.filter(c => c.hidden); }

  /* 计入探索度的房间数（未发现的隐藏房不算在内） */
  countableRooms() {
    return this.cells.filter(c => !c.hidden || c.discovered).length;
  }

  countableVisited() {
    let n = 0;
    for (const c of this.cells) {
      if (c.hidden && !c.discovered) continue;
      if (this.isVisited(c)) n++;
    }
    return n;
  }

  neighbor(cell, side) { return cell.links[side] || null; }

  visit(cell) {
    this.visited[cell.c + ',' + cell.r] = true;
  }

  isVisited(cell) { return !!this.visited[cell.c + ',' + cell.r]; }

  typeCount(type) {
    let n = 0;
    for (const c of this.cells) if (c.type === type) n++;
    return n;
  }

  /* 从 Start 做 BFS，返回可达集合 —— 用于自检 */
  reachableFromStart() {
    const seen = {};
    const q = [this.start];
    seen[this.start.c + ',' + this.start.r] = true;
    while (q.length) {
      const cur = q.shift();
      for (const d of DIRS) {
        const n = cur.links[d.side];
        if (!n) continue;
        const k = n.c + ',' + n.r;
        if (seen[k]) continue;
        seen[k] = true;
        q.push(n);
      }
    }
    return seen;
  }

  /* 用于测试与「同种子一致性」比对 */
  serialize() {
    const cells = this.cells.slice().sort((a, b) => (a.c - b.c) || (a.r - b.r))
      .map(c => `${c.c},${c.r}:${c.type}:${Object.keys(c.links).sort().join('')}`);
    return `seed=${this.seed};floor=${this.floor};size=${this.cols}x${this.rows};` + cells.join('|');
  }
}

</script>
<script>
/* ===========================================================
   spawn.js — 敌人生成编队系统（数据驱动）
   -----------------------------------------------------------
   设计目标：
     1. 不是「把所有敌人随机混在一起」，而是按「编队主题」成组出现
     2. 普通房：弱敌人 + 单一主题
     3. 精英房：强敌人 + 特殊敌人 + 精英词缀（由 Room 施加）
     4. 后期房：多兵种协同（前排 + 远程 + 辅助）
     5. 弹幕安全：限制弹幕型 / 辅助型数量，保证任何组合都有解
   新增敌人不需要改这里 —— 只需要在 enemy_roster.js 里注册时
   填好 cat / cost / minDepth / tags 即可自动进入编队池。
   =========================================================== */
'use strict';

/* -----------------------------------------------------------
   编队主题（数据驱动：新增主题只需加一条）
   ----------------------------------------------------------- */
const SPAWN_THEMES = [
  {
    id: 'rush', cn: '突袭', minDepth: 0, weight: 34,
    melee: 0.80, ranged: 0.20, special: 0.0,
    prefer: ['chaser', 'charger', 'hopper', 'gnasher']
  },
  {
    id: 'gunline', cn: '弹线', minDepth: 0, weight: 22,
    melee: 0.45, ranged: 0.55, special: 0.0,
    prefer: ['shooter', 'marksman', 'wisp', 'fanner']
  },
  {
    id: 'swarm', cn: '虫潮', minDepth: 1, weight: 18,
    melee: 0.85, ranged: 0.15, special: 0.0,
    prefer: ['swarmer', 'slougher', 'chaser', 'gnasher']
  },
  {
    id: 'siege', cn: '围城', minDepth: 2, weight: 16,
    melee: 0.55, ranged: 0.30, special: 0.15,
    prefer: ['brute', 'spiker', 'turret', 'marksman', 'charger']
  },
  {
    id: 'occult', cn: '诡术', minDepth: 2, weight: 16,
    melee: 0.35, ranged: 0.35, special: 0.30,
    prefer: ['phantom', 'blinker', 'bomber', 'ringer', 'wisp']
  },
  {
    id: 'cohort', cn: '战阵', minDepth: 3, weight: 16,
    melee: 0.45, ranged: 0.25, special: 0.30,
    prefer: ['aegis', 'mender', 'curator', 'bogger', 'summoner', 'brute', 'ringer']
  }
];

const SpawnDirector = {
  /* ---------------------------------------------------------
     主入口：返回 { waves: [[type...], ...], theme: '主题名' }
     --------------------------------------------------------- */
  build(opt) {
    opt = opt || {};
    const rng = opt.rng || new Rng(1);
    const depth = opt.depth || 0;
    const isElite = !!opt.isElite;
    const type = opt.type;
    const ch = opt.chapter || ChapterOf(depth + 1);
    const poolCfg = ch.pool || {};

    /* Boss 房：每一层有自己的 Boss 池（第 1 层固定回廊守望者） */
    if (type === ROOM_TYPE.BOSS) {
      const bossId = BossRoster.pick(depth + 1, rng.fork('boss'));
      const guard = (ch.guard || []).slice();
      return { waves: [[bossId].concat(guard)], theme: BossRoster.nameOf(bossId) };
    }

    /* 1. 选主题（章节限定的主题集合，保证每层战斗风格不同） */
    let pool = SPAWN_THEMES.filter(t => depth >= t.minDepth);
    if (poolCfg.themes && poolCfg.themes.length) {
      const byChapter = pool.filter(t => poolCfg.themes.indexOf(t.id) >= 0);
      if (byChapter.length) pool = byChapter;
    }
    const theme = this._weighted(rng, pool.length ? pool : [SPAWN_THEMES[0]]);

    /* 2. 预算（精英与后期房间显著更高；章节再叠加自己的预算） */
    let budget = isElite ? 16 + depth * 3.4 : 9 + depth * 2.9;
    budget += (poolCfg.budget || 0);
    budget = Math.min(budget, isElite ? 50 : 34);

    const maxCount = isElite ? 10 : (depth >= 3 ? 9 : (depth >= 1 ? 7 : 6));
    const maxTotal = maxCount + (poolCfg.max || 0);

    /* 3. 分类池（过滤：未隐藏 + 达深度 + 未被禁用） */
    const reg = EnemyFactory.registry;
    const has = (d, tag) => d.tags && d.tags.indexOf(tag) >= 0;
    const usable = k => {
      const d = reg[k].def;
      return !d.hidden && !!d.cat && d.cat !== 'boss' && (d.minDepth || 0) <= depth;
    };
    const byCat = cat => Object.keys(reg).filter(k => usable(k) && reg[k].def.cat === cat);

    const meleePool = byCat('melee');
    const rangedPool = byCat('ranged');
    const specialPool = byCat('special');
    if (!meleePool.length) return { waves: [['chaser']], theme: theme.cn };

    /* 主题偏好优先，池子为空时退回全池；章节偏好再叠一层（每层主角不同） */
    const bias = list => {
      const p = list.filter(k => theme.prefer.indexOf(k) >= 0);
      return p.length ? p : list;
    };
    const chBias = list => {
      if (!poolCfg.prefer || !poolCfg.prefer.length) return list;
      const p = list.filter(k => poolCfg.prefer.indexOf(k) >= 0);
      return p.length ? p : list;
    };
    const pickFrom = list => chBias(bias(list));

    const chosen = [];
    const spend = id => { chosen.push(id); budget -= (reg[id].def.cost || 3); };
    const countOf = pred => chosen.filter(pred).length;

    /* 4. 辅助位（全场最多 1 个，且深层/精英房才出现） */
    const supportPool = pickFrom(specialPool.filter(k => has(reg[k].def, 'support')));
    /* 章节的特殊敌人出现率越高，越容易出现辅助 / 特殊位 */
    let wantSupport = isElite || depth >= 3 || (depth >= 2 && theme.id === 'cohort') ||
      (poolCfg.special > 0.2);
    if (wantSupport && supportPool.length) spend(rng.pick(supportPool));

    /* 5. 弹幕位（数量受严格上限，避免无法躲避的弹幕墙） */
    const bulletPool = pickFrom(rangedPool.filter(k => has(reg[k].def, 'bullethell')));
    let bulletCap = depth >= 4 ? 2 : (depth >= 1 ? 1 : 0);
    bulletCap = Math.max(bulletCap, poolCfg.bullet || 0);
    if (isElite) bulletCap = Math.min(2, bulletCap + 1);
    for (let i = 0; i < bulletCap && bulletPool.length; i++) {
      const id = rng.pick(bulletPool);
      if ((reg[id].def.cost || 3) > budget) break;
      spend(id);
    }

    /* 6. 按主题比例填充剩余名额
          章节的「特殊敌人出现率」会抬高特殊位权重（越深层越容易出现诡术/辅助） */
    const spRatio = clamp((theme.special || 0) + (poolCfg.special || 0) * 0.6, 0, 0.62);
    const rest = 1 - spRatio;
    const mr = (theme.melee || 0) + (theme.ranged || 0) || 1;
    const meleeR = rest * ((theme.melee || 0) / mr);
    const rangedR = rest * ((theme.ranged || 0) / mr);

    let guard = 0;
    while (budget > 0 && chosen.length < maxTotal && guard++ < 60) {
      const roll = rng.next();
      let list;
      if (roll < meleeR) list = pickFrom(meleePool);
      else if (roll < meleeR + rangedR) list = pickFrom(rangedPool);
      else list = pickFrom(specialPool.filter(k => !has(reg[k].def, 'support')));
      if (!list.length) list = pickFrom(meleePool);

      /* 预算不够时，改用最便宜的可选项 */
      let id = rng.pick(list);
      if ((reg[id].def.cost || 3) > budget) {
        const cheap = list.slice().sort((a, b) => (reg[a].def.cost || 3) - (reg[b].def.cost || 3));
        if ((cheap[0] !== undefined) && (reg[cheap[0]].def.cost || 3) <= budget) id = cheap[0];
        else break;
      }

      /* 安全限制：同类成群的上限（弹幕型数量直接决定能否躲开） */
      const d = reg[id].def;
      if (has(d, 'swarm') && countOf(k => has(reg[k].def, 'swarm')) >= 6) continue;
      if (has(d, 'bullethell') &&
          (bulletCap <= 0 || countOf(k => has(reg[k].def, 'bullethell')) >= bulletCap)) continue;
      if (has(d, 'support') && countOf(k => has(reg[k].def, 'support')) >= 1) continue;

      spend(id);

      /* 群体型一次多带两只（它们是「成群」的意义所在） */
      if (has(d, 'swarm') && chosen.length < maxTotal && budget > 0) {
        if (rng.chance(0.75)) spend(id);
      }
    }

    /* 7. 保底规则 */
    if (!chosen.length) chosen.push('chaser');
    /* 有辅助就必须有前排保护，否则辅助会孤立被秒（也让房间更耐打） */
    const supportN = countOf(k => has(reg[k].def, 'support'));
    const meleeN = countOf(k => reg[k].def.cat === 'melee');
    if (supportN > 0 && meleeN < 2) {
      const m = pickFrom(meleePool);
      for (let i = meleeN; i < 2; i++) chosen.push(rng.pick(m));
    }
    /* 精英房必有后排（远程 / 特殊），否则整房纯近战太单调 */
    if (isElite && !chosen.some(k => reg[k].def.cat !== 'melee')) {
      let back = pickFrom(rangedPool.concat(specialPool.filter(k => !has(reg[k].def, 'support'))))
        .filter(k => !has(reg[k].def, 'bullethell'));
      if (!back.length) back = pickFrom(rangedPool);
      if (back.length) chosen.push(rng.pick(back));
    }
    /* 普通房至少两名前排：避免整房纯远程（也让「近战为主」的浅层体验成立） */
    if (!isElite) {
      const mn = countOf(k => reg[k].def.cat === 'melee');
      if (mn < 2) {
        const m = pickFrom(meleePool);
        for (let i = mn; i < 2; i++) chosen.push(rng.pick(m));
      }
    }
    if (chosen.length < 3) {
      const m = pickFrom(meleePool);
      while (chosen.length < 3) chosen.push(rng.pick(m));
    }

    /* 8. 分波：先出前排与辅助，远程压后 */
    const order = { special: [], melee: [], ranged: [] };
    for (const id of chosen) {
      const cat = reg[id].def.cat;
      (order[cat] || order.melee).push(id);
    }
    const all = order.special.concat(order.melee, order.ranged);

    let waves;
    if (all.length <= 5 || isElite) {
      waves = [all];
    } else {
      /* 深层大房间拆成更多波次（逐层加压，而不是一次性糊脸） */
      const parts = (all.length >= 11 && (poolCfg.max || 0) >= 2) ? 3 : 2;
      if (parts === 3) {
        const c1 = Math.ceil(all.length * 0.36);
        const c2 = Math.ceil(all.length * 0.68);
        waves = [all.slice(0, c1), all.slice(c1, c2), all.slice(c2)].filter(w => w.length);
      } else {
        const cut = Math.ceil(all.length * 0.55);
        waves = [all.slice(0, cut), all.slice(cut)];
      }
      if (!waves.length || !waves[waves.length - 1].length) waves = [all];
    }

    return { waves: waves, theme: theme.cn };
  },

  _weighted(rng, list) {
    let sum = 0;
    for (const t of list) sum += (t.weight || 1);
    let r = rng.next() * sum;
    for (const t of list) {
      r -= (t.weight || 1);
      if (r <= 0) return t;
    }
    return list[list.length - 1];
  }
};

<script>
/* ===========================================================
   room.js — 战斗房（固定尺寸竞技场）
   扩展：房间类型（Start / Combat / Treasure / Elite / Shop / Event / Boss）
   - 只有与其它房间相连的方向才有门
   - 战斗类房间：进入关门 → 生成敌人 → 清空后开门
   - 非战斗房间：门常开，放置可交互物件
   =========================================================== */
'use strict';

class Room {
  constructor(game, opts) {
    opts = opts || {};
    this.game = game;
    this.def = opts.def || { id: 0, c: 0, r: 0, type: ROOM_TYPE.COMBAT };
    this.type = this.def.type || ROOM_TYPE.COMBAT;
    this.index = opts.index || 0;
    this.depth = opts.depth || 0;
    this.tier = opts.tier || 0;
    this.connections = opts.connections || { top: true, bottom: true, left: true, right: true };
    this.rng = opts.rng || new Rng(1);
    this.roomSeed = opts.roomSeed || '';

    this.enemies = [];
    this.props = [];
    this.pending = [];
    this.waves = [];
    this.waveIndex = 0;
    this.waveTimer = 0.9;

    this.isCombatRoom = (this.type === ROOM_TYPE.COMBAT ||
                         this.type === ROOM_TYPE.ELITE ||
                         this.type === ROOM_TYPE.BOSS);

    /* 章节（层数 → 主题）：视觉 / 敌人 / 环境障碍 / Boss 全部由它决定 */
    this.floor = (opts.depth || 0) + 1;
    this.chapter = ChapterOf(this.floor);

    this.state = this.isCombatRoom ? 'fighting' : 'clear';
    this.doorsOpen = !this.isCombatRoom;
    this.clearTime = 0;
    this.spawnFx = 0;
    this.everCleared = false;
    this._spawnCounter = 0;
    this.crack = null;               // 隐藏房裂缝（父房间才有）
    this.hazards = [];               // 环境障碍（由 HazardField 托管）

    this._buildWalls();
    this._buildFloor();
    this._planWaves();
    this._spawnProps();
    this._spawnHazards();
    this._startWave();
  }

  /* 隐藏房被发现后：父房间需要重新开门 */
  refreshConnections(conns) {
    this.connections = conns;
    this._buildWalls();
  }

  get meta() { return ROOM_META[this.type] || ROOM_META.combat; }

  /* ---------------------------------------------------------
     墙体 / 门（只在有连接的方向开门洞）
     --------------------------------------------------------- */
  _buildWalls() {
    const W = VIEW_W, H = VIEW_H, T = WALL_T;
    const cx = W / 2, cy = H / 2, dw = DOOR_W / 2;

    /* 全封闭四面墙：敌人与投射物永远用这一套 */
    this.wallsClosed = [
      { x: 0, y: 0, w: W, h: T, inner: 'bottom' },
      { x: 0, y: H - T, w: W, h: T, inner: 'top' },
      { x: 0, y: T, w: T, h: H - T * 2, inner: 'right' },
      { x: W - T, y: T, w: T, h: H - T * 2, inner: 'left' }
    ];

    /* 门打开后使用的墙体：有连接的方向留出门洞，其余保持实心 */
    const open = [];
    const seg = (side) => {
      if (side === 'top') {
        if (this.connections.top) {
          open.push({ x: 0, y: 0, w: cx - dw, h: T, inner: 'bottom' });
          open.push({ x: cx + dw, y: 0, w: W - (cx + dw), h: T, inner: 'bottom' });
        } else open.push({ x: 0, y: 0, w: W, h: T, inner: 'bottom' });
      } else if (side === 'bottom') {
        if (this.connections.bottom) {
          open.push({ x: 0, y: H - T, w: cx - dw, h: T, inner: 'top' });
          open.push({ x: cx + dw, y: H - T, w: W - (cx + dw), h: T, inner: 'top' });
        } else open.push({ x: 0, y: H - T, w: W, h: T, inner: 'top' });
      } else if (side === 'left') {
        if (this.connections.left) {
          open.push({ x: 0, y: T, w: T, h: cy - dw - T, inner: 'right' });
          open.push({ x: 0, y: cy + dw, w: T, h: H - T - (cy + dw), inner: 'right' });
        } else open.push({ x: 0, y: T, w: T, h: H - T * 2, inner: 'right' });
      } else {
        if (this.connections.right) {
          open.push({ x: W - T, y: T, w: T, h: cy - dw - T, inner: 'left' });
          open.push({ x: W - T, y: cy + dw, w: T, h: H - T - (cy + dw), inner: 'left' });
        } else open.push({ x: W - T, y: T, w: T, h: H - T * 2, inner: 'left' });
      }
    };
    seg('top'); seg('bottom'); seg('left'); seg('right');
    this.wallsOpen = open;

    /* 门：洞口矩形 + 触发区（略微向房间内延伸） */
    const trig = 8;
    this.doors = [];
    if (this.connections.top) {
      this.doors.push({
        side: 'top', dir: { x: 0, y: -1 },
        gap: { x: cx - dw, y: 0, w: dw * 2, h: T },
        trigger: { x: cx - dw + trig, y: 0, w: dw * 2 - trig * 2, h: T + trig }
      });
    }
    if (this.connections.bottom) {
      this.doors.push({
        side: 'bottom', dir: { x: 0, y: 1 },
        gap: { x: cx - dw, y: H - T, w: dw * 2, h: T },
        trigger: { x: cx - dw + trig, y: H - T - trig, w: dw * 2 - trig * 2, h: T + trig }
      });
    }
    if (this.connections.left) {
      this.doors.push({
        side: 'left', dir: { x: -1, y: 0 },
        gap: { x: 0, y: cy - dw, w: T, h: dw * 2 },
        trigger: { x: 0, y: cy - dw + trig, w: T + trig, h: dw * 2 - trig * 2 }
      });
    }
    if (this.connections.right) {
      this.doors.push({
        side: 'right', dir: { x: 1, y: 0 },
        gap: { x: W - T, y: cy - dw, w: T, h: dw * 2 },
        trigger: { x: W - T - trig, y: cy - dw + trig, w: T + trig, h: dw * 2 - trig * 2 }
      });
    }
  }

  /* ---------------------------------------------------------
     地板（一次性烘焙到离屏画布，按房间种子决定花纹）
     --------------------------------------------------------- */
  _buildFloor() {
    const c = document.createElement('canvas');
    c.width = VIEW_W;
    c.height = VIEW_H;
    const g = c.getContext('2d');
    const pal = this.chapter.pal;

    g.fillStyle = pal.void;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.fillStyle = pal.floor;
    g.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

    const ts = 64;
    g.save();
    g.beginPath();
    g.rect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
    g.clip();

    const sd = hashSeed(this.roomSeed || (this.type + ':' + this.index));
    const seedX = (sd % 97) * 0.37, seedY = (sd % 61) * 0.91;
    const tr = pal.tile[0], tg = pal.tile[1], tb = pal.tile[2];
    const tv = pal.tileVar;
    for (let ty = 0; ty * ts < ARENA.h + ts; ty++) {
      for (let tx = 0; tx * ts < ARENA.w + ts; tx++) {
        const n = hash2(tx + seedX, ty + seedY);
        const x = ARENA.x + tx * ts;
        const y = ARENA.y + ty * ts;
        const shade = Math.floor(n * tv);
        g.fillStyle = `rgb(${tr + shade}, ${tg + shade}, ${tb + shade})`;
        g.fillRect(x + 1, y + 1, ts - 2, ts - 2);
        if (n > 0.82) {
          g.strokeStyle = pal.grout;
          g.lineWidth = 1.5;
          g.beginPath();
          g.moveTo(x + 12, y + ts - 14);
          g.lineTo(x + ts - 14, y + ts - 14);
          g.stroke();
        } else if (n < 0.14) {
          g.fillStyle = pal.dot;
          g.beginPath();
          g.arc(x + ts * 0.5, y + ts * 0.5, 4, 0, TAU);
          g.fill();
        }
      }
    }
    g.restore();

    /* 房间类型决定中央符环颜色（章节决定基础色调） */
    const accent = this.meta.color;
    const cx = VIEW_W / 2, cy = VIEW_H / 2;
    g.strokeStyle = accent;
    g.globalAlpha = 0.07;
    g.lineWidth = 3;
    g.beginPath(); g.arc(cx, cy, 168, 0, TAU); g.stroke();
    /* 章节外环：每层一个专属印纹 */
    g.strokeStyle = pal.accent;
    g.globalAlpha = 0.09;
    g.lineWidth = 2;
    const marks = this.chapter.id * 3;
    for (let i = 0; i < marks; i++) {
      const a = (i / marks) * TAU;
      g.beginPath();
      g.arc(cx, cy, 196, a, a + 0.16);
      g.stroke();
    }
    g.strokeStyle = accent;
    g.globalAlpha = 0.07;
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, cy, 148, 0, TAU); g.stroke();
    g.lineWidth = 2;
    const spokes = this.type === ROOM_TYPE.BOSS ? 8 : 6;
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * TAU;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * 148, cy + Math.sin(a) * 148);
      g.lineTo(cx + Math.cos(a) * 168, cy + Math.sin(a) * 168);
      g.stroke();
    }
    g.globalAlpha = 1;

    const vg = g.createRadialGradient(cx, cy, ARENA.h * 0.35, cx, cy, ARENA.h * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.45)');
    g.fillStyle = vg;
    g.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

    this.floorCanvas = c;
  }

  /* ---------------------------------------------------------
     敌人波次（使用房间专属 Rng → 同种子可复现）
     --------------------------------------------------------- */
  _planWaves() {
    const rng = this.rng;
    this.waves = [];
    this.themeCn = '';

    if (!this.isCombatRoom) return;

    if (this.type === ROOM_TYPE.BOSS) {
      /* 每一层有自己的 Boss 池（互不重叠），第 5 层是最终 Boss */
      const bossId = BossRoster.pick(this.depth + 1, rng.fork('boss'));
      this.bossId = bossId;
      const guard = (this.chapter.guard || []).slice();
      this.waves = [[bossId].concat(guard)];
      this.themeCn = BossRoster.nameOf(bossId);
      return;
    }

    /* 编队生成：按「章节 + 房间类型 + 深度」组合敌人，而不是把所有种类随机混在一起 */
    const res = SpawnDirector.build({
      type: this.type,
      depth: this.depth,
      isElite: this.type === ROOM_TYPE.ELITE,
      rng: rng.fork('waves'),
      chapter: this.chapter
    });
    this.waves = res.waves;
    this.themeCn = res.theme || '';
  }

  _startWave() {
    const w = this.waves[this.waveIndex] || [];
    this.pending = w.map((type, i) => ({ type: type, delay: i * 0.16 }));
  }

  /* ---------------------------------------------------------
     可交互物件（宝箱 / 祭坛 / 商栈）
     --------------------------------------------------------- */
  _spawnProps() {
    const cx = VIEW_W / 2, cy = VIEW_H / 2;
    const rng = this.rng;

    /* 隐藏房裂缝：父房间墙上（只有未发现时才存在） */
    const secSide = this.def.secretSide;
    const secCell = this.def.secretCell;
    if (secSide && secCell && !secCell.discovered) {
      const pos = this._wallCenter(secSide);
      this.crack = new WallCrack(this.game, pos.x, pos.y, secSide, secCell);
      this.props.push(this.crack);
    }

    switch (this.type) {
      case ROOM_TYPE.TREASURE:
        /* 主宝箱居中；第 2 层起两侧各多一口小箱 */
        this.props.push(new Chest(this.game, cx, cy, rng.fork('chest'), false));
        if (this.depth >= 1) {
          this.props.push(new Chest(this.game, cx - 190, cy + 40, rng.fork('chestL'), true));
          this.props.push(new Chest(this.game, cx + 190, cy + 40, rng.fork('chestR'), true));
        }
        break;
      case ROOM_TYPE.EVENT:
        this.props.push(new EventShrine(this.game, cx, cy, rng.fork('event')));
        break;
      case ROOM_TYPE.SHOP: {
        /* 3~5 个货架，横向铺开 */
        const stocks = rollShopStocks(rng.fork('shop'), this.game, this.depth + 1);
        const n = stocks.length;
        const span = Math.min(190, 760 / Math.max(1, n));
        for (let i = 0; i < n; i++) {
          const x = cx + (i - (n - 1) / 2) * span;
          this.props.push(new ShopStall(this.game, x, cy + 30, stocks[i]));
        }
        break;
      }
      case ROOM_TYPE.SECRET: {
        /* 秘室：两口宝箱 + 一堆金币 */
        this.props.push(new Chest(this.game, cx - 150, cy - 10, rng.fork('secL'), false));
        this.props.push(new Chest(this.game, cx + 150, cy - 10, rng.fork('secR'), true));
        const pile = new CoinPile(this.game, cx, cy + 90, 45 + (this.depth + 1) * 18);
        this.props.push(pile);
        break;
      }
      default:
        break;
    }
  }

  /* ---------------------------------------------------------
     环境障碍（章节决定种类与数量，房间 Rng 决定位置）
     只出现在战斗类房间；非战斗房间保持干净，方便交互
     --------------------------------------------------------- */
  _spawnHazards() {
    this.chapterFx = new ChapterFx(this.chapter, this.rng.fork('fx'));
    if (!this.isCombatRoom) return;
    this.hazards = new HazardField(this);
  }

  /* 墙面中心点（裂缝用） */
  _wallCenter(side) {
    const cx = VIEW_W / 2, cy = VIEW_H / 2;
    if (side === 'top') return { x: cx, y: WALL_T * 0.5 };
    if (side === 'bottom') return { x: cx, y: VIEW_H - WALL_T * 0.5 };
    if (side === 'left') return { x: WALL_T * 0.5, y: cy };
    return { x: VIEW_W - WALL_T * 0.5, y: cy };
  }

  /* ---------------------------------------------------------
     出生点：远离玩家、彼此不重叠（用房间 Rng）
     --------------------------------------------------------- */
  _spawnPoint(radius) {
    const p = this.game.player;
    const rng = this.rng;
    for (let attempt = 0; attempt < 40; attempt++) {
      const x = rng.range(ARENA.x + radius + 24, ARENA.x + ARENA.w - radius - 24);
      const y = rng.range(ARENA.y + radius + 24, ARENA.y + ARENA.h - radius - 24);
      if (p && dist(x, y, p.x, p.y) < 210) continue;
      let ok = true;
      for (const e of this.enemies) {
        if (dist(x, y, e.x, e.y) < radius + e.r + 14) { ok = false; break; }
      }
      if (ok) return { x: x, y: y };
    }
    const cx = ARENA.x + ARENA.w / 2, cy = ARENA.y + ARENA.h / 2;
    const sx = rng.chance(0.5) ? -1 : 1, sy = rng.chance(0.5) ? -1 : 1;
    return {
      x: clamp(cx + sx * ARENA.w * 0.36, ARENA.x + 50, ARENA.x + ARENA.w - 50),
      y: clamp(cy + sy * ARENA.h * 0.36, ARENA.y + 50, ARENA.y + ARENA.h - 50)
    };
  }

  _spawnEnemy(type) {
    /* 半径走注册表（新增敌人不用改这里） */
    const r = EnemyFactory.radiusOf(type);
    const isBossType = EnemyFactory.defOf(type).cat === 'boss';
    const pt = isBossType
      ? { x: ARENA.x + ARENA.w / 2, y: ARENA.y + 120 }
      : this._spawnPoint(r);
    /* 每只敌人派生独立 Rng → 敌人组成、出生点、行为都随种子复现 */
    const e = EnemyFactory.create(this.game, type, pt.x, pt.y, this.tier,
      this.rng.fork('enemy' + this._spawnCounter++));

    /* 章节难度：HP / 攻击节奏 / 移速 / 弹幕复杂度 / 词缀渗透（Boss 吃半幅） */
    e.applyChapterScale(this.chapter);

    /* 精英房：每只敌人带 1~2 个词缀（更硬 / 更疯 / 死亡特效） */
    if (this.type === ROOM_TYPE.ELITE) {
      const keys = Object.keys(ELITE_AFFIX);
      const cnt = this.depth >= 2 ? 2 : 1;
      const pick = [];
      for (let i = 0; i < cnt; i++) {
        const k = keys[Math.floor(this.rng.next() * keys.length)];
        if (pick.indexOf(k) < 0) pick.push(k);
      }
      e.applyAffixes(pick);
    }

    this.enemies.push(e);
    this.spawnFx = 0.3;
    this.game.particles.ring(pt.x, pt.y, e.colors[1], isBossType ? 26 : 12, isBossType ? 260 : 150);
    if (isBossType) this.bossRef = e;
    return e;
  }

  /* ---------------------------------------------------------
     更新
     --------------------------------------------------------- */
  update(dt) {
    if (this.spawnFx > 0) this.spawnFx -= dt;

    /* 章节背景效果（纯表现） */
    if (this.chapterFx) this.chapterFx.update(dt);

    /* 环境障碍：更新 → 对玩家与敌人施加作用 */
    if (this.hazards && this.hazards.update) {
      this.hazards.update(dt);
      this.hazards.affectAll(dt);
    }

    /* 待生成队列 */
    if (this.pending.length) {
      for (let i = this.pending.length - 1; i >= 0; i--) {
        const q = this.pending[i];
        q.delay -= dt;
        if (q.delay <= 0) {
          this._spawnEnemy(q.type);
          this.pending.splice(i, 1);
        }
      }
    }

    /* 敌人 */
    for (const e of this.enemies) e.update(dt);

    /* 互相分离 */
    const n = this.enemies.length;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        Collision.separate(this.enemies[i], this.enemies[j]);
      }
    }
    for (const e of this.enemies) this.clampEntity(e, false);

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      if (this.enemies[i].dead) this.enemies.splice(i, 1);
    }

    /* 物件 */
    for (const pr of this.props) pr.update(dt);

    /* 房间结算 */
    if (this.state === 'fighting') {
      if (this.pending.length === 0 && this.enemies.length === 0) {
        if (this.waveIndex + 1 < this.waves.length) {
          this.waveTimer -= dt;
          if (this.waveTimer <= 0) {
            this.waveIndex++;
            this.waveTimer = 0.9;
            this._startWave();
            this.game.ui.showBanner('残形涌现', '下一波', 1.1);
          }
        } else {
          this.markCleared();
        }
      }
    } else {
      this.clearTime += dt;
    }
  }

  /* ---------------------------------------------------------
     重新进入（复用实例时调用）：只重置瞬时表现，绝不重建敌人 / 物件
     --------------------------------------------------------- */
  onReenter() {
    this.spawnFx = 0;
    if (this.state === 'fighting') {
      /* 战斗未结束就返回（理论上门是关的）：重新锁门 */
      this.doorsOpen = false;
      this.clearTime = 0;
    }
  }

  markCleared() {
    if (this.state === 'clear') return;
    this.state = 'clear';
    this.doorsOpen = true;
    this.clearTime = 0;
    this.everCleared = true;

    /* Boss 房通关 → 解除房间（开门）+ 层间裂隙 + 大量金币 + 一件强力遗物 */
    if (this.type === ROOM_TYPE.BOSS) {
      const cx = ARENA.x + ARENA.w / 2, cy = ARENA.y + ARENA.h / 2;
      const lastFloor = this.floor >= CHAPTER_COUNT;
      this.props.push(new Portal(this.game, cx, cy + 40,
        lastFloor ? '终结回廊 · 查看结算' : '进入第 ' + (this.floor + 1) + ' 层 · ' + ChapterOf(this.floor + 1).cn));
      const cm = this.chapter.coins || 1;
      this.props.push(new CoinPile(this.game, cx + 210, cy, Math.round((120 + this.depth * 45) * cm)));
      this.props.push(new CoinPile(this.game, cx - 210, cy, Math.round((90 + this.depth * 35) * cm)));
      this.props.push(new BossRelic(this.game, cx - 120, cy - 60, this.rng.fork('bossRelic')));
      if (this.depth >= 2) {
        this.props.push(new BossRelic(this.game, cx + 120, cy - 60, this.rng.fork('bossRelic2')));
      }
    } else if (this.type === ROOM_TYPE.ELITE) {
      this.props.push(new Chest(this.game, ARENA.x + ARENA.w / 2 - 60, ARENA.y + ARENA.h / 2,
        this.rng.fork('eliteChest'), false));
      this.props.push(new CoinPile(this.game, ARENA.x + ARENA.w / 2 + 90, ARENA.y + ARENA.h / 2,
        28 + this.depth * 12));
    }
    this.game.onRoomCleared(this);
  }

  /* ---------------------------------------------------------
     碰撞辅助
     --------------------------------------------------------- */
  clampEntity(e, allowDoors) {
    const walls = (allowDoors && this.doorsOpen) ? this.wallsOpen : this.wallsClosed;
    const hit = Collision.resolveAll(e, walls);
    /* 环境障碍：实体化的柱子 / 齿轮 / 相位柱也会挡住去路 */
    if (this.hazards && this.hazards.resolveEntity) this.hazards.resolveEntity(e);
    return hit;
  }

  /* 子弹是否撞上环境障碍（返回该障碍） */
  hazardAt(x, y, r) {
    if (this.hazards && this.hazards.hitTest) return this.hazards.hitTest(x, y, r);
    return null;
  }

  /* 子弹在障碍表面反弹 */
  bounceOffHazard(p, h) {
    if (this.hazards && this.hazards.bounce) this.hazards.bounce(p, h);
  }

  hitsWall(x, y, r) {
    for (const w of this.wallsClosed) {
      if (Collision.circleRect(x, y, r, w)) return true;
    }
    return false;
  }

  /* 投射物撞墙反弹：就地修改 vx / vy 并推出墙体，返回是否发生反弹 */
  bounceOffWalls(p) {
    for (const w of this.wallsClosed) {
      if (!Collision.circleRect(p.x, p.y, p.r, w)) continue;
      const overLeft = (p.x + p.r) - w.x;
      const overRight = (w.x + w.w) - (p.x - p.r);
      const overTop = (p.y + p.r) - w.y;
      const overBottom = (w.y + w.h) - (p.y - p.r);
      const m = Math.min(overLeft, overRight, overTop, overBottom);
      /* overLeft = 需要向左挪多少才能脱离左面，以此类推 */
      if (m === overLeft) { p.vx = -Math.abs(p.vx); p.x -= overLeft; }
      else if (m === overRight) { p.vx = Math.abs(p.vx); p.x += overRight; }
      else if (m === overTop) { p.vy = -Math.abs(p.vy); p.y -= overTop; }
      else { p.vy = Math.abs(p.vy); p.y += overBottom; }
      return true;
    }
    return false;
  }

  aliveCount() {
    let c = 0;
    for (const e of this.enemies) if (!e.dead) c++;
    return c + this.pending.length;
  }

  doorUnder(px, py) {
    if (!this.doorsOpen) return null;
    for (const d of this.doors) {
      if (Collision.pointInRect(px, py, d.trigger)) return d;
    }
    return null;
  }

  doorBySide(side) {
    for (const d of this.doors) if (d.side === side) return d;
    return null;
  }

  /* ---------------------------------------------------------
     绘制
     --------------------------------------------------------- */
  drawFloor(ctx) {
    ctx.drawImage(this.floorCanvas, 0, 0);
    /* 章节背景（环境粒子）→ 地面预警层 */
    if (this.chapterFx) this.chapterFx.drawUnder(ctx);
    if (this.hazards && this.hazards.drawUnder) this.hazards.drawUnder(ctx);
    if (this.state === 'clear') {
      const t = this.clearTime;
      const a = 0.10 + 0.05 * Math.sin(t * 3);
      const cx = VIEW_W / 2, cy = VIEW_H / 2;
      const g = ctx.createRadialGradient(cx, cy, 20, cx, cy, 210);
      g.addColorStop(0, `rgba(255,190,110,${a})`);
      g.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - 220, cy - 220, 440, 440);
    }
  }

  drawProps(ctx) {
    for (const pr of this.props) pr.draw(ctx);
  }

  /* 实体之上的一层：柱体 / 电弧塔 / 章节氛围 */
  drawOverLayer(ctx) {
    if (this.hazards && this.hazards.drawOver) this.hazards.drawOver(ctx);
    if (this.chapterFx) this.chapterFx.drawOver(ctx);
  }

  drawWalls(ctx) {
    const walls = this.doorsOpen ? this.wallsOpen : this.wallsClosed;

    for (const d of this.doors) {
      const g = d.gap;
      ctx.fillStyle = '#0b1119';
      ctx.fillRect(g.x, g.y, g.w, g.h);

      if (this.doorsOpen) {
        const pulse = 0.5 + 0.5 * Math.sin(this.clearTime * 3.4);
        const grad = ctx.createLinearGradient(g.x, g.y, g.x + (g.w > g.h ? 0 : g.w), g.y + (g.h > g.w ? g.h : 0));
        grad.addColorStop(0, 'rgba(90,255,190,0.05)');
        grad.addColorStop(0.5, `rgba(120,255,200,${0.20 + 0.10 * pulse})`);
        grad.addColorStop(1, 'rgba(90,255,190,0.05)');
        ctx.fillStyle = grad;
        ctx.fillRect(g.x, g.y, g.w, g.h);

        ctx.strokeStyle = 'rgba(140,255,210,0.75)';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(g.x + 1, g.y + 1, g.w - 2, g.h - 2);
      } else {
        ctx.fillStyle = 'rgba(255,70,60,0.13)';
        ctx.fillRect(g.x, g.y, g.w, g.h);
        ctx.save();
        ctx.beginPath();
        ctx.rect(g.x, g.y, g.w, g.h);
        ctx.clip();
        ctx.strokeStyle = 'rgba(255,110,90,0.32)';
        ctx.lineWidth = 3;
        const off = (this.game.time * 42) % 22;
        const horiz = g.w > g.h;
        const len = horiz ? g.w : g.h;
        for (let i = -1; i < len / 22 + 2; i++) {
          ctx.beginPath();
          if (horiz) {
            const x = g.x + i * 22 + off;
            ctx.moveTo(x, g.y);
            ctx.lineTo(x + 10, g.y + g.h);
          } else {
            const y = g.y + i * 22 + off;
            ctx.moveTo(g.x, y);
            ctx.lineTo(g.x + g.w, y + 10);
          }
          ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,90,80,0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(g.x + 1, g.y + 1, g.w - 2, g.h - 2);
      }
    }

    const pal = this.chapter.pal;
    for (const w of walls) {
      ctx.fillStyle = pal.wall;
      ctx.fillRect(w.x, w.y, w.w, w.h);

      ctx.fillStyle = pal.wallEdge;
      if (w.inner === 'bottom') ctx.fillRect(w.x, w.y + w.h - 5, w.w, 5);
      else if (w.inner === 'top') ctx.fillRect(w.x, w.y, w.w, 5);
      else if (w.inner === 'right') ctx.fillRect(w.x + w.w - 5, w.y, 5, w.h);
      else ctx.fillRect(w.x, w.y, 5, w.h);

      ctx.strokeStyle = 'rgba(0,0,0,0.28)';
      ctx.lineWidth = 1;
      const horiz = w.w > w.h;
      const step = 48;
      ctx.beginPath();
      if (horiz) {
        for (let x = w.x + step; x < w.x + w.w; x += step) {
          ctx.moveTo(x, w.y); ctx.lineTo(x, w.y + w.h);
        }
      } else {
        for (let y = w.y + step; y < w.y + w.h; y += step) {
          ctx.moveTo(w.x, y); ctx.lineTo(w.x + w.w, y);
        }
      }
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x + 0.5, w.y + 0.5, w.w - 1, w.h - 1);
    }
  }
}

</script>
<script>
/* ===========================================================
   ui.js — HUD（Canvas）+ 遮罩面板（DOM）+ 小地图 + 横幅 + 准星
   =========================================================== */
'use strict';

class UI {
  constructor(game) {
    this.game = game;
    this.banner = null;
    this.hintTimer = 9;
    this.hitVignette = 0;
    this.animT = 0;
    this.customHint = '';          // 章节环境提示（进入新层时短暂显示）
    this.customHintT = 0;

    this.overlay = document.getElementById('overlay');
    this.elKicker = document.getElementById('ov-kicker');
    this.elTitleCn = document.getElementById('ov-title-cn');
    this.elTitleEn = document.getElementById('ov-title-en');
    this.elText = document.getElementById('ov-text');
    this.elBtn = document.getElementById('ov-btn');
    this.elHint = document.getElementById('ov-hint');
    this.elSeed = document.getElementById('seed-input');
    this.elShakeBtn = document.getElementById('shake-btn');
    this.elActions = document.getElementById('ov-actions');
    this.elPanel = (document.querySelector ? document.querySelector('.panel') : null);
    this.refreshShakeBtn();

    this.elBtn.addEventListener('click', () => {
      this.game.primaryAction();
    });

    /* 面板内的动态按钮（角色 / 统计 / 图鉴 / 返回 / 重置存档） */
    if (this.elActions) {
      this.elActions.addEventListener('click', (ev) => {
        const t = ev.target;
        if (!t || !t.getAttribute) return;
        const act = t.getAttribute('data-act');
        if (act === 'chars') this.setOverlay('chars');
        else if (act === 'stats') this.setOverlay('stats');
        else if (act === 'codex') this.setOverlay('codex');
        else if (act === 'back') this.setOverlay('title');
        else if (act === 'reset') { this._askReset(t); }
        else if (act === 'reset-yes') { if (typeof Meta !== 'undefined') Meta.reset(); this.setOverlay('stats'); }
        else if (act === 'reset-no') { this.setOverlay('stats'); }
        if (t.blur) t.blur();
      });
    }

    /* 角色卡片 / 存档确认：统一走一次事件委托 */
    if (this.elText) {
      this.elText.addEventListener('click', (ev) => {
        const t = ev.target;
        if (!t) return;
        const act = this._attrUpTo(t, 'data-act', this.elText);
        if (act === 'reset-yes') {
          if (typeof Meta !== 'undefined') Meta.reset();
          this.setOverlay('stats');
          return;
        }
        if (act === 'reset-no') { this.setOverlay('stats'); return; }
        const id = this._attrUpTo(t, 'data-char', this.elText);
        if (!id) return;
        if (typeof Meta === 'undefined' || !Meta.isCharUnlocked(id)) return;
        Meta.selectChar(id);
        this.game.charId = id;
        if (this.game.player) {
          this.game.player.char = CharacterOf(id);
          if (this.game.player.build) this.game.player.build.recompute();
        }
        this.setOverlay('chars');
      });
    }

    this.setOverlay('title');
  }

  /* 遮罩底部按钮组（按当前面板动态生成） */
  renderActions() {
    if (!this.elActions) return;
    const m = this.overlayMode;
    let html = '';
    if (m === 'title') {
      html =
        '<button type="button" data-act="chars">角色</button>' +
        '<button type="button" data-act="stats">统计</button>' +
        '<button type="button" data-act="codex">解锁图鉴</button>';
    } else if (m === 'chars' || m === 'stats' || m === 'codex') {
      html = '<button type="button" data-act="back">返回</button>';
      if (m === 'stats') html += '<button type="button" data-act="reset" class="danger">清空存档</button>';
    }
    this.elActions.innerHTML = html;
    this.elActions.style.display = html ? '' : 'none';
  }

  _askReset() {
    this.elText.innerHTML =
      '<div class="warn-box">确定清空全部 Meta 存档？<br>' +
      '<span style="opacity:.7">解锁内容、统计、设置都会归零，且无法恢复。</span></div>' +
      '<div class="row-btns">' +
      '<button type="button" class="cc-btn danger" data-act="reset-yes">确认清空</button>' +
      '<button type="button" class="cc-btn" data-act="reset-no">取消</button></div>';
  }

  /* 从点击目标向上找某个属性（DOM 里的卡片 / 按钮嵌套层级不定） */
  _attrUpTo(node, attr, root) {
    let n = node;
    let guard = 0;
    while (n && guard++ < 12) {
      if (n.getAttribute) {
        const v = n.getAttribute(attr);
        if (v) return v;
      }
      if (n === root) break;
      n = n.parentNode;
    }
    return null;
  }

  /* HUD 上的「抖动强度」按钮文案 */
  refreshShakeBtn() {
    if (!this.elShakeBtn) return;
    this.elShakeBtn.textContent = '抖动 · ' + this.game.shakeLabel();
  }

  /* 玩家当前 Build 的一句话摘要（遮罩面板用） */
  buildSummary(g) {
    if (!g.player || !g.player.build) return '';
    const slots = g.player.build.slots;
    if (!slots.length) return '尚无道具';
    const names = slots.slice(0, 8).map(s => {
      const it = ITEM_BY_ID[s.id];
      return (it ? it.name : s.id) + (s.n > 1 ? `×${s.n}` : '');
    });
    const more = slots.length > 8 ? ` 等 ${slots.length} 类` : '';
    return names.join('、') + more;
  }

  /* ---------------------------------------------------------
     遮罩面板
     --------------------------------------------------------- */
  setOverlay(mode) {
    this.overlayMode = mode;
    this.renderActions();
    /* 角色 / 统计 / 图鉴页面需要更宽的面板 */
    if (this.elPanel && this.elPanel.classList) {
      const wide = (mode === 'chars' || mode === 'stats' || mode === 'codex');
      if (wide) this.elPanel.classList.add('wide');
      else this.elPanel.classList.remove('wide');
    }
    if (!mode) {
      this.overlay.classList.add('hidden');
      return;
    }
    this.overlay.classList.remove('hidden');

    const g = this.game;
    if (mode === 'title') {
      this.elKicker.textContent = 'ORIGINAL ROGUELIKE SHOOTER';
      this.elTitleCn.textContent = '残响回廊';
      this.elTitleEn.textContent = 'ECHO RIFT';
      this.elText.innerHTML =
        '星脉崩解之后，回廊在裂隙中生长。<br>' +
        '徘徊其中的，是回声凝成的残形。<br><br>' +
        '你是拾火者。穿过 <b>五层回廊</b>，击败每一层的守望者，<br>' +
        '直到星界核心停止搏动。<br><br>' +
        '<span style="color:#8fa3b5">废弃庭院 → 机械矿井 → 腐化森林 → 虚空遗迹 → 星界核心</span><br>' +
        '<span style="color:#6b7c8c;font-size:12px">局外成长只解锁「新的可能性」，不会让你变得更强 —— 每一局的强度仍然只来自随机到的 Build</span>';
      this.elBtn.textContent = '开始探索';
      const kbHint = 'WASD 移动 · 鼠标瞄准 · 左键射击 · E 交互 · ESC 暂停 · F 全屏';
      this.elHint.textContent = (this.game.touchMode && this.touchHint) ? this.touchHint : kbHint;
      if (this.elSeed) this.elSeed.style.display = '';
    } else if (mode === 'pause') {
      this.elKicker.textContent = 'SYSTEM HALT';
      this.elTitleCn.textContent = '暂停';
      this.elTitleEn.textContent = 'PAUSED';
      this.elText.innerHTML =
        `SEED　<b>${g.seed}</b><br>` +
        `层数　<b>第 ${g.floor} 层 · ${this.chapterName(g)}</b><br>` +
        `金币　<b>${g.coins}</b><br>` +
        `已探索　<b>${Object.keys(g.map ? g.map.visited : {}).length} / ${g.map ? g.map.cells.length : 0}</b> 间<br>` +
        `持有道具　<b>${g.player ? g.player.build.length : 0}</b> 件<br>` +
        `<span style="color:#8fa3b5">${this.buildSummary(g)}</span>`;
      this.elBtn.textContent = '继续';
      this.elHint.textContent = 'R 重新开始 · ESC 继续';
      if (this.elSeed) this.elSeed.style.display = 'none';
    } else if (mode === 'victory') {
      const bosses = (g.bossDefeated && g.bossDefeated.length)
        ? g.bossDefeated.join(' → ') : '—';
      this.elKicker.textContent = 'THE RIFT FALLS SILENT';
      this.elTitleCn.textContent = '回廊终结';
      this.elTitleEn.textContent = 'RUN COMPLETE';
      this.elText.innerHTML =
        `SEED　<b>${g.seed}</b><br>` +
        `路线　<b>${this.chapterRoute(g)}</b><br>` +
        `击败首领　<b>${bosses}</b><br>` +
        `击碎残形　<b>${g.kills}</b>　用时　<b>${this.fmtTime(g.runTime)}</b>　金币　<b>${g.coins}</b><br>` +
        `持有道具　<b>${g.player ? g.player.build.length : 0}</b> 件<br>` +
        `<span style="color:#8fa3b5">${this.buildSummary(g)}</span>`;
      this.elBtn.textContent = '再来一局';
      this.elHint.textContent = '按 R 也可以重来（可先改 Seed）';
      if (this.elSeed) this.elSeed.style.display = '';
    } else if (mode === 'gameover') {
      this.elKicker.textContent = 'EMBER EXTINGUISHED';
      this.elTitleCn.textContent = '火种熄灭';
      this.elTitleEn.textContent = 'RUN OVER';
      this.elText.innerHTML =
        `SEED　<b>${g.seed}</b><br>` +
        `抵达　<b>第 ${g.floor} 层 · ${this.chapterName(g)} · ${g.roomTypeName()}</b><br>` +
        `击碎残形　<b>${g.kills}</b>　射出弹丸　<b>${g.player ? g.player.shotsFired : 0}</b><br>` +
        `持有道具　<b>${g.player ? g.player.build.length : 0}</b> 件<br>` +
        `<span style="color:#8fa3b5">${this.buildSummary(g)}</span>`;
      this.elBtn.textContent = '重新开始';
      this.elHint.textContent = '按 R 也可以重来（可先改 Seed）';
      if (this.elSeed) this.elSeed.style.display = '';
    } else if (mode === 'chars') {
      this.elKicker.textContent = 'CHOOSE YOUR EMBER';
      this.elTitleCn.textContent = '角色';
      this.elTitleEn.textContent = 'CHARACTERS';
      this.elText.innerHTML = this.charSelectHtml();
      this.elBtn.textContent = '开始探索';
      this.elHint.textContent = '角色只是不同起手式，没有强弱之分 · 解锁条件见「解锁图鉴」';
      if (this.elSeed) this.elSeed.style.display = '';
    } else if (mode === 'stats') {
      this.elKicker.textContent = 'LIFETIME RECORDS';
      this.elTitleCn.textContent = '统计';
      this.elTitleEn.textContent = 'STATISTICS';
      this.elText.innerHTML = this.statsHtml();
      this.elBtn.textContent = '返回标题';
      this.elHint.textContent = '数据保存在本机 localStorage · 不会上传';
      if (this.elSeed) this.elSeed.style.display = 'none';
    } else if (mode === 'codex') {
      this.elKicker.textContent = 'UNLOCK CODEX';
      this.elTitleCn.textContent = '解锁图鉴';
      this.elTitleEn.textContent = 'CODEX';
      this.elText.innerHTML = this.codexHtml();
      this.elBtn.textContent = '返回标题';
      this.elHint.textContent = '解锁只拓宽随机池，不给任何局外数值加成';
      if (this.elSeed) this.elSeed.style.display = 'none';
    }
  }

  /* ---------------- 角色选择页 ---------------- */
  charSelectHtml() {
    const cur = (typeof Meta !== 'undefined') ? Meta.selectedChar() : 'ember';
    const out = [];
    for (const c of CHARACTERS) {
      const ok = (typeof Meta === 'undefined') ? !c.locked : Meta.isCharUnlocked(c.id);
      const sel = (c.id === cur);
      const b = c.base;
      out.push(
        '<div class="char-card' + (sel ? ' sel' : '') + (ok ? '' : ' locked') + '"' +
        (ok ? ' data-char="' + c.id + '"' : '') + '>' +
        '<div class="cc-head"><span class="cc-name">' + c.name + '</span>' +
        '<span class="cc-en">' + c.en + '</span>' +
        (sel ? '<span class="cc-badge">使用中</span>' : (ok ? '' : '<span class="cc-badge lock">未解锁</span>')) +
        '</div>' +
        '<div class="cc-tag">' + c.tag + '</div>' +
        '<div class="cc-desc">' + (ok ? c.desc : '???') + '</div>' +
        '<div class="cc-abil"><b>能力</b>　' + (ok ? c.ability : '???') + '</div>' +
        '<div class="cc-stats">' +
        (ok
          ? ('生命 <b>' + b.maxHp + '</b>　攻击 <b>' + b.damage + '</b>　射速 <b>' +
            (1 / b.fireInterval).toFixed(1) + '/s</b>　移速 <b>' + b.moveSpeed + '</b>')
          : ('生命 <b>?</b>　攻击 <b>?</b>　射速 <b>?</b>　移速 <b>?</b>')) +
        '</div>' +
        (ok ? '' : '<div class="cc-cond">解锁条件 · ' + this.unlockCondOf('char', c.id) + '</div>') +
        '</div>'
      );
    }
    return '<div class="char-grid">' + out.join('') + '</div>';
  }

  unlockCondOf(kind, id) {
    const u = (typeof UNLOCK_BY !== 'undefined') ? UNLOCK_BY[kind + ':' + id] : null;
    return u ? u.cond : '—';
  }

  /* ---------------- 统计页 ---------------- */
  statsHtml() {
    const s = (typeof Meta !== 'undefined') ? Meta.stats : null;
    if (!s) return '<div class="warn-box">统计不可用</div>';
    const row = (k, v) => '<div class="stat"><span>' + k + '</span><b>' + v + '</b></div>';
    const beaten = (typeof Meta !== 'undefined') ? Meta.beatenBosses() : [];
    const beatenNames = beaten.map(id => BossRoster.nameOf(id));
    return '<div class="stat-grid">' +
      row('游戏次数', s.runs) +
      row('死亡次数', s.deaths) +
      row('通关次数', s.wins) +
      row('Boss 击杀', s.bossKills) +
      row('总击杀', s.kills) +
      row('累计金币', s.coins) +
      row('最远层数', '第 ' + s.bestFloor + ' 层') +
      row('最长生存', this.fmtTime(s.bestTime)) +
      row('累计游玩', this.fmtTime(s.time)) +
      row('已击败首领', (typeof Meta !== 'undefined') ? (Meta.data.beaten.length + ' / ' + BossRoster.list.length) : '—') +
      '</div>' +
      '<div class="codex-note">' +
      (beatenNames.length ? ('击败过的首领：<b>' + beatenNames.join('、') + '</b>') : '尚未击败任何首领') +
      '</div>';
  }

  /* ---------------- 解锁图鉴 ---------------- */
  codexHtml() {
    if (typeof Meta === 'undefined') return '<div class="warn-box">不可用</div>';
    const KIND = { char: '角色', item: '道具', event: '房间事件', boss: '首领' };
    const groups = {};
    for (const c of Meta.codex()) {
      (groups[c.kind] = groups[c.kind] || []).push(c);
    }
    const out = [];
    for (const k of ['char', 'item', 'event', 'boss']) {
      const list = groups[k];
      if (!list || !list.length) continue;
      const got = list.filter(c => c.got).length;
      out.push('<div class="cdx-group"><div class="cdx-title">' + KIND[k] +
        '　<span>' + got + ' / ' + list.length + '</span></div>');
      for (const c of list) {
        const pct = Math.round(clamp(c.cur / Math.max(1, c.need), 0, 1) * 100);
        out.push('<div class="cdx-row' + (c.got ? ' got' : '') + '">' +
          '<span class="cdx-name">' + (c.got ? c.name : '???') + '</span>' +
          '<span class="cdx-cond">' + c.cond + '</span>' +
          '<span class="cdx-bar"><i style="width:' + (c.got ? 100 : pct) + '%"></i></span>' +
          '<span class="cdx-pct">' + (c.got ? '已解锁' : pct + '%') + '</span>' +
          '</div>');
      }
      out.push('</div>');
    }
    return out.join('');
  }

  /* 读取玩家输入的 Seed（空则随机） */
  readSeedInput() {
    if (!this.elSeed) return '';
    return (this.elSeed.value || '').trim().toUpperCase();
  }

  /* 当前章节名（如「机械矿井」） */
  chapterName(g) {
    const ch = ChapterOf(g ? g.floor : 1);
    return ch ? ch.cn : '';
  }

  /* 结算用：完整路线（第1层 废弃庭院 → …… → 第5层 星界核心） */
  chapterRoute(g) {
    const out = [];
    for (const ch of CHAPTERS) {
      const reached = (g && g.floor >= ch.id);
      out.push((reached ? '' : '<span style="opacity:0.4">') +
        `${ch.id}·${ch.cn}` + (reached ? '' : '</span>'));
    }
    return out.join(' → ');
  }

  /* 秒 → mm:ss */
  fmtTime(sec) {
    const s = Math.max(0, Math.round(sec || 0));
    const m = Math.floor(s / 60);
    return `${m}:${String(s % 60).padStart(2, '0')}`;
  }

  /* ---------------------------------------------------------
     横幅
     --------------------------------------------------------- */
  /* 章节环境提示（进入新层时短暂显示） */
  showHint(text, dur) {
    this.customHint = text || '';
    this.customHintT = dur || 5;
  }

  showBanner(text, sub, duration) {
    if (!text) return;
    this.banner = {
      text: text, sub: sub || '', life: duration || 1.6, maxLife: duration || 1.6,
      style: 'normal'
    };
  }

  showClearBanner(sub) {
    this.banner = {
      text: 'ROOM CLEAR', sub: sub || '门已开启 · 走进门洞继续探索',
      life: 2.4, maxLife: 2.4, style: 'clear'
    };
  }

  update(dt) {
    this.animT += dt;
    if (this.hintTimer > 0) this.hintTimer -= dt;
    if (this.customHintT > 0) {
      this.customHintT -= dt;
      if (this.customHintT <= 0) this.customHint = '';
    }
    if (this.hitVignette > 0) this.hitVignette = Math.max(0, this.hitVignette - dt * 1.6);
    if (this.banner) {
      this.banner.life -= dt;
      if (this.banner.life <= 0) this.banner = null;
    }
  }

  /* ---------------------------------------------------------
     HUD
     --------------------------------------------------------- */
  drawHUD(ctx) {
    const g = this.game;
    const p = g.player;
    if (!p) return;

    /* ---- 左上：生命值 ---- */
    const bx = 26, by = 24, bw = 268, bh = 20;
    ctx.fillStyle = 'rgba(6,10,15,0.72)';
    roundRectPath(ctx, bx - 8, by - 22, bw + 96, bh + 62, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,190,220,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = '700 11px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#7fd7ea';
    ctx.fillText((p.char ? p.char.name + ' · ' + p.char.en : '拾火者 · EMBER'), bx, by - 7);

    ctx.fillStyle = '#2a1218';
    roundRectPath(ctx, bx, by, bw, bh, 5);
    ctx.fill();

    const ratio = clamp(p.hp / p.maxHp, 0, 1);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    if (ratio > 0.35) {
      grad.addColorStop(0, '#ffb347');
      grad.addColorStop(1, '#ffe08a');
    } else {
      grad.addColorStop(0, '#ff4d4d');
      grad.addColorStop(1, '#ff8a5c');
    }
    ctx.fillStyle = grad;
    if (ratio > 0.001) {
      roundRectPath(ctx, bx, by, bw * ratio, bh, 5);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      const x = bx + (bw / 5) * i;
      ctx.beginPath();
      ctx.moveTo(x, by + 2);
      ctx.lineTo(x, by + bh - 2);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,220,160,0.35)';
    roundRectPath(ctx, bx + 0.5, by + 0.5, bw - 1, bh - 1, 5);
    ctx.stroke();

    ctx.font = '800 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffe9c0';
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, bx + bw + 62, by + 15);

    /* ---- 左上第二行：余烬 / 层数 / 房间 / Seed ---- */
    ctx.textAlign = 'left';
    ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffd35e';
    ctx.fillText(`◈ ${g.coins} 金币`, bx, by + 40);

    ctx.font = '600 12px "Segoe UI", system-ui, sans-serif';
    const roomName = g.room ? g.room.meta.cn : '-';
    const alive = g.room ? g.room.aliveCount() : 0;
    const statusTxt = (g.room && g.room.isCombatRoom)
      ? (g.room.state === 'clear' ? '已肃清 · 门已开启' : `残形剩余 ${alive}`)
      : '可自由通行';
    ctx.fillStyle = (g.room && g.room.isCombatRoom && g.room.state !== 'clear') ? '#ff9d6b' : '#7dffb0';
    const chCn = this.chapterName(g);
    ctx.fillText(`第 ${g.floor} 层 · ${chCn} · ${roomName} · ${statusTxt}`, bx + 88, by + 40);

    ctx.fillStyle = '#5d6f7e';
    ctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`SEED ${g.seed}　击碎 ${g.kills}　${playerStatsText(p)}`, bx, by + 58);

    /* 章节进度：五章小圆点（当前章节点亮） */
    const dotY = by + 74;
    let dotX = bx + 168;
    for (const ch of CHAPTERS) {
      const cur = (ch.id === g.floor);
      const done = (ch.id < g.floor);
      ctx.fillStyle = cur ? ch.pal.accent : (done ? 'rgba(160,190,210,0.55)' : 'rgba(120,150,170,0.22)');
      ctx.beginPath();
      ctx.arc(dotX, dotY, cur ? 4.5 : 3, 0, TAU);
      ctx.fill();
      dotX += 15;
    }

    /* ---- 增益 / 诅咒条 ---- */
    this.drawBuffs(ctx, bx, by + 76);

    /* ---- 右上：小地图 ---- */
    this.drawMinimap(ctx);

    /* ---- 顶部中央：Boss 血条 + 阶段 + 攻击预警 ---- */
    this.drawBossBar(ctx);

    /* ---- 左下：Build 面板（持有道具 + 组合） ---- */
    this.drawBuildPanel(ctx);

    /* ---- 交互提示 ---- */
    if (g.nearProp && !g.nearProp.used) {
      const txt = (g.touchMode ? '' : 'E · ') + g.nearProp.label;
      ctx.textAlign = 'center';
      ctx.font = '700 14px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      const w = ctx.measureText(txt).width + 26;
      ctx.fillStyle = 'rgba(6,10,15,0.8)';
      roundRectPath(ctx, VIEW_W / 2 - w / 2, VIEW_H - 74, w, 30, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,200,110,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#ffd28a';
      ctx.fillText(txt, VIEW_W / 2, VIEW_H - 55);
      ctx.textAlign = 'left';
    }

    /* ---- 底部操作提示 / 章节环境提示（渐隐） ---- */
    if (this.hintTimer > 0 || this.customHintT > 0) {
      if (this.customHintT > 0) {
        ctx.globalAlpha = clamp(this.customHintT / 2.0, 0, 1);
        ctx.font = '700 13px "Segoe UI", "PingFang SC", system-ui, sans-serif';
        ctx.fillStyle = ChapterOf(g.floor).pal.accent;
        ctx.textAlign = 'center';
        ctx.fillText(this.customHint, VIEW_W / 2, VIEW_H - 22);
        ctx.textAlign = 'left';
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = clamp(this.hintTimer / 2.5, 0, 1);
        ctx.font = '600 12px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = '#6d8296';
        ctx.textAlign = 'center';
        const hint = g.touchMode
          ? '拖动屏幕两侧即可移动与射击'
          : 'WASD 移动　·　鼠标瞄准　·　左键射击　·　E 交互　·　ESC 暂停　·　F 全屏';
        ctx.fillText(hint, VIEW_W / 2, VIEW_H - 22);
        ctx.textAlign = 'left';
        ctx.globalAlpha = 1;
      }
    }

    /* ---- 受击暗角 / 低血量 ---- */
    if (this.hitVignette > 0) {
      const a = this.hitVignette * 0.5;
      const vg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.28, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.78);
      vg.addColorStop(0, 'rgba(255,40,40,0)');
      vg.addColorStop(1, `rgba(255,40,40,${a})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    if (p.hp > 0 && ratio < 0.3) {
      const pulse = 0.10 + 0.08 * Math.sin(g.time * 6);
      const vg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.3, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.8);
      vg.addColorStop(0, 'rgba(255,0,0,0)');
      vg.addColorStop(1, `rgba(255,0,0,${pulse})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }

    /* 悬停说明画在最上层 */
    this.drawItemTooltip(ctx);
  }

  /* ---------------------------------------------------------
     Build 面板：当前持有的道具（左下角）
     鼠标悬停任意道具 → 显示完整说明
     --------------------------------------------------------- */
  /* ---------------------------------------------------------
     Boss 血条：名称 / 阶段 / HP / 阶段阈值刻度 / 攻击预警
     —— Boss 战的关键可读性：当前在打什么、处在第几阶段、下一招是什么
     --------------------------------------------------------- */
  drawBossBar(ctx) {
    const g = this.game;
    if (!g || !g.room) return;
    let boss = null;
    for (const e of g.room.enemies) {
      if (e.isBoss && !e.dead) { boss = e; break; }
    }
    if (!boss) return;

    const cx = VIEW_W / 2;
    const bw = 660, bh = 16;
    const bx = cx - bw / 2, by = 30;
    const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
    const col = boss.colors[1] || '#ff4d6b';
    const sub = boss.colors[2] || '#ffffff';

    /* 背板 */
    ctx.fillStyle = 'rgba(6,10,15,0.78)';
    roundRectPath(ctx, bx - 12, by - 24, bw + 24, bh + 50, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,120,140,0.22)';
    ctx.lineWidth = 1;
    ctx.stroke();

    /* 名称 + 阶段 */
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '800 14px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    ctx.fillStyle = col;
    ctx.fillText(boss.name || '守望者', bx, by - 8);

    ctx.font = '700 11px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    ctx.fillStyle = sub;
    const pname = boss.phaseNames ? boss.phaseNames[boss.phase - 1] : '';
    ctx.fillText(`第 ${boss.phase} 阶段 · ${pname}`, bx + ctx.measureText(boss.name || '守望者').width + 90, by - 8);

    /* 阶段点 */
    for (let i = 0; i < 3; i++) {
      const px = bx + bw - 12 - (2 - i) * 16;
      const on = i < boss.phase;
      ctx.fillStyle = on ? col : 'rgba(255,255,255,0.16)';
      ctx.beginPath();
      ctx.arc(px, by - 12, 4.5, 0, TAU);
      ctx.fill();
    }

    /* 血条 */
    ctx.fillStyle = '#241018';
    roundRectPath(ctx, bx, by, bw, bh, 5);
    ctx.fill();

    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, boss.colors[0] || '#4a2b52');
    grad.addColorStop(0.35, col);
    grad.addColorStop(1, sub);
    ctx.fillStyle = grad;
    if (ratio > 0.001) {
      roundRectPath(ctx, bx, by, bw * ratio, bh, 5);
      ctx.fill();
    }

    /* 阶段阈值刻度（70% / 40%）：让玩家知道什么时候会变招 */
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2;
    for (const gate of [0.70, 0.40]) {
      const gx = bx + bw * gate;
      ctx.beginPath();
      ctx.moveTo(gx, by - 2);
      ctx.lineTo(gx, by + bh + 2);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1;
    roundRectPath(ctx, bx + 0.5, by + 0.5, bw - 1, bh - 1, 5);
    ctx.stroke();

    ctx.textAlign = 'right';
    ctx.font = '800 12px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffe9c0';
    ctx.fillText(`${Math.ceil(boss.hp)} / ${boss.maxHp}`, bx + bw - 66, by + 13);
    ctx.textAlign = 'left';

    /* 攻击预警：当前招式名 / 阶段转换提示 */
    let warn = null;
    if (boss.phaseLock > 0) warn = '阶段转换 · 攻击更快，弹幕更密';
    else if (boss.dying) warn = '陨落中';
    else if (boss.telegraphText) warn = boss.telegraphText;

    ctx.textAlign = 'center';
    if (warn) {
      const pulse = 0.72 + 0.28 * Math.sin(this.animT * 9);
      ctx.globalAlpha = boss.dying ? 0.8 : pulse;
      ctx.font = '800 15px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = boss.dying ? '#ffd35e' : '#ff9d6b';
      ctx.fillText('▲ ' + warn, cx, by + bh + 18);
      ctx.globalAlpha = 1;
    } else {
      ctx.font = '600 11px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = '#6d8296';
      ctx.fillText('特殊技能：' + (boss.specialName || '-'), cx, by + bh + 18);
    }
    ctx.textAlign = 'left';
  }

  /* ---------------------------------------------------------
     Build 面板（左下）
     --------------------------------------------------------- */
  drawBuildPanel(ctx) {
    const g = this.game;
    const p = g.player;
    if (!p || !p.build) return;

    const slots = p.build.slots;
    this._hoverItem = null;
    if (!slots.length) return;

    const mx = g.mouseWorld.x, my = g.mouseWorld.y;
    const combos = p.build.comboList || [];

    /* ---- 布局：单行紧凑色块条，贴在左下角 ---- */
    const CHIP = 17, GAP = 4, MAX_CHIP = 14;
    const x0 = 26;
    const y0 = VIEW_H - 32;                       // 色块顶边
    const shown = Math.min(slots.length, MAX_CHIP);
    const extra = slots.length - shown;
    let stripW = shown * CHIP + (shown - 1) * GAP + (extra > 0 ? 30 : 0);

    /* 悬停热区（略放大好进入） */
    const hot = mx >= x0 - 10 && mx <= x0 + stripW + (combos.length ? 74 : 10)
             && my >= y0 - 14 && my <= y0 + CHIP + 14;

    ctx.save();

    /* ---- 悬停时才展开完整列表（平时不占视野） ---- */
    if (hot && !g.touchMode) {
      const rowH = 17, colW = 214, maxRows = 8;
      const cols = slots.length > maxRows ? 2 : 1;
      const rows = Math.min(maxRows, Math.ceil(slots.length / cols));
      const panelH = 26 + rows * rowH;
      const px2 = x0 - 8, py2 = y0 - 12 - panelH;

      ctx.fillStyle = 'rgba(6,10,15,0.88)';
      roundRectPath(ctx, px2, py2, colW * cols + 16, panelH, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,190,220,0.22)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.font = '700 11px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#7fd7ea';
      ctx.fillText(`BUILD · ${p.build.length} 件道具`, px2 + 8, py2 + 15);

      if (combos.length) {
        ctx.font = '700 10.5px "Segoe UI", "PingFang SC", system-ui, sans-serif';
        ctx.fillStyle = '#c08bff';
        const names = combos.slice(0, 3).map(c => c.name).join(' · ');
        const more = combos.length > 3 ? ` +${combos.length - 3}` : '';
        ctx.fillText('组合 ' + names + more, px2 + 126, py2 + 15);
      }

      for (let i = 0; i < slots.length; i++) {
        const it = ITEM_BY_ID[slots[i].id];
        if (!it) continue;
        const col = Math.floor(i / maxRows);
        const row = i % maxRows;
        if (col >= cols) break;
        const rx = px2 + 8 + col * colW;
        const ry = py2 + 32 + row * rowH;
        const inRow = mx >= rx - 4 && mx <= rx + colW - 12 && my >= ry - 10 && my <= ry + 5;
        if (inRow) this._hoverItem = { item: it, n: slots[i].n };

        ctx.fillStyle = it.color;
        roundRectPath(ctx, rx, ry - 9, 10, 10, 3);
        ctx.fill();

        const label = it.name + (slots[i].n > 1 ? ` ×${slots[i].n}` : '');
        ctx.font = '700 11px "Segoe UI", "PingFang SC", system-ui, sans-serif';
        ctx.fillStyle = inRow ? '#ffffff' : '#d6e3ee';
        ctx.fillText(label, rx + 15, ry);
        if (inRow) {
          ctx.strokeStyle = 'rgba(255,220,150,0.55)';
          ctx.lineWidth = 1;
          roundRectPath(ctx, rx - 4, ry - 10, colW - 12, 16, 4);
          ctx.stroke();
        }
      }
    }

    /* ---- 常驻：一行小色块（半透明，鼠标移近才变亮） ---- */
    ctx.globalAlpha = hot ? 1 : 0.6;
    for (let i = 0; i < shown; i++) {
      const it = ITEM_BY_ID[slots[i].id];
      if (!it) continue;
      const x = x0 + i * (CHIP + GAP);
      const inChip = mx >= x - 2 && mx <= x + CHIP + 2 && my >= y0 - 6 && my <= y0 + CHIP + 6;
      if (inChip) this._hoverItem = { item: it, n: slots[i].n };

      const cat = ITEM_CAT[it.cat] || ITEM_CAT.special;
      ctx.fillStyle = it.color;
      roundRectPath(ctx, x, y0, CHIP, CHIP, 4);
      ctx.fill();
      ctx.strokeStyle = inChip ? 'rgba(255,235,190,0.9)' : 'rgba(10,16,22,0.75)';
      ctx.lineWidth = 1;
      ctx.stroke();

      /* 左上小角标 = 分类色；堆叠数画在方块右下 */
      ctx.fillStyle = cat.color;
      ctx.fillRect(x + 2.5, y0 + 2.5, 3.5, 3.5);
      if (slots[i].n > 1) {
        ctx.font = '800 9px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = 'rgba(8,12,18,0.85)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(slots[i].n), x + CHIP - 5, y0 + CHIP - 5);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
      }
      if (inChip) {
        ctx.strokeStyle = 'rgba(255,225,160,0.9)';
        ctx.lineWidth = 1.4;
        roundRectPath(ctx, x - 2, y0 - 2, CHIP + 4, CHIP + 4, 5);
        ctx.stroke();
      }
    }

    /* 超出显示上限 */
    if (extra > 0) {
      ctx.font = '700 10px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#8fa3b5';
      ctx.textBaseline = 'middle';
      ctx.fillText(`+${extra}`, x0 + shown * (CHIP + GAP) + 4, y0 + CHIP / 2 + 1);
      ctx.textBaseline = 'alphabetic';
    }

    /* 组合数小徽标 */
    if (combos.length) {
      const bx = x0 + stripW + 10;
      ctx.font = '700 10px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = '#c08bff';
      ctx.textBaseline = 'middle';
      ctx.fillText(`⚡${combos.length}`, bx, y0 + CHIP / 2 + 1);
      ctx.textBaseline = 'alphabetic';
    }
    ctx.restore();
  }

  /* 悬停说明浮层 */
  drawItemTooltip(ctx) {
    const h = this._hoverItem;
    if (!h) return;
    const it = h.item;
    const cat = ITEM_CAT[it.cat] || ITEM_CAT.special;
    const combos = this.game.player.build.combosOf(it.id);

    const w = 306;
    const lines = this._wrap(ctx, it.desc, w - 30, 12);
    const boxH = 62 + lines.length * 16 + (combos.length ? 18 + combos.length * 14 : 0);
    let x = this.game.mouseWorld.x + 18;
    let y = this.game.mouseWorld.y - boxH - 12;
    if (x + w > VIEW_W - 12) x = VIEW_W - 12 - w;
    if (y < 12) y = Math.min(VIEW_H - boxH - 12, this.game.mouseWorld.y + 20);

    ctx.save();
    ctx.fillStyle = 'rgba(6,10,15,0.94)';
    roundRectPath(ctx, x, y, w, boxH, 8);
    ctx.fill();
    ctx.strokeStyle = it.color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    let ty = y + 22;

    ctx.font = '800 14px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    ctx.fillStyle = it.color;
    ctx.fillText(it.name, x + 15, ty);

    ctx.font = '700 11px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    ctx.fillStyle = cat.color;
    const nw = ctx.measureText(it.name).width;
    ctx.fillText(cat.cn + (h.n > 1 ? ` ×${h.n}` : '') + `　上限 ${it.max}`, x + 19 + nw, ty);

    ty += 20;
    ctx.font = '600 12px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    ctx.fillStyle = '#c8d8e4';
    for (const ln of lines) { ctx.fillText(ln, x + 15, ty); ty += 16; }

    if (combos.length) {
      ty += 4;
      ctx.font = '700 10.5px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = '#c08bff';
      ctx.fillText('可参与的组合', x + 15, ty);
      ty += 14;
      ctx.font = '600 10.5px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      for (const c of combos) {
        const active = this.game.player.build.comboList.indexOf(c) >= 0;
        ctx.fillStyle = active ? c.color : '#5d6f7e';
        ctx.fillText((active ? '◆ ' : '◇ ') + c.name + '　' + (active ? '已激活' : '需要 ' +
          Object.keys(c.need).map(k => MOD_CN[k] || k).join(' + ')), x + 15, ty);
        ty += 14;
      }
    }
    ctx.restore();
  }

  /* 简单折行（兼容中文：逐字测量） */
  _wrap(ctx, text, maxW, fontPx) {
    ctx.font = `600 ${fontPx}px "Segoe UI", "PingFang SC", system-ui, sans-serif`;
    const out = [];
    let line = '';
    for (const ch of text) {
      const t = line + ch;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch; }
      else line = t;
    }
    if (line) out.push(line);
    return out;
  }

  /* ---------------------------------------------------------
     小地图（右上角）
     当前房间 / 已访问 / 未访问 / Boss / 特殊房间
     --------------------------------------------------------- */
  drawMinimap(ctx) {
    const g = this.game;
    const map = g.map;
    if (!map) return;

    const cell = 24;
    const pad = 10;
    const w = map.cols * cell, h = map.rows * cell;
    const ox = VIEW_W - 26 - w, oy = 20;

    ctx.save();
    ctx.fillStyle = 'rgba(6,10,15,0.72)';
    roundRectPath(ctx, ox - pad, oy - pad, w + pad * 2, h + pad * 2 + 4, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,190,220,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    const cxOf = (c) => ox + c * cell + cell / 2;
    const cyOf = (r) => oy + r * cell + cell / 2;

    /* 连接线 */
    ctx.strokeStyle = 'rgba(140,180,200,0.35)';
    ctx.lineWidth = 2;
    for (const cd of map.cells) {
      if (cd.hidden && !cd.discovered) continue;
      if (!map.isVisited(cd) && cd !== map.current) continue;
      for (const d of DIRS) {
        const n = cd.links[d.side];
        if (!n) continue;
        if (n.hidden && !n.discovered) continue;
        ctx.beginPath();
        ctx.moveTo(cxOf(cd.c), cyOf(cd.r));
        ctx.lineTo(lerp(cxOf(cd.c), cxOf(n.c), 0.5), lerp(cyOf(cd.r), cyOf(n.r), 0.5));
        ctx.stroke();
      }
    }

    /* 房间格（未发现的隐藏房不显示） */
    for (const cd of map.cells) {
      if (cd.hidden && !cd.discovered) continue;
      const meta = ROOM_META[cd.type] || ROOM_META.combat;
      const visited = map.isVisited(cd);
      const isCurrent = (cd === map.current);
      const x = ox + cd.c * cell, y = oy + cd.r * cell;
      const s = cell - 7;

      /* 未访问：暗淡轮廓 */
      if (!visited && !isCurrent) {
        ctx.fillStyle = 'rgba(90,110,130,0.12)';
        roundRectPath(ctx, x + 3.5, y + 3.5, s, s, 3);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,150,175,0.28)';
        ctx.lineWidth = 1;
        ctx.stroke();
        continue;
      }

      ctx.globalAlpha = isCurrent ? 1 : (visited ? 0.72 : 0.4);
      ctx.fillStyle = meta.color;
      roundRectPath(ctx, x + 3.5, y + 3.5, s, s, 3);
      ctx.fill();
      ctx.globalAlpha = 1;

      /* 特殊房间字形 */
      if (cd.type !== ROOM_TYPE.COMBAT) {
        ctx.font = '800 11px "Segoe UI", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#0b1017';
        ctx.fillText(meta.glyph, x + 3.5 + s / 2, y + 3.5 + s / 2 + 0.5);
      }

      /* 当前房间：脉冲高亮 + 中心点 */
      if (isCurrent) {
        const pulse = 0.6 + 0.4 * Math.sin(g.time * 5);
        ctx.strokeStyle = `rgba(255,255,255,${pulse})`;
        ctx.lineWidth = 2.5;
