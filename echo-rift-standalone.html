        const rr = lerp(430, 90, phase);
        ctx.globalAlpha = 0.30 * (1 - Math.abs(phase - 0.5) * 1.2);
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(0, 0, rr, 0, TAU);
        ctx.stroke();
      }
      ctx.restore();
    }

    if (this.state === 'windup') {
      ctx.save();
      ctx.rotate(this.face);
      bossWarnLine(ctx, this.r, 660 * (0.35 + 0.65 * (1 - this.stateT / 0.6)),
        1 - this.stateT / 0.6, '#ff6bd0', t);
      ctx.restore();
    }

    ctx.save();
    if (this.dying) this.deathTransform(ctx);

    /* 吸积盘（两层反向旋转） */
    ctx.save();
    ctx.rotate(t * 1.1);
    ctx.strokeStyle = 'rgba(185,140,255,0.55)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 1.7, this.r * 0.62, 0, 0, TAU);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.rotate(-t * 0.8);
    ctx.strokeStyle = 'rgba(255,107,208,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 1.35, this.r * 0.5, 0.6, 0, TAU);
    ctx.stroke();
    ctx.restore();

    /* 事件视界：纯黑核心 */
    bossCore(ctx, this.r, '#ffffff', '#b98cff', 'rgba(27,27,46,0.35)');
    ctx.fillStyle = '#05040a';
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.62, 0, TAU);
    ctx.fill();

    /* 视界外圈的高光（越接近死亡越亮） */
    const hurt = 1 - clamp(this.hp / this.maxHp, 0, 1);
    ctx.strokeStyle = pulling ? '#ff6bd0' : '#ffffff';
    ctx.globalAlpha = 0.5 + 0.4 * hurt + (pulling ? 0.3 * Math.sin(t * 24) : 0);
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.62, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* 环绕的星屑 */
    for (let i = 0; i < 6; i++) {
      const a = t * 1.6 + (i / 6) * TAU;
      const rr = this.r * (1.05 + 0.25 * Math.sin(t * 2 + i));
      ctx.fillStyle = i % 2 ? '#b98cff' : '#ff6bd0';
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 3.4, 0, TAU);
      ctx.fill();
    }

    this.drawCracks(ctx, this.r * 0.9, '#ff6bd0');
    ctx.restore();

    bossHurtRing(ctx, this);
  }
}

/* ===========================================================
   Boss 名册：按层数挑选（第 1 层固定回廊守望者）
   —— 数据驱动：新增 Boss = 加一条 { id, minFloor }
   =========================================================== */
const BossRoster = {
  list: [
    { id: 'boss', name: '回廊守望者', minFloor: 1 },
    { id: 'boss_slagsmith', name: '熔渣铸匠', minFloor: 2 },
    { id: 'boss_weaver', name: '经纬织者', minFloor: 2 },
    { id: 'boss_verdict', name: '铁律摆钟', minFloor: 3 },
    { id: 'boss_bloom', name: '腐殖母冠', minFloor: 3 },
    { id: 'boss_prism', name: '折射歌伶', minFloor: 4 },
    { id: 'boss_dune', name: '沙丘巨颚', minFloor: 4 },
    { id: 'boss_volt', name: '万伏主教', minFloor: 5 },
    { id: 'boss_collapse', name: '坍缩星核', minFloor: 6 }
  ],

  /* floor 从 1 开始；rng 传入 → 同 Seed 同 Boss
     （不使用跨局状态：只依赖 floor + rng，保证种子可复现）
     章节表（chapters.js）为每层指定了专属 Boss 池，池与池之间互不重叠
     → 每层遇到的 Boss 一定是该层独有的那一批 */
  pick(floor, rng) {
    if (!floor || floor <= 1) { this.lastId = 'boss'; return 'boss'; }
    const r = rng || new Rng(floor);

    if (typeof CHAPTERS !== 'undefined') {
      const ch = ChapterOf(floor);
      if (ch && ch.bosses && ch.bosses.length) {
        /* 只保留「已解锁」的 Boss（Meta 解锁后才会加入该层随机池） */
        let use = ch.bosses.filter(id => this.list.some(b => b.id === id));
        use = Meta.availableBosses(use);
        if (use.length) {
          const id = r.pick(use);
          this.lastId = id;
          return id;
        }
      }
    }

    const pool = this.list.filter(b => b.id !== 'boss' && floor >= (b.minFloor || 1));
    if (!pool.length) return 'boss';
    let use = pool;
    if (pool.length > 1) {
      /* 避免与「上一层会遇到的 Boss」重复：用 floor 派生 Rng 计算，仍然可复现 */
      const prevPool = this.list.filter(b => b.id !== 'boss' && (floor - 1) >= (b.minFloor || 1));
      if (prevPool.length) {
        const prev = r.fork('prev').pick(prevPool).id;
        const f = pool.filter(b => b.id !== prev);
        if (f.length) use = f;
      }
    }
    return r.pick(use).id;
  },

  nameOf(id) {
    for (const b of this.list) if (b.id === id) return b.name;
    return '回廊守望者';
  },

  /* UI 用：展示当前层的 Boss 信息 */
  infoOf(id) {
    const d = EnemyFactory.defOf(id);
    return { name: (d && d.boss && d.boss.name) || this.nameOf(id), title: (d && d.boss && d.boss.title) || '' };
  }
};

      special: 0.52, bullet: 2, spread: 2, affix: 0.32, budget: 12, max: 2
    },
    scale: { hp: 1.60, rate: 1.64, speed: 1.18 },
    bosses: ['boss_collapse', 'boss_nameless'],
    guard: ['charger', 'shooter', 'aegis'],
    coins: 1.8,
    final: true
  }
];

/* 取章节（层数越界时钳制，保证永远有主题） */
function ChapterOf(floor) {
  const f = clamp(Math.floor(floor) || 1, 1, CHAPTERS.length);
  return CHAPTERS[f - 1];
}

/* 总层数（流程终点） */
const CHAPTER_COUNT = CHAPTERS.length;

/* ===========================================================
   章节背景效果（纯表现层，不参与碰撞）
   —— 每层一种：飘落物 / 火星 / 孢子 / 星辰 / 能量流
   =========================================================== */
class ChapterFx {
  constructor(chapter, rng) {
    this.ch = chapter;
    this.type = (chapter.bg && chapter.bg.type) || 'petal';
    this.t = 0;
    this.items = [];
    const R = rng || new Rng(1);
    const n = (chapter.bg && chapter.bg.n) || 40;

    for (let i = 0; i < n; i++) {
      const it = this._make(R, true);
      this.items.push(it);
    }

    /* 机械矿井：背景齿轮剪影 */
    this.gears = [];
    if (this.type === 'spark') {
      for (let i = 0; i < 5; i++) {
        this.gears.push({
          x: R.range(ARENA.x + 80, ARENA.x + ARENA.w - 80),
          y: R.range(ARENA.y + 70, ARENA.y + ARENA.h - 70),
          r: R.range(44, 108),
          sp: R.range(-0.5, 0.5) || 0.3,
          teeth: R.int(8, 12),
          a: R.range(0, TAU)
        });
      }
    }
    /* 虚空遗迹：扭曲网格 */
    if (this.type === 'star') {
      this.grid = { off: R.range(0, 90), wob: R.range(0.6, 1.4) };
    }
    /* 星界核心：中央光晕 */
    if (this.type === 'ray') {
      this.rays = [];
      for (let i = 0; i < 9; i++) {
        this.rays.push({ a: (i / 9) * TAU + R.range(-0.2, 0.2), w: R.range(10, 30), sp: R.range(0.05, 0.2) });
      }
    }
  }

  _make(R, spread) {
    const it = { x: 0, y: 0, vx: 0, vy: 0, r: 2, life: 1, ph: 0, sp: 0 };
    switch (this.type) {
      case 'petal':     // 缓缓飘落的叶屑与尘埃
        it.x = R.range(ARENA.x, ARENA.x + ARENA.w);
        it.y = spread ? R.range(ARENA.y, ARENA.y + ARENA.h) : ARENA.y - 10;
        it.vx = R.range(-16, 16);
        it.vy = R.range(22, 52);
        it.r = R.range(1.6, 4.2);
        it.ph = R.range(0, TAU);
        it.sp = R.range(0.6, 1.8);
        break;
      case 'spark':     // 上升的火星（矿井炉火）
        it.x = R.range(ARENA.x, ARENA.x + ARENA.w);
        it.y = spread ? R.range(ARENA.y, ARENA.y + ARENA.h) : ARENA.y + ARENA.h + 8;
        it.vx = R.range(-12, 12);
        it.vy = R.range(-56, -22);
        it.r = R.range(1.2, 3.0);
        it.ph = R.range(0, TAU);
        it.sp = R.range(2, 5);
        break;
      case 'spore':     // 悬浮孢子（缓慢漂移）
        it.x = R.range(ARENA.x, ARENA.x + ARENA.w);
        it.y = spread ? R.range(ARENA.y, ARENA.y + ARENA.h) : ARENA.y + ARENA.h;
        it.vx = R.range(-10, 10);
        it.vy = R.range(-18, -5);
        it.r = R.range(1.8, 4.6);
        it.ph = R.range(0, TAU);
        it.sp = R.range(0.5, 1.4);
        break;
      case 'star':      // 虚空星尘（横向漂移）
        it.x = R.range(ARENA.x, ARENA.x + ARENA.w);
        it.y = spread ? R.range(ARENA.y, ARENA.y + ARENA.h) : R.range(ARENA.y, ARENA.y + ARENA.h);
        it.vx = R.range(-26, -6);
        it.vy = R.range(-6, 6);
        it.r = R.range(1.0, 2.6);
        it.ph = R.range(0, TAU);
        it.sp = R.range(1.5, 4);
        break;
      default:          // ray：能量流（斜向）
        it.x = R.range(ARENA.x, ARENA.x + ARENA.w);
        it.y = spread ? R.range(ARENA.y, ARENA.y + ARENA.h) : R.range(ARENA.y, ARENA.y + ARENA.h);
        it.vx = R.range(30, 90);
        it.vy = R.range(-40, -14);
        it.r = R.range(1.2, 3.2);
        it.ph = R.range(0, TAU);
        it.sp = R.range(1, 3);
        break;
    }
    return it;
  }

  _recycle(it) {
    const R = this._rr || (this._rr = new Rng(hashSeed(this.ch.cn)));
    const fresh = this._make(R, false);
    it.x = fresh.x; it.y = fresh.y;
    it.vx = fresh.vx; it.vy = fresh.vy;
    it.r = fresh.r; it.ph = fresh.ph; it.sp = fresh.sp;
  }

  update(dt) {
    this.t += dt;
    const L = ARENA.x, Rr = ARENA.x + ARENA.w, T = ARENA.y, B = ARENA.y + ARENA.h;
    for (const it of this.items) {
      it.ph += dt * it.sp;
      it.x += (it.vx + Math.sin(it.ph) * 12) * dt;
      it.y += it.vy * dt;
      if (it.y > B + 20 || it.y < T - 20 || it.x < L - 20 || it.x > Rr + 20) this._recycle(it);
    }
    if (this.gears) for (const g of this.gears) g.a += g.sp * dt;
    if (this.rays) for (const r of this.rays) r.a += r.sp * dt * 0.35;
  }

  /* 环境层：画在地板之上、实体之下 */
  drawUnder(ctx) {
    const ch = this.ch;
    const col = ch.pal.fx;
    ctx.save();
    ctx.beginPath();
    ctx.rect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
    ctx.clip();

    /* 矿井齿轮剪影 */
    if (this.gears) {
      for (const g of this.gears) {
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.rotate(g.a);
        ctx.globalAlpha = 0.055;
        ctx.strokeStyle = ch.pal.accent;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, g.r, 0, TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, g.r * 0.55, 0, TAU);
        ctx.stroke();
        for (let i = 0; i < g.teeth; i++) {
          const a = (i / g.teeth) * TAU;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * g.r, Math.sin(a) * g.r);
          ctx.lineTo(Math.cos(a) * (g.r + 9), Math.sin(a) * (g.r + 9));
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    /* 虚空扭曲网格 */
    if (this.grid) {
      ctx.globalAlpha = 0.05;
      ctx.strokeStyle = ch.pal.accent;
      ctx.lineWidth = 1;
      const step = 74;
      for (let x = ARENA.x; x < ARENA.x + ARENA.w; x += step) {
        ctx.beginPath();
        for (let y = ARENA.y; y <= ARENA.y + ARENA.h; y += 18) {
          const wx = x + Math.sin(y * 0.012 + this.t * 0.7) * 9;
          if (y === ARENA.y) ctx.moveTo(wx, y); else ctx.lineTo(wx, y);
        }
        ctx.stroke();
      }
    }

    /* 星界核心：中央放射光带 */
    if (this.rays) {
      const cx = VIEW_W / 2, cy = VIEW_H / 2;
      ctx.globalAlpha = 0.055;
      ctx.fillStyle = ch.pal.accent;
      for (const r of this.rays) {
        const w = r.w + Math.sin(this.t * 1.4 + r.a) * 8;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(r.a - w / 600) * 900, cy + Math.sin(r.a - w / 600) * 900);
        ctx.lineTo(cx + Math.cos(r.a + w / 600) * 900, cy + Math.sin(r.a + w / 600) * 900);
        ctx.closePath();
        ctx.fill();
      }
    }

    ctx.globalAlpha = 1;

    /* 粒子 */
    for (const it of this.items) {
      const tw = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(it.ph * 1.7));
      ctx.globalAlpha = this.type === 'spore' ? tw * 0.7 : tw;
      ctx.fillStyle = col;
      if (this.type === 'petal') {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.ph);
        ctx.beginPath();
        ctx.ellipse(0, 0, it.r * 2.1, it.r * 0.8, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.r, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* 顶层：章节色调 + 边缘氛围（画在实体之上、墙体之下） */
  drawOver(ctx) {
    const ch = this.ch;
    ctx.save();
    if (this.type === 'spore') {
      /* 森林：底部雾气 */
      const g = ctx.createLinearGradient(0, ARENA.y + ARENA.h * 0.55, 0, ARENA.y + ARENA.h);
      g.addColorStop(0, 'rgba(90,160,80,0)');
      g.addColorStop(1, 'rgba(90,190,110,0.09)');
      ctx.fillStyle = g;
      ctx.fillRect(ARENA.x, ARENA.y + ARENA.h * 0.55, ARENA.w, ARENA.h * 0.45);
    } else if (this.type === 'spark') {
      const g = ctx.createLinearGradient(0, ARENA.y, 0, ARENA.y + ARENA.h * 0.5);
      g.addColorStop(0, 'rgba(255,150,60,0.07)');
      g.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g;
      ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h * 0.5);
    } else if (this.type === 'star') {
      const p = 0.05 + 0.02 * Math.sin(this.t * 1.1);
      const g = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, ARENA.h * 0.2, VIEW_W / 2, VIEW_H / 2, ARENA.w * 0.62);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(120,70,220,${p})`);
      ctx.fillStyle = g;
      ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
    } else if (this.type === 'ray') {
      const p = 0.06 + 0.03 * Math.sin(this.t * 2.2);
      const g = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, 40, VIEW_W / 2, VIEW_H / 2, ARENA.w * 0.55);
      g.addColorStop(0, `rgba(150,235,255,${p})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
    }
    ctx.restore();
  }
}

/* ===========================================================
   环境障碍（每层不同）
   -----------------------------------------------------------
   通用契约：
     · solid        —— 是否阻挡移动与子弹
     · affect(e,dt) —— 对实体（玩家与敌人一致）的持续作用
     · onBullet(p)  —— 被子弹命中（可破坏物在这里扣血）
     · drawUnder / drawOver —— 分层绘制（地面预警在下，柱体在上）
   所有障碍的伤害都「先预警、再生效」，且对玩家与敌人同等生效
   =========================================================== */
class EnvHazard {
  constructor(game, x, y, opt) {
    opt = opt || {};
    this.game = game;
    this.x = x;
    this.y = y;
    this.r = opt.r || 30;
    this.solid = !!opt.solid;
    this.hp = opt.hp || 0;
    this.maxHp = this.hp;
    this.dead = false;
    this.t = opt.phase || 0;
    this.hitFlash = 0;
    this.dmg = opt.dmg || 0;
    this.color = opt.color || '#8fa3b5';
    this.rng = opt.rng || new Rng(hashSeed('hz'));
    this.isHazard = true;
  }

  update(dt) {
    this.t += dt;
    if (this.hitFlash > 0) this.hitFlash = Math.max(0, this.hitFlash - dt * 4);
  }

  /* 持续作用：默认无 */
  affect(entity, dt) { /* 子类实现 */ }

  /* 命中判定（圆） */
  contains(x, y, r) {
    return Collision.circleCircle(x, y, r || 0, this.x, this.y, this.r);
  }

  /* 子弹命中（solid 的障碍吸收子弹；可破坏物在此扣血） */
  onBullet(p) {
    if (this.hp <= 0) return;
    const d = Math.max(1, Math.round(p.damage * (p.damageMul || 1)));
    this.hp -= d;
    this.hitFlash = 1;
    this.game.damageNumbers.add(p.x, p.y - 8, d, { color: '#c8d8e4', life: 0.5 });
    this.game.particles.burst(p.x, p.y, 4, { speed: 150, life: 0.24, size: 3, color: this.color });
    if (this.hp <= 0) this.onBreak();
  }

  onBreak() {
    this.dead = true;
    this.game.particles.burst(this.x, this.y, 16, {
      speed: 230, life: 0.6, size: 5, colors: [this.color, '#ffffff', '#8fa3b5']
    });
    this.game.particles.ring(this.x, this.y, this.color, 12, 190);
    this.game.addShake(1.6);
  }

  drawUnder(ctx) { /* 子类实现 */ }
  drawOver(ctx) { /* 子类实现 */ }

  /* 统一阴影 */
  drawShadow(ctx, w, h) {
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(this.x, this.y + this.r * 0.42, (w || this.r) * 1.05, (h || this.r * 0.42), 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   1. 柱体障碍（石柱 / 齿轮 / 孢子囊 / 晶簇 / 星核柱）
      —— 阻挡移动与子弹，可被击碎（击碎后不再阻挡）
   ----------------------------------------------------------- */
class PillarHazard extends EnvHazard {
  constructor(game, x, y, opt) {
    opt = Object.assign({ solid: true, r: 30, hp: 70 }, opt);
    super(game, x, y, opt);
    this.style = opt.style || 'rubble';
    this.spin = this.rng.range(0, TAU);
    this.spinSpd = this.style === 'gear' ? this.rng.range(0.5, 1.1) * (this.rng.chance(0.5) ? 1 : -1) : 0;
    this.lumps = [];
    for (let i = 0; i < 5; i++) {
      this.lumps.push({ a: this.rng.range(0, TAU), d: this.rng.range(0.2, 0.7), s: this.rng.range(0.3, 0.6) });
    }
    if (this.style === 'gear') this.color = '#ffb35c';
    else if (this.style === 'pod') this.color = '#9ad14f';
    else if (this.style === 'crystal') this.color = '#c08bff';
    else if (this.style === 'core') this.color = '#8fe9ff';
    else this.color = '#9fb2c4';
  }

  update(dt) {
    super.update(dt);
    this.spin += dt * this.spinSpd;
  }

  onBreak() {
    /* 孢子囊：碎裂后炸出一片毒沼 */
    if (this.style === 'pod' && this.game.room && this.game.room.hazards &&
        this.game.room.hazards.list) {
      this.game.room.hazards.list.push(new SlickHazard(this.game, this.x, this.y, {
        r: 62, dmg: 6, color: '#9ad14f', rng: this.rng.fork('pod')
      }));
      this.game.particles.ring(this.x, this.y, '#9ad14f', 16, 130);
    }
    super.onBreak();
  }

  drawOver(ctx) {
    const q = this.maxHp > 0 ? clamp(this.hp / this.maxHp, 0, 1) : 1;
    ctx.save();
    ctx.translate(this.x, this.y);

    if (this.style === 'gear') {
      /* 机械矿井：转动的齿轮柱 */
      ctx.save();
      ctx.rotate(this.spin);
      ctx.fillStyle = '#3a2c1e';
      ctx.beginPath();
      ctx.arc(0, 0, this.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#ffb35c';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, this.r * 0.92, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = '#5a4426';
      ctx.beginPath();
      ctx.arc(0, 0, this.r * 0.42, 0, TAU);
      ctx.fill();
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU;
        ctx.strokeStyle = '#ffb35c';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * this.r * 0.92, Math.sin(a) * this.r * 0.92);
        ctx.lineTo(Math.cos(a) * (this.r + 8), Math.sin(a) * (this.r + 8));
        ctx.stroke();
      }
      ctx.restore();
    } else if (this.style === 'crystal') {
      /* 虚空遗迹：晶簇 */
      ctx.globalAlpha = 0.9;
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * TAU + this.t * 0.2;
        const h = this.r * (1.5 + 0.3 * Math.sin(this.t * 2 + i));
        ctx.fillStyle = i === 0 ? '#4b3a7a' : '#33265c';
        polygonPath(ctx, [
          [Math.cos(a - 0.28) * this.r * 0.5, Math.sin(a - 0.28) * this.r * 0.5],
          [Math.cos(a + 0.28) * this.r * 0.5, Math.sin(a + 0.28) * this.r * 0.5],
          [Math.cos(a) * 4, Math.sin(a) * 4 - h]
        ]);
        ctx.fill();
        ctx.strokeStyle = 'rgba(200,160,255,0.55)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (this.style === 'core') {
      /* 星界核心：能量柱 */
      const g = ctx.createRadialGradient(0, 0, 3, 0, 0, this.r * 1.3);
      g.addColorStop(0, '#eaffff');
      g.addColorStop(0.4, '#8fe9ff');
      g.addColorStop(1, 'rgba(30,80,110,0.15)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, this.r * (1.02 + 0.05 * Math.sin(this.t * 3)), 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(190,245,255,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.r * 1.25, this.spin, this.spin + Math.PI * 1.3);
      ctx.stroke();
    } else if (this.style === 'pod') {
      /* 腐化森林：孢子囊（越打越鼓） */
      const pulse = 1 + 0.08 * Math.sin(this.t * 2.4);
      ctx.fillStyle = '#3f5c2a';
      ctx.beginPath();
      ctx.ellipse(0, 0, this.r * pulse, this.r * 0.92 * pulse, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#9ad14f';
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(150,210,90,0.55)';
      for (const l of this.lumps) {
        ctx.beginPath();
        ctx.arc(Math.cos(l.a) * this.r * l.d, Math.sin(l.a) * this.r * l.d, this.r * l.s * 0.5, 0, TAU);
        ctx.fill();
      }
    } else {
      /* 废弃庭院：碎石堆 */
      ctx.fillStyle = '#2b3547';
      ctx.beginPath();
      ctx.arc(0, 0, this.r, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#3d4a60';
      for (const l of this.lumps) {
        ctx.beginPath();
        ctx.arc(Math.cos(l.a) * this.r * l.d, Math.sin(l.a) * this.r * l.d, this.r * l.s, 0, TAU);
        ctx.fill();
      }
      ctx.strokeStyle = '#55637a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.r, 0, TAU);
      ctx.stroke();
    }

    /* 受损裂纹 */
    if (q < 1) {
      ctx.strokeStyle = 'rgba(20,20,26,0.75)';
      ctx.lineWidth = 1.6 + (1 - q) * 2;
      const n = Math.ceil((1 - q) * 5);
      for (let i = 0; i < n; i++) {
        const a = (i / 5) * TAU + 0.4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * this.r * 0.15, Math.sin(a) * this.r * 0.15);
        ctx.lineTo(Math.cos(a) * this.r * 0.85, Math.sin(a) * this.r * 0.85);
        ctx.stroke();
      }
    }
    if (this.hitFlash > 0) {
      ctx.globalAlpha = this.hitFlash * 0.6;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, this.r * 1.05, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   2. 周期喷发（落石 / 蒸汽 / 孢子 / 虚空 / 脉冲）
      —— 预警 → 喷发 → 冷却；对玩家与敌人同等伤害
   ----------------------------------------------------------- */
class GeyserHazard extends EnvHazard {
  constructor(game, x, y, opt) {
    opt = Object.assign({ r: 56, dmg: 11 }, opt);
    super(game, x, y, opt);
    this.style = opt.style || 'rock';
    this.period = opt.period || 3.5;
    this.warn = opt.warn || 0.95;
    this.erupt = opt.erupt || 0.45;
    this.ph = this.rng.range(0, this.period);
    this.tickT = 0;
    this.hitIds = [];
    if (this.style === 'steam') this.color = '#ffb35c';
    else if (this.style === 'spore') this.color = '#9ad14f';
    else if (this.style === 'void') this.color = '#c08bff';
    else if (this.style === 'pulse') this.color = '#8fe9ff';
    else this.color = '#c8b48a';
  }

  get warning() { return this.ph > this.period - this.warn; }
  get erupting() { return this.ph < this.erupt; }

  update(dt) {
    super.update(dt);
    this.ph += dt;
    if (this.ph >= this.period) {
      this.ph -= this.period;
      this.hitIds.length = 0;
      this.tickT = 0;
      this._boom();
    }
  }

  _boom() {
    this.game.particles.burst(this.x, this.y, 14, {
      speed: 240, life: 0.5, size: 5, colors: [this.color, '#ffffff']
    });
    this.game.particles.ring(this.x, this.y, this.color, 14, 220);
    this.game.addShake(1.2);
  }

  affect(entity, dt) {
    if (!this.erupting) return;
    if (!this.contains(entity.x, entity.y, entity.r)) return;

    /* 每次喷发对同一目标只结算一次 */
    if (this.hitIds.indexOf(entity) >= 0) return;
    this.hitIds.push(entity);

    if (entity === this.game.player) {
      if (!entity.dead) entity.takeDamage(this.dmg, this.x, this.y);
    } else if (!entity.dead) {
      entity.takeDamage(this.dmg, this.x, this.y);
    }
    this.game.particles.burst(entity.x, entity.y, 6, { speed: 170, life: 0.3, size: 3.4, color: this.color });
  }

  drawUnder(ctx) {
    ctx.save();
    if (this.warning) {
      const g = clamp((this.ph - (this.period - this.warn)) / this.warn, 0, 1);
      ctx.globalAlpha = 0.14 + 0.30 * g;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * (0.35 + 0.65 * g), 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.5 + 0.4 * g;
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2 + 2 * g;
      ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -this.t * 60;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      /* 落石：预警阴影由小变大 */
      if (this.style === 'rock') {
        ctx.globalAlpha = 0.20 + 0.5 * g;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r * 0.28 * (0.4 + g), 0, TAU);
        ctx.fill();
      }
    } else if (this.style !== 'rock') {
      /* 常态：地面痕迹 */
      ctx.globalAlpha = 0.09;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 0.6, 0, TAU);
      ctx.fill();
    }

    if (this.erupting) {
      const q = 1 - this.ph / this.erupt;
      ctx.globalAlpha = clamp(q, 0, 1) * 0.7;
      const g2 = ctx.createRadialGradient(this.x, this.y, 4, this.x, this.y, this.r);
      g2.addColorStop(0, '#ffffff');
      g2.addColorStop(0.35, this.color);
      g2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * (0.6 + 0.4 * q), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   3. 传送带（机械矿井）：矩形区域持续推动实体
   ----------------------------------------------------------- */
class ConveyorHazard extends EnvHazard {
  constructor(game, x, y, opt) {
    opt = Object.assign({ r: 26 }, opt);
    super(game, x, y, opt);
    this.w = opt.w || 320;
    this.h = opt.h || 150;
    this.dir = opt.dir || { x: 1, y: 0 };
    this.force = opt.force || 150;
    this.color = '#ffb35c';
    this.rect = { x: x - this.w / 2, y: y - this.h / 2, w: this.w, h: this.h };
  }

  contains(x, y, r) {
    return Collision.circleRect(x, y, r || 0, this.rect);
  }

  affect(entity, dt) {
    if (!this.contains(entity.x, entity.y, entity.r)) return;
    const mul = (entity === this.game.player) ? 1 : 0.75;
    entity.x += this.dir.x * this.force * mul * dt;
    entity.y += this.dir.y * this.force * mul * dt;
  }

  drawUnder(ctx) {
    const r = this.rect;
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = this.color;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 1.6;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);

    /* 滚动箭头 */
    const horiz = Math.abs(this.dir.x) >= Math.abs(this.dir.y);
    ctx.globalAlpha = 0.42;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    const step = 46;
    const off = (this.t * this.force * 0.55) % step;
    if (horiz) {
      const sx = this.dir.x > 0 ? 1 : -1;
      for (let y = r.y + 22; y < r.y + r.h; y += 44) {
        for (let i = -1; i * step < r.w + step; i++) {
          const x = r.x + i * step + off * sx;
          if (x < r.x - 20 || x > r.x + r.w + 20) continue;
          ctx.beginPath();
          ctx.moveTo(x - 9 * sx, y - 8);
          ctx.lineTo(x + 9 * sx, y);
          ctx.lineTo(x - 9 * sx, y + 8);
          ctx.stroke();
        }
      }
    } else {
      const sy = this.dir.y > 0 ? 1 : -1;
      for (let x = r.x + 24; x < r.x + r.w; x += 46) {
        for (let i = -1; i * step < r.h + step; i++) {
          const y = r.y + i * step + off * sy;
          if (y < r.y - 20 || y > r.y + r.h + 20) continue;
          ctx.beginPath();
          ctx.moveTo(x - 8, y - 9 * sy);
          ctx.lineTo(x, y + 9 * sy);
          ctx.lineTo(x + 8, y - 9 * sy);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   4. 持续区域（毒沼 / 星云残留）：减速 + 持续伤害
   ----------------------------------------------------------- */
class SlickHazard extends EnvHazard {
  constructor(game, x, y, opt) {
    opt = Object.assign({ r: 64, dmg: 7 }, opt);
    super(game, x, y, opt);
    this.style = opt.style || 'bog';
    this.dps = this.dmg;
    this.tick = 0;
    if (this.style === 'bog') this.color = '#9ad14f';
    else if (this.style === 'void') this.color = '#c08bff';
    else this.color = '#8fe9ff';
  }

  affect(entity, dt) {
    if (!this.contains(entity.x, entity.y, entity.r)) return;
    if (entity === this.game.player) {
      entity.applySlow(0.35);
      this.tick -= dt;
      if (this.tick <= 0) {
        this.tick = 1.0;
        if (!entity.dead) entity.takeDamage(Math.round(this.dps), this.x, this.y);
      }
    } else if (!entity.dead) {
      entity.applyStatus('slow', 1);
      entity.takeDot(this.dps * dt, this.game.player);
    }
  }

  drawUnder(ctx) {
    ctx.save();
    const wob = 1 + 0.04 * Math.sin(this.t * 1.8);
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.r * wob, this.r * 0.86 * wob, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 0.34;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 气泡 */
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = this.color;
    for (let i = 0; i < 4; i++) {
      const a = this.t * (0.5 + i * 0.2) + i * 1.7;
      const d = this.r * (0.25 + 0.45 * (0.5 + 0.5 * Math.sin(a)));
      ctx.beginPath();
      ctx.arc(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d * 0.8, 2.4 + (i % 2), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   5. 引力漩涡（虚空遗迹）：周期激活，把附近实体往中心拉
      —— 只位移不伤害，可挣脱
   ----------------------------------------------------------- */
class VortexHazard extends EnvHazard {
  constructor(game, x, y, opt) {
    opt = Object.assign({ r: 70 }, opt);
    super(game, x, y, opt);
    this.period = opt.period || 6.2;
    this.on = opt.on || 3.0;
    this.color = '#c08bff';
    this.ph = this.rng.range(0, this.period);
  }

  get active() { return this.ph < this.on; }

  update(dt) {
    super.update(dt);
    this.ph = (this.ph + dt) % this.period;
    if (this.active && Math.random() < dt * 12) {
      const a = Math.random() * TAU;
      const d = this.r * (0.5 + Math.random() * 1.6);
      this.game.particles.spawn(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d,
        -Math.cos(a) * 90, -Math.sin(a) * 90, 0.5, 3, 'rgba(190,150,255,0.8)', { drag: 1.2 });
    }
  }

  affect(entity, dt) {
    if (!this.active) return;
    const dx = this.x - entity.x, dy = this.y - entity.y;
    const d = Math.hypot(dx, dy);
    const reach = this.r * 2.6;
    if (d > reach || d < 1) return;
    const k = 1 - d / reach;
    const force = (entity === this.game.player ? 150 : 110) * k;
    entity.x += (dx / d) * force * dt;
    entity.y += (dy / d) * force * dt;
  }

  drawUnder(ctx) {
    ctx.save();
    const warm = this.ph > this.period - 1.0;                 // 即将激活
    ctx.globalAlpha = this.active ? 0.30 : (warm ? 0.14 + 0.12 * Math.sin(this.t * 12) : 0.10);
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2.4;
    for (let i = 0; i < 3; i++) {
      const rr = this.r * (0.55 + i * 0.32);
      const a0 = this.t * (1.4 + i * 0.7) * (this.active ? 2.2 : 0.6);
      ctx.beginPath();
      ctx.arc(this.x, this.y, rr, a0, a0 + Math.PI * 1.35);
      ctx.stroke();
    }
    ctx.globalAlpha = this.active ? 0.20 : 0.08;
    const g = ctx.createRadialGradient(this.x, this.y, 4, this.x, this.y, this.r * 1.3);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.3, this.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * 1.3, 0, TAU);
    ctx.fill();
    /* 预警：激活前 1 秒闪外圈 */
    if (warm) {
      ctx.globalAlpha = 0.4;
      ctx.setLineDash([9, 7]);
      ctx.lineDashOffset = -this.t * 50;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 2.6, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   6. 相位柱（虚空遗迹）：周期实体化 / 虚化
      —— 实体化前 0.8s 有明确预警
   ----------------------------------------------------------- */
class PhaserHazard extends EnvHazard {
  constructor(game, x, y, opt) {
    opt = Object.assign({ r: 30 }, opt);
    super(game, x, y, opt);
    this.period = opt.period || 6.0;
    this.solidDur = opt.solidDur || 2.8;
    this.warn = 0.85;
    this.color = '#c08bff';
    this.ph = this.rng.range(0, this.period);
    this.solid = false;
  }

  update(dt) {
    super.update(dt);
    this.ph = (this.ph + dt) % this.period;
    this.solid = this.ph < this.solidDur;
  }

  affectsCollision() { return this.solid; }

  drawUnder(ctx) {
    /* 虚化 / 预警轮廓 */
    if (this.solid) return;
    const toSolid = this.period - this.ph;
    const warm = toSolid < this.warn;
    ctx.save();
    ctx.globalAlpha = warm ? 0.35 + 0.35 * Math.sin(this.t * 16) : 0.16;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 6]);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * (warm ? 1 : 0.85), 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  drawOver(ctx) {
    if (!this.solid) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = '#2a1f4a';
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * (0.45 + 0.12 * Math.sin(this.t * 4)), 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   7. 电弧塔（星界核心）：周期锁定最近目标 → 预警 → 放电
   ----------------------------------------------------------- */
class PylonHazard extends EnvHazard {
  constructor(game, x, y, opt) {
    opt = Object.assign({ solid: true, r: 24, hp: 120, dmg: 12 }, opt);
    super(game, x, y, opt);
    this.period = opt.period || 3.4;
    this.warn = 0.75;
    this.range = opt.range || 250;
    this.color = '#8fe9ff';
    this.ph = this.rng.range(0, this.period);
    this.target = null;
    this.zapT = 0;
  }

  update(dt) {
    super.update(dt);
    if (this.zapT > 0) this.zapT -= dt;
    const prev = this.ph;
    this.ph += dt;
    if (this.ph >= this.period) {
      this.ph -= this.period;
      this._fire();
    }
    /* 预警阶段锁定目标 */
    if (this.ph > this.period - this.warn) {
      this.target = this._nearest();
    } else if (prev <= this.period - this.warn) {
      this.target = null;
    }
  }

  _nearest() {
    const p = this.game.player;
    let best = null, bd = this.range * this.range;
    if (p && !p.dead) {
      const d = dist2(this.x, this.y, p.x, p.y);
      if (d < bd) { bd = d; best = p; }
    }
    const list = (this.game.room && this.game.room.enemies) || [];
    for (const e of list) {
      if (e.dead) continue;
      const d = dist2(this.x, this.y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  _fire() {
    const t = this.target || this._nearest();
    if (!t) return;
    this.game._zap(this.x, this.y - 18, t.x, t.y, this.color);
    if (t === this.game.player) {
      if (!t.dead) t.takeDamage(this.dmg, this.x, this.y);
    } else if (!t.dead) {
      t.takeDamage(this.dmg, this.x, this.y);
    }
    this.game.particles.burst(t.x, t.y, 8, { speed: 180, life: 0.3, size: 3.4, color: this.color });
    this.zapT = 0.2;
    this.target = null;
  }

  drawUnder(ctx) {
    if (!this.target) return;
    const g = clamp((this.ph - (this.period - this.warn)) / this.warn, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.5 * g;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 1.5 + 2 * g;
    ctx.setLineDash([8, 7]);
    ctx.lineDashOffset = -this.t * 90;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y - 18);
    ctx.lineTo(this.target.x, this.target.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  drawOver(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    this.drawShadow(ctx, this.r * 0.9, this.r * 0.34);
    /* 塔身 */
    ctx.fillStyle = '#16283a';
    roundRectPath(ctx, -this.r * 0.62, -this.r * 1.5, this.r * 1.24, this.r * 1.9, 5);
    ctx.fill();
    ctx.strokeStyle = '#24435c';
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 顶端球 */
    const chg = this.ph > this.period - this.warn
      ? clamp((this.ph - (this.period - this.warn)) / this.warn, 0, 1) : 0;
    const g = ctx.createRadialGradient(0, -this.r * 1.5, 2, 0, -this.r * 1.5, this.r * (0.7 + chg * 0.5));
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, this.color);
    g.addColorStop(1, 'rgba(40,120,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -this.r * 1.5, this.r * (0.55 + chg * 0.35), 0, TAU);
    ctx.fill();
    if (this.zapT > 0) {
      ctx.globalAlpha = this.zapT / 0.2;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, -this.r * 1.5, this.r * 0.9, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   环境障碍工厂 + 场地管理
   ----------------------------------------------------------- */
const HazardFactory = {
  create(game, def, x, y, rng) {
    const opt = { rng: rng || new Rng(hashSeed('hz' + x + ',' + y)), color: def.color };
    if (def.hp !== undefined) opt.hp = def.hp;
    if (def.dmg !== undefined) opt.dmg = def.dmg;
    opt.style = def.style;

    switch (def.type) {
      case 'pillar': return new PillarHazard(game, x, y, opt);
      case 'geyser': return new GeyserHazard(game, x, y, opt);
      case 'conveyor': {
        const horiz = rng ? rng.chance(0.5) : true;
        const w = horiz ? 330 : 150;
        const h = horiz ? 150 : 300;
        const dir = horiz
          ? { x: (rng && rng.chance(0.5)) ? 1 : -1, y: 0 }
          : { x: 0, y: (rng && rng.chance(0.5)) ? 1 : -1 };
        return new ConveyorHazard(game, x, y, Object.assign(opt, { w: w, h: h, dir: dir }));
      }
      case 'slick': return new SlickHazard(game, x, y, opt);
      case 'vortex': return new VortexHazard(game, x, y, opt);
      case 'phaser': return new PhaserHazard(game, x, y, opt);
      case 'pylon': return new PylonHazard(game, x, y, opt);
      default: return new PillarHazard(game, x, y, opt);
    }
  }
};

/* 一个房间内的环境障碍集合 */
class HazardField {
  constructor(room) {
    this.room = room;
    this.game = room.game;
    this.list = [];
    this.chapter = room.chapter;
    this._build();
  }

  /* 生成：数量与种类由章节决定，位置由房间 Rng 决定（同种子可复现） */
  _build() {
    const room = this.room;
    const rng = room.rng.fork('hazards');
    const ch = this.chapter;
    const defs = (room.type === ROOM_TYPE.BOSS)
      ? (ch.bossHazards || [])
      : (ch.hazards || []);
    if (!defs.length) return;

    const marginX = 108, marginY = 108;
    const cx = VIEW_W / 2, cy = VIEW_H / 2;
    const minFromCenter = room.type === ROOM_TYPE.BOSS ? 210 : 165;
    /* Boss 出场点：周围要留出空地，别把 Boss 卡在柱子里 */
    const bossPt = { x: ARENA.x + ARENA.w / 2, y: ARENA.y + 120 };

    for (const def of defs) {
      const n = rng.int(def.n[0], def.n[1]);
      for (let i = 0; i < n; i++) {
        let pt = null;
        for (let a = 0; a < 30; a++) {
          const x = rng.range(ARENA.x + marginX, ARENA.x + ARENA.w - marginX);
          const y = rng.range(ARENA.y + marginY, ARENA.y + ARENA.h - marginY);
          if (dist(x, y, cx, cy) < minFromCenter) continue;
          if (room.type === ROOM_TYPE.BOSS && dist(x, y, bossPt.x, bossPt.y) < 170) continue;
          let ok = true;
          for (const h of this.list) {
            if (dist(x, y, h.x, h.y) < 130) { ok = false; break; }
          }
          if (!ok) continue;
          pt = { x: x, y: y };
          break;
        }
        if (!pt) continue;
        this.list.push(HazardFactory.create(this.game, def, pt.x, pt.y, rng.fork('h' + this.list.length)));
      }
    }
  }

  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const h = this.list[i];
      h.update(dt);
      if (h.dead) { this.list.splice(i, 1); continue; }
    }
  }

  /* 对玩家与敌人施加作用（中立：谁踩到都一样） */
  affectAll(dt) {
    const p = this.game.player;
    for (const h of this.list) {
      if (p && !p.dead) h.affect(p, dt);
      for (const e of this.room.enemies) {
        if (!e.dead) h.affect(e, dt);
      }
    }
  }

  /* 阻挡移动：把实体推出实体化的障碍 */
  resolveEntity(e) {
    for (const h of this.list) {
      if (!h.solid) continue;
      const dx = e.x - h.x, dy = e.y - h.y;
      const need = e.r + h.r;
      const d2 = dx * dx + dy * dy;
      if (d2 >= need * need) continue;
      const d = Math.sqrt(d2);
      if (d < 0.0001) {
        /* 正好压在圆心上：随机挑一个方向推出去 */
        const a = Math.random() * TAU;
        e.x = h.x + Math.cos(a) * need;
        e.y = h.y + Math.sin(a) * need;
        continue;
      }
      const push = need - d;
      e.x += (dx / d) * push;
      e.y += (dy / d) * push;
    }
  }

  /* 子弹碰撞：返回被命中的障碍（solid 才算） */
  hitTest(x, y, r) {
    for (const h of this.list) {
      if (!h.solid) continue;
      if (h.contains(x, y, r)) return h;
    }
    return null;
  }

  /* 圆形反弹（供 bounce 类子弹使用） */
  bounce(p, h) {
    const dx = p.x - h.x, dy = p.y - h.y;
    const need = p.r + h.r;
    let d = Math.hypot(dx, dy) || 0.001;
    const ux = dx / d, uy = dy / d;
    p.x = h.x + ux * (need + 0.5);
    p.y = h.y + uy * (need + 0.5);
    const dot = p.vx * ux + p.vy * uy;
    p.vx -= 2 * dot * ux;
    p.vy -= 2 * dot * uy;
  }

  drawUnder(ctx) { for (const h of this.list) h.drawUnder(ctx); }
  drawOver(ctx) { for (const h of this.list) h.drawOver(ctx); }
}

/* ===========================================================

     update(p, dt, g)        每帧
     onKill(p, g, e)         击杀敌人
     onHurt(p, g)            受伤瞬间
     onFloor(p, g)           进入新一层（含开局第 1 层）
     onShoot(p, g)           每次射击之后
     dmgMul(p)               射击伤害倍率
     dmgTakenMul(p)          受到伤害倍率
   =========================================================== */
const CHAR_ABILITIES = {
  /* 拾火者：击杀偶尔回血；进层回血 */

  cinder: {
    onShoot(p, g) {
      p.heat = Math.min(10, p.heat + 1);
      p.heatT = 1.2;
    },
    update(p, dt, g) {
      if (p.heatT > 0) p.heatT -= dt;
      else if (p.heat > 0) p.heat = Math.max(0, p.heat - dt * 6);

        );

  },

  /* 磐盾：受伤后开护壁，减伤 50% */
  bulwark: {
    onHurt(p, g) {
      if (p.wallCd > 0) return;
      p.wallT = 2.5;
      p.wallCd = 6;
      g.particles.ring(p.x, p.y, '#7dffb0', 18, 180);

  orbiter: {

      for (const e of list) {

        const d = dist2(p.x, p.y, e.x, e.y);
        if (d < bd) { bd = d; best = e; }
      }
      const a = best ? angleTo(p.x, p.y, best.x, best.y) : p.aim;
      g.spawnProjectile({
        x: p.x + Math.cos(a) * (p.r + 8),
        y: p.y + Math.sin(a) * (p.r + 8),

/* ===========================================================

const UNLOCKS = [

const UNLOCK_BY = {};
for (const u of UNLOCKS) UNLOCK_BY[u.kind + ':' + u.id] = u;

/* ===========================================================
   4. 存档（localStorage）
   -----------------------------------------------------------
   只保存：解锁 / 已击败 Boss / 统计 / 设置
   绝不保存：当前 Run 的 Build、道具、血量、金币
   =========================================================== */
function lsGet(k) {
  try { return (typeof localStorage !== 'undefined') ? localStorage.getItem(k) : null; }
  catch (e) { return null; }
}
function lsSet(k, v) {
  try { if (typeof localStorage !== 'undefined') { localStorage.setItem(k, v); return true; } }
  catch (e) { /* 隐私模式 / 配额不足：静默降级为内存存档 */ }
  return false;
}
function lsDel(k) {
  try { if (typeof localStorage !== 'undefined') localStorage.removeItem(k); } catch (e) { }
}

const Meta = {
  data: null,
  storageOk: true,

  /* ---- 默认存档 ---- */
  defaults() {
    return {
      v: META_VERSION,
      unlocked: { char: ['ember'], item: [], boss: [], event: [] },
      beaten: [],                 // 击败过的 Boss id（图鉴用）
      stats: {
        runs: 0,        // 游戏次数
        deaths: 0,      // 死亡次数
        wins: 0,        // 通关次数
        bossKills: 0,   // Boss 击杀
        kills: 0,       // 总击杀
        coins: 0,       // 累计金币
        bestFloor: 1,   // 最远到达层数
        bestTime: 0,    // 最长生存时间（秒）
        time: 0         // 累计游玩时间（秒）
      },
      settings: { char: 'ember', shake: 1 }
    };
  },

  /* ---- 载入 / 保存 ---- */
  load() {
    const d = this.defaults();
    const raw = lsGet(META_KEY);
    if (raw) {
      try {
        const p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          if (p.unlocked) for (const k in d.unlocked) {
            if (Array.isArray(p.unlocked[k])) d.unlocked[k] = p.unlocked[k].slice();
          }
          if (Array.isArray(p.beaten)) d.beaten = p.beaten.slice();
          if (p.stats) for (const k in d.stats) {
            const n = Number(p.stats[k]);
            if (!isNaN(n)) d.stats[k] = n;
          }
          if (p.settings) for (const k in d.settings) {
            if (p.settings[k] !== undefined && p.settings[k] !== null) d.settings[k] = p.settings[k];
          }
        }
      } catch (e) { /* 存档损坏：用默认值 */ }
    }
    /* 初始角色永远可用（防止存档被手动改坏） */
    if (d.unlocked.char.indexOf('ember') < 0) d.unlocked.char.push('ember');
    this.data = d;
    this.storageOk = !!raw || lsSet(META_KEY, JSON.stringify(d));
    return d;
  },

  save() {
    if (!this.data) return false;
    return lsSet(META_KEY, JSON.stringify(this.data));
  },

  /* 清空存档（统计页提供入口） */
  reset() {
    lsDel(META_KEY);
    this.data = this.defaults();
    this.save();
    return this.data;
  },

  get stats() { return this.data.stats; },

  /* ---- 设置 ---- */
  getSetting(k, dv) {
    if (!this.data) return dv;
    const v = this.data.settings[k];
    return (v === undefined || v === null) ? dv : v;
  },
  setSetting(k, v) {
    if (!this.data) return;
    this.data.settings[k] = v;
    this.save();
  },
  selectedChar() {
    const id = this.getSetting('char', 'ember');
    return this.isCharUnlocked(id) ? id : 'ember';
  },
  selectChar(id) {
    if (!this.isCharUnlocked(id)) return false;
    this.setSetting('char', id);
    return true;
  },

  /* ---- 解锁查询 ---- */
  isUnlocked(kind, id) {
    if (!this.data) return kind === 'char' && id === 'ember';
    return this.data.unlocked[kind].indexOf(id) >= 0;
  },
  isCharUnlocked(id) { return this.isUnlocked('char', id); },
  isItemUnlocked(id) { return this.isUnlocked('item', id); },
  isBossUnlocked(id) { return this.isUnlocked('boss', id); },
  isEventUnlocked(id) { return this.isUnlocked('event', id); },

  /* 已解锁的角色 / 道具 / 事件 / Boss（过滤 locked 条目） */
  unlockedChars() { return CHARACTERS.filter(c => !c.locked || this.isCharUnlocked(c.id)); },
  availableItems() {
    if (typeof ITEMS === 'undefined') return [];
    return ITEMS.filter(it => !it.locked || this.isItemUnlocked(it.id));
  },
  availableBosses(pool) {
    return (pool || []).filter(id => {
      const u = UNLOCK_BY['boss:' + id];
      return !u || this.isBossUnlocked(id);
    });
  },

  /* ---- 记录 ---- */
  beginRun() {
    if (!this.data) this.load();
    this.data.stats.runs++;
    this.save();
  },

  addKill(n, isBoss, bossId) {
    if (!this.data) this.load();
    const s = this.data.stats;
    s.kills += (n || 1);
    if (isBoss) {
      s.bossKills++;
      if (bossId && this.data.beaten.indexOf(bossId) < 0) this.data.beaten.push(bossId);
    }
    this.save();
    return this.checkUnlocks();
  },

  addCoins(n) {
    if (!this.data) this.load();
    this.data.stats.coins += Math.max(0, Math.round(n || 0));
    this.save();
    return this.checkUnlocks();
  },

  reachFloor(f) {
    if (!this.data) this.load();
    if (f > this.data.stats.bestFloor) { this.data.stats.bestFloor = f; this.save(); }
    return this.checkUnlocks();
  },

  /* 本局结束：death / victory 都走这里 */
  endRun(res) {
    if (!this.data) this.load();
    res = res || {};
    const s = this.data.stats;
    if (res.victory) s.wins++; else s.deaths++;
    if (res.time > s.bestTime) s.bestTime = res.time;
    if (res.floor > s.bestFloor) s.bestFloor = res.floor;
    s.coins += Math.max(0, Math.round(res.coins || 0));
    this.save();
    return this.checkUnlocks();
  },

  addPlayTime(sec) {
    if (!this.data) return;
    this.data.stats.time += Math.max(0, sec || 0);
  },

  /* ---- 解锁判定：返回本次「新解锁」的条目 ---- */
  checkUnlocks() {
    if (!this.data) return [];
    const s = this.data.stats;
    const out = [];
    for (const u of UNLOCKS) {
      if (this.isUnlocked(u.kind, u.id)) continue;
      let ok = false;
      try { ok = !!u.test(s); } catch (e) { ok = false; }
      if (!ok) continue;
      this.data.unlocked[u.kind].push(u.id);
      out.push(u);
    }
    if (out.length) this.save();
    return out;
  },

  /* 统计页 / 图鉴用：某条解锁的进度 [当前, 需求] */
  progressOf(u) {
    if (!this.data) return [0, 1];
    if (this.isUnlocked(u.kind, u.id)) return [1, 1];
    try { return u.prog(this.data.stats); } catch (e) { return [0, 1]; }
  },

  /* 图鉴：全部可解锁条目（含已解锁 / 未解锁） */
  codex() {
    return UNLOCKS.map(u => {
      const p = this.progressOf(u);
      return {
        kind: u.kind, id: u.id, name: u.name, cond: u.cond,
        got: this.isUnlocked(u.kind, u.id),
        cur: p[0], need: p[1]
      };
    });
  },

  /* 击败过的 Boss（图鉴） */
  beatenBosses() {
    return (this.data ? this.data.beaten : []).slice();
  }
};

/* -----------------------------------------------------------
   万华之瞳 · Kaleidoscope
   主题：镜面折射。环形镜棱 / 扇形棱镜 / 镜旋弹幕 / 镜面激光 /
        追光棱 / 镜闪突进 / 镜裂地面 / 召唤镜影
   特殊技能：万华绘卷 —— 六面镜子绕身旋转，放射双向螺旋弹幕 + 镜裂地面
   ----------------------------------------------------------- */
class Kaleidoscope extends BossBase {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '万华之瞳',
      title: '你看见的不是我，是我折射出去的你',
      r: 32, hp: 560, speed: 104, touchDamage: 13, touchInterval: 0.85, mass: 7,
      rng: rng, colors: ['#2a1840', '#ff6bd0', '#7fe4ff'],
      specialName: '万华绘卷',
      phaseNames: ['单镜', '重影', '万华'],
      summonPool: ['wisp', 'phantom', 'swarmer'], maxMinions: 5
    });
    this.bulletDamage = 9;
    this.dmgFields = ['bulletDamage'];
    this.specialCd = 7.5;
    this.spiralA = rng.range(0, TAU);
    this.spiralLeft = 0;
    this.dashDir = 0;
    this.mirrorRot = 0;
    this.deathDur = 2.5;
    this.attacks = [
      { id: 'ring', cn: '环形镜棱', w: 24 },
      { id: 'fan', cn: '扇形棱镜', w: 20 },
      { id: 'spiral', cn: '镜旋弹幕', w: 22 },
      { id: 'laser', cn: '镜面激光', w: 20 },
      { id: 'homing', cn: '追光棱', w: 16, min: 2 },
      { id: 'dash', cn: '镜闪突进', w: 18 },
      { id: 'shard', cn: '镜裂地面', w: 20, min: 2 },
      { id: 'summon', cn: '召唤镜影', w: 13 }
    ];
  }

  onPhase(n) {
    this.summon(this.summonPool, n === 2 ? 2 : 3);
    this.specialCd = 1.3;
  }

  onHurt() {
    this.game.particles.burst(this.x, this.y, 4, {
      speed: 170, life: 0.32, size: 3.2,
      colors: ['#ff6bd0', '#7fe4ff', '#ffffff']
    });
    /* 被打碎的镜片四散 */
    for (let i = 0; i < 3; i++) {
      const a = this.rng.range(0, TAU);
      this.game.particles.spawn(
        this.x + Math.cos(a) * 16, this.y + Math.sin(a) * 16,
        Math.cos(a) * 90, Math.sin(a) * 90, rand(0.25, 0.5), rand(2.4, 4.2),
        i % 2 ? '#ff6bd0' : '#7fe4ff', { drag: 2.6 }
      );
    }
  }

  act(dt) {
    this.atkCd -= dt * this.atkRate;
    this.specialCd -= dt * this.atkRate;
    this.mirrorRot += dt * (0.8 + 0.35 * this.phase);

    switch (this.state) {
      case 'idle':
        this.hover(dt, 220, 380);
        this.tryTouchDamage(this.touchDamage);
        if (this.specialCd <= 0) { this.state = 'weaveWind'; this.stateT = 0.8; }
        else if (this.atkCd <= 0) this._start(this._pick(this.attacks));
        break;

      case 'ringWind':
        this.brake(0.86);
        this.telegraphText = '环形镜棱';
        this.stateT -= dt;
        if (this.stateT <= 0) {
          this.ringShot(this.phase >= 3 ? 18 : 14, {
            speed: 250, damage: this.bulletDamage, gap: 3, r: 7, color: '#ff6bd0'
          });
          this.ringLeft--;
          if (this.ringLeft > 0) this.stateT = 0.30;
          else { this.state = 'idle'; this.atkCd = 1.0; }
        }
        break;

      case 'fanWind':
        this.brake(0.85);
        this.telegraphText = '扇形棱镜';
        this.face = angleLerp(this.face, this.aimAngle(), Math.min(1, 8 * dt));
        this.stateT -= dt;
        if (this.stateT <= 0) {
          this.fanShot(this.phase >= 3 ? 9 : 7, 1.0, this.face, {
            speed: 330, damage: this.bulletDamage + 1, r: 7, color: '#7fe4ff'
          });
          this.state = 'idle'; this.atkCd = 0.95;
        }
        break;

      case 'spiral':
        this.brake(0.9);
        this.telegraphText = '镜旋弹幕';
        this.stateT -= dt;
        this.spiralLeft -= dt;
        if (this.spiralLeft <= 0) {
          this.spiralLeft = 0.1;
          this.spiralA += 0.42 * this.phaseSpeed;
          this.spiralShot(this.phase >= 2 ? 3 : 2, this.spiralA, {
            speed: 290, damage: this.bulletDamage, r: 6.5, color: '#ff6bd0'
          });
        }
        if (this.stateT <= 0) { this.state = 'idle'; this.atkCd = 1.05; }
        break;

      case 'laserWind':
        this.brake(0.8);
        this.telegraphText = '镜面激光';
        this.stateT -= dt;
        if (this.stateT <= 0) {
          const n = this.phase >= 3 ? 5 : (this.phase >= 2 ? 4 : 3);
          const base = this.aimAngle();
          for (let i = 0; i < n; i++) {
            this.addBeam({
              x: this.x, y: this.y, angle: base + (i / n) * TAU,
              warn: 0.68, active: 0.4, width: 15, dmg: 17, color: '#ff6bd0'
            });
          }
          this.game.addShake(2.2);
          this.state = 'idle'; this.atkCd = 1.1;
        }
        break;

      case 'homingCast':
        this.brake(0.88);
        this.telegraphText = '追光棱';
        this.stateT -= dt;
        if (this.stateT <= 0) {
          this.homingShot(this.phase >= 3 ? 4 : 3, {
            speed: 215, damage: this.bulletDamage + 2, r: 8, color: '#7fe4ff', homing: 2
          });
          this.state = 'idle'; this.atkCd = 1.0;
        }
        break;

      case 'windup':
        this.brake(0.78);
        this.telegraphText = '镜闪突进';
        this.face = angleLerp(this.face, this.aimAngle(), Math.min(1, 6 * dt));
        this.stateT -= dt;
        if (this.stateT <= 0) {
          this.dashDir = this.face;
          this.state = 'dash';
          this.stateT = 0.5;
        }
        break;

      case 'dash': {
        this.stateT -= dt;
        const r = this.dashMove(dt, this.dashDir, 680 * this.phaseSpeed,
          Math.round(this.touchDamage * 1.3), 6);
        if (r === 'wall' || this.stateT <= 0) {
          this.state = 'stagger';
          this.stateT = 0.65;
          this.game.addShake(3);
          this.game.particles.burst(this.x, this.y, 14, {
            speed: 250, life: 0.5, size: 4.5,
            colors: ['#ff6bd0', '#7fe4ff', '#ffffff']
          });
          this.ringShot(8, { speed: 230, damage: this.bulletDamage, gap: 2, r: 6, color: '#ff6bd0' });
        }
        break;
      }

      case 'stagger':
        this.brake(0.85);
        this.stateT -= dt;
        if (this.stateT <= 0) { this.state = 'idle'; this.atkCd = 0.95; }
        break;

      case 'shardCast':
        this.brake(0.86);
        this.telegraphText = '镜裂地面';
        this.stateT -= dt;
        if (this.stateT <= 0) {
          const p = this.game.player;
          const n = this.phase >= 3 ? 4 : (this.phase >= 2 ? 3 : 2);
          this.addHazard(p.x, p.y, {
            r: 56, warn: 0.85, active: 2.8, dmg: 11, grow: 10, color: '#7fe4ff'
          });
          for (let i = 1; i < n; i++) {
            const a = this.rng.range(0, TAU);
            const d = this.rng.range(100, 200);
            this.addHazard(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, {
              r: 46, warn: 0.9, active: 2.6, dmg: 10, grow: 9, color: '#ff6bd0'
            });
          }
          this.state = 'idle'; this.atkCd = 1.05;
        }
        break;

      case 'summonCast':
        this.brake(0.84);
        this.telegraphText = '召唤镜影';
        this.stateT -= dt;
        if (this.stateT <= 0) {
          this.summon(this.summonPool, this.phase >= 3 ? 3 : 2);
          this.state = 'idle'; this.atkCd = 1.25;
        }
        break;

      case 'weaveWind':
        this.brake(0.8);
        this.telegraphText = '万华绘卷';
        this.stateT -= dt;
        if (Math.random() < dt * 34) {
          const a = this.rng.range(0, TAU);
          this.game.particles.spawn(
            this.x + Math.cos(a) * 40, this.y + Math.sin(a) * 40,
            Math.cos(a) * 40, Math.sin(a) * 40, rand(0.25, 0.55), rand(3, 5.5),
            '#ff6bd0', { drag: 2 }
          );
        }
        if (this.stateT <= 0) { this.state = 'weave'; this.stateT = 1.1; this._weave(); }
        break;

      case 'weave':
        this.brake(0.9);
        this.stateT -= dt;
        this.spiralLeft -= dt;
        if (this.spiralLeft <= 0) {
          this.spiralLeft = 0.11;
          this.spiralA += 0.5;
          this.spiralShot(2, this.spiralA, { speed: 260, damage: this.bulletDamage, r: 6.5, color: '#7fe4ff' });
          this.spiralShot(2, -this.spiralA, { speed: 260, damage: this.bulletDamage, r: 6.5, color: '#ff6bd0' });
        }
        if (this.stateT <= 0) { this.state = 'idle'; this.atkCd = 1.15; this.specialCd = 8.0; }
        break;

      default: this.state = 'idle'; break;
    }
  }

  _start(id) {
    if (id === 'ring') { this.state = 'ringWind'; this.stateT = 0.5; this.ringLeft = this.phase >= 2 ? 3 : 2; }
    else if (id === 'fan') { this.state = 'fanWind'; this.stateT = 0.5; }
    else if (id === 'spiral') { this.state = 'spiral'; this.stateT = 1.5; this.spiralLeft = 0; }
    else if (id === 'laser') { this.state = 'laserWind'; this.stateT = 0.6; }
    else if (id === 'homing') { this.state = 'homingCast'; this.stateT = 0.5; }
    else if (id === 'dash') { this.state = 'windup'; this.stateT = 0.6; }
    else if (id === 'shard') { this.state = 'shardCast'; this.stateT = 0.55; }
    else { this.state = 'summonCast'; this.stateT = 0.6; }
  }

  /* 特殊技能：六面镜子旋转 + 双向螺旋 + 环形镜棱 + 镜裂 */
  _weave() {
    const mirrors = this.phase >= 3 ? 6 : 4;
    for (let i = 0; i < mirrors; i++) {
      const a = (i / mirrors) * TAU + this.mirrorRot;
      const d = 130;
      this.addHazard(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d, {
        r: 44, warn: 0.55, active: 2.4, dmg: 10, grow: 8, color: '#ff6bd0'
      });
    }
    this.ringShot(this.phase >= 2 ? 16 : 12, {
      speed: 240, damage: this.bulletDamage, gap: 3, r: 7, color: '#7fe4ff'
    });
    this.spiralA = this.rng.range(0, TAU);
    this.spiralLeft = 0;
    this.game.addShake(4);
    this.game.particles.ring(this.x, this.y, '#ff6bd0', 28, 300);
  }

  onDeathStart() {
    this.game.particles.ring(this.x, this.y, '#ff6bd0', 32, 290);
  }

  onDeath(dt) {
    /* 万华镜面逐个碎裂 */
    this.deathBombT -= dt;
    if (this.deathBombT <= 0) {
      this.deathBombT = 0.26;
      const a = this.rng.range(0, TAU);
      this.game.particles.burst(this.x + Math.cos(a) * 28, this.y + Math.sin(a) * 28, 12, {
        speed: 250, life: 0.6, size: 4.5,
        colors: ['#ff6bd0', '#7fe4ff', '#ffffff']
      });
      this.game.particles.ring(this.x, this.y, '#7fe4ff', 12, 190);
      this.game.addShake(2.4);
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    const winding = this.state === 'windup';
    const weave = this.state === 'weaveWind';

    this.drawAura(ctx, this.r + 16, '#ff6bd0');

    /* 突进预警线 */
    if (winding) {
      const g = 1 - this.stateT / 0.6;
      ctx.save();
      ctx.rotate(this.face);
      ctx.globalAlpha = 0.2 + 0.45 * g;
      ctx.strokeStyle = '#7fe4ff';
      ctx.lineWidth = 3 + 3 * g;
      ctx.setLineDash([14, 11]);
      ctx.lineDashOffset = -t * 70;
      ctx.beginPath();
      ctx.moveTo(this.r, 0);
      ctx.lineTo(this.r + 600 * (0.35 + 0.65 * g), 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    /* 环绕镜片（本体之外，世界坐标旋转） */
    const mN = this.phase + 2;
    for (let i = 0; i < mN; i++) {
      const a = this.mirrorRot + (i / mN) * TAU;
      const d = this.r + 42 + Math.sin(t * 2 + i) * 6;
      ctx.save();
      ctx.translate(Math.cos(a) * d, Math.sin(a) * d);
      ctx.rotate(a + t);
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = i % 2 ? '#ff6bd0' : '#7fe4ff';
      polygonPath(ctx, [[0, -11], [8, 0], [0, 11], [-8, 0]]);
      ctx.fill();
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    if (this.dying) this.deathTransform(ctx);

    /* 本体：多面棱镜球 */
    const g2 = ctx.createRadialGradient(0, 0, 3, 0, 0, this.r * 1.3);
    g2.addColorStop(0, weave ? '#ffffff' : '#ffd6f2');
    g2.addColorStop(0.45, '#ff6bd0');
    g2.addColorStop(1, 'rgba(42,24,64,0.25)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.08, 0, TAU);
    ctx.fill();

    /* 折射切面 */
    ctx.save();
    ctx.rotate(t * 0.6);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      ctx.fillStyle = i % 2 ? 'rgba(127,228,255,0.55)' : 'rgba(255,107,208,0.55)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * this.r, Math.sin(a) * this.r);
      ctx.lineTo(Math.cos(a + TAU / 6) * this.r, Math.sin(a + TAU / 6) * this.r);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    /* 中央瞳孔 */
    const pulse = 0.9 + 0.1 * Math.sin(t * 4);
    ctx.fillStyle = '#0d0718';
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 0.42 * pulse, this.r * 0.30 * pulse, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = weave ? '#ffffff' : '#7fe4ff';
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 0.20 * pulse, this.r * 0.26 * pulse, 0, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = '#ffd6f2';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.05, 0, TAU);
    ctx.stroke();

    this.drawCracks(ctx, this.r * 0.95, '#7fe4ff');
    ctx.restore();

    bossHurtRing(ctx, this);
  }
}

        this.stateT -= dt;
        if (this.stateT <= 0) {
          this.homingShot(this.phase >= 3 ? 5 : 3, {
            speed: 220, damage: this.bulletDamage + 2, r: 8, color: '#c9d8e8', homing: 2
          });
          this.state = 'idle'; this.atkCd = 1.0;
        }
        break;

      case 'windup':
        this.brake(0.78);
        this.telegraphText = '无相突进';
        this.face = angleLerp(this.face, this.aimAngle(), Math.min(1, 6 * dt));
        this.stateT -= dt;
        if (this.stateT <= 0) {
          this.dashDir = this.face;
          this.state = 'dash';
          this.stateT = 0.55;
        }
        break;

      case 'dash': {
        this.stateT -= dt;
        /* 突进途中拉出残影 */
        if (Math.random() < dt * 24) {
          this.echoes.push({ x: this.x, y: this.y, t: 0.45, max: 0.45 });
        }
        const r = this.dashMove(dt, this.dashDir, 700 * this.phaseSpeed,
          Math.round(this.touchDamage * 1.35), 6);
        if (r === 'wall' || this.stateT <= 0) {
          this.state = 'stagger';
          this.stateT = 0.6;
          this.game.addShake(3.2);
          this.game.particles.burst(this.x, this.y, 16, {
            speed: 260, life: 0.55, size: 5,
            colors: ['#c9d8e8', '#8fa3b5', '#ffffff']
          });
        }
        break;
      }

      case 'stagger':
        this.brake(0.85);
        this.stateT -= dt;
        if (this.stateT <= 0) { this.state = 'idle'; this.atkCd = 0.95; }
        break;

      case 'zoneCast':
        this.brake(0.86);
        this.telegraphText = '沉默领域';
        this.stateT -= dt;
        if (this.stateT <= 0) {
          const p = this.game.player;
          const n = this.phase >= 3 ? 4 : 3;
          this.addHazard(p.x, p.y, {
            r: 60, warn: 0.9, active: 3.0, dmg: 12, grow: 12, color: '#8fa3b5'
          });
          for (let i = 1; i < n; i++) {
            const a = this.rng.range(0, TAU);
            const d = this.rng.range(110, 210);
            this.addHazard(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, {
              r: 48, warn: 0.95, active: 2.6, dmg: 10, grow: 10, color: '#c9d8e8'
            });
          }
          this.state = 'idle'; this.atkCd = 1.1;
        }
        break;

      case 'summonCast':
        this.brake(0.84);
        this.telegraphText = '召唤回声';
        this.stateT -= dt;
        if (this.stateT <= 0) {
          this.summon(this.summonPool, this.phase >= 3 ? 3 : 2);
          this.state = 'idle'; this.atkCd = 1.2;
        }
        break;

      case 'unityWind':
        this.brake(0.8);
        this.telegraphText = '万相归一';
        this.stateT -= dt;
        if (Math.random() < dt * 30) {
          const a = this.rng.range(0, TAU);
          this.echoes.push({
            x: this.x + Math.cos(a) * 30, y: this.y + Math.sin(a) * 30,
            t: 0.6, max: 0.6
          });
        }
        if (this.stateT <= 0) { this.state = 'unity'; this.stateT = 1.0; this._unity(); }
        break;

      case 'unity':
        this.brake(0.9);
        this.stateT -= dt;
        if (this.stateT <= 0) { this.state = 'idle'; this.atkCd = 1.2; this.specialCd = 9.0; }
        break;

      default: this.state = 'idle'; break;
    }
  }

  _start(id) {
    if (id === 'ring') { this.state = 'ringWind'; this.stateT = 0.5; this.ringLeft = this.phase >= 2 ? 3 : 2; }
    else if (id === 'fan') { this.state = 'fanWind'; this.stateT = 0.5; }
    else if (id === 'spiral') { this.state = 'spiral'; this.stateT = 1.5; this.spiralLeft = 0; }
    else if (id === 'laser') { this.state = 'laserWind'; this.stateT = 0.6; }
    else if (id === 'homing') { this.state = 'homingCast'; this.stateT = 0.5; }
    else if (id === 'dash') { this.state = 'windup'; this.stateT = 0.6; }
    else if (id === 'zone') { this.state = 'zoneCast'; this.stateT = 0.55; }
    else { this.state = 'summonCast'; this.stateT = 0.6; }
  }

  /* 特殊技能：瞬移到玩家身侧 → 残影十字弹幕 → 本体十字激光 */
  _unity() {
    const p = this.game.player;
    const a = this.rng.range(0, TAU);
    const tx = clamp(p.x + Math.cos(a) * 190, ARENA.x + 110, ARENA.x + ARENA.w - 110);
    const ty = clamp(p.y + Math.sin(a) * 190, ARENA.y + 110, ARENA.y + ARENA.h - 110);

    /* 沿途残影：每个残影射一轮十字弹幕（有预警，可躲） */
    const steps = this.phase >= 3 ? 4 : 3;
    for (let i = 0; i < steps; i++) {
      const t = (i + 1) / steps;
      const ex = this.x + (tx - this.x) * t;
      const ey = this.y + (ty - this.y) * t;
      this.echoes.push({ x: ex, y: ey, t: 0.7, max: 0.7 });
      this.addHazard(ex, ey, {
        r: 40, warn: 0.6, active: 1.6, dmg: 9, color: '#8fa3b5'
      });
      for (let k = 0; k < 4; k++) {
        const ang = (k / 4) * TAU + this.rng.range(-0.1, 0.1);
        this.game.spawnProjectile({
          x: ex, y: ey, angle: ang, speed: 240,
          damage: this.bulletDamage, r: 6.5, friendly: false,
          color: '#c9d8e8', core: '#ffffff', life: 3.4, game: this.game, spin: 6
        });
      }
    }

    /* 位移 */
    this.particles_burst(this.x, this.y);
    this.x = tx; this.y = ty;
    this.vx = 0; this.vy = 0;
    this.particles_burst(this.x, this.y);

    /* 本体十字激光 */
    const base = this.aimAngle();
    for (let k = 0; k < 4; k++) {
      this.addBeam({
        x: this.x, y: this.y, angle: base + (k / 4) * TAU,
        warn: 0.66, active: 0.4, width: 15, dmg: 17, color: '#ffffff'
      });
    }
    this.game.addShake(4.5);
    this.game.particles.ring(this.x, this.y, '#c9d8e8', 30, 300);
  }

  particles_burst(x, y) {
    this.game.particles.burst(x, y, 14, {
      speed: 240, life: 0.5, size: 4.5, colors: ['#c9d8e8', '#8fa3b5', '#ffffff']
    });
  }

  onDeathStart() {
    this.game.particles.ring(this.x, this.y, '#c9d8e8', 36, 300);
  }

  onDeath(dt) {
    /* 所有「脸」依次剥落 */
    this.deathBombT -= dt;
    if (this.deathBombT <= 0) {
      this.deathBombT = 0.24;
      const a = this.rng.range(0, TAU);
      const d = this.rng.range(10, 40);
      this.game.particles.burst(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d, 10, {
        speed: 220, life: 0.65, size: 4,
        colors: ['#c9d8e8', '#8fa3b5', '#ffffff', '#7fd7ea']
      });
      this.game.addShake(2.2);
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    const winding = this.state === 'windup';
    const unity = this.state === 'unityWind';

    this.drawAura(ctx, this.r + 14, '#8fa3b5');

    if (winding) {
      const g = 1 - this.stateT / 0.6;
      ctx.save();
      ctx.rotate(this.face);
      ctx.globalAlpha = 0.2 + 0.45 * g;
      ctx.strokeStyle = '#c9d8e8';
      ctx.lineWidth = 3 + 3 * g;
      ctx.setLineDash([14, 11]);
      ctx.lineDashOffset = -t * 70;
      ctx.beginPath();
      ctx.moveTo(this.r, 0);
      ctx.lineTo(this.r + 620 * (0.35 + 0.65 * g), 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    /* 残影（世界坐标） */
    for (const e of this.echoes) {
      const k = clamp(e.t / e.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.35 * k;
      ctx.fillStyle = '#c9d8e8';
      ctx.beginPath();
      ctx.arc(e.x - this.x, e.y - this.y, this.r * (0.75 + 0.25 * k), 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    if (this.dying) this.deathTransform(ctx);

    /* 本体：无面的苍白形体 */
    const g2 = ctx.createRadialGradient(0, 0, 3, 0, 0, this.r * 1.35);
    g2.addColorStop(0, unity ? '#ffffff' : '#dfe9f3');
    g2.addColorStop(0.5, '#8fa3b5');
    g2.addColorStop(1, 'rgba(15,20,32,0.3)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.05, 0, TAU);
    ctx.fill();

    /* 不断变形的轮廓（没有固定相貌） */
    ctx.strokeStyle = 'rgba(230,240,250,0.85)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    const pts = 11;
    for (let i = 0; i <= pts; i++) {
      const a = (i / pts) * TAU;
      const rr = this.r * (0.92 + 0.16 * Math.sin(t * 2.2 + i * 1.7) + 0.06 * Math.sin(t * 5 + i));
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    /* 空白的面具 */
    ctx.fillStyle = 'rgba(10,14,22,0.85)';
    ctx.beginPath();
    ctx.ellipse(0, -2, this.r * 0.46, this.r * 0.56, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(220,235,250,0.55)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    /* 阶段越高，身上浮现越多「别人的脸」 */
    for (let i = 0; i < this.phase; i++) {
      const a = t * 0.9 + (i / 3) * TAU;
      const d = this.r * 0.72;
      ctx.globalAlpha = 0.28 + 0.12 * Math.sin(t * 3 + i);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * d, Math.sin(a) * d, 7, 10, a, 0, TAU);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * d - 4, Math.sin(a) * d - 3);
      ctx.lineTo(Math.cos(a) * d - 1, Math.sin(a) * d - 3);
      ctx.moveTo(Math.cos(a) * d + 1, Math.sin(a) * d - 3);
      ctx.lineTo(Math.cos(a) * d + 4, Math.sin(a) * d - 3);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    this.drawCracks(ctx, this.r * 0.9, '#ffffff');
    ctx.restore();

    bossHurtRing(ctx, this);
  }
}

/* ---- 注册（cat:'boss' → 不进普通房生成池；locked → 需解锁才入池） ---- */
EnemyFactory.register('boss_kaleido', Kaleidoscope, {

  boss: { name: '万华之瞳', title: '你看见的不是我，是我折射出去的你' }
});
