    this.marks = [];               // {x, y, t, dur, r, dmg}
    this.keepMin = 240;
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = angleTo(this.x, this.y, p.x, p.y);

    let mx = 0, my = 0;
    if (d < this.keepMin) { mx = -Math.cos(toP); my = -Math.sin(toP); }
    else if (d > 460) { mx = Math.cos(toP); my = Math.sin(toP); }
    else { mx = Math.cos(toP + Math.PI / 2) * Math.sin(this.animT * 0.8); my = Math.sin(toP + Math.PI / 2) * Math.sin(this.animT * 0.8); }
    const len = Math.hypot(mx, my) || 1;
    this.vx = (mx / len) * this.speed;
    this.vy = (my / len) * this.speed;
    this.face = angleLerp(this.face, toP, Math.min(1, 3.5 * dt));

    this.cd -= dt;
    if (this.cd <= 0 && d < 620) {
      this.cd = this.rng.range(2.4, 3.4);
      /* 落点 = 玩家当前位置（不预判，保证玩家走开就能躲） */
      const t = arenaClamp(p.x, p.y, this.blastRadius * 0.5);
      const flight = clamp(dist(this.x, this.y, t.x, t.y) / 420, 0.7, 1.5);
      this.marks.push({
        x: t.x, y: t.y, t: 0, dur: flight, r: this.blastRadius, dmg: this.dmgOut(this.blastDamage)
      });
    }

    /* 落点结算 */
    for (let i = this.marks.length - 1; i >= 0; i--) {
      const m = this.marks[i];
      m.t += dt;
      if (m.t >= m.dur) {
        this._blast(m);
        this.marks.splice(i, 1);
      }
    }
    this.tryTouchDamage(this.touchDamage);
  }

  _blast(m) {
    this.game.particles.ring(m.x, m.y, '#9ad14f', 16, m.r * 3);
    this.game.particles.burst(m.x, m.y, 16, {
      speed: 240, life: 0.5, size: 5, colors: ['#9ad14f', '#ffffff', this.colors[0]]
    });
    this.game.addShake(1.8);
    const p = this.game.player;
    const reach = m.r + p.r;
    if (dist2(m.x, m.y, p.x, p.y) <= reach * reach) {
      p.takeDamage(m.dmg, m.x, m.y);
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 落点预警（世界坐标 → 局部坐标） */
    for (const m of this.marks) {
      ctx.save();
      ctx.translate(m.x - this.x, m.y - this.y);
      drawTelegraphRing(ctx, m.r, clamp(m.t / m.dur, 0, 1), '#9ad14f');
      ctx.restore();
    }
    ctx.save();
    ctx.rotate(this.face);
    /* 囊袋（充能时鼓起） */
    const puff = 1 + 0.12 * Math.sin(t * 3);
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(-this.r * 0.2, 0, this.r * 0.95 * puff, this.r * 0.9 * puff, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 悬挂的弹囊 */
    ctx.fillStyle = this.colors[2];
    ctx.beginPath();
    ctx.arc(this.r * 0.5, this.r * 0.15, this.r * 0.42, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    /* 短足 */
    ctx.strokeStyle = '#1e3327';
    ctx.lineWidth = 3;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(-this.r * 0.4, s * this.r * 0.5);
      ctx.lineTo(-this.r * 0.95, s * this.r * 1.05);
      ctx.stroke();
    }
    ctx.fillStyle = '#e8ffb0';
    ctx.beginPath(); ctx.arc(this.r * 0.15, -this.r * 0.35, 2.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.15, this.r * 0.35, 2.4, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ===========================================================
   远程 · 追踪弹：曳光 Wisp
   射出慢速追踪弹（转向速率受限，跑起来就能甩掉）
   =========================================================== */
class Wisp extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '曳光',
      r: 14,
      hp: 26,
      speed: 112,
      touchDamage: 4,
      touchInterval: 1.0,
      mass: 0.7,
      rng: rng,
      colors: ['#2a3f5c', '#7fe4ff', '#4fb0ff']
    });
    this.bulletDamage = 6;
    this.dmgFields = ['bulletDamage'];
    this.cd = rng.range(0.6, 1.4);
    this.phase = rng.range(0, TAU);
    this.keepMin = 260;
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = angleTo(this.x, this.y, p.x, p.y);
    this.phase += dt * 3;

    /* 飘忽绕行 */
    const orbitA = toP + Math.PI / 2 * Math.sin(this.animT * 0.8);
    let mx, my;
    if (d < this.keepMin) { mx = -Math.cos(toP); my = -Math.sin(toP); }
    else { mx = Math.cos(orbitA); my = Math.sin(orbitA); }
    const len = Math.hypot(mx, my) || 1;
    this.vx = (mx / len) * this.speed;
    this.vy = (my / len) * this.speed;
    this.face = angleLerp(this.face, toP, Math.min(1, 4 * dt));

    this.cd -= dt;
    if (this.cd <= 0 && d < 560) {
      this.cd = this.rng.range(1.6, 2.4);
      const a = toP + this.rng.range(-0.35, 0.35);
      this.fireBullet(a, {
        speed: 176, damage: this.dmgOut(this.bulletDamage), r: 6,
        color: '#7fe4ff', core: '#ffffff', life: 3.4, homing: 1
      });
    }
    if (Math.random() < dt * 12) {
      this.game.particles.trail(this.x, this.y, 'rgba(127,228,255,0.28)', 4);
    }
    this.tryTouchDamage(this.touchDamage);
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 光晕 */
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, this.r * 2);
    g.addColorStop(0, 'rgba(127,228,255,0.35)');
    g.addColorStop(1, 'rgba(127,228,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 2, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.rotate(this.phase * 0.4);
    /* 飘带 */
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2.4;
    ctx.globalAlpha = 0.7;
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * TAU;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(Math.cos(a) * this.r, Math.sin(a) * this.r,
        Math.cos(a + 0.7) * (this.r + 12 + Math.sin(t * 5 + i) * 4),
        Math.sin(a + 0.7) * (this.r + 12 + Math.sin(t * 5 + i) * 4));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.72, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#eaffff';
    ctx.beginPath();
    ctx.arc(Math.cos(this.face) * 2.5, Math.sin(this.face) * 2.5, this.r * 0.3, 0, TAU);
    ctx.fill();
  }
}

/* ===========================================================
   远程 · 固定炮台：铸哨 Turret
   不会移动，护甲偏高，间歇打出三连点射
   =========================================================== */
class Turret extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '铸哨',
      r: 20,
      hp: 74,
      speed: 0,
      touchDamage: 8,
      touchInterval: 1.2,
      mass: 4,
      rng: rng,
      colors: ['#333a44', '#ffd35e', '#8fa3b5']
    });
    this.dr = 0.15;
    this.bulletDamage = 7;
    this.dmgFields = ['bulletDamage'];
    this.cd = rng.range(0.8, 1.6);
    this.burstLeft = 0;
    this.burstT = 0;
    this.barrel = rng.range(0, TAU);
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    this.vx = 0; this.vy = 0;
    const toP = angleTo(this.x, this.y, p.x, p.y);
    this.face = angleLerp(this.face, toP, Math.min(1, 3.4 * dt));
    this.barrel += dt * (this.burstLeft > 0 ? 9 : 0.8);

    if (this.burstLeft > 0) {
      this.burstT -= dt;
      if (this.burstT <= 0) {
        this.burstT = 0.13;
        this.burstLeft--;
        this.fireBullet(this.face + this.rng.range(-0.06, 0.06), {
          speed: 330, damage: this.dmgOut(this.bulletDamage), r: 5.5,
          color: '#ffd35e', core: '#fff6da', life: 2.4
        });
        this.game.particles.burst(
          this.x + Math.cos(this.face) * this.r, this.y + Math.sin(this.face) * this.r, 4,
          { speed: 130, life: 0.22, size: 3, color: '#ffd35e', dir: this.face, spread: 0.9 }
        );
      }
    } else {
      this.cd -= dt;
      if (this.cd <= 0 && d < 620) {
        this.burstLeft = 3;
        this.burstT = 0;
        this.cd = this.rng.range(2.0, 2.8);
      }
    }
    this.tryTouchDamage(this.touchDamage);
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 底座 */
    ctx.fillStyle = '#20262e';
    polygonPath(ctx, (() => {
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU + 0.5;
        pts.push([Math.cos(a) * this.r * 1.22, Math.sin(a) * this.r * 1.22]);
      }
      return pts;
    })());
    ctx.fill();
    ctx.strokeStyle = this.colors[2];
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 炮塔 */
    ctx.save();
    ctx.rotate(this.face);
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.82, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2.2;
    ctx.stroke();

    /* 炮管 */
    ctx.fillStyle = '#141a20';
    roundRectPath(ctx, this.r * 0.3, -4.5, this.r * 1.15, 9, 3);
    ctx.fill();
    ctx.fillStyle = this.burstLeft > 0 ? '#fff6da' : '#ffd35e';
    roundRectPath(ctx, this.r * 1.3, -2.4, 5, 4.8, 2);
    ctx.fill();
    ctx.restore();

    /* 旋转的哨环 */
    ctx.save();
    ctx.rotate(this.barrel);
    ctx.strokeStyle = 'rgba(255,211,94,0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.35, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    /* 待机指示灯 */
    ctx.fillStyle = this.cd < 0.4 ? '#ff5a4d' : '#8fa3b5';
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.95, 3 + (this.cd < 0.4 ? 1.5 * Math.sin(t * 22) : 0), 0, TAU);
    ctx.fill();
  }
}

/* ===========================================================
   特殊 · 召唤：织卵 Summoner
   远离玩家，周期性孵化蚀群（场上同类数量有上限）
   =========================================================== */
class Summoner extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '织卵',
      r: 21,
      hp: 58,
      speed: 84,
      touchDamage: 6,
      touchInterval: 1.0,
      mass: 1.4,
      rng: rng,
      colors: ['#3c2a4a', '#c86bff', '#7f3fd6']
    });
    this.cd = rng.range(1.2, 2.0);
    this.hatchT = 0;
    this.hatching = false;
    this.maxMinions = 5;
    this.legPhase = rng.range(0, TAU);
  }

  _minionCount() {
    const list = this.game.room ? this.game.room.enemies : [];
    let n = 0;
    for (const e of list) if (!e.dead && e.type === 'swarmer') n++;
    return n + (this.game.room ? this.game.room.pending.filter(q => q.type === 'swarmer').length : 0);
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = angleTo(this.x, this.y, p.x, p.y);
    this.legPhase += dt * 4;

    /* 始终保持距离 */
    let mx = 0, my = 0;
    if (d < 300) { mx = -Math.cos(toP); my = -Math.sin(toP); }
    else if (d > 480) { mx = Math.cos(toP) * 0.4; my = Math.sin(toP) * 0.4; }
    else { mx = Math.cos(toP + Math.PI / 2) * 0.5; my = Math.sin(toP + Math.PI / 2) * 0.5; }
    const len = Math.hypot(mx, my) || 1;
    const sp = this.speed * (this.hatching ? 0.35 : 1);
    this.vx = (mx / len) * sp;
    this.vy = (my / len) * sp;
    this.face = angleLerp(this.face, toP, Math.min(1, 3 * dt));

    if (this.hatching) {
      this.hatchT -= dt;
      if (this.hatchT <= 0) {
        this.hatching = false;
        this.cd = this.rng.range(3.2, 4.4);
        const room = this.game.room;
        const n = Math.min(2, this.maxMinions - this._minionCount());
        for (let i = 0; i < n; i++) {
          if (room) room.pending.push({ type: 'swarmer', delay: 0.14 * i });
        }
        this.game.particles.ring(this.x, this.y, '#c86bff', 12, 200);
      }
    } else {
      this.cd -= dt;
      if (this.cd <= 0 && this._minionCount() < this.maxMinions) {
        this.hatching = true;
        this.hatchT = 0.9;
      }
    }
    this.tryTouchDamage(this.touchDamage);
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 蜘蛛腿 */
    ctx.strokeStyle = '#2a1d33';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + Math.sin(this.legPhase + i) * 0.12;
      const mid = this.r * 0.9, tip = this.r + 14;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.r * 0.4, Math.sin(a) * this.r * 0.4);
      ctx.quadraticCurveTo(
        Math.cos(a + 0.3) * mid, Math.sin(a + 0.3) * mid,
        Math.cos(a + 0.15) * tip, Math.sin(a + 0.15) * tip
      );
      ctx.stroke();
    }
    /* 卵囊（孵化时鼓动） */
    const pulse = this.hatching ? 1 + 0.16 * Math.sin(t * 18) : 1 + 0.05 * Math.sin(t * 2.5);
    ctx.save();
    ctx.scale(pulse, pulse);
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(-this.r * 0.1, 0, this.r * 0.95, this.r * 0.88, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 卵粒 */
    ctx.fillStyle = this.colors[2];
    for (let i = 0; i < 4; i++) {
      const a = t * 0.6 + (i / 4) * TAU;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * this.r * 0.4, Math.sin(a) * this.r * 0.4, 3.2, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    /* 眼 */
    ctx.fillStyle = this.hatching ? '#ffe0ff' : '#c86bff';
    ctx.beginPath(); ctx.arc(this.r * 0.35, -this.r * 0.3, 2.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.35, this.r * 0.3, 2.6, 0, TAU); ctx.fill();
  }
}

/* ===========================================================
   特殊 · 隐身：潜影 Phantom
   显形追击 → 潜行（半透明、加速、不可被锁定）→ 贴近后突袭
   =========================================================== */
class Phantom extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '潜影',
      r: 17,
      hp: 34,
      speed: 132,
      touchDamage: 6,
      touchInterval: 1.0,
      mass: 0.9,
      rng: rng,
      colors: ['#1e2a3a', '#a8c4ff', '#5f7fc0']
    });
    this.strikeDamage = 17;
    this.dmgFields = ['strikeDamage'];
    this.state = 'stalk';
    this.stateT = rng.range(1.0, 1.8);
    this.veil = 0;                 // 0 显形 · 1 完全潜行
    this.drift = rng.range(0, TAU);
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    this.drift += dt * 2.2;

    if (this.state === 'stalk') {
      this.stateT -= dt;
      this.veil = Math.max(0, this.veil - dt * 3);
      const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.drift) * 0.4;
      this.face = angleLerp(this.face, a, Math.min(1, 6 * dt));
      this.vx = Math.cos(this.face) * this.speed;
      this.vy = Math.sin(this.face) * this.speed;
      this.tryTouchDamage(this.touchDamage);
      if (this.stateT <= 0) { this.state = 'veil'; this.stateT = this.rng.range(1.8, 2.8); }
    } else if (this.state === 'veil') {
      this.stateT -= dt;
      this.veil = Math.min(1, this.veil + dt * 2.2);
      /* 潜行期：绕着玩家兜圈子保持一个身位，不急着贴脸 */
      const toP = angleTo(this.x, this.y, p.x, p.y);
      const orbit = toP + Math.PI / 2 * 0.85;
      let mx, my;
      if (d > 230) { mx = Math.cos(toP); my = Math.sin(toP); }
      else if (d < 150) { mx = -Math.cos(toP); my = -Math.sin(toP); }
      else { mx = Math.cos(orbit); my = Math.sin(orbit); }
      const len = Math.hypot(mx, my) || 1;
      const sp = this.speed * 1.35;
      this.vx = (mx / len) * sp;
      this.vy = (my / len) * sp;
      this.face = angleLerp(this.face, toP, Math.min(1, 5 * dt));
      if (Math.random() < dt * 16) {
        this.game.particles.trail(this.x, this.y, 'rgba(168,196,255,0.22)', 5);
      }
      /* 潜行走完才突袭（保证有一段真正的隐身期） */
      if (this.stateT <= 0) {
        this.state = 'strike';
        this.stateT = 0.32;
        this.face = angleTo(this.x, this.y, p.x, p.y);
      }
    } else {
      this.stateT -= dt;
      this.veil = Math.max(0, this.veil - dt * 6);
      const sp = this.speed * 3.2;
      this.vx = Math.cos(this.face) * sp;
      this.vy = Math.sin(this.face) * sp;
      if (this.stateT > 0.16 && dist(this.x, this.y, p.x, p.y) < this.r + p.r + 26) {
        p.takeDamage(this.dmgOut(this.strikeDamage), this.x, this.y);
        this.stateT = Math.min(this.stateT, 0.15);
        this.game.particles.burst(this.x, this.y, 10, {
          speed: 190, life: 0.35, size: 4, colors: ['#a8c4ff', '#ffffff', this.colors[2]]
        });
      }
      if (this.stateT <= 0) { this.state = 'stalk'; this.stateT = this.rng.range(0.8, 1.4); }
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 潜行：整体变淡，只留轮廓与眼 */
    ctx.save();
    ctx.globalAlpha = 1 - this.veil * 0.82;

    ctx.rotate(this.face);
    /* 斗篷状轮廓 */
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.moveTo(this.r * 1.2, 0);
    ctx.quadraticCurveTo(0, -this.r * 1.15, -this.r * 1.0, -this.r * 0.5);
    ctx.quadraticCurveTo(-this.r * 0.5, 0, -this.r * 1.0, this.r * 0.5);
    ctx.quadraticCurveTo(0, this.r * 1.15, this.r * 1.2, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 兜帽下的双眼 */
    ctx.fillStyle = this.state === 'veil' ? '#ff6b6b' : '#dce8ff';
    ctx.beginPath(); ctx.arc(this.r * 0.45, -this.r * 0.28, 2.8, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.45, this.r * 0.28, 2.8, 0, TAU); ctx.fill();
    ctx.restore();

    /* 潜行时额外画一层可辨认的轮廓（不至于完全看不见） */
    if (this.veil > 0.2) {
      ctx.save();
      ctx.globalAlpha = 0.18 + 0.10 * Math.sin(t * 6);
      ctx.strokeStyle = '#a8c4ff';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.arc(0, 0, this.r * 1.15, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }
}

/* ===========================================================
   特殊 · 自爆：胀囊 Bomber
   贴近后进入倒计时（鼓胀 + 预警环），到点自爆；提前击杀也会炸
   =========================================================== */
class Bomber extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '胀囊',
      r: 17,
      hp: 28,
      speed: 128,
      touchDamage: 5,
      touchInterval: 1.0,
      mass: 0.9,
      rng: rng,
      colors: ['#5c2222', '#ff8a5c', '#ff3b30']
    });
    this.blastDamage = 20;
    this.blastRadius = 104;
    this.dmgFields = ['blastDamage'];
    this.fuse = -1;                // <0 未点火
    this.fuseDur = 1.15;
    this.exploded = false;
    this.bob = rng.range(0, TAU);
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    this.bob += dt * 4;

    const a = angleTo(this.x, this.y, p.x, p.y);
    this.face = angleLerp(this.face, a, Math.min(1, 5 * dt));

    if (this.fuse < 0) {
      const sp = this.speed;
      this.vx = Math.cos(this.face) * sp;
      this.vy = Math.sin(this.face) * sp;
      this.tryTouchDamage(this.touchDamage);
      if (d < 132) this.fuse = 0;
    } else {
      this.fuse += dt;
      /* 点火后仍在缓慢逼近，但玩家可以走开 */
      const sp = this.speed * 0.45;
      this.vx = Math.cos(this.face) * sp;
      this.vy = Math.sin(this.face) * sp;
      if (Math.random() < dt * 30) {
        this.game.particles.spawn(
          this.x + rand(-8, 8), this.y - this.r + rand(-6, 6),
          rand(-20, 20), rand(-70, -30), rand(0.2, 0.45), rand(2, 4),
          'rgba(255,180,90,0.7)', { drag: 2 }
        );
      }
      if (this.fuse >= this.fuseDur) {
        this._explode();
      }
    }
  }

  _explode() {
    if (this.exploded) return;
    this.exploded = true;
    const p = this.game.player;
    this.game.particles.ring(this.x, this.y, '#ff8a5c', 22, this.blastRadius * 3.4);
    this.game.particles.burst(this.x, this.y, 26, {
      speed: 300, life: 0.6, size: 6, colors: ['#ff8a5c', '#ffd35e', '#ffffff', this.colors[0]]
    });
    this.game.addShake(3);
    const reach = this.blastRadius + p.r;
    if (dist2(this.x, this.y, p.x, p.y) <= reach * reach) {
      p.takeDamage(this.dmgOut(this.blastDamage), this.x, this.y);
    }
    if (!this.dead) { this.hp = 0; this.die(); }
  }

  /* 死亡效果：被击杀时同样引爆 */
  die() {
    if (this.dead) return;
    this._explode();
    super.die();
  }

  onDraw(ctx) {
    const t = this.animT;
    const g = this.fuse >= 0 ? clamp(this.fuse / this.fuseDur, 0, 1) : 0;

    /* 爆炸预警环 */
    if (this.fuse >= 0) drawTelegraphRing(ctx, this.blastRadius, g, '#ff5a4d');

    /* 鼓胀的囊体 */
    const swell = 1 + g * 0.35 + Math.sin(this.bob) * (0.04 + 0.10 * g);
    ctx.save();
    ctx.scale(swell, swell);
    ctx.fillStyle = this.fuse >= 0 && Math.sin(t * (14 + 26 * g)) > 0 ? '#ffd35e' : this.colors[0];
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.95, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2 + 1.5 * g;
    ctx.stroke();
    /* 内部涌动 */
    ctx.fillStyle = this.colors[2];
    ctx.globalAlpha = 0.55 + 0.35 * g;
    ctx.beginPath();
    ctx.arc(Math.sin(t * 3) * 3, Math.cos(t * 2.4) * 3, this.r * (0.34 + 0.18 * g), 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    /* 引线火花 */
    if (this.fuse >= 0) {
      const fx = Math.cos(-Math.PI / 2 + Math.sin(t * 9) * 0.5) * this.r * 1.1;
      const fy = -this.r * 1.1;
      ctx.fillStyle = '#fff3c0';
      ctx.beginPath();
      ctx.arc(fx, fy, 3 + Math.sin(t * 30), 0, TAU);
      ctx.fill();
    } else {
      ctx.fillStyle = '#ffd0b0';
      ctx.beginPath(); ctx.arc(-this.r * 0.25, -this.r * 0.35, 2.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-this.r * 0.25, this.r * 0.35, 2.4, 0, TAU); ctx.fill();
    }
  }
}

/* ===========================================================
   特殊 · 治疗：织愈 Mender
   躲在最远处，持续为受伤同伴织补生命（优先击杀目标）
   =========================================================== */
class Mender extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '织愈',
      r: 17,
      hp: 32,
      speed: 106,
      touchDamage: 4,
      touchInterval: 1.2,
      mass: 0.8,
      rng: rng,
      colors: ['#22463c', '#7dffb0', '#39c98a']
    });
    this.healAmount = 10;
    this.dmgFields = ['healAmount'];
    this.cd = rng.range(0.8, 1.6);
    this.beam = null;              // {x, y, t}
    this.float = rng.range(0, TAU);
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = angleTo(this.x, this.y, p.x, p.y);
    this.float += dt * 2;

    /* 玩家靠近就跑，尽可能远离 */
    let mx, my;
    if (d < 340) { mx = -Math.cos(toP); my = -Math.sin(toP); }
    else { mx = Math.cos(toP + Math.PI / 2) * Math.sin(this.animT * 0.6); my = Math.sin(toP + Math.PI / 2) * Math.sin(this.animT * 0.6); }
    const len = Math.hypot(mx, my) || 1;
    this.vx = (mx / len) * this.speed;
    this.vy = (my / len) * this.speed;
    this.face = angleLerp(this.face, toP, Math.min(1, 3 * dt));

    if (this.beam) {
      this.beam.t -= dt;
      if (this.beam.t <= 0) this.beam = null;
    }

    this.cd -= dt;
    if (this.cd <= 0) {
      const target = this._pickTarget();
      if (target) {
        this.cd = this.rng.range(2.2, 3.0);
        const amount = Math.round(this.healAmount + target.maxHp * 0.10);
        const before = target.hp;
        target.hp = Math.min(target.maxHp, target.hp + amount);
        const gained = Math.round(target.hp - before);
        this.beam = { x: target.x, y: target.y, t: 0.45 };
        if (gained > 0) {
          this.game.damageNumbers.add(target.x, target.y - target.r - 6, '+' + gained, {
            color: '#7dffb0', life: 0.8, vy: -40
          });
        }
        this.game.particles.ring(target.x, target.y, '#7dffb0', 8, 120);
      } else {
        this.cd = 0.6;
      }
    }
    this.tryTouchDamage(this.touchDamage);
  }

  _pickTarget() {
    const list = this.game.room ? this.game.room.enemies : [];
    let best = null, worst = 0.999;
    for (const e of list) {
      if (e === this || e.dead || e.isBoss) continue;
      if (e.hp >= e.maxHp) continue;
      if (dist2(this.x, this.y, e.x, e.y) > 300 * 300) continue;
      const ratio = e.hp / e.maxHp;
      if (ratio < worst) { worst = ratio; best = e; }
    }
    return best;
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 治疗光束 */
    if (this.beam) {
      ctx.save();
      ctx.globalAlpha = clamp(this.beam.t / 0.45, 0, 1) * 0.8;
      ctx.strokeStyle = '#7dffb0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(this.beam.x - this.x, this.beam.y - this.y);
      ctx.stroke();
      ctx.restore();
    }

    ctx.translate(0, Math.sin(this.float) * 3);
    /* 灯笼状躯体 */
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, this.r * 1.6);
    g.addColorStop(0, 'rgba(125,255,176,0.45)');
    g.addColorStop(1, 'rgba(125,255,176,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.6, 0, TAU);
    ctx.fill();

    ctx.fillStyle = this.colors[0];
    polygonPath(ctx, [
      [0, -this.r * 1.1],
      [this.r * 0.8, -this.r * 0.2],
      [this.r * 0.55, this.r * 0.95],
      [-this.r * 0.55, this.r * 0.95],
      [-this.r * 0.8, -this.r * 0.2]
    ]);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 心核 */
    ctx.fillStyle = this.colors[1];
    const pulse = 1 + 0.15 * Math.sin(t * 5);
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.34 * pulse, 0, TAU);
    ctx.fill();
    /* 环绕的织针 */
    ctx.strokeStyle = 'rgba(125,255,176,0.6)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const a = t * 1.4 + (i / 3) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.r * 0.9, Math.sin(a) * this.r * 0.9);
      ctx.lineTo(Math.cos(a) * (this.r * 1.35), Math.sin(a) * (this.r * 1.35));
      ctx.stroke();
    }
  }
}

/* ===========================================================
   特殊 · 护盾：盾壳 Aegis
   缓慢移动，周期性给附近同伴（含自己）套上护盾
   =========================================================== */
class Aegis extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '盾壳',
      r: 22,
      hp: 92,
      speed: 62,
      touchDamage: 9,
      touchInterval: 1.0,
      mass: 2.4,
      rng: rng,
      colors: ['#26364a', '#8fd8ff', '#3f7fb0']
    });
    this.dr = 0.18;
    this.shieldAmount = 24;
    this.dmgFields = ['shieldAmount'];
    this.cd = rng.range(0.6, 1.4);
    this.castT = 0;
    this.casting = false;
    this.spin = rng.range(0, TAU);
  }

  onUpdate(dt) {
    const p = this.game.player;
    const a = angleTo(this.x, this.y, p.x, p.y);
    this.face = angleLerp(this.face, a, Math.min(1, 2.6 * dt));
    this.spin += dt * 0.9;
    const sp = this.speed * (this.casting ? 0.3 : 1);
    this.vx = Math.cos(this.face) * sp;
    this.vy = Math.sin(this.face) * sp;
    this.tryTouchDamage(this.touchDamage);

    if (this.casting) {
      this.castT -= dt;
      if (this.castT <= 0) {
        this.casting = false;
        this.cd = this.rng.range(4.0, 5.2);
        this._grant();
      }
    } else {
      this.cd -= dt;
      if (this.cd <= 0) { this.casting = true; this.castT = 0.7; }
    }
  }

  _grant() {
    const list = this.game.room ? this.game.room.enemies : [];
    let n = 0;
    for (const e of list) {
      if (e.dead) continue;
      if (dist2(this.x, this.y, e.x, e.y) > 230 * 230) continue;
      e.shield = Math.max(e.shield, Math.round(this.shieldAmount));
      this.game.particles.ring(e.x, e.y, '#8fd8ff', 8, 110);
      n++;
    }
    this.game.particles.ring(this.x, this.y, '#8fd8ff', 16, 300);
    if (n > 0) {
      this.game.damageNumbers.add(this.x, this.y - this.r - 8, '护盾 ×' + n, {
        color: '#8fd8ff', life: 0.8
      });
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 施法预警范围 */
    if (this.casting) {
      ctx.save();
      ctx.globalAlpha = 0.12 + 0.2 * Math.sin(t * 12);
      ctx.fillStyle = '#8fd8ff';
      ctx.beginPath();
      ctx.arc(0, 0, 230, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#8fd8ff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.rotate(this.face);
    /* 六边形壳 */
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      pts.push([Math.cos(a) * this.r, Math.sin(a) * this.r]);
    }
    ctx.fillStyle = this.colors[0];
    polygonPath(ctx, pts);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2.4;
    ctx.stroke();
    /* 内层板 */
    ctx.strokeStyle = 'rgba(143,216,255,0.45)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.6, 0, TAU);
    ctx.stroke();
    /* 举在身前的盾 */
    ctx.save();
    ctx.translate(this.r * 0.7, 0);
    ctx.rotate(this.casting ? Math.sin(t * 20) * 0.1 : 0);
    ctx.fillStyle = this.casting ? '#cdefff' : this.colors[2];
    polygonPath(ctx, [
      [0, -this.r * 0.85], [this.r * 0.35, -this.r * 0.5],
      [this.r * 0.35, this.r * 0.5], [0, this.r * 0.85]
    ]);
    ctx.fill();
    ctx.strokeStyle = '#8fd8ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
    /* 眼缝 */
    ctx.fillStyle = '#cdefff';
    roundRectPath(ctx, -this.r * 0.1, -this.r * 0.35, this.r * 0.7, 3.4, 1.7);
    ctx.fill();
    roundRectPath(ctx, -this.r * 0.1, this.r * 0.35, this.r * 0.7, 3.4, 1.7);
    ctx.fill();
    ctx.restore();

    /* 自转的护环 */
    ctx.save();
    ctx.rotate(this.spin);
    ctx.strokeStyle = 'rgba(143,216,255,0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.3, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

/* ===========================================================
   特殊 · 减速：滞泥 Bogger
   缓慢爬行并沿途留下泥沼，玩家踏入会被拖慢
   =========================================================== */
class Bogger extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '滞泥',
      r: 19,
      hp: 56,
      speed: 58,
      touchDamage: 7,
      touchInterval: 1.0,
      mass: 2,
      rng: rng,
      colors: ['#3b3324', '#c8b46b', '#8f7a3c']
    });
    this.poolCd = rng.range(0.4, 1.2);
    this.pools = [];               // {x, y, r, life, t}
    this.drip = rng.range(0, TAU);
  }

  onUpdate(dt) {
    const p = this.game.player;
    const a = angleTo(this.x, this.y, p.x, p.y);
    this.face = angleLerp(this.face, a, Math.min(1, 2.2 * dt));
    this.vx = Math.cos(this.face) * this.speed;
    this.vy = Math.sin(this.face) * this.speed;
    this.tryTouchDamage(this.touchDamage);
    this.drip += dt * 3;

    this.poolCd -= dt;
    if (this.poolCd <= 0) {
      this.poolCd = this.rng.range(1.5, 2.2);
      this.pools.push({ x: this.x, y: this.y, r: 72, life: 6.0, t: 0 });
      if (this.pools.length > 5) this.pools.shift();
      this.game.particles.burst(this.x, this.y, 6, {
        speed: 90, life: 0.5, size: 4, color: '#c8b46b', drag: 4
      });
    }

    for (let i = this.pools.length - 1; i >= 0; i--) {
      const z = this.pools[i];
      z.life -= dt;
      z.t += dt;
      if (z.life <= 0) { this.pools.splice(i, 1); continue; }
      if (dist2(z.x, z.y, p.x, p.y) < (z.r + p.r) * (z.r + p.r)) p.applySlow(0.28);
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 泥沼（世界坐标） */
    for (const z of this.pools) {
      ctx.save();
      ctx.translate(z.x - this.x, z.y - this.y);
      const fade = clamp(z.life / 1.2, 0, 1);
      ctx.globalAlpha = (0.16 + 0.06 * Math.sin(z.t * 3)) * fade;
      ctx.fillStyle = '#c8b46b';
      ctx.beginPath();
      ctx.arc(0, 0, z.r, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.35 * fade;
      ctx.strokeStyle = '#8f7a3c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, z.r, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.25 * fade;
      for (let i = 0; i < 3; i++) {
        const a = z.t * 0.8 + (i / 3) * TAU;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * z.r * 0.5, Math.sin(a) * z.r * 0.5, 8, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.rotate(this.face);
    /* 泥块躯体 */
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 1.05, this.r * 0.9, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 下滴的泥浆 */
    ctx.fillStyle = this.colors[2];
    for (let i = 0; i < 3; i++) {
      const px = -this.r * 0.5 + i * this.r * 0.5;
      const len = 6 + Math.abs(Math.sin(this.drip + i)) * 8;
      ctx.beginPath();
      ctx.ellipse(px, this.r * 0.7, 3, len * 0.5, 0, 0, TAU);
      ctx.fill();
    }
    /* 背上的孔洞 */
    ctx.fillStyle = '#241f16';
    ctx.beginPath(); ctx.arc(-this.r * 0.2, -this.r * 0.25, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.25, this.r * 0.2, 3, 0, TAU); ctx.fill();
    /* 眼 */
    ctx.fillStyle = '#f0e2a8';
    ctx.beginPath(); ctx.arc(this.r * 0.4, -this.r * 0.3, 2.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.4, this.r * 0.3, 2.4, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ===========================================================
   特殊 · 传送：折跃 Blinker
   周期性瞬移到玩家侧后方，现身后立刻打出两发（有淡入淡出预警）
   =========================================================== */
class Blinker extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '折跃',
      r: 16,
      hp: 36,
      speed: 108,
      touchDamage: 6,
      touchInterval: 1.0,
      mass: 1,
      rng: rng,
      colors: ['#3a2a52', '#c08bff', '#7f5cd6']
    });
    this.bulletDamage = 8;
    this.dmgFields = ['bulletDamage'];
    this.state = 'move';
    this.stateT = rng.range(1.0, 1.8);
    this.fade = 1;                 // 1 实体 · 0 完全消失
    this.tx = x; this.ty = y;
    this.cd = rng.range(1.6, 2.6);
    this.spin = rng.range(0, TAU);
    this._fired = false;
  }

  onUpdate(dt) {
    const p = this.game.player;
    this.spin += dt * 2.2;

    if (this.state === 'move') {
      this.cd -= dt;
      this.fade = Math.min(1, this.fade + dt * 4);
      const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.animT * 2) * 0.5;
      this.face = angleLerp(this.face, a, Math.min(1, 5 * dt));
      this.vx = Math.cos(this.face) * this.speed * 0.7;
      this.vy = Math.sin(this.face) * this.speed * 0.7;
      this.tryTouchDamage(this.touchDamage);
      if (this.cd <= 0) {
        this.state = 'vanish';
        this.stateT = 0.26;
        /* 目标：玩家侧后方 150~210 */
        const base = angleTo(p.x, p.y, this.x, this.y);
        const a2 = base + this.rng.range(-1.0, 1.0);
        const dd = this.rng.range(150, 210);
        const t = arenaClamp(p.x + Math.cos(a2) * dd, p.y + Math.sin(a2) * dd, 40);
        this.tx = t.x; this.ty = t.y;
        this.game.particles.burst(this.x, this.y, 10, {
          speed: 170, life: 0.35, size: 4, color: '#c08bff'
        });
      }
    } else if (this.state === 'vanish') {
      this.stateT -= dt;
      this.vx *= 0.7; this.vy *= 0.7;
      this.fade = Math.max(0, this.fade - dt / 0.26);
      if (this.stateT <= 0) {
        /* 瞬移 */
        this.x = this.tx; this.y = this.ty;
        this.game.room.clampEntity(this, false);
        this.state = 'appear';
        this.stateT = 0.26;
        this.game.particles.ring(this.x, this.y, '#c08bff', 14, 200);
      }
    } else if (this.state === 'appear') {
      this.stateT -= dt;
      this.vx = 0; this.vy = 0;
      this.fade = Math.min(1, this.fade + dt / 0.26);
      this.face = angleLerp(this.face, angleTo(this.x, this.y, p.x, p.y), Math.min(1, 12 * dt));
      if (this.stateT <= 0) {
        this.state = 'volley';
        this.stateT = 0.28;
      }
    } else {
      this.stateT -= dt;
      this.vx *= 0.6; this.vy *= 0.6;
      if (this.stateT > 0.14 && !this._fired) {
        this._fired = true;
        const base = angleTo(this.x, this.y, p.x, p.y);
        for (const off of [-0.13, 0.13]) {
          this.fireBullet(base + off, {
            speed: 320, damage: this.dmgOut(this.bulletDamage), r: 5.5,
            color: '#c08bff', core: '#efe0ff', life: 2.4, spin: 10
          });
        }
      }
      if (this.stateT <= 0) {
        this.state = 'move';
        this.cd = this.rng.range(2.0, 3.0);
        this._fired = false;
      }
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    ctx.save();
    ctx.globalAlpha = this.fade;
    ctx.rotate(this.spin * 0.4);

    /* 菱形本体 */
    ctx.fillStyle = this.colors[0];
    polygonPath(ctx, [
      [0, -this.r * 1.15],
      [this.r * 0.85, 0],
      [0, this.r * 1.15],
      [-this.r * 0.85, 0]
    ]);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 内部折跃核心 */
    ctx.fillStyle = this.colors[2];
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.4 * (0.8 + 0.3 * Math.sin(t * 6)), 0, TAU);
    ctx.fill();
    /* 相位环 */
    ctx.strokeStyle = 'rgba(192,139,255,0.55)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.45, this.spin, this.spin + Math.PI * 1.4);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    /* 折跃目标提示（消失期间显示落点） */
    if (this.state === 'vanish') {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#c08bff';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.arc(this.tx - this.x, this.ty - this.y, this.r, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }
}

/* ===========================================================
   特殊 · 分裂：畸核 Nucleus
   受到伤害时有概率裂出一颗小核（有数量上限），越打越多
   =========================================================== */
class Nucleus extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '畸核',
      r: 21,
      hp: 64,
      speed: 70,
      touchDamage: 8,
      touchInterval: 0.9,
      mass: 1.8,
      rng: rng,
      colors: ['#4a2a2a', '#ff9d6b', '#d65a3c']
    });
    this.maxSplits = 3;
    this.splitChance = 0.30;
    this.splitCd = 0;
    this.pulse = rng.range(0, TAU);
    this.spawned = false;
  }

  onUpdate(dt) {
    const p = this.game.player;
    if (this.splitCd > 0) this.splitCd -= dt;
    this.pulse += dt * 2.6;
    const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.animT * 1.4) * 0.4;
    this.face = angleLerp(this.face, a, Math.min(1, 3.4 * dt));
    this.vx = Math.cos(this.face) * this.speed;
    this.vy = Math.sin(this.face) * this.speed;
    this.tryTouchDamage(this.touchDamage);
  }

  _nucleidCount() {
    const list = this.game.room ? this.game.room.enemies : [];
    let n = 0;
    for (const e of list) if (!e.dead && e.type === 'nucleid') n++;
    return n + (this.game.room ? this.game.room.pending.filter(q => q.type === 'nucleid').length : 0);
  }

  takeDamage(amount, srcX, srcY) {
    const before = this.hp;
    super.takeDamage(amount, srcX, srcY);
    if (this.dead || this.hp === before) return;
    /* 受伤反馈：有概率裂出小核 */
    if (this.splitCd <= 0 && this._nucleidCount() < this.maxSplits && this.rng.chance(this.splitChance)) {
      this.splitCd = 1.6;
      const room = this.game.room;
      if (room) room.pending.push({ type: 'nucleid', delay: 0.1 });
      this.game.particles.ring(this.x, this.y, '#ff9d6b', 10, 170);
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 外膜 */
    const pulse = 1 + 0.07 * Math.sin(this.pulse);
    ctx.save();
    ctx.scale(pulse, pulse);
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2.4;
    ctx.stroke();
    /* 内部气泡（表示待分裂的核） */
    ctx.fillStyle = this.colors[2];
    for (let i = 0; i < 4; i++) {
      const a = t * 0.9 + (i / 4) * TAU;
      const rr = this.r * 0.42;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 4.6 + Math.sin(t * 4 + i) * 1.4, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = '#ffd0b0';
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.24, 0, TAU);
    ctx.fill();
    ctx.restore();
    /* 触须 */
    ctx.strokeStyle = '#331c1c';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU + t * 0.4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.r * 0.7, Math.sin(a) * this.r * 0.7);
      ctx.lineTo(Math.cos(a) * (this.r + 10 + Math.sin(t * 5 + i) * 3),
                 Math.sin(a) * (this.r + 10 + Math.sin(t * 5 + i) * 3));
      ctx.stroke();
    }
  }
}

/* 小核：畸核分裂物（不参与随机生成） */
class Nucleid extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '小核',
      r: 11,
      hp: 14,
      speed: 168,
      touchDamage: 5,
      touchInterval: 0.7,
      mass: 0.5,
      rng: rng,
      colors: ['#4a2a2a', '#ff9d6b', '#d65a3c']
    });
    this.wob = rng.range(0, TAU);
  }
  onUpdate(dt) {
    const p = this.game.player;
    this.wob += dt * 6.5;
    const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.wob) * 0.32;
    this.face = angleLerp(this.face, a, Math.min(1, 10 * dt));
    this.vx = Math.cos(this.face) * this.speed;
    this.vy = Math.sin(this.face) * this.speed;
    this.tryTouchDamage(this.touchDamage);
  }
  onDraw(ctx) {
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.fillStyle = this.colors[2];
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.45, 0, TAU);
    ctx.fill();
  }
}

/* ===========================================================
   特殊 · 增益：塑能 Curator
   不直接攻击，周期给附近同伴注入狂暴（移速 +25%，伤害 +20%）
   =========================================================== */
class Curator extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '塑能',
      r: 18,
      hp: 40,
      speed: 96,
      touchDamage: 4,
      touchInterval: 1.2,
      mass: 0.9,
      rng: rng,
      colors: ['#4a3520', '#ffb347', '#ff7a3c']
    });
    this.cd = rng.range(0.8, 1.6);
    this.castT = 0;
    this.casting = false;
    this.float = rng.range(0, TAU);
    this.ring = 0;
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = angleTo(this.x, this.y, p.x, p.y);
    this.float += dt * 2.4;

    /* 中距离徘徊 */
    let mx = 0, my = 0;
    if (d < 240) { mx = -Math.cos(toP); my = -Math.sin(toP); }
    else if (d > 420) { mx = Math.cos(toP) * 0.5; my = Math.sin(toP) * 0.5; }
    else { mx = Math.cos(toP + Math.PI / 2) * 0.6; my = Math.sin(toP + Math.PI / 2) * 0.6; }
    const len = Math.hypot(mx, my) || 1;
    const sp = this.speed * (this.casting ? 0.3 : 1);
    this.vx = (mx / len) * sp;
    this.vy = (my / len) * sp;
    this.face = angleLerp(this.face, toP, Math.min(1, 3 * dt));

    if (this.ring > 0) this.ring -= dt;

    if (this.casting) {
      this.castT -= dt;
      if (this.castT <= 0) {
        this.casting = false;
        this.cd = this.rng.range(3.4, 4.6);
        this._empower();
      }
    } else {
      this.cd -= dt;
      if (this.cd <= 0) { this.casting = true; this.castT = 0.8; }
    }
    this.tryTouchDamage(this.touchDamage);
  }

  _empower() {
    const list = this.game.room ? this.game.room.enemies : [];
    let n = 0;
    for (const e of list) {
      if (e === this || e.dead) continue;
      if (dist2(this.x, this.y, e.x, e.y) > 250 * 250) continue;
      e.rageT = Math.max(e.rageT, 5.0);
      this.game.particles.ring(e.x, e.y, '#ffb347', 8, 120);
      n++;
    }
    this.ring = 0.5;
    this.game.particles.ring(this.x, this.y, '#ffb347', 18, 320);
    if (n > 0) {
      this.game.damageNumbers.add(this.x, this.y - this.r - 8, '狂暴 ×' + n, {
        color: '#ffb347', life: 0.8
      });
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 施法范围 */
    if (this.casting) {
      ctx.save();
      ctx.globalAlpha = 0.10 + 0.16 * Math.sin(t * 12);
      ctx.fillStyle = '#ffb347';
      ctx.beginPath();
      ctx.arc(0, 0, 250, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    /* 生效扩散环 */
    if (this.ring > 0) {
      ctx.save();
      ctx.globalAlpha = this.ring / 0.5;
      ctx.strokeStyle = '#ffb347';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 250 * (1 - this.ring / 0.5) + 20, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    ctx.translate(0, Math.sin(this.float) * 3);
    /* 悬浮的眼状核心 */
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, this.r * 1.7);
    g.addColorStop(0, 'rgba(255,179,71,0.4)');
    g.addColorStop(1, 'rgba(255,179,71,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.7, 0, TAU);
    ctx.fill();

    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 0.9, this.r * 0.78, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 单只大眼 */
    ctx.fillStyle = '#fff3d0';
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.46, 0, TAU);
    ctx.fill();
    ctx.fillStyle = this.casting ? '#ff3b30' : this.colors[2];
    const px = Math.cos(this.face) * 3, py = Math.sin(this.face) * 3;
    ctx.beginPath();
    ctx.arc(px, py, this.r * 0.24, 0, TAU);
    ctx.fill();
    /* 能量须 */
    ctx.strokeStyle = 'rgba(255,179,71,0.6)';
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 4; i++) {
      const a = t * 1.6 + (i / 4) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.r * 0.9, Math.sin(a) * this.r * 0.9);
      ctx.lineTo(Math.cos(a) * (this.r * 1.3), Math.sin(a) * (this.r * 1.3));
      ctx.stroke();
    }
  }
}

<script>
/* ===========================================================
   map.js — 程序生成的房间地图（网格 / 节点结构）
   - Start 房固定
   - Boss 房位于地图末端
   - 所有房间由「从已有房间生长」产生 → 天然连通，无孤立房间
   - 相同 Seed + 相同层数 → 完全相同地图
   =========================================================== */
'use strict';

const ROOM_TYPE = {
  START: 'start',
  COMBAT: 'combat',
  TREASURE: 'treasure',
  ELITE: 'elite',
  SHOP: 'shop',
  EVENT: 'event',
  BOSS: 'boss',
  SECRET: 'secret'
};

const ROOM_META = {
  start:    { cn: '起点',   color: '#7dffb0', glyph: 'S' },
  combat:   { cn: '战斗',   color: '#8fa3b5', glyph: '·' },
  treasure: { cn: '宝库',   color: '#ffd35e', glyph: 'T' },
  elite:    { cn: '精英',   color: '#ff8a5c', glyph: 'E' },
  shop:     { cn: '商栈',   color: '#7fe4ff', glyph: '$' },
  event:    { cn: '异象',   color: '#c08bff', glyph: '?' },
  boss:     { cn: '守望者', color: '#ff4d6b', glyph: 'B' },
  secret:   { cn: '秘室',   color: '#c08bff', glyph: '*' }
};

const DIRS = [
  { side: 'top', dc: 0, dr: -1 },
  { side: 'bottom', dc: 0, dr: 1 },
  { side: 'left', dc: -1, dr: 0 },
  { side: 'right', dc: 1, dr: 0 }
];

class GameMap {
  constructor(seed, floor) {
    this.seed = seed;
    this.floor = floor || 1;
    this.rng = new Rng(hashSeed(seed) ^ hashSeed('floor:' + this.floor));
    this.cols = 0;
    this.rows = 0;
    this.cells = [];
    this.grid = {};        // key "c,r" -> cell
    this.visited = {};
    this.current = null;
    this.start = null;
    this.boss = null;
    this.generate();
  }

  /* ---------------------------------------------------------
     生成
     --------------------------------------------------------- */
  generate() {
    const rng = this.rng;
    this.cols = clamp(5 + Math.floor(this.floor / 3), 5, 7);
    this.rows = 5;
    const cols = this.cols, rows = this.rows;

    /* 1. 起点固定在最左列（纵向居中附近） */
    const startR = rows >= 5 ? 2 + rng.int(-1, 1) : Math.floor(rows / 2);
    const start = this._add(0, clamp(startR, 0, rows - 1));
    this.start = start;
    start.type = ROOM_TYPE.START;

    /* 2. 主路径：从起点一路向右生长到最右列 → 末端即 Boss */
    let cur = start;
    let guard = 0;
    const mainPath = [start];
    while (cur.c < cols - 1 && guard++ < 200) {
      /* 先在当前列纵向游走 0~2 格，再向右推进一格。
         注意：纵向漂移必须在「尚未进入最右列」时完成，
         否则会在最右列留下比 Boss 更远的房间，破坏 Boss 的末端性。 */
      const vSteps = rng.int(0, 2);
      const vDir = rng.chance(0.5) ? -1 : 1;
      for (let i = 0; i < vSteps; i++) {
        const nr = cur.r + vDir;
        if (nr < 0 || nr >= rows) break;
        cur = this._add(cur.c, nr);
        mainPath.push(cur);
      }
      /* 向右推进（最后一次推进一定落在最右列，其后不再漂移 → 末端即 Boss） */
      cur = this._add(cur.c + 1, cur.r);
      mainPath.push(cur);
    }

    /* 3. Boss = 主路径末端（一定在最右列） */
    this.boss = cur;
    cur.type = ROOM_TYPE.BOSS;

    /* 4. 分支：从主路径上的房间长出 2~4 条短支线 */
    const branchCount = clamp(2 + rng.int(0, 2), 2, 4);
    const branchRoots = rng.shuffle(mainPath.slice(0, Math.max(1, mainPath.length - 1)));
    let made = 0;
    for (let i = 0; i < branchRoots.length && made < branchCount; i++) {
      const root = branchRoots[i];
      if (root === this.start || root === this.boss) continue;
      /* 支线不从末端附近长出，保证 Boss 房始终是地图尽头 */
      if (root.c >= this.boss.c - 1) continue;
      const len = rng.int(1, 2);
      let node = root;
      for (let s = 0; s < len; s++) {
        const dirs = rng.shuffle(DIRS);
        let placed = null;
        for (const d of dirs) {
          const nc = node.c + d.dc, nr = node.r + d.dr;
          if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) continue;
          if (this.grid[nc + ',' + nr]) continue;
          if (nc >= this.boss.c) continue;          // 不越过 Boss 所在列
          /* 支线房间只能挂在自己父节点上：避免支线互相粘连后比 Boss 更远 */
          let otherNeighbors = 0;
          for (const dd of DIRS) {
            const nb = this.grid[(nc + dd.dc) + ',' + (nr + dd.dr)];
            if (nb && nb !== node) otherNeighbors++;
          }
          if (otherNeighbors > 0) continue;
          placed = this._add(nc, nr);
          break;
        }
        if (!placed) break;
        node = placed;
      }
      made++;
    }

    /* 5. 分配房间类型 */
    this._assignTypes(mainPath);

    /* 6. 建立连接（四方向相邻即连通） */
    this._linkAll();

    /* 7. 保险：确保 Boss 一定是离 Start 最远的房间（末端） */
    this._ensureBossTerminal();

    /* 8. 隐藏房：放在保险之后，避免被剪枝逻辑误删 */
    this._placeSecretRooms();
  }

  /* ---------------------------------------------------------
     隐藏房
     - 挂在一个普通房间的空邻位上（死路尽头）
     - 未发现前：地图不显示，父房间也不开门
     - 发现条件：击碎父房间墙上那道可疑裂缝
     --------------------------------------------------------- */
  _placeSecretRooms() {
    const rng = this.rng;
    const want = this.floor <= 1
      ? (rng.chance(0.55) ? 1 : 0)
      : (rng.chance(0.45) ? 2 : 1);

    /* 父房间必须离 Start 足够近：秘室 = 父房间距离 +1，
       所以要保证 秘室距离 < Boss 距离，Boss 才始终是地图尽头 */
    const d0 = this.distancesFromStart();
    const bd = d0[this.boss.c + ',' + this.boss.r];
    const parents = rng.shuffle(this.cells.filter(c => {
      if (c === this.start || c === this.boss || c.type === ROOM_TYPE.BOSS) return false;
      if (c.c >= this.boss.c - 1) return false;        // 也要远离 Boss 所在列
      const dd = d0[c.c + ',' + c.r];
      return dd !== undefined && dd + 1 < bd;
    }));

    let made = 0;
    for (const parent of parents) {
      if (made >= want) break;
      const sides = rng.shuffle(DIRS.slice());
      let ok = false;
      for (const d of sides) {
        if (parent.links[d.side]) continue;                 // 该方向已有房间
        const nc = parent.c + d.dc, nr = parent.r + d.dr;
        if (nc < 0 || nc >= this.cols || nr < 0 || nr >= this.rows) continue;
        if (this.grid[nc + ',' + nr]) continue;
        /* 新格子除了父房间外不能有别的邻居（保持死路尽头） */
        let extra = 0;
        for (const dd of DIRS) {
          const nb = this.grid[(nc + dd.dc) + ',' + (nr + dd.dr)];
          if (nb && nb !== parent) extra++;
        }
        if (extra > 0) continue;

        const cell = this._add(nc, nr);
        cell.type = ROOM_TYPE.SECRET;
        cell.hidden = true;
        cell.discovered = false;
        cell.branch = true;
        /* 记录裂缝开在哪一侧（父房间视角） */
        parent.secretSide = d.side;
        parent.secretCell = cell;
        cell.parentCell = parent;
        this._linkAll();
        ok = true;
        made++;
        break;
      }
      if (!ok) continue;
    }
  }

  /* BFS 距离表（以 Start 为原点） */
  distancesFromStart() {
    const d = {};
    d[this.start.c + ',' + this.start.r] = 0;
    const q = [this.start];
    while (q.length) {
      const cur = q.shift();
      for (const dir of DIRS) {
        const n = cur.links[dir.side];
        if (!n) continue;
        const k = n.c + ',' + n.r;
        if (d[k] !== undefined) continue;
        d[k] = d[cur.c + ',' + cur.r] + 1;
        q.push(n);
      }
    }
    return d;
  }

  /* 若存在比 Boss 更远的房间，整批剪掉。
     安全性说明：BFS 最短路经过的中间房间距离严格递减，
     因此「距离 > Boss 距离」的房间被删除后，剩下的房间仍全部连通（无孤立）。 */
  _ensureBossTerminal() {
    for (let pass = 0; pass < 12; pass++) {
      const d = this.distancesFromStart();
      const bd = d[this.boss.c + ',' + this.boss.r];
      const doomed = this.cells.filter(c => {
        if (c === this.boss || c === this.start) return false;
        const dd = d[c.c + ',' + c.r];
        return dd === undefined || dd > bd;      // 不可达 或 比 Boss 更远
      });
      if (!doomed.length) break;
      for (const cell of doomed) {
        delete this.grid[cell.c + ',' + cell.r];
        const idx = this.cells.indexOf(cell);
        if (idx >= 0) this.cells.splice(idx, 1);
      }
      this._linkAll();
    }
  }

  _add(c, r) {
    const key = c + ',' + r;
    if (this.grid[key]) return this.grid[key];
    const cell = {
      id: this.cells.length,
      c: c, r: r,
      type: ROOM_TYPE.COMBAT,
      links: {},             // side -> cell
      branch: false
    };
    this.grid[key] = cell;
    this.cells.push(cell);
    return cell;
  }

  _assignTypes(mainPath) {
    const rng = this.rng;

    /* 主路径（含起点/Boss）上的中间房间：多为战斗，偶尔精英 / 异象 */
    for (const cell of mainPath) {
      if (cell === this.start || cell === this.boss) continue;
      const roll = rng.next();
      if (roll < 0.16) cell.type = ROOM_TYPE.ELITE;
      else if (roll < 0.30) cell.type = ROOM_TYPE.EVENT;
      else cell.type = ROOM_TYPE.COMBAT;
    }

    /* 支线房间：宝库 / 商栈 / 异象为主 */
    const branches = this.cells.filter(c => c !== this.start && c !== this.boss &&
      !mainPath.includes(c));
    const shuffled = rng.shuffle(branches);

    /* 保证：至少一间宝库；房间多时保证一间商栈 */
    const want = [];
    want.push(ROOM_TYPE.TREASURE);
    if (shuffled.length >= 3) want.push(ROOM_TYPE.SHOP);
    if (shuffled.length >= 5) want.push(ROOM_TYPE.TREASURE);
    if (this.floor >= 2 && shuffled.length >= 4) want.push(ROOM_TYPE.ELITE);

    for (let i = 0; i < shuffled.length; i++) {
      const cell = shuffled[i];
      if (i < want.length) {
        cell.type = want[i];
      } else {
        const roll = rng.next();
        if (roll < 0.34) cell.type = ROOM_TYPE.TREASURE;
        else if (roll < 0.56) cell.type = ROOM_TYPE.EVENT;
        else if (roll < 0.78) cell.type = ROOM_TYPE.ELITE;
        else cell.type = ROOM_TYPE.COMBAT;
      }
      cell.branch = true;
    }

    /* 兜底：如果没有宝库（支线太少），把某个非 Boss 战斗房改成宝库 */
    if (!this.cells.some(c => c.type === ROOM_TYPE.TREASURE)) {
      const cand = this.cells.filter(c => c !== this.start && c !== this.boss &&
        c.type === ROOM_TYPE.COMBAT);
      if (cand.length) cand[rng.int(0, cand.length - 1)].type = ROOM_TYPE.TREASURE;
    }
  }

  _linkAll() {
    for (const cell of this.cells) {
      cell.links = {};
      for (const d of DIRS) {
        const n = this.grid[(cell.c + d.dc) + ',' + (cell.r + d.dr)];
        if (n) cell.links[d.side] = n;
      }
    }
  }

  /* ---------------------------------------------------------
     查询
     --------------------------------------------------------- */
  /* 门的连接：未发现的隐藏房不出现在父房间的门列表里 */
  connectionsOf(cell) {
    const out = {
      top: !!cell.links.top,
      bottom: !!cell.links.bottom,
      left: !!cell.links.left,
      right: !!cell.links.right
    };
    for (const d of DIRS) {
      const n = cell.links[d.side];
      if (n && n.hidden && !n.discovered) out[d.side] = false;
    }
    return out;
  }

  /* 揭示整张地图（回廊残图） */
  revealAll() {
    for (const c of this.cells) {
      if (c.hidden && !c.discovered) continue;
      this.visit(c);
    }
  }

  secretCells() { return this.cells.filter(c => c.hidden); }

  /* 计入探索度的房间数（未发现的隐藏房不算在内） */
  countableRooms() {
    return this.cells.filter(c => !c.hidden || c.discovered).length;
  }

  countableVisited() {
    let n = 0;
    for (const c of this.cells) {
      if (c.hidden && !c.discovered) continue;
      if (this.isVisited(c)) n++;
    }
    return n;
  }

  neighbor(cell, side) { return cell.links[side] || null; }

  visit(cell) {
    this.visited[cell.c + ',' + cell.r] = true;
  }

  isVisited(cell) { return !!this.visited[cell.c + ',' + cell.r]; }

  typeCount(type) {
    let n = 0;
    for (const c of this.cells) if (c.type === type) n++;
    return n;
  }

  /* 从 Start 做 BFS，返回可达集合 —— 用于自检 */
  reachableFromStart() {
    const seen = {};
    const q = [this.start];
    seen[this.start.c + ',' + this.start.r] = true;
    while (q.length) {
      const cur = q.shift();
      for (const d of DIRS) {
        const n = cur.links[d.side];
        if (!n) continue;
        const k = n.c + ',' + n.r;
        if (seen[k]) continue;
        seen[k] = true;
        q.push(n);
      }
    }
    return seen;
  }

  /* 用于测试与「同种子一致性」比对 */
  serialize() {
    const cells = this.cells.slice().sort((a, b) => (a.c - b.c) || (a.r - b.r))
      .map(c => `${c.c},${c.r}:${c.type}:${Object.keys(c.links).sort().join('')}`);
    return `seed=${this.seed};floor=${this.floor};size=${this.cols}x${this.rows};` + cells.join('|');
  }
}

</script>
<script>
/* ===========================================================
   spawn.js — 敌人生成编队系统（数据驱动）
   -----------------------------------------------------------
   设计目标：
     1. 不是「把所有敌人随机混在一起」，而是按「编队主题」成组出现
     2. 普通房：弱敌人 + 单一主题
     3. 精英房：强敌人 + 特殊敌人 + 精英词缀（由 Room 施加）
     4. 后期房：多兵种协同（前排 + 远程 + 辅助）
     5. 弹幕安全：限制弹幕型 / 辅助型数量，保证任何组合都有解
   新增敌人不需要改这里 —— 只需要在 enemy_roster.js 里注册时
   填好 cat / cost / minDepth / tags 即可自动进入编队池。
   =========================================================== */
'use strict';

/* -----------------------------------------------------------
   编队主题（数据驱动：新增主题只需加一条）
   ----------------------------------------------------------- */
const SPAWN_THEMES = [
  {
    id: 'rush', cn: '突袭', minDepth: 0, weight: 34,
    melee: 0.80, ranged: 0.20, special: 0.0,
    prefer: ['chaser', 'charger', 'hopper', 'gnasher']
  },
  {
    id: 'gunline', cn: '弹线', minDepth: 0, weight: 22,
    melee: 0.45, ranged: 0.55, special: 0.0,
    prefer: ['shooter', 'marksman', 'wisp', 'fanner']
  },
  {
    id: 'swarm', cn: '虫潮', minDepth: 1, weight: 18,
    melee: 0.85, ranged: 0.15, special: 0.0,
    prefer: ['swarmer', 'slougher', 'chaser', 'gnasher']
  },
  {
    id: 'siege', cn: '围城', minDepth: 2, weight: 16,
    melee: 0.55, ranged: 0.30, special: 0.15,
    prefer: ['brute', 'spiker', 'turret', 'marksman', 'charger']
  },
  {
    id: 'occult', cn: '诡术', minDepth: 2, weight: 16,
    melee: 0.35, ranged: 0.35, special: 0.30,
    prefer: ['phantom', 'blinker', 'bomber', 'ringer', 'wisp']
  },
  {
    id: 'cohort', cn: '战阵', minDepth: 3, weight: 16,
    melee: 0.45, ranged: 0.25, special: 0.30,
    prefer: ['aegis', 'mender', 'curator', 'bogger', 'summoner', 'brute', 'ringer']
  }
];

const SpawnDirector = {
  /* ---------------------------------------------------------
     主入口：返回 { waves: [[type...], ...], theme: '主题名' }
     --------------------------------------------------------- */
  build(opt) {
    opt = opt || {};
    const rng = opt.rng || new Rng(1);
    const depth = opt.depth || 0;
    const isElite = !!opt.isElite;
    const type = opt.type;

    /* Boss 房：守望者 + 深层护卫 */
    if (type === ROOM_TYPE.BOSS) {
      const guard = depth >= 3 ? ['charger', 'shooter'] : (depth >= 1 ? ['shooter'] : []);
      return { waves: [['boss'].concat(guard)], theme: '守望者' };
    }

    /* 1. 选主题 */
    const pool = SPAWN_THEMES.filter(t => depth >= t.minDepth);
    const theme = this._weighted(rng, pool.length ? pool : [SPAWN_THEMES[0]]);

    /* 2. 预算（精英与后期房间显著更高） */
    let budget = isElite ? 16 + depth * 3.4 : 9 + depth * 2.9;
    budget = Math.min(budget, isElite ? 50 : 34);

    const maxCount = isElite ? 10 : (depth >= 3 ? 9 : (depth >= 1 ? 7 : 6));

    /* 3. 分类池（过滤：未隐藏 + 达深度 + 未被禁用） */
    const reg = EnemyFactory.registry;
    const has = (d, tag) => d.tags && d.tags.indexOf(tag) >= 0;
    const usable = k => {
      const d = reg[k].def;
      return !d.hidden && !!d.cat && d.cat !== 'boss' && (d.minDepth || 0) <= depth;
    };
    const byCat = cat => Object.keys(reg).filter(k => usable(k) && reg[k].def.cat === cat);

    const meleePool = byCat('melee');
    const rangedPool = byCat('ranged');
    const specialPool = byCat('special');
    if (!meleePool.length) return { waves: [['chaser']], theme: theme.cn };

    /* 主题偏好优先，池子为空时退回全池 */
    const bias = list => {
      const p = list.filter(k => theme.prefer.indexOf(k) >= 0);
      return p.length ? p : list;
    };

    const chosen = [];
    const spend = id => { chosen.push(id); budget -= (reg[id].def.cost || 3); };
    const countOf = pred => chosen.filter(pred).length;

    /* 4. 辅助位（全场最多 1 个，且深层/精英房才出现） */
    const supportPool = bias(specialPool.filter(k => has(reg[k].def, 'support')));
    let wantSupport = isElite || depth >= 3 || (depth >= 2 && theme.id === 'cohort');
    if (wantSupport && supportPool.length) spend(rng.pick(supportPool));

    /* 5. 弹幕位（数量受严格上限，避免无法躲避的弹幕墙） */
    const bulletPool = bias(rangedPool.filter(k => has(reg[k].def, 'bullethell')));
    let bulletCap = depth >= 4 ? 2 : (depth >= 1 ? 1 : 0);
    if (isElite) bulletCap = Math.min(2, bulletCap + 1);
    for (let i = 0; i < bulletCap && bulletPool.length; i++) {
      const id = rng.pick(bulletPool);
      if ((reg[id].def.cost || 3) > budget) break;
      spend(id);
    }

    /* 6. 按主题比例填充剩余名额 */
    let guard = 0;
    while (budget > 0 && chosen.length < maxCount && guard++ < 60) {
      const roll = rng.next();
      let list;
      if (roll < theme.melee) list = bias(meleePool);
      else if (roll < theme.melee + theme.ranged) list = bias(rangedPool);
      else list = bias(specialPool.filter(k => !has(reg[k].def, 'support')));
      if (!list.length) list = bias(meleePool);

      /* 预算不够时，改用最便宜的可选项 */
      let id = rng.pick(list);
      if ((reg[id].def.cost || 3) > budget) {
        const cheap = list.slice().sort((a, b) => (reg[a].def.cost || 3) - (reg[b].def.cost || 3));
        if ((cheap[0] !== undefined) && (reg[cheap[0]].def.cost || 3) <= budget) id = cheap[0];
        else break;
      }

      /* 安全限制：同类成群的上限（弹幕型数量直接决定能否躲开） */
      const d = reg[id].def;
      if (has(d, 'swarm') && countOf(k => has(reg[k].def, 'swarm')) >= 6) continue;
      if (has(d, 'bullethell') &&
          (bulletCap <= 0 || countOf(k => has(reg[k].def, 'bullethell')) >= bulletCap)) continue;
      if (has(d, 'support') && countOf(k => has(reg[k].def, 'support')) >= 1) continue;

      spend(id);

      /* 群体型一次多带两只（它们是「成群」的意义所在） */
      if (has(d, 'swarm') && chosen.length < maxCount && budget > 0) {
        if (rng.chance(0.75)) spend(id);
      }
    }

    /* 7. 保底规则 */
    if (!chosen.length) chosen.push('chaser');
    /* 有辅助就必须有前排保护，否则辅助会孤立被秒（也让房间更耐打） */
    const supportN = countOf(k => has(reg[k].def, 'support'));
    const meleeN = countOf(k => reg[k].def.cat === 'melee');
    if (supportN > 0 && meleeN < 2) {
      const m = bias(meleePool);
      for (let i = meleeN; i < 2; i++) chosen.push(rng.pick(m));
    }
    if (chosen.length < 3) {
      const m = bias(meleePool);
      while (chosen.length < 3) chosen.push(rng.pick(m));
    }

    /* 8. 分波：先出前排与辅助，远程压后 */
    const order = { special: [], melee: [], ranged: [] };
    for (const id of chosen) {
      const cat = reg[id].def.cat;
      (order[cat] || order.melee).push(id);
    }
    const all = order.special.concat(order.melee, order.ranged);

    let waves;
    if (all.length <= 5 || isElite) {
      waves = [all];
    } else {
      const cut = Math.ceil(all.length * 0.55);
      waves = [all.slice(0, cut), all.slice(cut)];
      if (!waves[1].length) waves = [all];
    }

    return { waves: waves, theme: theme.cn };
  },

  _weighted(rng, list) {
    let sum = 0;
    for (const t of list) sum += (t.weight || 1);
    let r = rng.next() * sum;
    for (const t of list) {
      r -= (t.weight || 1);
      if (r <= 0) return t;
    }
    return list[list.length - 1];
  }
};

</script>
<script>
/* ===========================================================
   room.js — 战斗房（固定尺寸竞技场）
   扩展：房间类型（Start / Combat / Treasure / Elite / Shop / Event / Boss）
   - 只有与其它房间相连的方向才有门
   - 战斗类房间：进入关门 → 生成敌人 → 清空后开门
   - 非战斗房间：门常开，放置可交互物件
   =========================================================== */
'use strict';

class Room {
  constructor(game, opts) {
    opts = opts || {};
    this.game = game;
    this.def = opts.def || { id: 0, c: 0, r: 0, type: ROOM_TYPE.COMBAT };
    this.type = this.def.type || ROOM_TYPE.COMBAT;
    this.index = opts.index || 0;
    this.depth = opts.depth || 0;
    this.tier = opts.tier || 0;
    this.connections = opts.connections || { top: true, bottom: true, left: true, right: true };
    this.rng = opts.rng || new Rng(1);
    this.roomSeed = opts.roomSeed || '';

    this.enemies = [];
    this.props = [];
    this.pending = [];
    this.waves = [];
    this.waveIndex = 0;
    this.waveTimer = 0.9;

    this.isCombatRoom = (this.type === ROOM_TYPE.COMBAT ||
                         this.type === ROOM_TYPE.ELITE ||
                         this.type === ROOM_TYPE.BOSS);

    this.state = this.isCombatRoom ? 'fighting' : 'clear';
    this.doorsOpen = !this.isCombatRoom;
    this.clearTime = 0;
    this.spawnFx = 0;
    this.everCleared = false;
    this._spawnCounter = 0;
    this.crack = null;               // 隐藏房裂缝（父房间才有）

    this._buildWalls();
    this._buildFloor();
    this._planWaves();
    this._spawnProps();
    this._startWave();
  }

  /* 隐藏房被发现后：父房间需要重新开门 */
  refreshConnections(conns) {
    this.connections = conns;
    this._buildWalls();
  }

  get meta() { return ROOM_META[this.type] || ROOM_META.combat; }

  /* ---------------------------------------------------------
     墙体 / 门（只在有连接的方向开门洞）
     --------------------------------------------------------- */
  _buildWalls() {
    const W = VIEW_W, H = VIEW_H, T = WALL_T;
    const cx = W / 2, cy = H / 2, dw = DOOR_W / 2;

    /* 全封闭四面墙：敌人与投射物永远用这一套 */
    this.wallsClosed = [
      { x: 0, y: 0, w: W, h: T, inner: 'bottom' },
      { x: 0, y: H - T, w: W, h: T, inner: 'top' },
      { x: 0, y: T, w: T, h: H - T * 2, inner: 'right' },
      { x: W - T, y: T, w: T, h: H - T * 2, inner: 'left' }
    ];

    /* 门打开后使用的墙体：有连接的方向留出门洞，其余保持实心 */
    const open = [];
    const seg = (side) => {
      if (side === 'top') {
        if (this.connections.top) {
          open.push({ x: 0, y: 0, w: cx - dw, h: T, inner: 'bottom' });
          open.push({ x: cx + dw, y: 0, w: W - (cx + dw), h: T, inner: 'bottom' });
        } else open.push({ x: 0, y: 0, w: W, h: T, inner: 'bottom' });
      } else if (side === 'bottom') {
        if (this.connections.bottom) {
          open.push({ x: 0, y: H - T, w: cx - dw, h: T, inner: 'top' });
          open.push({ x: cx + dw, y: H - T, w: W - (cx + dw), h: T, inner: 'top' });
        } else open.push({ x: 0, y: H - T, w: W, h: T, inner: 'top' });
      } else if (side === 'left') {
        if (this.connections.left) {
          open.push({ x: 0, y: T, w: T, h: cy - dw - T, inner: 'right' });
          open.push({ x: 0, y: cy + dw, w: T, h: H - T - (cy + dw), inner: 'right' });
        } else open.push({ x: 0, y: T, w: T, h: H - T * 2, inner: 'right' });
      } else {
        if (this.connections.right) {
          open.push({ x: W - T, y: T, w: T, h: cy - dw - T, inner: 'left' });
          open.push({ x: W - T, y: cy + dw, w: T, h: H - T - (cy + dw), inner: 'left' });
        } else open.push({ x: W - T, y: T, w: T, h: H - T * 2, inner: 'left' });
      }
    };
    seg('top'); seg('bottom'); seg('left'); seg('right');
    this.wallsOpen = open;

    /* 门：洞口矩形 + 触发区（略微向房间内延伸） */
    const trig = 8;
    this.doors = [];
    if (this.connections.top) {
      this.doors.push({
        side: 'top', dir: { x: 0, y: -1 },
        gap: { x: cx - dw, y: 0, w: dw * 2, h: T },
        trigger: { x: cx - dw + trig, y: 0, w: dw * 2 - trig * 2, h: T + trig }
      });
    }
    if (this.connections.bottom) {
      this.doors.push({
        side: 'bottom', dir: { x: 0, y: 1 },
        gap: { x: cx - dw, y: H - T, w: dw * 2, h: T },
        trigger: { x: cx - dw + trig, y: H - T - trig, w: dw * 2 - trig * 2, h: T + trig }
      });
    }
    if (this.connections.left) {
      this.doors.push({
        side: 'left', dir: { x: -1, y: 0 },
        gap: { x: 0, y: cy - dw, w: T, h: dw * 2 },
        trigger: { x: 0, y: cy - dw + trig, w: T + trig, h: dw * 2 - trig * 2 }
      });
    }
    if (this.connections.right) {
      this.doors.push({
        side: 'right', dir: { x: 1, y: 0 },
        gap: { x: W - T, y: cy - dw, w: T, h: dw * 2 },
        trigger: { x: W - T - trig, y: cy - dw + trig, w: T + trig, h: dw * 2 - trig * 2 }
      });
    }
  }

  /* ---------------------------------------------------------
     地板（一次性烘焙到离屏画布，按房间种子决定花纹）
     --------------------------------------------------------- */
  _buildFloor() {
    const c = document.createElement('canvas');
    c.width = VIEW_W;
    c.height = VIEW_H;
    const g = c.getContext('2d');

    g.fillStyle = '#05070c';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.fillStyle = '#0e151d';
    g.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

    const ts = 64;
    g.save();
    g.beginPath();
    g.rect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
    g.clip();

    const sd = hashSeed(this.roomSeed || (this.type + ':' + this.index));
    const seedX = (sd % 97) * 0.37, seedY = (sd % 61) * 0.91;
    for (let ty = 0; ty * ts < ARENA.h + ts; ty++) {
      for (let tx = 0; tx * ts < ARENA.w + ts; tx++) {
        const n = hash2(tx + seedX, ty + seedY);
        const x = ARENA.x + tx * ts;
        const y = ARENA.y + ty * ts;
        const shade = 14 + Math.floor(n * 12);
        g.fillStyle = `rgb(${shade}, ${shade + 6}, ${shade + 12})`;
        g.fillRect(x + 1, y + 1, ts - 2, ts - 2);
        if (n > 0.82) {
          g.strokeStyle = 'rgba(90,170,190,0.10)';
          g.lineWidth = 1.5;
          g.beginPath();
          g.moveTo(x + 12, y + ts - 14);
          g.lineTo(x + ts - 14, y + ts - 14);
          g.stroke();
        } else if (n < 0.14) {
          g.fillStyle = 'rgba(120,200,220,0.06)';
          g.beginPath();
          g.arc(x + ts * 0.5, y + ts * 0.5, 4, 0, TAU);
          g.fill();
        }
      }
    }
    g.restore();

    /* 房间类型决定中央符环颜色 */
    const accent = this.meta.color;
    const cx = VIEW_W / 2, cy = VIEW_H / 2;
    g.strokeStyle = accent;
    g.globalAlpha = 0.07;
    g.lineWidth = 3;
    g.beginPath(); g.arc(cx, cy, 168, 0, TAU); g.stroke();
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, cy, 148, 0, TAU); g.stroke();
    g.lineWidth = 2;
    const spokes = this.type === ROOM_TYPE.BOSS ? 8 : 6;
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * TAU;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * 148, cy + Math.sin(a) * 148);
      g.lineTo(cx + Math.cos(a) * 168, cy + Math.sin(a) * 168);
      g.stroke();
    }
    g.globalAlpha = 1;

    const vg = g.createRadialGradient(cx, cy, ARENA.h * 0.35, cx, cy, ARENA.h * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.45)');
    g.fillStyle = vg;
    g.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

    this.floorCanvas = c;
  }

  /* ---------------------------------------------------------
     敌人波次（使用房间专属 Rng → 同种子可复现）
     --------------------------------------------------------- */
  _planWaves() {
    const rng = this.rng;
    this.waves = [];
    this.themeCn = '';

    if (!this.isCombatRoom) return;

    if (this.type === ROOM_TYPE.BOSS) {
      this.waves = [['boss']];
      this.themeCn = '守望者';
      return;
    }

    /* 编队生成：按房间类型 + 深度组合敌人，而不是把所有种类随机混在一起 */
    const res = SpawnDirector.build({
      type: this.type,
      depth: this.depth,
      isElite: this.type === ROOM_TYPE.ELITE,
      rng: rng.fork('waves')
    });
    this.waves = res.waves;
    this.themeCn = res.theme || '';
  }

  _startWave() {
    const w = this.waves[this.waveIndex] || [];
    this.pending = w.map((type, i) => ({ type: type, delay: i * 0.16 }));
  }

  /* ---------------------------------------------------------
     可交互物件（宝箱 / 祭坛 / 商栈）
     --------------------------------------------------------- */
  _spawnProps() {
    const cx = VIEW_W / 2, cy = VIEW_H / 2;
    const rng = this.rng;

    /* 隐藏房裂缝：父房间墙上（只有未发现时才存在） */
    const secSide = this.def.secretSide;
    const secCell = this.def.secretCell;
    if (secSide && secCell && !secCell.discovered) {
      const pos = this._wallCenter(secSide);
      this.crack = new WallCrack(this.game, pos.x, pos.y, secSide, secCell);
      this.props.push(this.crack);
    }

    switch (this.type) {
      case ROOM_TYPE.TREASURE:
        /* 主宝箱居中；第 2 层起两侧各多一口小箱 */
        this.props.push(new Chest(this.game, cx, cy, rng.fork('chest'), false));
        if (this.depth >= 1) {
          this.props.push(new Chest(this.game, cx - 190, cy + 40, rng.fork('chestL'), true));
          this.props.push(new Chest(this.game, cx + 190, cy + 40, rng.fork('chestR'), true));
        }
        break;
      case ROOM_TYPE.EVENT:
        this.props.push(new EventShrine(this.game, cx, cy, rng.fork('event')));
        break;
      case ROOM_TYPE.SHOP: {
        /* 3~5 个货架，横向铺开 */
        const stocks = rollShopStocks(rng.fork('shop'), this.game, this.depth + 1);
        const n = stocks.length;
        const span = Math.min(190, 760 / Math.max(1, n));
        for (let i = 0; i < n; i++) {
          const x = cx + (i - (n - 1) / 2) * span;
          this.props.push(new ShopStall(this.game, x, cy + 30, stocks[i]));
        }
        break;
      }
      case ROOM_TYPE.SECRET: {
        /* 秘室：两口宝箱 + 一堆金币 */
        this.props.push(new Chest(this.game, cx - 150, cy - 10, rng.fork('secL'), false));
        this.props.push(new Chest(this.game, cx + 150, cy - 10, rng.fork('secR'), true));
        const pile = new CoinPile(this.game, cx, cy + 90, 45 + (this.depth + 1) * 18);
        this.props.push(pile);
        break;
      }
      default:
        break;
    }
  }

  /* 墙面中心点（裂缝用） */
  _wallCenter(side) {
    const cx = VIEW_W / 2, cy = VIEW_H / 2;
    if (side === 'top') return { x: cx, y: WALL_T * 0.5 };
    if (side === 'bottom') return { x: cx, y: VIEW_H - WALL_T * 0.5 };
    if (side === 'left') return { x: WALL_T * 0.5, y: cy };
    return { x: VIEW_W - WALL_T * 0.5, y: cy };
  }

  /* ---------------------------------------------------------
     出生点：远离玩家、彼此不重叠（用房间 Rng）
     --------------------------------------------------------- */
  _spawnPoint(radius) {
    const p = this.game.player;
    const rng = this.rng;
    for (let attempt = 0; attempt < 40; attempt++) {
      const x = rng.range(ARENA.x + radius + 24, ARENA.x + ARENA.w - radius - 24);
      const y = rng.range(ARENA.y + radius + 24, ARENA.y + ARENA.h - radius - 24);
      if (p && dist(x, y, p.x, p.y) < 210) continue;
      let ok = true;
      for (const e of this.enemies) {
        if (dist(x, y, e.x, e.y) < radius + e.r + 14) { ok = false; break; }
      }
      if (ok) return { x: x, y: y };
    }
    const cx = ARENA.x + ARENA.w / 2, cy = ARENA.y + ARENA.h / 2;
    const sx = rng.chance(0.5) ? -1 : 1, sy = rng.chance(0.5) ? -1 : 1;
    return {
      x: clamp(cx + sx * ARENA.w * 0.36, ARENA.x + 50, ARENA.x + ARENA.w - 50),
      y: clamp(cy + sy * ARENA.h * 0.36, ARENA.y + 50, ARENA.y + ARENA.h - 50)
    };
  }

  _spawnEnemy(type) {
    /* 半径走注册表（新增敌人不用改这里） */
    const r = EnemyFactory.radiusOf(type);
    const pt = type === 'boss'
      ? { x: ARENA.x + ARENA.w / 2, y: ARENA.y + 120 }
      : this._spawnPoint(r);
    /* 每只敌人派生独立 Rng → 敌人组成、出生点、行为都随种子复现 */
    const e = EnemyFactory.create(this.game, type, pt.x, pt.y, this.tier,
      this.rng.fork('enemy' + this._spawnCounter++));

    /* 精英房：每只敌人带 1~2 个词缀（更硬 / 更疯 / 死亡特效） */
    if (this.type === ROOM_TYPE.ELITE) {
      const keys = Object.keys(ELITE_AFFIX);
      const cnt = this.depth >= 2 ? 2 : 1;
      const pick = [];
      for (let i = 0; i < cnt; i++) {
        const k = keys[Math.floor(this.rng.next() * keys.length)];
        if (pick.indexOf(k) < 0) pick.push(k);
      }
      e.applyAffixes(pick);
    }

    this.enemies.push(e);
    this.spawnFx = 0.3;
    this.game.particles.ring(pt.x, pt.y, e.colors[1], type === 'boss' ? 26 : 12, type === 'boss' ? 260 : 150);
    return e;
  }

  /* ---------------------------------------------------------
     更新
     --------------------------------------------------------- */
  update(dt) {
    if (this.spawnFx > 0) this.spawnFx -= dt;

    /* 待生成队列 */
    if (this.pending.length) {
      for (let i = this.pending.length - 1; i >= 0; i--) {
        const q = this.pending[i];
        q.delay -= dt;
        if (q.delay <= 0) {
          this._spawnEnemy(q.type);
          this.pending.splice(i, 1);
        }
      }
    }

    /* 敌人 */
    for (const e of this.enemies) e.update(dt);

    /* 互相分离 */
    const n = this.enemies.length;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        Collision.separate(this.enemies[i], this.enemies[j]);
      }
    }
    for (const e of this.enemies) this.clampEntity(e, false);

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      if (this.enemies[i].dead) this.enemies.splice(i, 1);
    }

    /* 物件 */
    for (const pr of this.props) pr.update(dt);

    /* 房间结算 */
    if (this.state === 'fighting') {
      if (this.pending.length === 0 && this.enemies.length === 0) {
        if (this.waveIndex + 1 < this.waves.length) {
          this.waveTimer -= dt;
          if (this.waveTimer <= 0) {
            this.waveIndex++;
            this.waveTimer = 0.9;
            this._startWave();
            this.game.ui.showBanner('残形涌现', '下一波', 1.1);
          }
        } else {
          this.markCleared();
        }
      }
    } else {
      this.clearTime += dt;
    }
  }

  /* ---------------------------------------------------------
     重新进入（复用实例时调用）：只重置瞬时表现，绝不重建敌人 / 物件
     --------------------------------------------------------- */
  onReenter() {
    this.spawnFx = 0;
    if (this.state === 'fighting') {
      /* 战斗未结束就返回（理论上门是关的）：重新锁门 */
      this.doorsOpen = false;
      this.clearTime = 0;
    }
  }

  markCleared() {
    if (this.state === 'clear') return;
    this.state = 'clear';
    this.doorsOpen = true;
    this.clearTime = 0;
    this.everCleared = true;

    /* Boss 房通关 → 生成层间裂隙；精英房通关 → 掉落宝箱 + 金币堆 */
    if (this.type === ROOM_TYPE.BOSS) {
      this.props.push(new Portal(this.game, ARENA.x + ARENA.w / 2, ARENA.y + ARENA.h / 2));
      this.props.push(new CoinPile(this.game, ARENA.x + ARENA.w / 2 + 130, ARENA.y + ARENA.h / 2,
        60 + this.depth * 25));
    } else if (this.type === ROOM_TYPE.ELITE) {
      this.props.push(new Chest(this.game, ARENA.x + ARENA.w / 2 - 60, ARENA.y + ARENA.h / 2,
        this.rng.fork('eliteChest'), false));
      this.props.push(new CoinPile(this.game, ARENA.x + ARENA.w / 2 + 90, ARENA.y + ARENA.h / 2,
        28 + this.depth * 12));
    }
    this.game.onRoomCleared(this);
  }

  /* ---------------------------------------------------------
     碰撞辅助
     --------------------------------------------------------- */
  clampEntity(e, allowDoors) {
    const walls = (allowDoors && this.doorsOpen) ? this.wallsOpen : this.wallsClosed;
    return Collision.resolveAll(e, walls);
  }

  hitsWall(x, y, r) {
    for (const w of this.wallsClosed) {
      if (Collision.circleRect(x, y, r, w)) return true;
    }
    return false;
  }

  /* 投射物撞墙反弹：就地修改 vx / vy 并推出墙体，返回是否发生反弹 */
  bounceOffWalls(p) {
    for (const w of this.wallsClosed) {
      if (!Collision.circleRect(p.x, p.y, p.r, w)) continue;
      const overLeft = (p.x + p.r) - w.x;
      const overRight = (w.x + w.w) - (p.x - p.r);
      const overTop = (p.y + p.r) - w.y;
      const overBottom = (w.y + w.h) - (p.y - p.r);
      const m = Math.min(overLeft, overRight, overTop, overBottom);
      /* overLeft = 需要向左挪多少才能脱离左面，以此类推 */
      if (m === overLeft) { p.vx = -Math.abs(p.vx); p.x -= overLeft; }
      else if (m === overRight) { p.vx = Math.abs(p.vx); p.x += overRight; }
      else if (m === overTop) { p.vy = -Math.abs(p.vy); p.y -= overTop; }
