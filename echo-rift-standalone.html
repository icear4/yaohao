    this.label = '可疑的裂缝';

    /* 判定中心往房间内侧偏移：裂缝长在墙上，但子弹会在撞墙前就被吃掉，
       所以判定框必须提前伸进房间一段距离，否则永远打不碎 */
    const INWARD = { top: [0, 1], bottom: [0, -1], left: [1, 0], right: [-1, 0] };
    const inv = INWARD[side] || [0, 0];
    this.hx = x + inv[0] * 26;
    this.hy = y + inv[1] * 26;
  }

  inRange() { return false; }
  use() { return false; }

  /* 子弹命中判定（矩形区域，中心已向房间内侧偏移） */
  hitTest(x, y, r) {
    if (this.broken) return false;
    const w = this._w(), h = this._h();
    return Math.abs(x - this.hx) <= w / 2 + r && Math.abs(y - this.hy) <= h / 2 + r;
  }

  _w() { return (this.side === 'left' || this.side === 'right') ? 34 : 118; }
  _h() { return (this.side === 'left' || this.side === 'right') ? 118 : 34; }

  onHit(p) {
    if (this.broken || p.crackHit) return false;
    p.crackHit = true;
    this.hitsLeft--;
    this.shakeT = 0.35;
    this.game.particles.burst(p.x, p.y, 8, {
      speed: 160, life: 0.35, size: 3.4, colors: ['#c8d8e4', '#7fe4ff', '#ffffff']
    });
    this.game.damageNumbers.add(this.x, this.y - 26, '裂缝 ' + Math.max(0, this.hitsLeft) + '/3',
      { color: '#9fe4f5', life: 0.8 });
    if (this.hitsLeft <= 0) this.breakOpen();
    return true;
  }

  breakOpen() {
    if (this.broken) return;
    this.broken = true;
    this.game.particles.burst(this.x, this.y, 26, {
      speed: 240, life: 0.8, size: 5, colors: ['#c08bff', '#ffffff', '#ffd35e']
    });
    this.game.particles.ring(this.x, this.y, '#c08bff', 20, 240);
    this.game.addShake(3.5);
    if (this.secretCell) this.game.discoverSecret(this.secretCell);
  }

  update(dt) {
    super.update(dt);
    if (this.shakeT > 0) this.shakeT -= dt;
  }

  draw(ctx) {
    if (this.broken) return;
    const t = this.animT;
    const sh = this.shakeT > 0 ? Math.sin(this.shakeT * 60) * 3 : 0;
    ctx.save();
    ctx.translate(this.x + sh, this.y);
    if (this.side === 'left' || this.side === 'right') ctx.rotate(Math.PI / 2);

    /* 微弱的光晕（几乎看不出来，靠近时才明显） */
    const p = this.game.player;
    const near = p ? Math.max(0, 1 - dist(this.x, this.y, p.x, p.y) / 260) : 0;
    const a = 0.10 + 0.22 * near + 0.05 * Math.sin(t * 2.2);
    const g = ctx.createLinearGradient(-60, 0, 60, 0);
    g.addColorStop(0, 'rgba(192,139,255,0)');
    g.addColorStop(0.5, `rgba(192,139,255,${a})`);
    g.addColorStop(1, 'rgba(192,139,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-60, -17, 120, 34);

    /* 裂纹 */
    ctx.strokeStyle = `rgba(220,235,255,${0.28 + 0.4 * near})`;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-52, 4);
    for (let i = 0; i <= 8; i++) {
      const px = -52 + i * 13;
      ctx.lineTo(px, Math.sin(i * 1.7 + 0.6) * 7);
    }
    ctx.stroke();

    ctx.strokeStyle = `rgba(160,200,230,${0.14 + 0.24 * near})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-40, -8);
    ctx.lineTo(-14, 2);
    ctx.lineTo(18, -6);
    ctx.lineTo(46, 3);
    ctx.stroke();
    ctx.restore();

    /* 靠近时给个提示 */
    if (near > 0.45) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '600 11px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = 'rgba(160,200,230,0.75)';
      ctx.fillText('墙上有可疑的裂缝…（射击它）', this.x, this.y + (this.side === 'bottom' ? 40 : 34));
      ctx.textAlign = 'left';
      ctx.restore();
    }
  }
}

/* -----------------------------------------------------------
   金币堆（秘室 / 奖励房）
   ----------------------------------------------------------- */
class CoinPile extends Prop {
  constructor(game, x, y, amount) {
    super(game, x, y, { r: 24 });
    this.amount = amount;
    this.label = '拾取金币';
  }

  use() {
    if (!super.use()) return false;
    this.game.addCoins(this.amount, this.x, this.y);
    this.game.particles.burst(this.x, this.y, 26, {
      speed: 220, life: 0.9, size: 4, colors: ['#ffd35e', '#ffe08a', '#ffffff']
    });
    this.game.particles.ring(this.x, this.y, '#ffd35e', 16, 200);
    return true;
  }

  draw(ctx) {
    const t = this.animT;
    this.drawBase(ctx, this.used ? '#5d6f7e' : '#ffd35e', 0.3);
    if (!this.used) this.drawMarker(ctx, '#ffd35e');

    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.used) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#5d6f7e';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(-8 + i * 8, 8, 9, 5, 0, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
      return;
    }
    /* 三摞金币 */
    for (let i = 0; i < 3; i++) {
      const h = 4 + i * 2;
      const x = -12 + i * 12;
      const y = 10 - h - Math.sin(t * 2.4 + i) * 1.5;
      ctx.fillStyle = i === 1 ? '#ffe08a' : '#ffd35e';
      for (let k = 0; k < h; k++) {
        ctx.beginPath();
        ctx.ellipse(x, y + k * 3, 10 - k * 0.6, 4.4, 0, 0, TAU);
        ctx.fill();
      }
      ctx.strokeStyle = 'rgba(120,80,20,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(x, y + h * 3, 10 - h * 0.6, 4.4, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.font = '800 12px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe9c0';
    ctx.fillText('◈' + this.amount, 0, -28);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

</script>
<script>
/* ===========================================================
   enemy.js — 敌人基类 + 三种原创敌人（各自独立 AI）
     1. 灰噬体  Chaser  ：持续追踪 + 扑击近战
     2. 棱目    Shooter ：保持距离 + 预判弹幕
     3. 锥锋    Charger ：蓄力后高速冲锋
   =========================================================== */
'use strict';

/* -----------------------------------------------------------
   精英词缀表（数据驱动：新增词缀只需加一条数据）
   ----------------------------------------------------------- */
const ELITE_AFFIX = {
  warded:    { cn: '守护', color: '#7fe4ff', desc: '生命 +60%' },
  armored:   { cn: '甲壳', color: '#c8d8e4', desc: '受到伤害 -30%' },
  frenzy:    { cn: '狂乱', color: '#ff8a5c', desc: '移速 +40%，接触伤害 +20%' },
  volatile:  { cn: '不稳', color: '#ff4d6b', desc: '死亡时爆裂' },
  splitting: { cn: '裂生', color: '#9ad14f', desc: '死亡时裂出两只残形' },
  rich:      { cn: '富饶', color: '#ffd35e', desc: '掉落金币 ×3' }
};

/* -----------------------------------------------------------
   敌人基类
   ----------------------------------------------------------- */
class Enemy {
  constructor(game, x, y, cfg) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.kx = 0;                     // 击退速度
    this.ky = 0;

    this.r = cfg.r;
    this.maxHp = cfg.hp;
    this.hp = cfg.hp;
    this.speed = cfg.speed;
    this.touchDamage = cfg.touchDamage || 0;
    this.touchInterval = cfg.touchInterval || 0.8;

    this.name = cfg.name;
    this.colors = cfg.colors;
    this.mass = cfg.mass || 1;
    /* 每只敌人自带 Rng：行为随机也进入种子体系（相同 Seed → 相同战斗） */
    this.rng = cfg.rng || new Rng(Math.floor(Math.random() * 0x7fffffff));

    this.dead = false;
    this.touchTimer = 0;
    this.hitFlash = 0;
    this.animT = this.rng.range(0, 10);
    this.face = this.rng.range(0, TAU);

    this.spawnT = 0;
    this.spawnDur = 0.5;
    this.spawned = false;            // 出场动画完成

    /* ---- 状态效果（由道具施加） ---- */
    this.burnT = 0; this.burnStack = 0;
    this.poisonT = 0; this.poisonStack = 0;
    this.freezeT = 0;
    this.slowT = 0; this.slowStack = 0;
    this.baseSpeed = this.speed;
    this.dotAcc = 0;

    /* ---- 精英词缀 ---- */
    this.dr = 0;                     // 伤害减免（甲壳词缀）
    this.affix = null;               // 词缀 key 列表

    /* ---- 护盾 / 增益（由特殊敌人提供） ---- */
    this.shield = 0;                 // 护盾值：先于生命被消耗
    this.rageT = 0;                  // 狂暴增益剩余时间（移速 +25%，伤害 ×1.2）

    /* ---- 需要随层数成长的自定义伤害字段（子类填名字） ---- */
    this.dmgFields = null;
    this.coinBonus = 0;              // 额外金币（由种类定义写入）
  }

  /* 精英词缀表（数据驱动） */
  static get AFFIX() { return ELITE_AFFIX; }

  /* 施加状态：kind = burn | poison | freeze | slow，level = 层数 */
  applyStatus(kind, level) {
    if (this.dead || level <= 0) return;
    if (kind === 'burn') { this.burnStack = Math.min(9, this.burnStack + level); this.burnT = 3.0; }
    else if (kind === 'poison') { this.poisonStack = Math.min(12, this.poisonStack + level); this.poisonT = 4.0; }
    else if (kind === 'freeze') { this.freezeT = Math.max(this.freezeT, 0.8 + 0.25 * level); }
    else if (kind === 'slow') { this.slowStack = Math.min(5, this.slowStack + level); this.slowT = Math.max(this.slowT, 1.6); }
  }

  hasStatus() {
    return this.burnT > 0 || this.poisonT > 0 || this.freezeT > 0 || this.slowT > 0;
  }

  /* 持续伤害（不触发击退与受击闪白） */
  takeDot(amount, healer) {
    if (this.dead || amount <= 0) return;
    this.hp -= amount;
    if (healer && healer.build) {
      const m = healer.mods || {};
      if (m.dotVamp > 0) healer.hp = Math.min(healer.maxHp, healer.hp + amount * 0.10);
    }
    if (this.hp <= 0) { this.hp = 0; this.die(); }
  }

  _updateStatus(dt) {
    if (this.burnT > 0) this.burnT -= dt; else this.burnStack = 0;
    if (this.poisonT > 0) this.poisonT -= dt; else this.poisonStack = 0;
    if (this.freezeT > 0) this.freezeT -= dt;
    if (this.slowT > 0) this.slowT -= dt; else this.slowStack = 0;
    if (this.rageT > 0) this.rageT -= dt;

    const dps = this.burnStack * 3.2 + this.poisonStack * 2.4;
    if (dps > 0) {
      this.dotAcc += dps * dt;
      if (this.dotAcc >= 1) {
        const tick = Math.floor(this.dotAcc);
        this.dotAcc -= tick;
        this.takeDot(tick, this.game.player);
        if (Math.random() < 0.5) {
          this.game.particles.spawn(
            this.x + rand(-this.r, this.r), this.y + rand(-this.r, this.r),
            rand(-20, 20), rand(-50, -20), rand(0.3, 0.6), rand(2, 3.4),
            this.burnStack >= this.poisonStack ? '#ff9d3c' : '#9ad14f', { drag: 2 }
          );
        }
      }
    }

    /* 速度倍率：冰冻结死，减速按比例，狂暴加速 */
    const slowMul = this.slowT > 0 ? Math.max(0.4, 1 - 0.15 * this.slowStack) : 1;
    const rageMul = this.rageT > 0 ? 1.25 : 1;
    this.speed = this.baseSpeed * (this.freezeT > 0 ? 0 : slowMul) * rageMul;

    /* 极寒领域：被冻结/减速的敌人向外散发寒气 */
    if (this.game.player && this.game.player.mods &&
        this.game.player.mods.frostField > 0 && (this.freezeT > 0 || this.slowT > 0)) {
      for (const o of this.game.room.enemies) {
        if (o === this || o.dead) continue;
        if (dist2(this.x, this.y, o.x, o.y) < 110 * 110) o.applyStatus('slow', 1);
      }
    }
  }

  get spawnScale() {
    return this.spawnT >= this.spawnDur ? 1 : easeOutBack(clamp(this.spawnT / this.spawnDur, 0, 1));
  }

  applyTier(tier) {
    const hpMul = 1 + 0.14 * tier;
    const dmgMul = 1 + Math.min(0.05 * tier, 0.6);
    const spdMul = 1 + Math.min(0.022 * tier, 0.35);
    this.maxHp = Math.round(this.maxHp * hpMul);
    this.hp = this.maxHp;
    this.touchDamage = Math.round(this.touchDamage * dmgMul);
    this.speed *= spdMul;
    this.baseSpeed = this.speed;
    this.tier = tier;

    /* 子类声明的自定义伤害字段（子弹伤害 / 砸地伤害等）同步成长 */
    if (this.dmgFields) {
      for (const k of this.dmgFields) {
        if (typeof this[k] === 'number') this[k] = Math.round(this[k] * dmgMul);
      }
    }
  }

  /* 伤害输出（受狂暴增益影响） */
  dmgOut(base) { return Math.round(base * (this.rageT > 0 ? 1.2 : 1)); }

  /* 统一的敌方弹幕生成入口：所有敌人子弹都从这里出，便于统一做安全限制 */
  fireBullet(angle, opt) {
    opt = opt || {};
    return this.game.spawnProjectile({
      x: this.x + Math.cos(angle) * (this.r + (opt.offset || 6)),
      y: this.y + Math.sin(angle) * (this.r + (opt.offset || 6)),
      angle: angle,
      speed: opt.speed || 300,
      damage: opt.damage === undefined ? 8 : opt.damage,
      r: opt.r || 6,
      friendly: false,
      color: opt.color || this.colors[1],
      core: opt.core || '#ffffff',
      life: opt.life || 3.0,
      spin: opt.spin || 0,
      homing: opt.homing || 0,
      game: this.game
    });
  }

  /* 精英词缀（数据驱动，只改数值与标记，不动子类 AI） */
  applyAffixes(keys) {
    if (!keys || !keys.length) return;
    this.affix = keys.slice();
    for (const k of keys) {
      if (k === 'warded') { this.maxHp = Math.round(this.maxHp * 1.6); this.hp = this.maxHp; }
      else if (k === 'armored') { this.dr = 0.30; this.r = Math.round(this.r * 1.18); }
      else if (k === 'frenzy') {
        this.speed *= 1.4; this.baseSpeed = this.speed;
        this.touchDamage = Math.round(this.touchDamage * 1.2);
      }
      /* volatile / splitting / rich 只做标记，结算在 Game.onEnemyKilled */
    }
  }

  update(dt) {
    this.animT += dt;
    this.spawnT += dt;
    if (!this.spawned && this.spawnT >= this.spawnDur) {
      this.spawned = true;
      this.game.particles.ring(this.x, this.y, this.colors[1], 10, 110);
    }

    if (this.hitFlash > 0) this.hitFlash = Math.max(0, this.hitFlash - dt * 4);
    if (this.touchTimer > 0) this.touchTimer -= dt;

    /* 出场动画期间不行动 */
    if (!this.spawned) {
      this.vx = 0; this.vy = 0;
      return;
    }

    this._updateStatus(dt);
    if (this.dead) return;

    /* 冻结：完全停止行动（移动与攻击都被冻住） */
    if (this.freezeT > 0) {
      this.vx = 0; this.vy = 0;
      const kd = Math.max(0, 1 - 9 * dt);
      this.kx *= kd; this.ky *= kd;
      this.x += this.kx * dt;
      this.y += this.ky * dt;
      this.game.room.clampEntity(this, false);
      return;
    }

    this.onUpdate(dt);

    /* 击退衰减 */
    const kd = Math.max(0, 1 - 9 * dt);
    this.kx *= kd; this.ky *= kd;

    this.x += (this.vx + this.kx) * dt;
    this.y += (this.vy + this.ky) * dt;

    /* 永远被关在房间内（不会从门跑出去） */
    this.game.room.clampEntity(this, false);
  }

  /* 接触伤害：子类在需要时调用 */
  tryTouchDamage(amount, extraRange) {
    if (this.touchTimer > 0 || amount <= 0) return false;
    const p = this.game.player;
    if (!p || p.dead) return false;
    const reach = this.r + p.r + (extraRange || 2);
    if (dist2(this.x, this.y, p.x, p.y) <= reach * reach) {
      const hurt = p.takeDamage(this.dmgOut(amount), this.x, this.y);
      this.touchTimer = this.touchInterval;
      /* 烬刺外皮：近身接触时反弹伤害 */
      const th = (p.mods && p.mods.thorns) || 0;
      if (th > 0) {
        this.takeDamage(th * 10, p.x, p.y);
        this.game.particles.burst(this.x, this.y, 6, {
          speed: 160, life: 0.3, size: 3, color: '#c8ff6a'
        });
      }
      return hurt;
    }
    return false;
  }

  takeDamage(amount, srcX, srcY) {
    if (this.dead) return;
    if (this.dr > 0) amount = amount * (1 - this.dr);   // 甲壳词缀：减伤
    if (amount < 1) amount = 1;

    /* 护盾：先扣盾，扣完才算伤害（仍然有受击反馈） */
    if (this.shield > 0) {
      const absorb = Math.min(this.shield, amount);
      this.shield -= absorb;
      amount -= absorb;
      this.hitFlash = 1;
      this.game.particles.hitSpark(
        lerp(srcX, this.x, 0.75), lerp(srcY, this.y, 0.75),
        angleTo(srcX, srcY, this.x, this.y) + Math.PI, '#8fd8ff'
      );
      if (amount < 1) {
        this.game.damageNumbers.add(this.x, this.y - this.r - 6, '盾', {
          color: '#8fd8ff', life: 0.55
        });
        return;
      }
    }

    this.hp -= amount;
    this.hitFlash = 1;

    const ang = angleTo(srcX, srcY, this.x, this.y);
    const kb = 150 / this.mass;
    this.kx += Math.cos(ang) * kb;
    this.ky += Math.sin(ang) * kb;

    this.game.particles.hitSpark(
      lerp(srcX, this.x, 0.75), lerp(srcY, this.y, 0.75),
      ang + Math.PI, this.colors[1]
    );

    if (this.hp <= 0) {
      this.hp = 0;
      this.die();
    }
  }

  die() {
    if (this.dead) return;
    this.dead = true;
    this.game.particles.deathBurst(this.x, this.y, this.colors, this.r / 16);
    this.game.particles.burst(this.x, this.y, 10, {
      speed: 120, life: 0.6, size: 5, color: '#ffffff',
      colors: ['#ffffff', this.colors[1], this.colors[0]], drag: 2.2
    });
    this.game.onEnemyKilled(this);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    /* 影子 */
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(2, 7, this.r * 1.02, this.r * 0.55, 0, 0, TAU);
    ctx.fill();

    /* 出场动画：从地面升起 + 召唤环 */
    const st = clamp(this.spawnT / this.spawnDur, 0, 1);
    if (st < 1) {
      ctx.globalAlpha = 1 - st;
      ctx.strokeStyle = this.colors[1];
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, this.r * (0.6 + st * 2.6), 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    const s = this.spawnScale;
    ctx.scale(s, s);
    ctx.globalAlpha = st < 1 ? 0.35 + 0.65 * st : 1;

    this.onDraw(ctx);

    /* 精英词缀光环 */
    if (this.affix && this.affix.length) {
      const col = ELITE_AFFIX[this.affix[0]] ? ELITE_AFFIX[this.affix[0]].color : '#ff8a5c';
      ctx.save();
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.55 + 0.2 * Math.sin(this.animT * 3);
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.lineDashOffset = -this.animT * 14;
      ctx.beginPath();
      ctx.arc(0, 0, this.r + 7, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    /* 护盾环（盾持者提供） */
    if (this.shield > 0) {
      ctx.save();
      ctx.globalAlpha = 0.42 + 0.2 * Math.sin(this.animT * 5);
      ctx.strokeStyle = '#8fd8ff';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(0, 0, this.r + 4.5, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = '#8fd8ff';
      ctx.fill();
      ctx.restore();
    }

    /* 受击白闪 */
    if (this.hitFlash > 0) {
      ctx.globalAlpha = this.hitFlash * 0.7;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, this.r * 1.05, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    /* 血条（受伤后才显示） */
    if (this.hp < this.maxHp && !this.dead) {
      const w = this.r * 2.1, h = 4;
      const bx = this.x - w * 0.5, by = this.y - this.r - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
      ctx.fillStyle = '#3a1f26';
      ctx.fillRect(bx, by, w, h);
      ctx.fillStyle = this.colors[2] || '#ff6b6b';
      ctx.fillRect(bx, by, w * clamp(this.hp / this.maxHp, 0, 1), h);
    }
  }

  /* --- 子类实现 --- */
  onUpdate(dt) {}
  onDraw(ctx) {}

  /* 朝目标平滑转向 */
  steerTo(tx, ty, speed, dt, turnRate) {
    const want = angleTo(this.x, this.y, tx, ty);
    this.face = turnRate ? angleLerp(this.face, want, Math.min(1, turnRate * dt)) : want;
    this.vx = Math.cos(this.face) * speed;
    this.vy = Math.sin(this.face) * speed;
  }
}

/* ===========================================================
   1. 灰噬体 · Chaser
   不断追踪玩家；靠近后短暂缩身蓄力，然后高速扑击
   =========================================================== */
class Chaser extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '灰噬体',
      r: 16,
      hp: 34,
      speed: 116,
      touchDamage: 7,
      touchInterval: 0.75,
      mass: 1,
      rng: rng,
      colors: ['#53655a', '#c8ff6a', '#9ad14f']
    });
    this.lungeDamage = 12;
    this.state = 'chase';
    this.stateT = 0;
    this.lungeCd = this.rng.range(0.4, 1.4);
    this.lungeDir = 0;
    this.wob = this.rng.range(0, TAU);
  }

  applyTier(tier) {
    super.applyTier(tier);
    this.lungeDamage = Math.round(this.lungeDamage * (1 + Math.min(0.05 * tier, 0.6)));
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    this.wob += dt * 5.5;

    if (this.state === 'chase') {
      this.lungeCd -= dt;
      /* 蛇形追踪 */
      const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.wob) * 0.28;
      this.face = angleLerp(this.face, a, Math.min(1, 8 * dt));
      this.vx = Math.cos(this.face) * this.speed;
      this.vy = Math.sin(this.face) * this.speed;
      this.tryTouchDamage(this.touchDamage);

      if (d < 130 && this.lungeCd <= 0) {
        this.state = 'windup';
        this.stateT = 0.28;
        this.vx = 0; this.vy = 0;
      }
    } else if (this.state === 'windup') {
      this.stateT -= dt;
      this.vx *= 0.82; this.vy *= 0.82;
      this.face = angleLerp(this.face, angleTo(this.x, this.y, p.x, p.y), Math.min(1, 10 * dt));
      if (this.stateT <= 0) {
        this.lungeDir = angleTo(this.x, this.y, p.x, p.y);
        this.state = 'lunge';
        this.stateT = 0.26;
        this.lungeCd = this.rng.range(1.5, 2.4);
        this.game.particles.burst(this.x, this.y, 6, {
          speed: 90, life: 0.3, size: 3, color: '#c8ff6a', dir: this.lungeDir + Math.PI, spread: 1.5
        });
      }
    } else if (this.state === 'lunge') {
      this.stateT -= dt;
      const sp = this.speed * 3.1;
      this.vx = Math.cos(this.lungeDir) * sp;
      this.vy = Math.sin(this.lungeDir) * sp;
      if (Math.random() < dt * 30) this.game.particles.trail(this.x, this.y, 'rgba(200,255,106,0.28)', 5);
      this.tryTouchDamage(this.lungeDamage, 6);
      if (this.stateT <= 0) {
        this.state = 'chase';
        this.stateT = 0;
      }
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    const lunging = this.state === 'lunge';
    const winding = this.state === 'windup';

    /* 腿（抖动的尖刺） */
    ctx.strokeStyle = '#33423a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const a = t * (lunging ? 3.2 : 1.1) + (i / 5) * TAU;
      const len = this.r + 7 + Math.sin(t * 9 + i * 1.7) * 3.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.r * 0.4, Math.sin(a) * this.r * 0.4);
      ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      ctx.stroke();
    }

    ctx.save();
    ctx.rotate(this.face);

    /* 身体 */
    const squash = winding ? 0.86 : 1;
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 1.04 * (2 - squash), this.r * 0.92 * squash, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#7d8f80';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 背甲弧线 */
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(-this.r * 0.2, 0, this.r * 0.72, -1.1, 1.1);
    ctx.stroke();

    /* 噬口（朝向前方，蓄力/扑击时张开） */
    const open = lunging ? 1 : (winding ? 0.55 : 0.28 + 0.08 * Math.sin(t * 4));
    ctx.fillStyle = '#20160f';
    ctx.beginPath();
    ctx.moveTo(this.r * 0.34, 0);
    ctx.arc(this.r * 0.34, 0, this.r * 0.78, -open * 1.0, open * 1.0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = lunging ? '#ffe066' : '#ff9d3c';
    ctx.beginPath();
    ctx.moveTo(this.r * 0.5, 0);
    ctx.arc(this.r * 0.5, 0, this.r * 0.44, -open * 0.72, open * 0.72);
    ctx.closePath();
    ctx.fill();

    /* 两颗眼点 */
    ctx.fillStyle = '#e9ffb0';
    ctx.beginPath(); ctx.arc(this.r * 0.1, -this.r * 0.5, 2.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.1, this.r * 0.5, 2.4, 0, TAU); ctx.fill();

    ctx.restore();
  }
}

/* ===========================================================
   2. 棱目 · Shooter
   维持中距离，横向游走，蓄能后射出三连棱晶
   =========================================================== */
class Shooter extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '棱目',
      r: 18,
      hp: 28,
      speed: 92,
      touchDamage: 5,
      touchInterval: 1.0,
      mass: 0.85,
      rng: rng,
      colors: ['#3a4a66', '#7fe4ff', '#5aa9ff']
    });
    this.keepMin = 190;
    this.keepMax = 330;
    this.strafeDir = this.rng.chance(0.5) ? 1 : -1;
    this.strafeT = this.rng.range(0.8, 1.8);
    this.cd = this.rng.range(0.7, 1.5);
    this.aimT = 0;               // 蓄能进度 0..1
    this.aiming = false;
    this.bulletDamage = 8;
    this.bob = this.rng.range(0, TAU);
  }

  applyTier(tier) {
    super.applyTier(tier);
    this.bulletDamage = Math.round(this.bulletDamage * (1 + Math.min(0.05 * tier, 0.6)));
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = angleTo(this.x, this.y, p.x, p.y);
    this.face = angleLerp(this.face, toP, Math.min(1, 6 * dt));
    this.bob += dt * 2.4;

    /* 距离控制 */
    let mx = 0, my = 0;
    if (d < this.keepMin) {
      mx = -Math.cos(toP); my = -Math.sin(toP);      // 后退
    } else if (d > this.keepMax) {
      mx = Math.cos(toP); my = Math.sin(toP);         // 靠近
    } else {
      this.strafeT -= dt;
      if (this.strafeT <= 0) { this.strafeDir *= -1; this.strafeT = this.rng.range(1.0, 2.2); }
      mx = Math.cos(toP + Math.PI / 2) * this.strafeDir;
      my = Math.sin(toP + Math.PI / 2) * this.strafeDir;
    }
    const len = Math.hypot(mx, my) || 1;
    const sp = this.speed * (this.aiming ? 0.35 : 1);
    this.vx = (mx / len) * sp;
    this.vy = (my / len) * sp;

    /* 开火循环 */
    if (!this.aiming) {
      this.cd -= dt;
      if (this.cd <= 0 && d < 520) {
        this.aiming = true;
        this.aimT = 0;
      }
    } else {
      this.aimT += dt / 0.55;
      if (this.aimT >= 1) {
        this.fire();
        this.aiming = false;
        this.cd = this.rng.range(1.6, 2.4);
      }
    }

    this.tryTouchDamage(this.touchDamage);
  }

  fire() {
    const p = this.game.player;
    const base = angleTo(this.x, this.y, p.x, p.y);
    const n = 3;
    const spread = 0.17;
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * spread;
      this.game.spawnProjectile({
        x: this.x + Math.cos(a) * (this.r + 6),
        y: this.y + Math.sin(a) * (this.r + 6),
        angle: a,
        speed: 315,
        damage: this.bulletDamage,
        r: 6,
        friendly: false,
        color: '#7fe4ff',
        core: '#ffffff',
        life: 3.0,
        spin: 9
      });
    }
    this.game.particles.burst(this.x + Math.cos(base) * this.r, this.y + Math.sin(base) * this.r, 6, {
      speed: 120, life: 0.3, size: 3, color: '#aef0ff', dir: base, spread: 1.2
    });
  }

  onDraw(ctx) {
    const t = this.animT;
    const float = Math.sin(this.bob) * 3;

    /* 悬浮光环 */
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = this.colors[1];
    ctx.beginPath();
    ctx.ellipse(0, 9, this.r * 0.8, this.r * 0.3, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.translate(0, float);

    /* 环绕碎片 */
    for (let i = 0; i < 3; i++) {
      const a = t * 1.6 + (i / 3) * TAU;
      const rr = this.r + 11;
      const sx = Math.cos(a) * rr, sy = Math.sin(a) * rr * 0.55;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(a);
      ctx.fillStyle = this.colors[0];
      polygonPath(ctx, [[0, -5], [4, 4], [-4, 4]]);
      ctx.fill();
      ctx.strokeStyle = this.colors[1];
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }

    /* 棱形本体 */
    ctx.rotate(Math.sin(t * 0.9) * 0.12);
    ctx.fillStyle = this.colors[0];
    polygonPath(ctx, [
      [0, -this.r * 1.15],
      [this.r * 0.95, 0],
      [0, this.r * 1.15],
      [-this.r * 0.95, 0]
    ]);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 单眼 */
    const eyeR = this.r * 0.52;
    const px = Math.cos(this.face) * 3.2, py = Math.sin(this.face) * 3.2;
    ctx.fillStyle = '#eaf6ff';
    ctx.beginPath(); ctx.arc(0, 0, eyeR, 0, TAU); ctx.fill();
    ctx.fillStyle = this.aiming ? '#ff7a4d' : '#2b3a55';
    ctx.beginPath(); ctx.arc(px, py, eyeR * 0.52, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0a0f18';
    ctx.beginPath(); ctx.arc(px * 1.25, py * 1.25, eyeR * 0.24, 0, TAU); ctx.fill();

    /* 蓄能提示 */
    if (this.aiming) {
      ctx.save();
      ctx.rotate(this.face);
      const g = this.aimT;
      ctx.globalAlpha = 0.22 + 0.5 * g;
      ctx.strokeStyle = '#ff8a5c';
      ctx.lineWidth = 1 + 2 * g;
      ctx.beginPath();
      ctx.moveTo(this.r, 0);
      ctx.lineTo(this.r + 40 + g * 130, 0);
      ctx.stroke();
      ctx.restore();

      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 30);
      ctx.strokeStyle = '#ffb08a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.r * (1.2 + 0.35 * (1 - g)), 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

/* ===========================================================
   3. 锥锋 · Charger
   缓慢逼近 → 原地蓄力（带预警线）→ 高速直线冲锋 → 硬直
   =========================================================== */
class Charger extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '锥锋',
      r: 19,
      hp: 54,
      speed: 104,
      touchDamage: 15,
      touchInterval: 0.9,
      mass: 1.5,
      rng: rng,
      colors: ['#6b2f3a', '#ff6b5c', '#ff3b57']
    });
    this.state = 'stalk';
    this.stateT = this.rng.range(0.5, 1.2);
    this.dashDir = 0;
    this.dashSpeed = 760;
    this.lastX = x;
    this.lastY = y;
    this.dashElapsed = 0;
    this.hitWall = false;
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);

    if (this.state === 'stalk') {
      this.stateT -= dt;
      /* 缓慢逼近，稍微绕圈 */
      const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.animT * 1.3) * 0.4;
      this.face = angleLerp(this.face, a, Math.min(1, 5 * dt));
      const sp = this.speed * (d > 260 ? 1 : 0.55);
      this.vx = Math.cos(this.face) * sp;
      this.vy = Math.sin(this.face) * sp;
      this.tryTouchDamage(Math.round(this.touchDamage * 0.45));

      if (this.stateT <= 0 && d < 520) {
        this.state = 'windup';
        this.stateT = 0.7;
      }
    } else if (this.state === 'windup') {
      this.stateT -= dt;
      this.vx *= 0.7; this.vy *= 0.7;
      this.face = angleLerp(this.face, angleTo(this.x, this.y, p.x, p.y), Math.min(1, 7 * dt));
      if (Math.random() < dt * 26) {
        this.game.particles.spawn(
          this.x + rand(-14, 14), this.y + rand(-14, 14),
          rand(-30, 30), rand(-30, 30), rand(0.2, 0.4), rand(2, 4),
          'rgba(255,90,80,0.5)', { drag: 3 }
        );
      }
      if (this.stateT <= 0) {
        this.dashDir = angleTo(this.x, this.y, p.x, p.y);
        this.state = 'dash';
        this.stateT = 0.42;
        this.dashElapsed = 0;
        this.lastX = this.x; this.lastY = this.y;
        this.game.particles.burst(this.x, this.y, 10, {
          speed: 200, life: 0.35, size: 4, color: '#ff6b5c',
          dir: this.dashDir + Math.PI, spread: 1.1
        });
      }
    } else if (this.state === 'dash') {
      this.stateT -= dt;
      this.dashElapsed += dt;
      this.face = this.dashDir;
      this.vx = Math.cos(this.dashDir) * this.dashSpeed;
      this.vy = Math.sin(this.dashDir) * this.dashSpeed;

      /* 撞墙检测：本帧实际位移远小于预期即为撞墙 */
      const moved = dist(this.lastX, this.lastY, this.x, this.y);
      const expect = this.dashSpeed * dt;
      this.lastX = this.x; this.lastY = this.y;

      if (Math.random() < dt * 45) {
        this.game.particles.trail(this.x, this.y, 'rgba(255,80,70,0.35)', 9);
      }
      this.tryTouchDamage(this.touchDamage, 4);

      if (this.dashElapsed > 0.08 && moved < expect * 0.5) {
        this.state = 'stagger';
        this.stateT = 0.85;
        this.vx = 0; this.vy = 0;
        this.game.particles.burst(this.x, this.y, 12, {
          speed: 220, life: 0.5, size: 4, color: '#ffd0b0',
          colors: ['#ffd0b0', '#ff8a6a', '#ffffff']
        });
        this.game.addShake(3);
        this.game.damageNumbers.add(this.x, this.y - this.r - 8, '撞击', {
          color: '#ffc0a0', life: 0.7
        });
      }

      if (this.stateT <= 0 && this.state === 'dash') {
        this.state = 'recover';
        this.stateT = 0.6;
      }
    } else if (this.state === 'recover' || this.state === 'stagger') {
      this.stateT -= dt;
      this.vx *= 0.86; this.vy *= 0.86;
      if (this.stateT <= 0) {
        this.state = 'stalk';
        this.stateT = this.rng.range(0.9, 1.7);
      }
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    const winding = this.state === 'windup';
    const dashing = this.state === 'dash';
    const staggering = this.state === 'stagger';

    /* 蓄力预警线 */
    if (winding) {
      const g = 1 - this.stateT / 0.7;
      ctx.save();
      ctx.rotate(this.face);
      ctx.globalAlpha = 0.2 + 0.45 * g;
      ctx.strokeStyle = '#ff5a4d';
      ctx.lineWidth = 2 + 3 * g;
      ctx.setLineDash([14, 10]);
      ctx.lineDashOffset = -t * 60;
      ctx.beginPath();
      ctx.moveTo(this.r, 0);
      ctx.lineTo(this.r + 520 * (0.35 + 0.65 * g), 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    /* 抖动 */
    if (winding) {
      ctx.translate(rand(-2.4, 2.4), rand(-2.4, 2.4));
    }

    ctx.rotate(this.face);

    /* 尾焰 / 拖影 */
    if (dashing) {
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = this.colors[1];
      polygonPath(ctx, [
        [-this.r * 1.1, -this.r * 0.5],
        [-this.r * 2.6, 0],
        [-this.r * 1.1, this.r * 0.5]
      ]);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* 楔形本体 */
    const stretch = dashing ? 1.35 : (winding ? 0.9 : 1);
    ctx.fillStyle = this.colors[0];
    polygonPath(ctx, [
      [this.r * 1.45 * stretch, 0],
      [-this.r * 0.85, -this.r * 0.95],
      [-this.r * 0.5, 0],
      [-this.r * 0.85, this.r * 0.95]
    ]);
    ctx.fill();
    ctx.strokeStyle = staggering ? '#ffd0b0' : this.colors[1];
    ctx.lineWidth = 2.2;
    ctx.stroke();

    /* 甲片 */
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-this.r * 0.2, -this.r * 0.62);
    ctx.lineTo(this.r * 0.5, 0);
    ctx.lineTo(-this.r * 0.2, this.r * 0.62);
    ctx.stroke();

    /* 尖端（蓄力 / 冲锋时炽亮） */
    const tipGlow = dashing ? 1 : (winding ? 0.5 + 0.5 * Math.sin(t * 26) : 0.35);
    ctx.globalAlpha = tipGlow;
    ctx.fillStyle = dashing ? '#fff2c8' : '#ff8a5c';
    polygonPath(ctx, [
      [this.r * 1.45 * stretch, 0],
      [this.r * 0.55, -this.r * 0.34],
      [this.r * 0.55, this.r * 0.34]
    ]);
    ctx.fill();
    ctx.globalAlpha = 1;

    /* 侧部能量点 */
    ctx.fillStyle = dashing ? '#ffe9a0' : '#ff5a4d';
    ctx.beginPath(); ctx.arc(-this.r * 0.1, -this.r * 0.55, 2.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-this.r * 0.1, this.r * 0.55, 2.6, 0, TAU); ctx.fill();
  }
}

/* ===========================================================
   4. 回廊守望者 · Warden（Boss）
   三形态：环形弹幕 / 旋转螺旋弹 / 蓄力冲撞，血量阈值召唤残形
   =========================================================== */
class Warden extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '回廊守望者',
      r: 34,
      hp: 460,
      speed: 88,
      touchDamage: 16,
      touchInterval: 0.8,
      mass: 6,
      rng: rng,
      colors: ['#4a2b52', '#ff6bd0', '#ff4d6b']
    });
    this.isBoss = true;
    this.phase = 1;
    this.state = 'hover';
    this.stateT = this.rng.range(0.6, 1.2);
    this.cd = 1.4;
    this.spiralAngle = this.rng.range(0, TAU);
    this.spiralShots = 0;
    this.ringLeft = 0;
    this.dashDir = 0;
    this.spin = 0;
    this.summoned = 0;
  }

  _bullet(angle, speed, r, damage) {
    return {
      x: this.x + Math.cos(angle) * (this.r + 8),
      y: this.y + Math.sin(angle) * (this.r + 8),
      angle: angle,
      speed: speed,
      damage: damage,
      r: r || 7,
      friendly: false,
      color: '#ff6bd0',
      core: '#ffe0f5',
      life: 4.0,
      spin: 6
    };
  }

  _ring(count, speed, offset) {
    for (let i = 0; i < count; i++) {
      const a = offset + (i / count) * TAU;
      this.game.spawnProjectile(this._bullet(a, speed, 7, 9));
    }
    this.game.particles.ring(this.x, this.y, '#ff6bd0', count, 220);
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    this.spin += dt * 0.9;

    /* 形态切换 */
    const ratio = this.hp / this.maxHp;
    const wantPhase = ratio > 0.66 ? 1 : (ratio > 0.33 ? 2 : 3);
    if (wantPhase !== this.phase) {
      this.phase = wantPhase;
      this.state = 'hover';
      this.stateT = 0.7;
      this.game.addShake(6);
      this.game.particles.ring(this.x, this.y, '#ff4d6b', 30, 280);
      this.game.ui.showBanner('守望者 · 形态 ' + wantPhase, '回廊开始崩解', 1.4);
      /* 召唤残形 */
      const n = wantPhase === 2 ? 2 : 3;
      for (let i = 0; i < n; i++) {
        const room = this.game.room;
        if (room && this.summoned < 8) {
          const e = room._spawnEnemy(wantPhase === 3 && i === 0 ? 'charger' : 'chaser');
          if (e) { e.spawnT = e.spawnDur * 0.6; this.summoned++; }
        }
      }
    }

    const speedMul = 1 + (this.phase - 1) * 0.35;

    if (this.state === 'hover') {
      /* 缓慢逼近并保持中距 */
      const a = angleTo(this.x, this.y, p.x, p.y);
      const sp = this.speed * speedMul * (d > 300 ? 1 : (d < 200 ? -0.5 : 0.25));
      this.face = angleLerp(this.face, a, Math.min(1, 3 * dt));
      this.vx = Math.cos(a) * Math.max(0, sp) + Math.cos(a + Math.PI / 2) * 40 * Math.sin(this.animT * 1.2);
      this.vy = Math.sin(a) * Math.max(0, sp) + Math.sin(a + Math.PI / 2) * 40 * Math.sin(this.animT * 1.2);
      this.tryTouchDamage(this.touchDamage);

      this.stateT -= dt;
      if (this.stateT <= 0) {
        const roll = this.rng.next();
        if (roll < 0.36) { this.state = 'ring'; this.stateT = 0.55; this.ringLeft = this.phase >= 2 ? 3 : 2; }
        else if (roll < 0.68) { this.state = 'spiral'; this.stateT = 1.5; this.spiralShots = 0; }
        else { this.state = 'windup'; this.stateT = 0.6; }
      }
    } else if (this.state === 'ring') {
      this.stateT -= dt;
      this.vx *= 0.85; this.vy *= 0.85;
      if (this.stateT <= 0) {
        this._ring(this.phase >= 3 ? 18 : 14, 250, this.rng.range(0, TAU));
        this.ringLeft--;
        if (this.ringLeft > 0) this.stateT = 0.28;
        else { this.state = 'hover'; this.stateT = 0.9; }
      }
    } else if (this.state === 'spiral') {
      this.stateT -= dt;
      this.vx *= 0.9; this.vy *= 0.9;
      this.spiralAngle += dt * 3.4 * speedMul;
      this.spiralShots -= dt;
      if (this.spiralShots <= 0) {
        this.spiralShots = 0.075;
        for (let i = 0; i < (this.phase >= 2 ? 3 : 2); i++) {
          const a = this.spiralAngle + (i / (this.phase >= 2 ? 3 : 2)) * TAU;
          this.game.spawnProjectile(this._bullet(a, 300, 6, 8));
        }
      }
      if (this.stateT <= 0) { this.state = 'hover'; this.stateT = 1.0; }
    } else if (this.state === 'windup') {
      this.stateT -= dt;
      this.vx *= 0.8; this.vy *= 0.8;
      this.face = angleLerp(this.face, angleTo(this.x, this.y, p.x, p.y), Math.min(1, 6 * dt));
      if (Math.random() < dt * 30) {
        this.game.particles.spawn(this.x + rand(-24, 24), this.y + rand(-24, 24),
          rand(-40, 40), rand(-40, 40), rand(0.2, 0.45), rand(3, 6),
          'rgba(255,90,170,0.55)', { drag: 3 });
      }
      if (this.stateT <= 0) {
        this.dashDir = angleTo(this.x, this.y, p.x, p.y);
        this.state = 'dash';
        this.stateT = 0.5;
        this.game.addShake(2);
      }
    } else if (this.state === 'dash') {
      this.stateT -= dt;
      this.face = this.dashDir;
      const sp = 620 * speedMul;
      this.vx = Math.cos(this.dashDir) * sp;
      this.vy = Math.sin(this.dashDir) * sp;
      if (Math.random() < dt * 50) {
        this.game.particles.trail(this.x, this.y, 'rgba(255,90,170,0.35)', 12);
      }
      this.tryTouchDamage(Math.round(this.touchDamage * 1.4), 6);
      if (this.stateT <= 0) { this.state = 'hover'; this.stateT = 1.1; }
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    const winding = this.state === 'windup';
    const dashing = this.state === 'dash';

    /* 蓄力预警 */
    if (winding) {
      const g = 1 - this.stateT / 0.6;
      ctx.save();
      ctx.rotate(this.face);
      ctx.globalAlpha = 0.25 + 0.45 * g;
      ctx.strokeStyle = '#ff4d6b';
      ctx.lineWidth = 3 + 3 * g;
      ctx.setLineDash([16, 12]);
      ctx.lineDashOffset = -t * 70;
      ctx.beginPath();
      ctx.moveTo(this.r, 0);
      ctx.lineTo(this.r + 600 * (0.4 + 0.6 * g), 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    /* 外环旋转护板 */
    ctx.save();
    ctx.rotate(this.spin);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      ctx.save();
      ctx.rotate(a);
      ctx.fillStyle = i % 2 ? '#5c3566' : '#3b2244';
      polygonPath(ctx, [
        [this.r + 16, -9],
        [this.r + 30, 0],
        [this.r + 16, 9],
        [this.r + 4, 0]
      ]);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,107,208,0.5)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    /* 主体 */
    ctx.save();
    if (winding) ctx.translate(rand(-2, 2), rand(-2, 2));
    const pulse = 1 + Math.sin(t * 2.4) * 0.04;
    ctx.scale(pulse, pulse);

    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, this.r * 1.5);
    g.addColorStop(0, '#ffd0ee');
    g.addColorStop(0.35, '#ff6bd0');
    g.addColorStop(1, 'rgba(74,43,82,0.15)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.05, 0, TAU);
    ctx.fill();

    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.78, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#ff6bd0';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    /* 三只眼（形态越多睁得越多） */
    for (let i = 0; i < 3; i++) {
      const open = i < this.phase;
      const a = -Math.PI / 2 + (i - 1) * 0.7;
      const ex = Math.cos(a) * this.r * 0.4;
      const ey = Math.sin(a) * this.r * 0.4;
      ctx.fillStyle = open ? '#fff0fb' : '#2b1b30';
      ctx.beginPath();
      ctx.ellipse(ex, ey, 7, open ? 6 : 2, a, 0, TAU);
      ctx.fill();
      if (open) {
        ctx.fillStyle = '#ff2d6b';
        const pa = angleTo(ex, ey, this.game.player.x - this.x, this.game.player.y - this.y);
        ctx.beginPath();
        ctx.arc(ex + Math.cos(pa) * 2.2, ey + Math.sin(pa) * 2.2, 3, 0, TAU);
        ctx.fill();
      }
    }

    /* 核心裂纹（血量越低越亮） */
    const hurt = 1 - this.hp / this.maxHp;
    ctx.globalAlpha = 0.3 + hurt * 0.6;
    ctx.strokeStyle = dashing ? '#ffffff' : '#ff4d6b';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const a = t * 0.6 + (i / 4) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 8, Math.sin(a) * 8);
      ctx.lineTo(Math.cos(a) * this.r * 0.7, Math.sin(a) * this.r * 0.7);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/* ===========================================================
   敌人工厂（注册表驱动）
   —— 新增敌人 = 在 enemy_roster.js 里 EnemyFactory.register(...)
   —— 这里只登记最初的三只 + Boss，其余在 roster 中追加
   =========================================================== */
const EnemyFactory = {
  registry: {},

  register(id, cls, def) {
    this.registry[id] = { cls: cls, def: def || {} };
  },

  defOf(type) {
    const r = this.registry[type];
    return r ? r.def : {};
  },

  /* 出生点半径（房间生成时用） */
  radiusOf(type) {
    const d = this.defOf(type);
    return d.r || (type === 'boss' ? 34 : 16);
  },

  create(game, type, x, y, tier, rng) {
    const reg = this.registry[type];
    let e = null;
    if (reg) {
      e = new reg.cls(game, x, y, rng);
    } else {
      /* 未注册类型的兜底（不应该发生） */
      e = new Chaser(game, x, y, rng);
    }
    e.type = type;
    const d = this.defOf(type);
    if (d.coin) e.coinBonus = d.coin;
    e.applyTier(tier || 0);
    return e;
  }
};

/* 注意：这三只最初的敌人也要登记 cat / cost / minDepth，
   否则新的编队系统会把它们排除在生成池之外 */
EnemyFactory.register('chaser', Chaser, {
  r: 16, cat: 'melee', role: 'chase', cost: 2, minDepth: 0, tags: ['mobile'], coin: 0
});
EnemyFactory.register('shooter', Shooter, {
  r: 18, cat: 'ranged', role: 'burst', cost: 3, minDepth: 0, tags: [], coin: 1
});
EnemyFactory.register('charger', Charger, {
  r: 19, cat: 'melee', role: 'charge', cost: 4, minDepth: 0, tags: ['mobile'], coin: 3
});
EnemyFactory.register('boss', Warden, { r: 34, coin: 0, hidden: true, cat: 'boss' });

</script>
<script>
/* ===========================================================
   enemy_roster.js — 扩充敌人图鉴（数据驱动注册）
   -----------------------------------------------------------
   本文件只做「追加」：不改动 enemy.js 中已有的灰噬体 / 棱目 / 锥锋 / 守望者。
   每只敌人都具备：
     · 独立 AI（各自的状态机）
     · 独立 HP / 移速 / 攻击方式 / 攻击冷却
     · 受伤反馈（基类统一：白闪 + 击退 + 火花 + 血条）
     · 死亡效果（基类统一：碎裂爆散，部分敌人有额外的死亡效果）
   新增一只敌人 = 写一个 class + 一条 EnemyFactory.register(...)
   =========================================================== */
'use strict';

/* -----------------------------------------------------------
   通用小工具（本文件内部使用）
   ----------------------------------------------------------- */

/* 把点夹到场地内，留 margin 边距 */
function arenaClamp(x, y, margin) {
  const m = margin || 24;
  return {
    x: clamp(x, ARENA.x + m, ARENA.x + ARENA.w - m),
    y: clamp(y, ARENA.y + m, ARENA.y + ARENA.h - m)
  };
}

/* 预警扇形（世界坐标已由调用方平移） */
function drawTelegraphArc(ctx, radius, halfAngle, progress, color) {
  ctx.save();
  ctx.globalAlpha = 0.14 + 0.30 * progress;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, radius, -halfAngle, halfAngle);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 0.45 + 0.45 * progress;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

/* 预警圆环（渐满） */
function drawTelegraphRing(ctx, radius, progress, color) {
  ctx.save();
  ctx.globalAlpha = 0.16 + 0.20 * progress;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 0.5 + 0.4 * progress;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2 + 2 * progress;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.stroke();
  /* 内圈随进度收缩，读秒感 */
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.arc(0, 0, radius * (1 - progress), 0, TAU);
  ctx.stroke();
  ctx.restore();
}

/* ===========================================================
   近战 · 跳跃：跃尘 Hopper
   蓄力屈身 → 高高跃起砸向玩家落点（落点有预警圈）→ 砸地范围伤害
   =========================================================== */
class Hopper extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '跃尘',
      r: 15,
      hp: 32,
      speed: 122,
      touchDamage: 8,
      touchInterval: 0.9,
      mass: 1,
      rng: rng,
      colors: ['#4d5c38', '#d8ff7a', '#a6d94f']
    });
    this.slamDamage = 14;
    this.slamRadius = 76;
    this.dmgFields = ['slamDamage'];
    this.state = 'hop';
    this.stateT = rng.range(0.25, 0.9);
    this.tx = x; this.ty = y;
    this.sx = x; this.sy = y;
    this.leapT = 0;
    this.leapDur = 0.4;
    this.squash = 0;
  }

  onUpdate(dt) {
    const p = this.game.player;

    if (this.state === 'hop') {
      this.stateT -= dt;
      const a = angleTo(this.x, this.y, p.x, p.y);
      this.face = angleLerp(this.face, a, Math.min(1, 6 * dt));
      const sp = this.speed * (this.stateT > 0 ? 1 : 0.25);
      this.vx = Math.cos(this.face) * sp;
      this.vy = Math.sin(this.face) * sp;
      this.tryTouchDamage(this.touchDamage);
      this.squash = 0;

      if (this.stateT <= 0) {
        const t = arenaClamp(p.x, p.y, this.slamRadius * 0.6);
        this.tx = t.x; this.ty = t.y;
        this.sx = this.x; this.sy = this.y;
        this.leapT = 0;
        this.leapDur = clamp(dist(this.x, this.y, this.tx, this.ty) / 640, 0.26, 0.62);
        this.state = 'leap';
      }
    } else if (this.state === 'leap') {
      this.leapT += dt;
      const t = clamp(this.leapT / this.leapDur, 0, 1);
      const rem = Math.max(0.0001, this.leapDur - this.leapT);
      this.vx = (this.tx - this.x) / rem;
      this.vy = (this.ty - this.y) / rem;
      this.face = Math.atan2(this.vy, this.vx);
      if (Math.random() < dt * 34) {
        this.game.particles.trail(this.x, this.y, 'rgba(216,255,122,0.30)', 6);
      }
      if (t >= 1) {
        this._slam();
        this.state = 'land';
        this.stateT = 0.42;
        this.vx = 0; this.vy = 0;
        this.squash = 1;
      }
    } else {
      this.stateT -= dt;
      this.vx *= 0.8; this.vy *= 0.8;
      this.squash = Math.max(0, this.squash - dt * 3);
      if (this.stateT <= 0) { this.state = 'hop'; this.stateT = this.rng.range(0.45, 1.15); }
    }
  }

  _slam() {
    const p = this.game.player;
    this.game.particles.ring(this.x, this.y, '#d8ff7a', 16, 250);
    this.game.particles.burst(this.x, this.y, 14, {
      speed: 220, life: 0.45, size: 4, colors: ['#d8ff7a', '#ffffff', this.colors[0]]
    });
    this.game.addShake(2.2);
    const reach = this.slamRadius + p.r;
    if (dist2(this.x, this.y, p.x, p.y) <= reach * reach) {
      p.takeDamage(this.dmgOut(this.slamDamage), this.x, this.y);
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    const crouch = this.state === 'hop' && this.stateT < 0.35 ? 0.78 : 1;
    const air = this.state === 'leap';
    const sq = this.squash;

    /* 起跳落点预警 */
    if (air) {
      ctx.save();
      drawTelegraphRing(ctx, this.slamRadius, clamp(this.leapT / this.leapDur, 0, 1), '#ff8a5c');
      ctx.restore();
    }

    /* 影子留在地面 */
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 6, this.r * (air ? 0.7 : 1), this.r * 0.5, 0, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.rotate(this.face);

    /* 后腿（屈身时压缩） */
    ctx.strokeStyle = '#33401f';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      const bend = air ? 1.25 : (crouch < 1 ? 0.55 : 0.95);
      ctx.beginPath();
      ctx.moveTo(-this.r * 0.3, s * this.r * 0.5);
      ctx.lineTo(-this.r * 0.95 * bend, s * this.r * 1.05 * bend);
      ctx.stroke();
    }

    /* 身体：椭圆 + 背纹 */
    ctx.scale(1 / Math.max(0.4, crouch) * (1 - sq * 0.18), crouch * (1 + sq * 0.2));
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 1.02, this.r * 0.88, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(0,0,0,0.32)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-this.r * 0.15, 0, this.r * 0.6, -1.0, 1.0);
    ctx.stroke();

    /* 头 / 眼 */
    ctx.fillStyle = '#e9ffb0';
    ctx.beginPath(); ctx.arc(this.r * 0.45, -this.r * 0.34, 3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.45, this.r * 0.34, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1b2410';
    ctx.beginPath(); ctx.arc(this.r * 0.55, -this.r * 0.34, 1.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.55, this.r * 0.34, 1.5, 0, TAU); ctx.fill();

    /* 蓄力时的尘光 */
    if (crouch < 1) {
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 26);
      ctx.strokeStyle = '#d8ff7a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.r * 1.35, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

/* ===========================================================
   近战 · 连击：啮喙 Gnasher
   疾冲贴身 → 三连撕咬（每咬一次小突进）→ 短暂喘息
   =========================================================== */
class Gnasher extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '啮喙',
      r: 15,
      hp: 42,
      speed: 138,
      touchDamage: 6,
      touchInterval: 0.55,
      mass: 1,
      rng: rng,
      colors: ['#5c3a32', '#ffb08a', '#ff7a4d']
    });
    this.biteDamage = 7;
    this.dmgFields = ['biteDamage'];
    this.state = 'chase';
    this.cd = rng.range(0.3, 1.0);
    this.biteLeft = 0;
    this.biteT = 0;
    this.jaw = 0;
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);

    if (this.state === 'chase') {
      this.cd -= dt;
      const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.animT * 6.5) * 0.34;
      this.face = angleLerp(this.face, a, Math.min(1, 9 * dt));
      this.vx = Math.cos(this.face) * this.speed;
      this.vy = Math.sin(this.face) * this.speed;
      this.tryTouchDamage(this.touchDamage);
      this.jaw = Math.max(0, this.jaw - dt * 4);
      if (d < 78 && this.cd <= 0) {
        this.state = 'combo';
        this.biteLeft = 3;
        this.biteT = 0;
      }
    } else if (this.state === 'combo') {
      this.biteT -= dt;
      const a = angleTo(this.x, this.y, p.x, p.y);
      this.face = angleLerp(this.face, a, Math.min(1, 12 * dt));
      if (this.biteT <= 0) {
        this.biteT = 0.16;
        this.biteLeft--;
        this.jaw = 1;
        const lunge = this.speed * 2.4;
        this.vx = Math.cos(this.face) * lunge;
        this.vy = Math.sin(this.face) * lunge;
        this.game.particles.burst(this.x + Math.cos(this.face) * this.r,
          this.y + Math.sin(this.face) * this.r, 4, {
            speed: 130, life: 0.22, size: 3, color: '#ffb08a', dir: this.face, spread: 1.3
          });
        if (dist(this.x, this.y, p.x, p.y) < this.r + p.r + 22) {
          p.takeDamage(this.dmgOut(this.biteDamage), this.x, this.y);
        }
        if (this.biteLeft <= 0) {
          this.state = 'rest';
          this.stateT = 0.55;
          this.cd = this.rng.range(1.4, 2.2);
        }
      } else {
        this.vx *= 0.72; this.vy *= 0.72;
      }
      this.jaw = Math.max(0, this.jaw - dt * 3);
    } else {
      this.stateT -= dt;
      this.vx *= 0.82; this.vy *= 0.82;
      if (this.stateT <= 0) this.state = 'chase';
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    ctx.save();
    ctx.rotate(this.face);

    /* 拖在身后的碎屑 */
    ctx.strokeStyle = '#3a241d';
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const a = Math.PI + (i - 1) * 0.5 + Math.sin(t * 8 + i) * 0.18;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.r * 0.5, Math.sin(a) * this.r * 0.5);
      ctx.lineTo(Math.cos(a) * (this.r + 9), Math.sin(a) * (this.r + 9));
      ctx.stroke();
    }

    /* 身体 */
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(-this.r * 0.1, 0, this.r * 0.95, this.r * 0.8, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[2];
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 上下颚（张开时露出利齿） */
    const open = 0.2 + this.jaw * 0.72 + Math.sin(t * 5) * 0.06;
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.rotate(s * open * 0.55);
      ctx.fillStyle = '#7a4436';
      ctx.beginPath();
      ctx.moveTo(this.r * 0.1, 0);
      ctx.lineTo(this.r * 1.25, s * this.r * 0.12);
      ctx.lineTo(this.r * 0.95, s * this.r * 0.42);
      ctx.closePath();
      ctx.fill();
      /* 利齿 */
      ctx.fillStyle = '#ffe6cf';
      for (let i = 0; i < 3; i++) {
        const px = this.r * (0.45 + i * 0.28);
        ctx.beginPath();
        ctx.moveTo(px, s * this.r * 0.12);
        ctx.lineTo(px + 3, s * this.r * 0.02);
        ctx.lineTo(px + 6, s * this.r * 0.12);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    /* 眼（连击时发红） */
    ctx.fillStyle = this.state === 'combo' ? '#ff3b30' : '#ffd0b0';
    ctx.beginPath(); ctx.arc(this.r * 0.05, -this.r * 0.42, 2.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.05, this.r * 0.42, 2.6, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ===========================================================
   近战 · 分裂：裂蜕 Slougher
   迟缓追击；死亡时蜕裂成两只幼虫（幼虫不再分裂）
   =========================================================== */
class Slougher extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '裂蜕',
      r: 20,
      hp: 52,
      speed: 78,
      touchDamage: 9,
      touchInterval: 0.9,
      mass: 1.6,
      rng: rng,
      colors: ['#2f5a52', '#7fffd8', '#39c9a8']
    });
    this.canSplit = true;
    this.wob = rng.range(0, TAU);
    this.seam = 0;
  }

  onUpdate(dt) {
    const p = this.game.player;
    this.wob += dt * 2.2;
    const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.wob) * 0.22;
    this.face = angleLerp(this.face, a, Math.min(1, 4 * dt));
    this.vx = Math.cos(this.face) * this.speed;
    this.vy = Math.sin(this.face) * this.speed;
    this.tryTouchDamage(this.touchDamage);
    /* 血量越低，蜕裂缝越明显 */
    this.seam = 1 - this.hp / this.maxHp;
  }

  /* 死亡效果：蜕裂出两只幼虫 */
  die() {
    if (this.dead) return;
    super.die();
    if (this.canSplit && this.game.room) {
      this.game.particles.ring(this.x, this.y, '#7fffd8', 18, 200);
      for (let i = 0; i < 2; i++) {
        this.game.room.pending.push({ type: 'sloughling', delay: 0.12 * i });
      }
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    ctx.save();
    ctx.rotate(this.face);
    /* 伪足 */
    ctx.strokeStyle = '#1d3b36';
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + Math.sin(t * 3 + i) * 0.2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.r * 0.4, Math.sin(a) * this.r * 0.4);
      ctx.lineTo(Math.cos(a) * (this.r + 8 + Math.sin(t * 6 + i * 2) * 3),
                 Math.sin(a) * (this.r + 8 + Math.sin(t * 6 + i * 2) * 3));
      ctx.stroke();
    }
    /* 胶质体 */
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 1.05, this.r * 0.95, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 蜕裂缝（血量越低越亮） */
    ctx.strokeStyle = '#7fffd8';
    ctx.globalAlpha = 0.35 + 0.6 * this.seam;
    ctx.lineWidth = 1.5 + 2 * this.seam;
    ctx.beginPath();
    ctx.moveTo(-this.r, 0);
    ctx.quadraticCurveTo(0, Math.sin(t * 2) * 6, this.r, 0);
    ctx.stroke();
    ctx.globalAlpha = 1;
    /* 内核（表示即将分裂的东西） */
    ctx.fillStyle = this.colors[2];
    ctx.beginPath(); ctx.arc(-this.r * 0.2, 0, 5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.3, -this.r * 0.2, 3.4, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* 幼虫：裂蜕分裂出来的小型追击者（不参与随机生成） */
class Sloughling extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '蜕幼虫',
      r: 11,
      hp: 15,
      speed: 176,
      touchDamage: 5,
      touchInterval: 0.7,
      mass: 0.6,
      rng: rng,
      colors: ['#2f5a52', '#7fffd8', '#39c9a8']
    });
    this.wob = rng.range(0, TAU);
  }
  onUpdate(dt) {
    const p = this.game.player;
    this.wob += dt * 7;
    const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.wob) * 0.3;
    this.face = angleLerp(this.face, a, Math.min(1, 10 * dt));
    this.vx = Math.cos(this.face) * this.speed;
    this.vy = Math.sin(this.face) * this.speed;
    this.tryTouchDamage(this.touchDamage);
  }
  onDraw(ctx) {
    ctx.save();
    ctx.rotate(this.face);
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 1.1, this.r * 0.85, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.fillStyle = this.colors[1];
    ctx.beginPath(); ctx.arc(this.r * 0.2, 0, 3, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ===========================================================
   近战 · 重击：崩岩 Brute
   缓慢逼近 → 抬臂蓄力（扇形预警）→ 砸地（前方扇形范围伤害 + 强击退）
   =========================================================== */
class Brute extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '崩岩',
      r: 24,
      hp: 96,
      speed: 72,
      touchDamage: 10,
      touchInterval: 1.0,
      mass: 3,
      rng: rng,
      colors: ['#3d3a4a', '#b9a7ff', '#7a5cff']
    });
    this.slamDamage = 20;
    this.slamRange = 108;
    this.slamHalf = 0.85;
    this.dmgFields = ['slamDamage'];
    this.state = 'walk';
    this.stateT = rng.range(0.4, 1.0);
    this.cd = 1.6;
    this.armT = 0;
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);

    if (this.state === 'walk') {
      this.cd -= dt;
      const a = angleTo(this.x, this.y, p.x, p.y);
      this.face = angleLerp(this.face, a, Math.min(1, 3 * dt));
      this.vx = Math.cos(this.face) * this.speed;
      this.vy = Math.sin(this.face) * this.speed;
      this.tryTouchDamage(this.touchDamage);
      this.armT = 0;
      if (this.cd <= 0 && d < this.slamRange + 60) {
        this.state = 'wind';
        this.stateT = 0.75;
      }
    } else if (this.state === 'wind') {
      this.stateT -= dt;
      this.vx *= 0.7; this.vy *= 0.7;
      this.face = angleLerp(this.face, angleTo(this.x, this.y, p.x, p.y), Math.min(1, 4 * dt));
      this.armT = 1 - this.stateT / 0.75;
      if (this.stateT <= 0) {
        this.state = 'slam';
        this.stateT = 0.22;
        this._slam();
      }
    } else if (this.state === 'slam') {
      this.stateT -= dt;
      this.vx *= 0.5; this.vy *= 0.5;
      this.armT = 1;
      if (this.stateT <= 0) { this.state = 'walk'; this.cd = this.rng.range(1.8, 2.6); }
    }
  }

  _slam() {
    const p = this.game.player;
    this.game.particles.ring(this.x, this.y, '#b9a7ff', 14, 300);
    this.game.particles.burst(
      this.x + Math.cos(this.face) * this.r, this.y + Math.sin(this.face) * this.r, 16,
      { speed: 240, life: 0.5, size: 5, colors: ['#b9a7ff', '#ffffff', this.colors[0]] }
    );
    this.game.addShake(3);
    const dd = dist(this.x, this.y, p.x, p.y);
    if (dd <= this.slamRange + p.r) {
      const pa = angleTo(this.x, this.y, p.x, p.y);
      if (Math.abs(angleDelta(this.face, pa)) <= this.slamHalf) {
        p.takeDamage(this.dmgOut(this.slamDamage), this.x, this.y);
      }
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    const g = this.armT;

    /* 扇形预警 */
    if (this.state === 'wind') {
      ctx.save();
      ctx.rotate(this.face);
      drawTelegraphArc(ctx, this.slamRange, this.slamHalf, g, '#b9a7ff');
      ctx.restore();
    }

    ctx.save();
    ctx.rotate(this.face);

    /* 双腿 */
    ctx.fillStyle = '#2a2733';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(-this.r * 0.35, s * this.r * 0.62, this.r * 0.34, this.r * 0.26, 0, 0, TAU);
      ctx.fill();
    }

    /* 躯干（岩石块） */
    ctx.fillStyle = this.colors[0];
    polygonPath(ctx, [
      [-this.r * 0.9, -this.r * 0.85],
      [this.r * 0.7, -this.r * 0.7],
      [this.r * 0.95, 0],
      [this.r * 0.7, this.r * 0.7],
      [-this.r * 0.9, this.r * 0.85]
    ]);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2.2;
    ctx.stroke();

    /* 裂纹 */
    ctx.strokeStyle = 'rgba(185,167,255,0.5)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-this.r * 0.5, -this.r * 0.3);
    ctx.lineTo(0, 0);
    ctx.lineTo(this.r * 0.35, this.r * 0.3);
    ctx.stroke();

    /* 举起的重臂（蓄力时抬高） */
    ctx.save();
    ctx.translate(this.r * 0.35, 0);
    ctx.rotate(-g * 1.1 + (this.state === 'slam' ? 1.4 : 0));
    ctx.fillStyle = '#4b4660';
    roundRectPath(ctx, -6, -this.r * 0.3, this.r * 1.25, this.r * 0.6, 6);
    ctx.fill();
    ctx.fillStyle = this.colors[2];
    ctx.beginPath();
    ctx.arc(this.r * 1.15, 0, this.r * 0.36, 0, TAU);
    ctx.fill();
    ctx.restore();

    /* 眼 */
    ctx.fillStyle = this.state === 'wind' ? '#ffd0ff' : '#8f7fd8';
    ctx.beginPath(); ctx.arc(this.r * 0.3, -this.r * 0.34, 3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(this.r * 0.3, this.r * 0.34, 3, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ===========================================================
   近战 · 群体：蚀群 Swarmer
   极小的快速残形，成群出现，血量极低，走位飘忽
   =========================================================== */
class Swarmer extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '蚀群',
      r: 9,
      hp: 12,
      speed: 192,
      touchDamage: 4,
      touchInterval: 0.5,
      mass: 0.4,
      rng: rng,
      colors: ['#4a2a55', '#d68bff', '#9a4dd6']
    });
    this.wob = rng.range(0, TAU);
    this.wobSpeed = rng.range(6, 10);
  }

  onUpdate(dt) {
    const p = this.game.player;
    this.wob += dt * this.wobSpeed;
    const a = angleTo(this.x, this.y, p.x, p.y) + Math.sin(this.wob) * 0.55;
    this.face = angleLerp(this.face, a, Math.min(1, 12 * dt));
    this.vx = Math.cos(this.face) * this.speed;
    this.vy = Math.sin(this.face) * this.speed;
    this.tryTouchDamage(this.touchDamage);
  }

  onDraw(ctx) {
    const t = this.animT;
    ctx.save();
    ctx.rotate(this.face);
    /* 三条细腿 */
    ctx.strokeStyle = '#331d3d';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = Math.PI + (i - 1) * 0.7 + Math.sin(t * 14 + i) * 0.3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * (this.r + 6), Math.sin(a) * (this.r + 6));
      ctx.stroke();
    }
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 1.05, this.r * 0.85, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.fillStyle = this.colors[1];
    ctx.beginPath(); ctx.arc(this.r * 0.35, 0, 2.4, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ===========================================================
   近战 · 反伤：刺壳 Spiker
   缓慢沉重的甲壳，受伤时向四周喷出尖刺
   =========================================================== */
class Spiker extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '刺壳',
      r: 19,
      hp: 70,
      speed: 66,
      touchDamage: 9,
      touchInterval: 0.9,
      mass: 2,
      rng: rng,
      colors: ['#2c3a48', '#9ec9e8', '#5a86ad']
    });
    this.dr = 0.22;                 // 天生硬壳
    this.spikeDamage = 7;
    this.dmgFields = ['spikeDamage'];
    this.spikeCd = 0;
    this.bristle = 0;
    this.roll = rng.range(0, TAU);
  }

  onUpdate(dt) {
    const p = this.game.player;
    if (this.spikeCd > 0) this.spikeCd -= dt;
    this.bristle = Math.max(0, this.bristle - dt * 2);
    this.roll += dt * 0.8;
    const a = angleTo(this.x, this.y, p.x, p.y);
    this.face = angleLerp(this.face, a, Math.min(1, 3.5 * dt));
    this.vx = Math.cos(this.face) * this.speed;
    this.vy = Math.sin(this.face) * this.speed;
    this.tryTouchDamage(this.touchDamage);
  }

  takeDamage(amount, srcX, srcY) {
    const before = this.hp;
    super.takeDamage(amount, srcX, srcY);
    if (this.dead || this.hp === before) return;
    /* 受伤反馈：炸开一圈尖刺（有冷却，不会刷屏） */
    if (this.spikeCd <= 0) {
      this.spikeCd = 1.1;
      this.bristle = 1;
      const n = 5;
      const base = this.rng.range(0, TAU);
      for (let i = 0; i < n; i++) {
        this.fireBullet(base + (i / n) * TAU, {
          speed: 300, damage: this.dmgOut(this.spikeDamage), r: 4.5,
          color: '#9ec9e8', core: '#ffffff', life: 1.1, spin: 12
        });
      }
      this.game.particles.ring(this.x, this.y, '#9ec9e8', 10, 190);
    }
  }

  onDraw(ctx) {
    const t = this.animT;
    ctx.save();
    ctx.rotate(this.roll);
    /* 甲壳刺（受击后竖起） */
    const len = this.r + 6 + this.bristle * 9;
    ctx.strokeStyle = '#8fb6cf';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.r * 0.75, Math.sin(a) * this.r * 0.75);
      ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      ctx.stroke();
    }
    /* 壳体 */
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.92, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2.4;
    ctx.stroke();
    /* 内层甲片 */
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(0, 0, this.r * (0.3 + i * 0.22), 0, TAU);
      ctx.stroke();
    }
    ctx.fillStyle = this.bristle > 0 ? '#ffd0a0' : '#5a86ad';
    ctx.beginPath(); ctx.arc(0, 0, this.r * 0.24, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ===========================================================
   远程 · 单发：准瞳 Marksman
   远距离保持，长时间激光瞄准线（可躲），然后射出一发高速弹
   =========================================================== */
class Marksman extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '准瞳',
      r: 17,
      hp: 30,
      speed: 104,
      touchDamage: 5,
      touchInterval: 1.0,
      mass: 0.9,
      rng: rng,
      colors: ['#3b3350', '#ffe066', '#ffb347']
    });
    this.bulletDamage = 15;
    this.dmgFields = ['bulletDamage'];
    this.keepMin = 330;
    this.keepMax = 560;
    this.state = 'idle';
    this.stateT = rng.range(0.5, 1.4);
    this.cd = rng.range(0.8, 1.6);
    this.aimA = 0;
    this.aimT = 0;
    this.aimDur = 1.05;
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = angleTo(this.x, this.y, p.x, p.y);
    this.face = angleLerp(this.face, toP, Math.min(1, 5 * dt));

    /* 距离控制：太近后撤，太远靠近 */
    let mx = 0, my = 0;
    if (d < this.keepMin) { mx = -Math.cos(toP); my = -Math.sin(toP); }
    else if (d > this.keepMax) { mx = Math.cos(toP); my = Math.sin(toP); }
    else {
      mx = Math.cos(toP + Math.PI / 2) * Math.sin(this.animT * 0.9);
      my = Math.sin(toP + Math.PI / 2) * Math.sin(this.animT * 0.9);
    }
    const len = Math.hypot(mx, my) || 1;
    const sp = this.speed * (this.state === 'aim' ? 0.25 : 1);
    this.vx = (mx / len) * sp;
    this.vy = (my / len) * sp;

    if (this.state === 'idle') {
      this.cd -= dt;
      if (this.cd <= 0 && d < 640) {
        this.state = 'aim';
        this.aimT = 0;
        this.aimA = toP;
      }
    } else if (this.state === 'aim') {
      this.aimT += dt;
      /* 瞄准线缓慢跟枪：玩家跑动即可甩掉 */
      this.aimA = angleLerp(this.aimA, toP, Math.min(1, 2.2 * dt));
      if (this.aimT >= this.aimDur) {
        this.fireBullet(this.aimA, {
          speed: 620, damage: this.dmgOut(this.bulletDamage), r: 5,
          color: '#ffe066', core: '#ffffff', life: 1.6, spin: 16
        });
        this.game.particles.burst(
          this.x + Math.cos(this.aimA) * this.r, this.y + Math.sin(this.aimA) * this.r, 6,
          { speed: 150, life: 0.28, size: 3, color: '#ffe066', dir: this.aimA, spread: 1.0 }
        );
        this.state = 'idle';
        this.cd = this.rng.range(1.9, 2.8);
      }
    }
    this.tryTouchDamage(this.touchDamage);
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 瞄准线（细 → 粗，最后一刻收束） */
    if (this.state === 'aim') {
      const g = clamp(this.aimT / this.aimDur, 0, 1);
      ctx.save();
      ctx.rotate(this.aimA);
      ctx.globalAlpha = 0.20 + 0.55 * g;
      ctx.strokeStyle = g > 0.85 ? '#ffffff' : '#ff8a5c';
      ctx.lineWidth = 0.8 + 2.4 * g;
      ctx.setLineDash([18, 12]);
      ctx.lineDashOffset = -t * 90;
      ctx.beginPath();
      ctx.moveTo(this.r, 0);
      ctx.lineTo(this.r + 700, 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    ctx.save();
    /* 三脚支架 */
    ctx.strokeStyle = '#2a2438';
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * TAU + t * 0.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.r * 0.4, Math.sin(a) * this.r * 0.4);
      ctx.lineTo(Math.cos(a) * (this.r + 10), Math.sin(a) * (this.r + 10));
      ctx.stroke();
    }
    ctx.rotate(this.face);
    /* 机体 */
    ctx.fillStyle = this.colors[0];
    polygonPath(ctx, [
      [this.r * 0.9, 0],
      [-this.r * 0.5, -this.r * 0.85],
      [-this.r * 0.85, 0],
      [-this.r * 0.5, this.r * 0.85]
    ]);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 单眼镜头 */
    ctx.fillStyle = '#1a1626';
    ctx.beginPath(); ctx.arc(this.r * 0.18, 0, this.r * 0.52, 0, TAU); ctx.fill();
    ctx.fillStyle = this.state === 'aim' ? '#ff5a4d' : '#ffe066';
    ctx.beginPath(); ctx.arc(this.r * 0.18, 0, this.r * 0.34, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = this.state === 'aim' ? 0.9 : 0.35;
    ctx.beginPath(); ctx.arc(this.r * 0.26, 0, this.r * 0.14, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/* ===========================================================
   远程 · 环形弹幕：环律 Ringer
   悬停蓄能，然后放出一圈弹幕 —— 但永远留出一道缺口（必定可躲）
   =========================================================== */
class Ringer extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '环律',
      r: 19,
      hp: 44,
      speed: 74,
      touchDamage: 6,
      touchInterval: 1.0,
      mass: 1.2,
      rng: rng,
      colors: ['#46305c', '#ff9de0', '#c86bff']
    });
    this.bulletDamage = 8;
    this.dmgFields = ['bulletDamage'];
    this.state = 'hover';
    this.stateT = rng.range(0.4, 1.2);
    this.charge = 0;
    this.chargeDur = 0.95;
    this.cd = rng.range(1.0, 1.8);
    this.orbit = rng.range(0, TAU);
    this.gapStart = 0;
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = angleTo(this.x, this.y, p.x, p.y);
    this.orbit += dt * 1.6;

    /* 维持中距（280~430） */
    let mx = 0, my = 0;
    if (d < 280) { mx = -Math.cos(toP); my = -Math.sin(toP); }
    else if (d > 430) { mx = Math.cos(toP); my = Math.sin(toP); }
    else {
      mx = Math.cos(toP + Math.PI / 2) * Math.sin(this.animT * 0.7);
      my = Math.sin(toP + Math.PI / 2) * Math.sin(this.animT * 0.7);
    }
    const len = Math.hypot(mx, my) || 1;
    const sp = this.speed * (this.state === 'charge' ? 0.3 : 1);
    this.vx = (mx / len) * sp;
    this.vy = (my / len) * sp;
    this.face = angleLerp(this.face, toP, Math.min(1, 4 * dt));

    if (this.state === 'hover') {
      this.cd -= dt;
      if (this.cd <= 0 && d < 560) {
        this.state = 'charge';
        this.charge = 0;
        /* 缺口位置随机：玩家必须找缺口，而不是站原地 */
        this.gapStart = this.rng.int(0, 11);
      }
    } else if (this.state === 'charge') {
      this.charge += dt;
      if (this.charge >= this.chargeDur) {
        this._ring();
        this.state = 'hover';
        this.cd = this.rng.range(2.6, 3.6);
      }
    }
    this.tryTouchDamage(this.touchDamage);
  }

  /* 12 发环形弹幕，连续 3 发留空 → 永远有缺口 */
  _ring() {
    const N = 12, GAP = 3;
    const base = this.animT * 0.7;
    for (let i = 0; i < N; i++) {
      let hole = false;
      for (let k = 0; k < GAP; k++) if ((this.gapStart + k) % N === i) hole = true;
      if (hole) continue;
      const a = base + (i / N) * TAU;
      this.fireBullet(a, {
        speed: 205, damage: this.dmgOut(this.bulletDamage), r: 6.5,
        color: '#ff9de0', core: '#ffe0f5', life: 4.0, spin: 5
      });
    }
    this.game.particles.ring(this.x, this.y, '#ff9de0', 14, 240);
  }

  onDraw(ctx) {
    const t = this.animT;
    /* 环绕的律点 */
    for (let i = 0; i < 4; i++) {
      const a = this.orbit + (i / 4) * TAU;
      const rr = this.r + 12;
      ctx.fillStyle = this.colors[1];
      ctx.globalAlpha = 0.75;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr * 0.6, 3.4, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* 蓄能：先画出缺口环（让玩家提前看到逃生口） */
    if (this.state === 'charge') {
      const g = clamp(this.charge / this.chargeDur, 0, 1);
      const N = 12, GAP = 3;
      const base = this.animT * 0.7;
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.5 * g;
      ctx.strokeStyle = '#ff9de0';
      ctx.lineWidth = 2;
      for (let i = 0; i < N; i++) {
        let hole = false;
        for (let k = 0; k < GAP; k++) if ((this.gapStart + k) % N === i) hole = true;
        if (hole) continue;
        const a = base + (i / N) * TAU;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * this.r * 1.6, Math.sin(a) * this.r * 1.6, 3 * (0.5 + g), 0, TAU);
        ctx.stroke();
      }
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, this.r * (1.15 + 0.5 * (1 - g)), 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    /* 主体：悬浮的环 */
    ctx.save();
    ctx.rotate(this.orbit * 0.5);
    ctx.fillStyle = this.colors[0];
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.78, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.78, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = this.colors[2];
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.48, 0.4, 0.4 + Math.PI * 1.2);
    ctx.stroke();
    /* 中心核 */
    ctx.fillStyle = this.state === 'charge' ? '#ffffff' : '#ff9de0';
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.26 * (this.state === 'charge' ? 1 + 0.3 * Math.sin(t * 24) : 1), 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

/* ===========================================================
   远程 · 扇形弹幕：扇喙 Fanner
   正面扇形 5 发，蓄力时显示扇区（走位或绕背即可躲）
   =========================================================== */
class Fanner extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '扇喙',
      r: 18,
      hp: 36,
      speed: 96,
      touchDamage: 6,
      touchInterval: 0.9,
      mass: 1,
      rng: rng,
      colors: ['#5a3f22', '#ffc46b', '#ff7a3c']
    });
    this.bulletDamage = 7;
    this.dmgFields = ['bulletDamage'];
    this.half = 0.52;          // 扇形半角（总约 60°）
    this.shots = 5;
    this.state = 'idle';
    this.cd = rng.range(0.6, 1.4);
    this.aimT = 0;
    this.aimDur = 0.7;
    this.aimA = 0;
    this.keepMin = 200;
  }

  onUpdate(dt) {
    const p = this.game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = angleTo(this.x, this.y, p.x, p.y);

    let mx = 0, my = 0;
    if (d < this.keepMin) { mx = -Math.cos(toP); my = -Math.sin(toP); }
    else if (d > 420) { mx = Math.cos(toP); my = Math.sin(toP); }
    else {
      mx = Math.cos(toP + Math.PI / 2) * Math.sin(this.animT * 1.1);
      my = Math.sin(toP + Math.PI / 2) * Math.sin(this.animT * 1.1);
    }
    const len = Math.hypot(mx, my) || 1;
    const sp = this.speed * (this.state === 'aim' ? 0.35 : 1);
    this.vx = (mx / len) * sp;
    this.vy = (my / len) * sp;
    this.face = angleLerp(this.face, toP, Math.min(1, 5 * dt));

    if (this.state === 'idle') {
      this.cd -= dt;
      if (this.cd <= 0 && d < 520) { this.state = 'aim'; this.aimT = 0; this.aimA = toP; }
    } else {
      this.aimT += dt;
      this.aimA = angleLerp(this.aimA, toP, Math.min(1, 3.2 * dt));
      if (this.aimT >= this.aimDur) {
        const n = this.shots;
        for (let i = 0; i < n; i++) {
          const a = this.aimA + (i - (n - 1) / 2) * (this.half * 2 / (n - 1));
          this.fireBullet(a, {
            speed: 300, damage: this.dmgOut(this.bulletDamage), r: 5.5,
            color: '#ffc46b', core: '#fff3d0', life: 2.6, spin: 8
          });
        }
        this.game.particles.burst(
          this.x + Math.cos(this.aimA) * this.r, this.y + Math.sin(this.aimA) * this.r, 8,
          { speed: 180, life: 0.3, size: 3.4, color: '#ffc46b', dir: this.aimA, spread: this.half * 2 }
        );
        this.state = 'idle';
        this.cd = this.rng.range(1.8, 2.6);
      }
    }
    this.tryTouchDamage(this.touchDamage);
  }

  onDraw(ctx) {
    const t = this.animT;
    if (this.state === 'aim') {
      const g = clamp(this.aimT / this.aimDur, 0, 1);
      ctx.save();
      ctx.rotate(this.aimA);
      drawTelegraphArc(ctx, 260, this.half, g, '#ffc46b');
      ctx.restore();
    }
    ctx.save();
    ctx.rotate(this.face);
    /* 扇形尾鳍 */
    ctx.fillStyle = this.colors[0];
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(-this.r * 0.6, s * this.r * 0.3);
      ctx.quadraticCurveTo(-this.r * 0.2, s * this.r * 1.3, this.r * 0.5, s * this.r * 0.95);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = this.colors[1];
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
    /* 楔形喙 */
    ctx.fillStyle = this.colors[0];
    polygonPath(ctx, [
      [this.r * 1.3, 0],
      [-this.r * 0.7, -this.r * 0.8],
      [-this.r * 0.9, 0],
      [-this.r * 0.7, this.r * 0.8]
    ]);
    ctx.fill();
    ctx.strokeStyle = this.colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 喙口（蓄力时张开） */
    const open = this.state === 'aim' ? 0.6 : 0.25;
    ctx.fillStyle = '#2a1a0d';
    ctx.beginPath();
    ctx.moveTo(this.r * 0.7, 0);
    ctx.arc(this.r * 0.7, 0, this.r * 0.7, -open, open);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = this.state === 'aim' ? '#fff3d0' : '#ff7a3c';
    ctx.beginPath(); ctx.arc(this.r * 0.35, 0, this.r * 0.24, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ===========================================================
   远程 · 抛射：曲射囊 Lobber
   抛出一个慢速落点弹（落点提前显示预警圈），到点后爆开
   =========================================================== */
class Lobber extends Enemy {
  constructor(game, x, y, rng) {
    super(game, x, y, {
      name: '曲射囊',
      r: 18,
      hp: 40,
      speed: 88,
      touchDamage: 6,
      touchInterval: 1.0,
      mass: 1.2,
      rng: rng,
      colors: ['#2f4a3a', '#9ad14f', '#c8ff6a']
    });
    this.blastDamage = 16;
    this.blastRadius = 88;
    this.dmgFields = ['blastDamage'];
    this.cd = rng.range(0.8, 1.6);
