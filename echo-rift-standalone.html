<script>
/* ===========================================================
   map.js — 程序生成的房间地图（网格 / 节点结构）
   - Start 房固定
   - Boss 房位于地图末端
   - 所有房间由「从已有房间生长」产生 → 天然连通，无孤立房间
   - 相同 Seed + 相同层数 → 完全相同地图
   =========================================================== */
'use strict';

const ROOM_TYPE = {
  START: 'start',
  COMBAT: 'combat',
  TREASURE: 'treasure',
  ELITE: 'elite',
  SHOP: 'shop',
  EVENT: 'event',
  BOSS: 'boss'
};

const ROOM_META = {
  start:    { cn: '起点',   color: '#7dffb0', glyph: 'S' },
  combat:   { cn: '战斗',   color: '#8fa3b5', glyph: '·' },
  treasure: { cn: '宝库',   color: '#ffd35e', glyph: 'T' },
  elite:    { cn: '精英',   color: '#ff8a5c', glyph: 'E' },
  shop:     { cn: '商栈',   color: '#7fe4ff', glyph: '$' },
  event:    { cn: '异象',   color: '#c08bff', glyph: '?' },
  boss:     { cn: '守望者', color: '#ff4d6b', glyph: 'B' }
};

const DIRS = [
  { side: 'top', dc: 0, dr: -1 },
  { side: 'bottom', dc: 0, dr: 1 },
  { side: 'left', dc: -1, dr: 0 },
  { side: 'right', dc: 1, dr: 0 }
];

class GameMap {
  constructor(seed, floor) {
    this.seed = seed;
    this.floor = floor || 1;
    this.rng = new Rng(hashSeed(seed) ^ hashSeed('floor:' + this.floor));
    this.cols = 0;
    this.rows = 0;
    this.cells = [];
    this.grid = {};        // key "c,r" -> cell
    this.visited = {};
    this.current = null;
    this.start = null;
    this.boss = null;
    this.generate();
  }

  /* ---------------------------------------------------------
     生成
     --------------------------------------------------------- */
  generate() {
    const rng = this.rng;
    this.cols = clamp(5 + Math.floor(this.floor / 3), 5, 7);
    this.rows = 5;
    const cols = this.cols, rows = this.rows;

    /* 1. 起点固定在最左列（纵向居中附近） */
    const startR = rows >= 5 ? 2 + rng.int(-1, 1) : Math.floor(rows / 2);
    const start = this._add(0, clamp(startR, 0, rows - 1));
    this.start = start;
    start.type = ROOM_TYPE.START;

    /* 2. 主路径：从起点一路向右生长到最右列 → 末端即 Boss */
    let cur = start;
    let guard = 0;
    const mainPath = [start];
    while (cur.c < cols - 1 && guard++ < 200) {
      /* 先在当前列纵向游走 0~2 格，再向右推进一格。
         注意：纵向漂移必须在「尚未进入最右列」时完成，
         否则会在最右列留下比 Boss 更远的房间，破坏 Boss 的末端性。 */
      const vSteps = rng.int(0, 2);
      const vDir = rng.chance(0.5) ? -1 : 1;
      for (let i = 0; i < vSteps; i++) {
        const nr = cur.r + vDir;
        if (nr < 0 || nr >= rows) break;
        cur = this._add(cur.c, nr);
        mainPath.push(cur);
      }
      /* 向右推进（最后一次推进一定落在最右列，其后不再漂移 → 末端即 Boss） */
      cur = this._add(cur.c + 1, cur.r);
      mainPath.push(cur);
    }

    /* 3. Boss = 主路径末端（一定在最右列） */
    this.boss = cur;
    cur.type = ROOM_TYPE.BOSS;

    /* 4. 分支：从主路径上的房间长出 2~4 条短支线 */
    const branchCount = clamp(2 + rng.int(0, 2), 2, 4);
    const branchRoots = rng.shuffle(mainPath.slice(0, Math.max(1, mainPath.length - 1)));
    let made = 0;
    for (let i = 0; i < branchRoots.length && made < branchCount; i++) {
      const root = branchRoots[i];
      if (root === this.start || root === this.boss) continue;
      /* 支线不从末端附近长出，保证 Boss 房始终是地图尽头 */
      if (root.c >= this.boss.c - 1) continue;
      const len = rng.int(1, 2);
      let node = root;
      for (let s = 0; s < len; s++) {
        const dirs = rng.shuffle(DIRS);
        let placed = null;
        for (const d of dirs) {
          const nc = node.c + d.dc, nr = node.r + d.dr;
          if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) continue;
          if (this.grid[nc + ',' + nr]) continue;
          if (nc >= this.boss.c) continue;          // 不越过 Boss 所在列
          /* 支线房间只能挂在自己父节点上：避免支线互相粘连后比 Boss 更远 */
          let otherNeighbors = 0;
          for (const dd of DIRS) {
            const nb = this.grid[(nc + dd.dc) + ',' + (nr + dd.dr)];
            if (nb && nb !== node) otherNeighbors++;
          }
          if (otherNeighbors > 0) continue;
          placed = this._add(nc, nr);
          break;
        }
        if (!placed) break;
        node = placed;
      }
      made++;
    }

    /* 5. 分配房间类型 */
    this._assignTypes(mainPath);

    /* 6. 建立连接（四方向相邻即连通） */
    this._linkAll();

    /* 7. 保险：确保 Boss 一定是离 Start 最远的房间（末端） */
    this._ensureBossTerminal();
  }

  /* BFS 距离表（以 Start 为原点） */
  distancesFromStart() {
    const d = {};
    d[this.start.c + ',' + this.start.r] = 0;
    const q = [this.start];
    while (q.length) {
      const cur = q.shift();
      for (const dir of DIRS) {
        const n = cur.links[dir.side];
        if (!n) continue;
        const k = n.c + ',' + n.r;
        if (d[k] !== undefined) continue;
        d[k] = d[cur.c + ',' + cur.r] + 1;
        q.push(n);
      }
    }
    return d;
  }

  /* 若存在比 Boss 更远的房间，整批剪掉。
     安全性说明：BFS 最短路经过的中间房间距离严格递减，
     因此「距离 > Boss 距离」的房间被删除后，剩下的房间仍全部连通（无孤立）。 */
  _ensureBossTerminal() {
    for (let pass = 0; pass < 12; pass++) {
      const d = this.distancesFromStart();
      const bd = d[this.boss.c + ',' + this.boss.r];
      const doomed = this.cells.filter(c => {
        if (c === this.boss || c === this.start) return false;
        const dd = d[c.c + ',' + c.r];
        return dd === undefined || dd > bd;      // 不可达 或 比 Boss 更远
      });
      if (!doomed.length) break;
      for (const cell of doomed) {
        delete this.grid[cell.c + ',' + cell.r];
        const idx = this.cells.indexOf(cell);
        if (idx >= 0) this.cells.splice(idx, 1);
      }
      this._linkAll();
    }
  }

  _add(c, r) {
    const key = c + ',' + r;
    if (this.grid[key]) return this.grid[key];
    const cell = {
      id: this.cells.length,
      c: c, r: r,
      type: ROOM_TYPE.COMBAT,
      links: {},             // side -> cell
      branch: false
    };
    this.grid[key] = cell;
    this.cells.push(cell);
    return cell;
  }

  _assignTypes(mainPath) {
    const rng = this.rng;

    /* 主路径（含起点/Boss）上的中间房间：多为战斗，偶尔精英 / 异象 */
    for (const cell of mainPath) {
      if (cell === this.start || cell === this.boss) continue;
      const roll = rng.next();
      if (roll < 0.16) cell.type = ROOM_TYPE.ELITE;
      else if (roll < 0.30) cell.type = ROOM_TYPE.EVENT;
      else cell.type = ROOM_TYPE.COMBAT;
    }

    /* 支线房间：宝库 / 商栈 / 异象为主 */
    const branches = this.cells.filter(c => c !== this.start && c !== this.boss &&
      !mainPath.includes(c));
    const shuffled = rng.shuffle(branches);

    /* 保证：至少一间宝库；房间多时保证一间商栈 */
    const want = [];
    want.push(ROOM_TYPE.TREASURE);
    if (shuffled.length >= 3) want.push(ROOM_TYPE.SHOP);
    if (shuffled.length >= 5) want.push(ROOM_TYPE.TREASURE);
    if (this.floor >= 2 && shuffled.length >= 4) want.push(ROOM_TYPE.ELITE);

    for (let i = 0; i < shuffled.length; i++) {
      const cell = shuffled[i];
      if (i < want.length) {
        cell.type = want[i];
      } else {
        const roll = rng.next();
        if (roll < 0.34) cell.type = ROOM_TYPE.TREASURE;
        else if (roll < 0.56) cell.type = ROOM_TYPE.EVENT;
        else if (roll < 0.78) cell.type = ROOM_TYPE.ELITE;
        else cell.type = ROOM_TYPE.COMBAT;
      }
      cell.branch = true;
    }

    /* 兜底：如果没有宝库（支线太少），把某个非 Boss 战斗房改成宝库 */
    if (!this.cells.some(c => c.type === ROOM_TYPE.TREASURE)) {
      const cand = this.cells.filter(c => c !== this.start && c !== this.boss &&
        c.type === ROOM_TYPE.COMBAT);
      if (cand.length) cand[rng.int(0, cand.length - 1)].type = ROOM_TYPE.TREASURE;
    }
  }

  _linkAll() {
    for (const cell of this.cells) {
      cell.links = {};
      for (const d of DIRS) {
        const n = this.grid[(cell.c + d.dc) + ',' + (cell.r + d.dr)];
        if (n) cell.links[d.side] = n;
      }
    }
  }

  /* ---------------------------------------------------------
     查询
     --------------------------------------------------------- */
  connectionsOf(cell) {
    return {
      top: !!cell.links.top,
      bottom: !!cell.links.bottom,
      left: !!cell.links.left,
      right: !!cell.links.right
    };
  }

  neighbor(cell, side) { return cell.links[side] || null; }

  visit(cell) {
    this.visited[cell.c + ',' + cell.r] = true;
  }

  isVisited(cell) { return !!this.visited[cell.c + ',' + cell.r]; }

  typeCount(type) {
    let n = 0;
    for (const c of this.cells) if (c.type === type) n++;
    return n;
  }

  /* 从 Start 做 BFS，返回可达集合 —— 用于自检 */
  reachableFromStart() {
    const seen = {};
    const q = [this.start];
    seen[this.start.c + ',' + this.start.r] = true;
    while (q.length) {
      const cur = q.shift();
      for (const d of DIRS) {
        const n = cur.links[d.side];
        if (!n) continue;
        const k = n.c + ',' + n.r;
        if (seen[k]) continue;
        seen[k] = true;
        q.push(n);
      }
    }
    return seen;
  }

  /* 用于测试与「同种子一致性」比对 */
  serialize() {
    const cells = this.cells.slice().sort((a, b) => (a.c - b.c) || (a.r - b.r))
      .map(c => `${c.c},${c.r}:${c.type}:${Object.keys(c.links).sort().join('')}`);
    return `seed=${this.seed};floor=${this.floor};size=${this.cols}x${this.rows};` + cells.join('|');
  }
}

</script>
<script>
/* ===========================================================
   room.js — 战斗房（固定尺寸竞技场）
   扩展：房间类型（Start / Combat / Treasure / Elite / Shop / Event / Boss）
   - 只有与其它房间相连的方向才有门
   - 战斗类房间：进入关门 → 生成敌人 → 清空后开门
   - 非战斗房间：门常开，放置可交互物件
   =========================================================== */
'use strict';

class Room {
  constructor(game, opts) {
    opts = opts || {};
    this.game = game;
    this.def = opts.def || { id: 0, c: 0, r: 0, type: ROOM_TYPE.COMBAT };
    this.type = this.def.type || ROOM_TYPE.COMBAT;
    this.index = opts.index || 0;
    this.depth = opts.depth || 0;
    this.tier = opts.tier || 0;
    this.connections = opts.connections || { top: true, bottom: true, left: true, right: true };
    this.rng = opts.rng || new Rng(1);
    this.roomSeed = opts.roomSeed || '';

    this.enemies = [];
    this.props = [];
    this.pending = [];
    this.waves = [];
    this.waveIndex = 0;
    this.waveTimer = 0.9;

    this.isCombatRoom = (this.type === ROOM_TYPE.COMBAT ||
                         this.type === ROOM_TYPE.ELITE ||
                         this.type === ROOM_TYPE.BOSS);

    this.state = this.isCombatRoom ? 'fighting' : 'clear';
    this.doorsOpen = !this.isCombatRoom;
    this.clearTime = 0;
    this.spawnFx = 0;
    this.everCleared = false;
    this._spawnCounter = 0;

    this._buildWalls();
    this._buildFloor();
    this._planWaves();
    this._spawnProps();
    this._startWave();
  }

  get meta() { return ROOM_META[this.type] || ROOM_META.combat; }

  /* ---------------------------------------------------------
     墙体 / 门（只在有连接的方向开门洞）
     --------------------------------------------------------- */
  _buildWalls() {
    const W = VIEW_W, H = VIEW_H, T = WALL_T;
    const cx = W / 2, cy = H / 2, dw = DOOR_W / 2;

    /* 全封闭四面墙：敌人与投射物永远用这一套 */
    this.wallsClosed = [
      { x: 0, y: 0, w: W, h: T, inner: 'bottom' },
      { x: 0, y: H - T, w: W, h: T, inner: 'top' },
      { x: 0, y: T, w: T, h: H - T * 2, inner: 'right' },
      { x: W - T, y: T, w: T, h: H - T * 2, inner: 'left' }
    ];

    /* 门打开后使用的墙体：有连接的方向留出门洞，其余保持实心 */
    const open = [];
    const seg = (side) => {
      if (side === 'top') {
        if (this.connections.top) {
          open.push({ x: 0, y: 0, w: cx - dw, h: T, inner: 'bottom' });
          open.push({ x: cx + dw, y: 0, w: W - (cx + dw), h: T, inner: 'bottom' });
        } else open.push({ x: 0, y: 0, w: W, h: T, inner: 'bottom' });
      } else if (side === 'bottom') {
        if (this.connections.bottom) {
          open.push({ x: 0, y: H - T, w: cx - dw, h: T, inner: 'top' });
          open.push({ x: cx + dw, y: H - T, w: W - (cx + dw), h: T, inner: 'top' });
        } else open.push({ x: 0, y: H - T, w: W, h: T, inner: 'top' });
      } else if (side === 'left') {
        if (this.connections.left) {
          open.push({ x: 0, y: T, w: T, h: cy - dw - T, inner: 'right' });
          open.push({ x: 0, y: cy + dw, w: T, h: H - T - (cy + dw), inner: 'right' });
        } else open.push({ x: 0, y: T, w: T, h: H - T * 2, inner: 'right' });
      } else {
        if (this.connections.right) {
          open.push({ x: W - T, y: T, w: T, h: cy - dw - T, inner: 'left' });
          open.push({ x: W - T, y: cy + dw, w: T, h: H - T - (cy + dw), inner: 'left' });
        } else open.push({ x: W - T, y: T, w: T, h: H - T * 2, inner: 'left' });
      }
    };
    seg('top'); seg('bottom'); seg('left'); seg('right');
    this.wallsOpen = open;

    /* 门：洞口矩形 + 触发区（略微向房间内延伸） */
    const trig = 8;
    this.doors = [];
    if (this.connections.top) {
      this.doors.push({
        side: 'top', dir: { x: 0, y: -1 },
        gap: { x: cx - dw, y: 0, w: dw * 2, h: T },
        trigger: { x: cx - dw + trig, y: 0, w: dw * 2 - trig * 2, h: T + trig }
      });
    }
    if (this.connections.bottom) {
      this.doors.push({
        side: 'bottom', dir: { x: 0, y: 1 },
        gap: { x: cx - dw, y: H - T, w: dw * 2, h: T },
        trigger: { x: cx - dw + trig, y: H - T - trig, w: dw * 2 - trig * 2, h: T + trig }
      });
    }
    if (this.connections.left) {
      this.doors.push({
        side: 'left', dir: { x: -1, y: 0 },
        gap: { x: 0, y: cy - dw, w: T, h: dw * 2 },
        trigger: { x: 0, y: cy - dw + trig, w: T + trig, h: dw * 2 - trig * 2 }
      });
    }
    if (this.connections.right) {
      this.doors.push({
        side: 'right', dir: { x: 1, y: 0 },
        gap: { x: W - T, y: cy - dw, w: T, h: dw * 2 },
        trigger: { x: W - T - trig, y: cy - dw + trig, w: T + trig, h: dw * 2 - trig * 2 }
      });
    }
  }

  /* ---------------------------------------------------------
     地板（一次性烘焙到离屏画布，按房间种子决定花纹）
     --------------------------------------------------------- */
  _buildFloor() {
    const c = document.createElement('canvas');
    c.width = VIEW_W;
    c.height = VIEW_H;
    const g = c.getContext('2d');

    g.fillStyle = '#05070c';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.fillStyle = '#0e151d';
    g.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

    const ts = 64;
    g.save();
    g.beginPath();
    g.rect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
    g.clip();

    const sd = hashSeed(this.roomSeed || (this.type + ':' + this.index));
    const seedX = (sd % 97) * 0.37, seedY = (sd % 61) * 0.91;
    for (let ty = 0; ty * ts < ARENA.h + ts; ty++) {
      for (let tx = 0; tx * ts < ARENA.w + ts; tx++) {
        const n = hash2(tx + seedX, ty + seedY);
        const x = ARENA.x + tx * ts;
        const y = ARENA.y + ty * ts;
        const shade = 14 + Math.floor(n * 12);
        g.fillStyle = `rgb(${shade}, ${shade + 6}, ${shade + 12})`;
        g.fillRect(x + 1, y + 1, ts - 2, ts - 2);
        if (n > 0.82) {
          g.strokeStyle = 'rgba(90,170,190,0.10)';
          g.lineWidth = 1.5;
          g.beginPath();
          g.moveTo(x + 12, y + ts - 14);
          g.lineTo(x + ts - 14, y + ts - 14);
          g.stroke();
        } else if (n < 0.14) {
          g.fillStyle = 'rgba(120,200,220,0.06)';
          g.beginPath();
          g.arc(x + ts * 0.5, y + ts * 0.5, 4, 0, TAU);
          g.fill();
        }
      }
    }
    g.restore();

    /* 房间类型决定中央符环颜色 */
    const accent = this.meta.color;
    const cx = VIEW_W / 2, cy = VIEW_H / 2;
    g.strokeStyle = accent;
    g.globalAlpha = 0.07;
    g.lineWidth = 3;
    g.beginPath(); g.arc(cx, cy, 168, 0, TAU); g.stroke();
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, cy, 148, 0, TAU); g.stroke();
    g.lineWidth = 2;
    const spokes = this.type === ROOM_TYPE.BOSS ? 8 : 6;
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * TAU;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * 148, cy + Math.sin(a) * 148);
      g.lineTo(cx + Math.cos(a) * 168, cy + Math.sin(a) * 168);
      g.stroke();
    }
    g.globalAlpha = 1;

    const vg = g.createRadialGradient(cx, cy, ARENA.h * 0.35, cx, cy, ARENA.h * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.45)');
    g.fillStyle = vg;
    g.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

    this.floorCanvas = c;
  }

  /* ---------------------------------------------------------
     敌人波次（使用房间专属 Rng → 同种子可复现）
     --------------------------------------------------------- */
  _planWaves() {
    const rng = this.rng;
    this.waves = [];

    if (!this.isCombatRoom) return;

    if (this.type === ROOM_TYPE.BOSS) {
      this.waves = [['boss']];
      return;
    }

    const depth = this.depth;
    const elite = this.type === ROOM_TYPE.ELITE;
    const total = elite
      ? Math.min(7, 3 + Math.floor(depth * 0.9))
      : Math.min(10, 3 + Math.floor(depth * 1.1));

    const pool = [['chaser', 5]];
    pool.push(['shooter', depth >= 1 ? 3 : 2]);
    pool.push(['charger', depth >= 2 ? 3 : 2]);
    if (elite) pool.push(['charger', 3], ['shooter', 2]);

    const list = [];
    for (let i = 0; i < total; i++) {
      let sum = 0;
      for (const p of pool) sum += p[1];
      let r = rng.next() * sum;
      let chosen = 'chaser';
      for (const p of pool) {
        r -= p[1];
        if (r <= 0) { chosen = p[0]; break; }
      }
      list.push(chosen);
    }
    if (!list.includes('chaser')) list[0] = 'chaser';

    if (total <= 5 || elite) this.waves = [list];
    else {
      const cut = Math.ceil(total * 0.55);
      this.waves = [list.slice(0, cut), list.slice(cut)];
    }
  }

  _startWave() {
    const w = this.waves[this.waveIndex] || [];
    this.pending = w.map((type, i) => ({ type: type, delay: i * 0.16 }));
  }

  /* ---------------------------------------------------------
     可交互物件（宝箱 / 祭坛 / 商栈）
     --------------------------------------------------------- */
  _spawnProps() {
    const cx = VIEW_W / 2, cy = VIEW_H / 2;
    const rng = this.rng;
    switch (this.type) {
      case ROOM_TYPE.TREASURE:
        /* 主宝箱居中；第 2 层起两侧各多一口小箱 */
        this.props.push(new Chest(this.game, cx, cy, rng.fork('chest'), false));
        if (this.depth >= 1) {
          this.props.push(new Chest(this.game, cx - 190, cy + 40, rng.fork('chestL'), true));
          this.props.push(new Chest(this.game, cx + 190, cy + 40, rng.fork('chestR'), true));
        }
        break;
      case ROOM_TYPE.EVENT:
        this.props.push(new Shrine(this.game, cx, cy, rng.fork('shrine')));
        break;
      case ROOM_TYPE.SHOP:
        this.props.push(new Pedestal(this.game, cx - 110, cy, rng.fork('shop0'), 10));
        this.props.push(new Pedestal(this.game, cx + 110, cy, rng.fork('shop1'), 16));
        break;
      default:
        break;
    }
  }

  /* ---------------------------------------------------------
     出生点：远离玩家、彼此不重叠（用房间 Rng）
     --------------------------------------------------------- */
  _spawnPoint(radius) {
    const p = this.game.player;
    const rng = this.rng;
    for (let attempt = 0; attempt < 40; attempt++) {
      const x = rng.range(ARENA.x + radius + 24, ARENA.x + ARENA.w - radius - 24);
      const y = rng.range(ARENA.y + radius + 24, ARENA.y + ARENA.h - radius - 24);
      if (p && dist(x, y, p.x, p.y) < 210) continue;
      let ok = true;
      for (const e of this.enemies) {
        if (dist(x, y, e.x, e.y) < radius + e.r + 14) { ok = false; break; }
      }
      if (ok) return { x: x, y: y };
    }
    const cx = ARENA.x + ARENA.w / 2, cy = ARENA.y + ARENA.h / 2;
    const sx = rng.chance(0.5) ? -1 : 1, sy = rng.chance(0.5) ? -1 : 1;
    return {
      x: clamp(cx + sx * ARENA.w * 0.36, ARENA.x + 50, ARENA.x + ARENA.w - 50),
      y: clamp(cy + sy * ARENA.h * 0.36, ARENA.y + 50, ARENA.y + ARENA.h - 50)
    };
  }

  _spawnEnemy(type) {
    const r = type === 'boss' ? 34 : (type === 'charger' ? 19 : (type === 'shooter' ? 18 : 16));
    const pt = type === 'boss'
      ? { x: ARENA.x + ARENA.w / 2, y: ARENA.y + 120 }
      : this._spawnPoint(r);
    /* 每只敌人派生独立 Rng → 敌人组成、出生点、行为都随种子复现 */
    const e = EnemyFactory.create(this.game, type, pt.x, pt.y, this.tier,
      this.rng.fork('enemy' + this._spawnCounter++));
    this.enemies.push(e);
    this.spawnFx = 0.3;
    this.game.particles.ring(pt.x, pt.y, e.colors[1], type === 'boss' ? 26 : 12, type === 'boss' ? 260 : 150);
    return e;
  }

  /* ---------------------------------------------------------
     更新
     --------------------------------------------------------- */
  update(dt) {
    if (this.spawnFx > 0) this.spawnFx -= dt;

    /* 待生成队列 */
    if (this.pending.length) {
      for (let i = this.pending.length - 1; i >= 0; i--) {
        const q = this.pending[i];
        q.delay -= dt;
        if (q.delay <= 0) {
          this._spawnEnemy(q.type);
          this.pending.splice(i, 1);
        }
      }
    }

    /* 敌人 */
    for (const e of this.enemies) e.update(dt);

    /* 互相分离 */
    const n = this.enemies.length;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        Collision.separate(this.enemies[i], this.enemies[j]);
      }
    }
    for (const e of this.enemies) this.clampEntity(e, false);

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      if (this.enemies[i].dead) this.enemies.splice(i, 1);
    }

    /* 物件 */
    for (const pr of this.props) pr.update(dt);

    /* 房间结算 */
    if (this.state === 'fighting') {
      if (this.pending.length === 0 && this.enemies.length === 0) {
        if (this.waveIndex + 1 < this.waves.length) {
          this.waveTimer -= dt;
          if (this.waveTimer <= 0) {
            this.waveIndex++;
            this.waveTimer = 0.9;
            this._startWave();
            this.game.ui.showBanner('残形涌现', '下一波', 1.1);
          }
        } else {
          this.markCleared();
        }
      }
    } else {
      this.clearTime += dt;
    }
  }

  /* ---------------------------------------------------------
     重新进入（复用实例时调用）：只重置瞬时表现，绝不重建敌人 / 物件
     --------------------------------------------------------- */
  onReenter() {
    this.spawnFx = 0;
    if (this.state === 'fighting') {
      /* 战斗未结束就返回（理论上门是关的）：重新锁门 */
      this.doorsOpen = false;
      this.clearTime = 0;
    }
  }

  markCleared() {
    if (this.state === 'clear') return;
    this.state = 'clear';
    this.doorsOpen = true;
    this.clearTime = 0;
    this.everCleared = true;

    /* Boss 房通关 → 生成层间裂隙；精英房通关 → 掉落宝箱 */
    if (this.type === ROOM_TYPE.BOSS) {
      this.props.push(new Portal(this.game, ARENA.x + ARENA.w / 2, ARENA.y + ARENA.h / 2));
    } else if (this.type === ROOM_TYPE.ELITE) {
      this.props.push(new Chest(this.game, ARENA.x + ARENA.w / 2, ARENA.y + ARENA.h / 2,
        this.rng.fork('eliteChest'), false));
    }
    this.game.onRoomCleared(this);
  }

  /* ---------------------------------------------------------
     碰撞辅助
     --------------------------------------------------------- */
  clampEntity(e, allowDoors) {
    const walls = (allowDoors && this.doorsOpen) ? this.wallsOpen : this.wallsClosed;
    return Collision.resolveAll(e, walls);
  }

  hitsWall(x, y, r) {
    for (const w of this.wallsClosed) {
      if (Collision.circleRect(x, y, r, w)) return true;
    }
    return false;
  }

  /* 投射物撞墙反弹：就地修改 vx / vy 并推出墙体，返回是否发生反弹 */
  bounceOffWalls(p) {
    for (const w of this.wallsClosed) {
      if (!Collision.circleRect(p.x, p.y, p.r, w)) continue;
      const overLeft = (p.x + p.r) - w.x;
      const overRight = (w.x + w.w) - (p.x - p.r);
      const overTop = (p.y + p.r) - w.y;
      const overBottom = (w.y + w.h) - (p.y - p.r);
      const m = Math.min(overLeft, overRight, overTop, overBottom);
      /* overLeft = 需要向左挪多少才能脱离左面，以此类推 */
      if (m === overLeft) { p.vx = -Math.abs(p.vx); p.x -= overLeft; }
      else if (m === overRight) { p.vx = Math.abs(p.vx); p.x += overRight; }
      else if (m === overTop) { p.vy = -Math.abs(p.vy); p.y -= overTop; }
      else { p.vy = Math.abs(p.vy); p.y += overBottom; }
      return true;
    }
    return false;
  }

  aliveCount() {
    let c = 0;
    for (const e of this.enemies) if (!e.dead) c++;
    return c + this.pending.length;
  }

  doorUnder(px, py) {
    if (!this.doorsOpen) return null;
    for (const d of this.doors) {
      if (Collision.pointInRect(px, py, d.trigger)) return d;
    }
    return null;
  }

  doorBySide(side) {
    for (const d of this.doors) if (d.side === side) return d;
    return null;
  }

  /* ---------------------------------------------------------
     绘制
     --------------------------------------------------------- */
  drawFloor(ctx) {
    ctx.drawImage(this.floorCanvas, 0, 0);
    if (this.state === 'clear') {
      const t = this.clearTime;
      const a = 0.10 + 0.05 * Math.sin(t * 3);
      const cx = VIEW_W / 2, cy = VIEW_H / 2;
      const g = ctx.createRadialGradient(cx, cy, 20, cx, cy, 210);
      g.addColorStop(0, `rgba(255,190,110,${a})`);
      g.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - 220, cy - 220, 440, 440);
    }
  }

  drawProps(ctx) {
    for (const pr of this.props) pr.draw(ctx);
  }

  drawWalls(ctx) {
    const walls = this.doorsOpen ? this.wallsOpen : this.wallsClosed;

    for (const d of this.doors) {
      const g = d.gap;
      ctx.fillStyle = '#0b1119';
      ctx.fillRect(g.x, g.y, g.w, g.h);

      if (this.doorsOpen) {
        const pulse = 0.5 + 0.5 * Math.sin(this.clearTime * 3.4);
        const grad = ctx.createLinearGradient(g.x, g.y, g.x + (g.w > g.h ? 0 : g.w), g.y + (g.h > g.w ? g.h : 0));
        grad.addColorStop(0, 'rgba(90,255,190,0.05)');
        grad.addColorStop(0.5, `rgba(120,255,200,${0.20 + 0.10 * pulse})`);
        grad.addColorStop(1, 'rgba(90,255,190,0.05)');
        ctx.fillStyle = grad;
        ctx.fillRect(g.x, g.y, g.w, g.h);

        ctx.strokeStyle = 'rgba(140,255,210,0.75)';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(g.x + 1, g.y + 1, g.w - 2, g.h - 2);
      } else {
        ctx.fillStyle = 'rgba(255,70,60,0.13)';
        ctx.fillRect(g.x, g.y, g.w, g.h);
        ctx.save();
        ctx.beginPath();
        ctx.rect(g.x, g.y, g.w, g.h);
        ctx.clip();
        ctx.strokeStyle = 'rgba(255,110,90,0.32)';
        ctx.lineWidth = 3;
        const off = (this.game.time * 42) % 22;
        const horiz = g.w > g.h;
        const len = horiz ? g.w : g.h;
        for (let i = -1; i < len / 22 + 2; i++) {
          ctx.beginPath();
          if (horiz) {
            const x = g.x + i * 22 + off;
            ctx.moveTo(x, g.y);
            ctx.lineTo(x + 10, g.y + g.h);
          } else {
            const y = g.y + i * 22 + off;
            ctx.moveTo(g.x, y);
            ctx.lineTo(g.x + g.w, y + 10);
          }
          ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,90,80,0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(g.x + 1, g.y + 1, g.w - 2, g.h - 2);
      }
    }

    for (const w of walls) {
      ctx.fillStyle = '#171d29';
      ctx.fillRect(w.x, w.y, w.w, w.h);

      ctx.fillStyle = '#2b3547';
      if (w.inner === 'bottom') ctx.fillRect(w.x, w.y + w.h - 5, w.w, 5);
      else if (w.inner === 'top') ctx.fillRect(w.x, w.y, w.w, 5);
      else if (w.inner === 'right') ctx.fillRect(w.x + w.w - 5, w.y, 5, w.h);
      else ctx.fillRect(w.x, w.y, 5, w.h);

      ctx.strokeStyle = 'rgba(0,0,0,0.28)';
      ctx.lineWidth = 1;
      const horiz = w.w > w.h;
      const step = 48;
      ctx.beginPath();
      if (horiz) {
        for (let x = w.x + step; x < w.x + w.w; x += step) {
          ctx.moveTo(x, w.y); ctx.lineTo(x, w.y + w.h);
        }
      } else {
        for (let y = w.y + step; y < w.y + w.h; y += step) {
          ctx.moveTo(w.x, y); ctx.lineTo(w.x + w.w, y);
        }
      }
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x + 0.5, w.y + 0.5, w.w - 1, w.h - 1);
    }
  }
}

</script>
<script>
/* ===========================================================
   ui.js — HUD（Canvas）+ 遮罩面板（DOM）+ 小地图 + 横幅 + 准星
   =========================================================== */
'use strict';

class UI {
  constructor(game) {
    this.game = game;
    this.banner = null;
    this.hintTimer = 9;
    this.hitVignette = 0;

    this.overlay = document.getElementById('overlay');
    this.elKicker = document.getElementById('ov-kicker');
    this.elTitleCn = document.getElementById('ov-title-cn');
    this.elTitleEn = document.getElementById('ov-title-en');
    this.elText = document.getElementById('ov-text');
    this.elBtn = document.getElementById('ov-btn');
    this.elHint = document.getElementById('ov-hint');
    this.elSeed = document.getElementById('seed-input');

    this.elBtn.addEventListener('click', () => {
      this.game.primaryAction();
    });

    this.setOverlay('title');
  }

  /* 玩家当前 Build 的一句话摘要（遮罩面板用） */
  buildSummary(g) {
    if (!g.player || !g.player.build) return '';
    const slots = g.player.build.slots;
    if (!slots.length) return '尚无道具';
    const names = slots.slice(0, 8).map(s => {
      const it = ITEM_BY_ID[s.id];
      return (it ? it.name : s.id) + (s.n > 1 ? `×${s.n}` : '');
    });
    const more = slots.length > 8 ? ` 等 ${slots.length} 类` : '';
    return names.join('、') + more;
  }

  /* ---------------------------------------------------------
     遮罩面板
     --------------------------------------------------------- */
  setOverlay(mode) {
    this.overlayMode = mode;
    if (!mode) {
      this.overlay.classList.add('hidden');
      return;
    }
    this.overlay.classList.remove('hidden');

    const g = this.game;
    if (mode === 'title') {
      this.elKicker.textContent = 'ORIGINAL ROGUELIKE SHOOTER';
      this.elTitleCn.textContent = '残响回廊';
      this.elTitleEn.textContent = 'ECHO RIFT';
      this.elText.innerHTML =
        '星脉崩解之后，回廊在裂隙中生长。<br>' +
        '徘徊其中的，是回声凝成的残形。<br><br>' +
        '你是最后的拾火者，收集余烬，走到守望者面前。';
      this.elBtn.textContent = '开始探索';
      const kbHint = 'WASD 移动 · 鼠标瞄准 · 左键射击 · E 交互 · ESC 暂停 · F 全屏';
      this.elHint.textContent = (this.game.touchMode && this.touchHint) ? this.touchHint : kbHint;
      if (this.elSeed) this.elSeed.style.display = '';
    } else if (mode === 'pause') {
      this.elKicker.textContent = 'SYSTEM HALT';
      this.elTitleCn.textContent = '暂停';
      this.elTitleEn.textContent = 'PAUSED';
      this.elText.innerHTML =
        `SEED　<b>${g.seed}</b><br>` +
        `层数　<b>第 ${g.floor} 层</b><br>` +
        `余烬　<b>${g.embers}</b><br>` +
        `已探索　<b>${Object.keys(g.map ? g.map.visited : {}).length} / ${g.map ? g.map.cells.length : 0}</b> 间<br>` +
        `持有道具　<b>${g.player ? g.player.build.length : 0}</b> 件<br>` +
        `<span style="color:#8fa3b5">${this.buildSummary(g)}</span>`;
      this.elBtn.textContent = '继续';
      this.elHint.textContent = 'R 重新开始 · ESC 继续';
      if (this.elSeed) this.elSeed.style.display = 'none';
    } else if (mode === 'gameover') {
      this.elKicker.textContent = 'EMBER EXTINGUISHED';
      this.elTitleCn.textContent = '火种熄灭';
      this.elTitleEn.textContent = 'RUN OVER';
      this.elText.innerHTML =
        `SEED　<b>${g.seed}</b><br>` +
        `抵达　<b>第 ${g.floor} 层 · ${g.roomTypeName()}</b><br>` +
        `击碎残形　<b>${g.kills}</b>　射出弹丸　<b>${g.player ? g.player.shotsFired : 0}</b><br>` +
        `持有道具　<b>${g.player ? g.player.build.length : 0}</b> 件<br>` +
        `<span style="color:#8fa3b5">${this.buildSummary(g)}</span>`;
      this.elBtn.textContent = '重新开始';
      this.elHint.textContent = '按 R 也可以重来（可先改 Seed）';
      if (this.elSeed) this.elSeed.style.display = '';
    }
  }

  /* 读取玩家输入的 Seed（空则随机） */
  readSeedInput() {
    if (!this.elSeed) return '';
    return (this.elSeed.value || '').trim().toUpperCase();
  }

  /* ---------------------------------------------------------
     横幅
     --------------------------------------------------------- */
  showBanner(text, sub, duration) {
    if (!text) return;
    this.banner = {
      text: text, sub: sub || '', life: duration || 1.6, maxLife: duration || 1.6,
      style: 'normal'
    };
  }

  showClearBanner(sub) {
    this.banner = {
      text: 'ROOM CLEAR', sub: sub || '门已开启 · 走进门洞继续探索',
      life: 2.4, maxLife: 2.4, style: 'clear'
    };
  }

  update(dt) {
    if (this.hintTimer > 0) this.hintTimer -= dt;
    if (this.hitVignette > 0) this.hitVignette = Math.max(0, this.hitVignette - dt * 1.6);
    if (this.banner) {
      this.banner.life -= dt;
      if (this.banner.life <= 0) this.banner = null;
    }
  }

  /* ---------------------------------------------------------
     HUD
     --------------------------------------------------------- */
  drawHUD(ctx) {
    const g = this.game;
    const p = g.player;
    if (!p) return;

    /* ---- 左上：生命值 ---- */
    const bx = 26, by = 24, bw = 268, bh = 20;
    ctx.fillStyle = 'rgba(6,10,15,0.72)';
    roundRectPath(ctx, bx - 8, by - 22, bw + 96, bh + 62, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,190,220,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = '700 11px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#7fd7ea';
    ctx.fillText('拾火者 · EMBER', bx, by - 7);

    ctx.fillStyle = '#2a1218';
    roundRectPath(ctx, bx, by, bw, bh, 5);
    ctx.fill();

    const ratio = clamp(p.hp / p.maxHp, 0, 1);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    if (ratio > 0.35) {
      grad.addColorStop(0, '#ffb347');
      grad.addColorStop(1, '#ffe08a');
    } else {
      grad.addColorStop(0, '#ff4d4d');
      grad.addColorStop(1, '#ff8a5c');
    }
    ctx.fillStyle = grad;
    if (ratio > 0.001) {
      roundRectPath(ctx, bx, by, bw * ratio, bh, 5);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      const x = bx + (bw / 5) * i;
      ctx.beginPath();
      ctx.moveTo(x, by + 2);
      ctx.lineTo(x, by + bh - 2);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,220,160,0.35)';
    roundRectPath(ctx, bx + 0.5, by + 0.5, bw - 1, bh - 1, 5);
    ctx.stroke();

    ctx.font = '800 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffe9c0';
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, bx + bw + 62, by + 15);

    /* ---- 左上第二行：余烬 / 层数 / 房间 / Seed ---- */
    ctx.textAlign = 'left';
    ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffd35e';
    ctx.fillText(`◈ ${g.embers} 余烬`, bx, by + 40);

    ctx.font = '600 12px "Segoe UI", system-ui, sans-serif';
    const roomName = g.room ? g.room.meta.cn : '-';
    const alive = g.room ? g.room.aliveCount() : 0;
    const statusTxt = (g.room && g.room.isCombatRoom)
      ? (g.room.state === 'clear' ? '已肃清 · 门已开启' : `残形剩余 ${alive}`)
      : '可自由通行';
    ctx.fillStyle = (g.room && g.room.isCombatRoom && g.room.state !== 'clear') ? '#ff9d6b' : '#7dffb0';
    ctx.fillText(`第 ${g.floor} 层 · ${roomName} · ${statusTxt}`, bx + 88, by + 40);

    ctx.fillStyle = '#5d6f7e';
    ctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`SEED ${g.seed}　击碎 ${g.kills}　${playerStatsText(p)}`, bx, by + 58);

    /* ---- 右上：小地图 ---- */
    this.drawMinimap(ctx);

    /* ---- 左下：Build 面板（持有道具 + 组合） ---- */
    this.drawBuildPanel(ctx);

    /* ---- 交互提示 ---- */
    if (g.nearProp && !g.nearProp.used) {
      const txt = (g.touchMode ? '' : 'E · ') + g.nearProp.label;
      ctx.textAlign = 'center';
      ctx.font = '700 14px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      const w = ctx.measureText(txt).width + 26;
      ctx.fillStyle = 'rgba(6,10,15,0.8)';
      roundRectPath(ctx, VIEW_W / 2 - w / 2, VIEW_H - 74, w, 30, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,200,110,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#ffd28a';
      ctx.fillText(txt, VIEW_W / 2, VIEW_H - 55);
      ctx.textAlign = 'left';
    }

    /* ---- 底部操作提示（渐隐） ---- */
    if (this.hintTimer > 0) {
      ctx.globalAlpha = clamp(this.hintTimer / 2.5, 0, 1);
      ctx.font = '600 12px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#6d8296';
      ctx.textAlign = 'center';
      const hint = g.touchMode
        ? '拖动屏幕两侧即可移动与射击'
        : 'WASD 移动　·　鼠标瞄准　·　左键射击　·　E 交互　·　ESC 暂停　·　F 全屏';
      ctx.fillText(hint, VIEW_W / 2, VIEW_H - 22);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }

    /* ---- 受击暗角 / 低血量 ---- */
    if (this.hitVignette > 0) {
      const a = this.hitVignette * 0.5;
      const vg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.28, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.78);
      vg.addColorStop(0, 'rgba(255,40,40,0)');
      vg.addColorStop(1, `rgba(255,40,40,${a})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    if (p.hp > 0 && ratio < 0.3) {
      const pulse = 0.10 + 0.08 * Math.sin(g.time * 6);
      const vg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.3, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.8);
      vg.addColorStop(0, 'rgba(255,0,0,0)');
      vg.addColorStop(1, `rgba(255,0,0,${pulse})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }

    /* 悬停说明画在最上层 */
    this.drawItemTooltip(ctx);
  }

  /* ---------------------------------------------------------
     Build 面板：当前持有的道具（左下角）
     鼠标悬停任意道具 → 显示完整说明
     --------------------------------------------------------- */
  drawBuildPanel(ctx) {
    const g = this.game;
    const p = g.player;
    if (!p || !p.build) return;

    const slots = p.build.slots;
    const mx = g.mouseWorld.x, my = g.mouseWorld.y;
    const rowH = 18;
    const colW = 236;
    const maxRows = 9;
    const maxShow = maxRows * 2;
    const shown = Math.min(slots.length, maxShow);
    const cols = shown > maxRows ? 2 : 1;
    const rowsUsed = Math.min(maxRows, shown);
    const bottomY = VIEW_H - 28;
    const panelH = 24 + rowsUsed * rowH;
    const px = 26, py = bottomY - panelH;
    const panelW = colW * cols;

    ctx.save();
    ctx.fillStyle = 'rgba(6,10,15,0.72)';
    roundRectPath(ctx, px - 8, py - 8, panelW + 16, panelH + 12, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,190,220,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    /* 标题 */
    ctx.font = '700 11px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#7fd7ea';
    ctx.fillText(`BUILD · ${p.build.length} 件道具`, px, py + 4);

    /* 生效中的组合 */
    this._hoverItem = null;
    if (p.build.comboList.length) {
      let cx2 = px + 118;
      ctx.font = '700 10.5px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = '#c08bff';
      const names = p.build.comboList.slice(0, 3).map(c => c.name).join(' · ');
      const more = p.build.comboList.length > 3 ? ` +${p.build.comboList.length - 3}` : '';
      ctx.fillText('组合 ' + names + more, cx2, py + 4);
    }

    /* 道具行（列优先排布） */
    for (let i = 0; i < shown; i++) {
      const it = ITEM_BY_ID[slots[i].id];
      if (!it) continue;
      const col = i >= maxRows ? 1 : 0;
      const row = i % maxRows;
      const x = px + col * colW;
      const rowY = py + 22 + row * rowH;

      /* 命中矩形（供悬停判定） */
      const inRow = mx >= x - 4 && mx <= x + colW - 12 && my >= rowY - 11 && my <= rowY + 6;
      if (inRow) this._hoverItem = { item: it, n: slots[i].n };

      /* 分类色块 */
      const cat = ITEM_CAT[it.cat] || ITEM_CAT.special;
      ctx.fillStyle = it.color;
      roundRectPath(ctx, x, rowY - 9, 11, 11, 3);
      ctx.fill();

      /* 名称 + 层数 */
      ctx.font = '700 11px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = inRow ? '#ffffff' : '#d6e3ee';
      const label = it.name + (slots[i].n > 1 ? ` ×${slots[i].n}` : '');
      ctx.fillText(label, x + 16, rowY);

      /* 分类标记 */
      ctx.font = '600 9.5px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = cat.color;
      const nameW = ctx.measureText(label).width;
      ctx.fillText(cat.cn, x + 18 + nameW + 4, rowY);

      if (inRow) {
        ctx.strokeStyle = 'rgba(255,220,150,0.55)';
        ctx.lineWidth = 1;
        roundRectPath(ctx, x - 4, rowY - 11, colW - 12, 17, 4);
        ctx.stroke();
      }
    }

    if (slots.length > maxShow) {
      ctx.font = '600 10px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#6d8296';
      ctx.fillText(`+${slots.length - maxShow} 件未显示`, px + colW, py + 4);
    }
    ctx.restore();
  }

  /* 悬停说明浮层 */
  drawItemTooltip(ctx) {
    const h = this._hoverItem;
    if (!h) return;
    const it = h.item;
    const cat = ITEM_CAT[it.cat] || ITEM_CAT.special;
    const combos = this.game.player.build.combosOf(it.id);

    const w = 306;
    const lines = this._wrap(ctx, it.desc, w - 30, 12);
    const boxH = 62 + lines.length * 16 + (combos.length ? 18 + combos.length * 14 : 0);
    let x = this.game.mouseWorld.x + 18;
    let y = this.game.mouseWorld.y - boxH - 12;
    if (x + w > VIEW_W - 12) x = VIEW_W - 12 - w;
    if (y < 12) y = Math.min(VIEW_H - boxH - 12, this.game.mouseWorld.y + 20);

    ctx.save();
    ctx.fillStyle = 'rgba(6,10,15,0.94)';
    roundRectPath(ctx, x, y, w, boxH, 8);
    ctx.fill();
    ctx.strokeStyle = it.color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    let ty = y + 22;

    ctx.font = '800 14px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    ctx.fillStyle = it.color;
    ctx.fillText(it.name, x + 15, ty);

    ctx.font = '700 11px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    ctx.fillStyle = cat.color;
    const nw = ctx.measureText(it.name).width;
    ctx.fillText(cat.cn + (h.n > 1 ? ` ×${h.n}` : '') + `　上限 ${it.max}`, x + 19 + nw, ty);

    ty += 20;
    ctx.font = '600 12px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    ctx.fillStyle = '#c8d8e4';
    for (const ln of lines) { ctx.fillText(ln, x + 15, ty); ty += 16; }

    if (combos.length) {
      ty += 4;
      ctx.font = '700 10.5px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = '#c08bff';
      ctx.fillText('可参与的组合', x + 15, ty);
      ty += 14;
      ctx.font = '600 10.5px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      for (const c of combos) {
        const active = this.game.player.build.comboList.indexOf(c) >= 0;
        ctx.fillStyle = active ? c.color : '#5d6f7e';
        ctx.fillText((active ? '◆ ' : '◇ ') + c.name + '　' + (active ? '已激活' : '需要 ' +
          Object.keys(c.need).map(k => MOD_CN[k] || k).join(' + ')), x + 15, ty);
        ty += 14;
      }
    }
    ctx.restore();
  }

  /* 简单折行（兼容中文：逐字测量） */
  _wrap(ctx, text, maxW, fontPx) {
    ctx.font = `600 ${fontPx}px "Segoe UI", "PingFang SC", system-ui, sans-serif`;
    const out = [];
    let line = '';
    for (const ch of text) {
      const t = line + ch;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch; }
      else line = t;
    }
    if (line) out.push(line);
    return out;
  }

  /* ---------------------------------------------------------
     小地图（右上角）
     当前房间 / 已访问 / 未访问 / Boss / 特殊房间
     --------------------------------------------------------- */
  drawMinimap(ctx) {
    const g = this.game;
    const map = g.map;
    if (!map) return;

    const cell = 24;
    const pad = 10;
    const w = map.cols * cell, h = map.rows * cell;
    const ox = VIEW_W - 26 - w, oy = 20;

    ctx.save();
    ctx.fillStyle = 'rgba(6,10,15,0.72)';
    roundRectPath(ctx, ox - pad, oy - pad, w + pad * 2, h + pad * 2 + 4, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,190,220,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    const cxOf = (c) => ox + c * cell + cell / 2;
    const cyOf = (r) => oy + r * cell + cell / 2;

    /* 连接线 */
    ctx.strokeStyle = 'rgba(140,180,200,0.35)';
    ctx.lineWidth = 2;
    for (const cd of map.cells) {
      if (!map.isVisited(cd) && cd !== map.current) continue;
      for (const d of DIRS) {
        const n = cd.links[d.side];
        if (!n) continue;
        ctx.beginPath();
        ctx.moveTo(cxOf(cd.c), cyOf(cd.r));
        ctx.lineTo(lerp(cxOf(cd.c), cxOf(n.c), 0.5), lerp(cyOf(cd.r), cyOf(n.r), 0.5));
        ctx.stroke();
      }
    }

    /* 房间格 */
    for (const cd of map.cells) {
      const meta = ROOM_META[cd.type] || ROOM_META.combat;
      const visited = map.isVisited(cd);
      const isCurrent = (cd === map.current);
      const x = ox + cd.c * cell, y = oy + cd.r * cell;
      const s = cell - 7;

      /* 未访问：暗淡轮廓 */
      if (!visited && !isCurrent) {
        ctx.fillStyle = 'rgba(90,110,130,0.12)';
        roundRectPath(ctx, x + 3.5, y + 3.5, s, s, 3);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,150,175,0.28)';
        ctx.lineWidth = 1;
        ctx.stroke();
        continue;
      }

      ctx.globalAlpha = isCurrent ? 1 : (visited ? 0.72 : 0.4);
      ctx.fillStyle = meta.color;
      roundRectPath(ctx, x + 3.5, y + 3.5, s, s, 3);
      ctx.fill();
      ctx.globalAlpha = 1;

      /* 特殊房间字形 */
      if (cd.type !== ROOM_TYPE.COMBAT) {
        ctx.font = '800 11px "Segoe UI", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#0b1017';
        ctx.fillText(meta.glyph, x + 3.5 + s / 2, y + 3.5 + s / 2 + 0.5);
      }

      /* 当前房间：脉冲高亮 + 中心点 */
      if (isCurrent) {
        const pulse = 0.6 + 0.4 * Math.sin(g.time * 5);
        ctx.strokeStyle = `rgba(255,255,255,${pulse})`;
        ctx.lineWidth = 2.5;
        roundRectPath(ctx, x + 2, y + 2, s + 3, s + 3, 4);
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x + 3.5 + s / 2, y + 3.5 + s / 2, 2.4, 0, TAU);
        ctx.fill();
      }
    }

    ctx.font = '600 10px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#6d8296';
    ctx.fillText(`回廊地图　${Object.keys(map.visited).length}/${map.cells.length}`, ox + w / 2, oy + h + pad + 12);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  /* ---- 横幅 ---- */
  drawBanner(ctx) {
    if (!this.banner) return;
    const b = this.banner;
    const t = b.life / b.maxLife;
    const inT = clamp((1 - t) * 5, 0, 1);
    const alpha = clamp(t * 2.2, 0, 1);
    const scale = 0.86 + easeOutCubic(inT) * 0.14;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(VIEW_W / 2, VIEW_H * 0.30);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (b.style === 'clear') {
      ctx.font = '900 58px "Segoe UI", system-ui, sans-serif';
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(b.text, 0, 0);
      const grad = ctx.createLinearGradient(-200, 0, 200, 0);
      grad.addColorStop(0, '#8affc8');
      grad.addColorStop(0.5, '#ffffff');
      grad.addColorStop(1, '#8affc8');
      ctx.fillStyle = grad;
      ctx.fillText(b.text, 0, 0);
    } else {
      ctx.font = '800 34px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(b.text, 0, 0);
      ctx.fillStyle = '#ffd28a';
      ctx.fillText(b.text, 0, 0);
    }

    if (b.sub) {
      ctx.font = '600 14px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.fillStyle = '#9fb6c8';
      ctx.fillText(b.sub, 0, b.style === 'clear' ? 42 : 26);
    }
    ctx.restore();
  }

  /* ---- 准星 ---- */
  drawCrosshair(ctx) {
    const m = this.game.mouseWorld;
    const p = this.game.player;
    const t = this.game.time;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.strokeStyle = p && p.fireTimer > 0 ? 'rgba(255,220,150,0.95)' : 'rgba(150,240,255,0.85)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * TAU + t * 0.6;
      ctx.moveTo(Math.cos(a) * 12, Math.sin(a) * 12);
      ctx.lineTo(Math.cos(a) * 17, Math.sin(a) * 17);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(0, 0, 1.8, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* ---------------------------------------------------------
     触屏层：虚拟摇杆 + 屏幕按钮
     --------------------------------------------------------- */
  drawTouchControls(ctx) {
    const t = this.game.input && this.game.input.touch;
    if (t) t.draw(ctx);

    const btns = this.game.touchButtons ? this.game.touchButtons() : [];
    for (let i = 0; i < btns.length; i++) {
      const b = btns[i];
      ctx.save();
      ctx.fillStyle = 'rgba(8,14,20,0.62)';
      roundRectPath(ctx, b.x, b.y, b.w, b.h, 10);
      ctx.fill();
      ctx.strokeStyle = (b.id === 'act') ? 'rgba(255,200,110,0.6)' : 'rgba(120,190,220,0.45)';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      ctx.fillStyle = (b.id === 'act') ? '#ffd28a' : '#9fe4f5';
      ctx.font = '700 16px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.label || '', b.x + b.w / 2, b.y + b.h / 2 + 1);
      ctx.restore();
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  /* 切到触屏模式时替换操作提示文案 */
  setTouchHint() {
    this.touchHint = '左半屏拖动移动　·　右半屏拖动瞄准并射击　·　按钮交互 / 暂停';
    if (this.elHint) this.elHint.textContent = this.touchHint;
  }
}

</script>
<script>
/* ===========================================================
   game.js — 主循环 / 状态机 / 地图与房间推进 / 全局事件
   扩展：程序生成的地图、Seed 系统、房间类型、摄像机滑动切换
   =========================================================== */
'use strict';

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = 1;

    this.input = new Input(canvas);
    this.ui = new UI(this);
    this.particles = new ParticleSystem(900);
    this.damageNumbers = new DamageNumbers();
    this.projectiles = [];

    this.state = 'title';        // title | playing | paused | gameover
    this.time = 0;
    this.kills = 0;
    this.shake = 0;
    this.transition = null;
    this.mouseWorld = { x: VIEW_W / 2, y: VIEW_H / 2 };
    this.nearProp = null;
    this.fx = [];                // 电弧等短时特效
    this.zones = [];             // 泥沼等持续区域
    this.touchMode = false;      // 触屏模式（首次触摸后自动开启）
    this.rotateHintDismissed = false;
    this.viewScale = 1;

    /* 种子 / 层数 / 货币 / 已获得道具 */
    this.seed = randomSeedString();
    this.floor = 1;
    this.embers = 0;
    this.ownedItems = [];

    this.fps = 60;
    this._fpsAcc = 0;
    this._fpsFrames = 0;

    /* 已实例化的房间缓存：key = floor#c,r
       → 重新进入已探索的房间时复用同一实例，敌人 / 宝箱 / 状态都不会刷新 */
    this.roomCache = {};

    /* 首屏也要有一张地图和房间（标题界面背景） */
    this.map = new GameMap(this.seed, this.floor);
    this.player = new Player(this, VIEW_W / 2, VIEW_H / 2 + 90);
    this.room = this._roomFor(this.map.start);
    this.map.current = this.map.start;
    this.map.visit(this.map.start);

    this._placePlayerAtEntry('bottom');

    this.input.onBlur = () => { if (this.state === 'playing') this.pause(); };

    /* 触屏：按钮布局与回调接到 TouchControls 上 */
    this.input.touch.buttonsFn = () => this.touchButtons();
    this.input.touch.onButton = (id) => this.onTouchButton(id);

    this.resize();
    window.addEventListener('resize', () => this.resize());
    document.addEventListener('fullscreenchange', () => setTimeout(() => this.resize(), 60));
    window.addEventListener('orientationchange', () => {
      setTimeout(() => this.resize(), 80);
      setTimeout(() => this.resize(), 400);
    });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', () => this.resize());
    }
  }

  /* ---------------------------------------------------------
     自适应尺寸：舞台用 transform 等比缩放，永远保持 16:9 不变形
     --------------------------------------------------------- */
  resize() {
    const stage = document.getElementById('stage');
    const vv = window.visualViewport;
    const de = document.documentElement;
    const aw = Math.max(320, Math.round(vv ? vv.width : (de.clientWidth || window.innerWidth)));
    const ah = Math.max(240, Math.round(vv ? vv.height : (de.clientHeight || window.innerHeight)));

    /* 等比 contain：手机上不留白边，桌面留 30px 呼吸 */
    const pad = this.touchMode ? 0 : 30;
    const s = Math.min((aw - pad) / VIEW_W, (ah - pad) / VIEW_H);
    this.viewScale = s;
    if (stage) stage.style.transform = 'scale(' + s + ')';

    /* 渲染分辨率：按实际显示大小决定 → 手机上降采样保 60FPS，高分屏不糊 */
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rs = clamp(s * dpr, 0.75, 1.5);
    if (Math.abs(rs - this.dpr) > 0.01) {
      this.dpr = rs;
      this.canvas.width = Math.round(VIEW_W * rs);
      this.canvas.height = Math.round(VIEW_H * rs);
    }

    this._updateRotateHint(aw, ah);
  }

  /* 竖屏提示（仅触屏设备，且未被玩家关掉） */
  _updateRotateHint(w, h) {
    const el = document.getElementById('rotate-hint');
    if (!el || !el.classList) return;
    const portrait = h > w * 1.08;
    const show = portrait && this.touchMode && !this.rotateHintDismissed;
    if (show) el.classList.remove('hidden');
    else el.classList.add('hidden');
  }

  /* 首次真实触摸 → 切到触屏模式 */
  _enableTouchMode() {
    if (this.touchMode) return;
    this.touchMode = true;
    if (document.body && document.body.classList) document.body.classList.add('touch-mode');
    if (this.ui && this.ui.setTouchHint) this.ui.setTouchHint();
    this.resize();
  }

  /* 触屏屏幕按钮（逻辑坐标，随画布一起缩放） */
  touchButtons() {
    if (!this.touchMode) return [];
    if (this.state !== 'playing' && this.state !== 'paused') return [];
    const list = [{
      id: 'pause', x: VIEW_W - 92, y: VIEW_H - 92, w: 72, h: 72,
      label: this.state === 'paused' ? '继续' : '暂停'
    }];
    if (this.state === 'playing' && this.nearProp && !this.nearProp.used) {
      list.push({
        id: 'act', x: VIEW_W / 2 - 86, y: VIEW_H - 172, w: 172, h: 60,
        label: this.nearProp.label
      });
    }
    return list;
  }

  onTouchButton(id) {
    if (id === 'pause') {
      if (this.state === 'playing') this.pause();
      else if (this.state === 'paused') this.resume();
    } else if (id === 'act') {
      if (this.nearProp && !this.nearProp.used) this.nearProp.use();
    }
  }

  toggleFullscreen() {
    const d = document;
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
    } else {
      (d.exitFullscreen || d.webkitExitFullscreen || function () {}).call(d);
    }
  }

  /* ---------------------------------------------------------
     流程控制
     --------------------------------------------------------- */
  startRun(seedStr) {
    this.seed = (seedStr && String(seedStr).trim().length)
      ? String(seedStr).trim().toUpperCase()
      : randomSeedString();

    this.floor = 1;
    this.kills = 0;
    this.embers = 0;
    this.ownedItems = [];
    this.projectiles.length = 0;
    this.fx.length = 0;
    this.zones.length = 0;
    this.particles.clear();
    this.damageNumbers.clear();
    this.transition = null;
    this.shake = 0;
    this.nearProp = null;
    this.roomCache = {};

    this.player = new Player(this, VIEW_W / 2, VIEW_H / 2 + 90);
    this.map = new GameMap(this.seed, this.floor);
    this.state = 'playing';
    this.ui.setOverlay(null);

    this.room = this._roomFor(this.map.start);
    this.map.current = this.map.start;
    this.map.visit(this.map.start);
    this._placePlayerAtEntry('bottom');

    this.ui.showBanner('第 1 层 · ' + this.map.cells.length + ' 间',
      'SEED ' + this.seed + ' · 走到守望者面前', 2.4);
  }

  pause() {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    if (this.input && this.input.touch) this.input.touch.releaseAll();
    this.ui.setOverlay('pause');
  }

  resume() {
    if (this.state !== 'paused') return;
    this.state = 'playing';
    if (this.input && this.input.touch) this.input.touch.releaseAll();
    this.ui.setOverlay(null);
  }

  primaryAction() {
    if (this.state === 'title' || this.state === 'gameover') this.startRun(this.ui.readSeedInput());
    else if (this.state === 'paused') this.resume();
  }

  roomTypeName() { return this.room ? this.room.meta.cn : '-'; }

  onPlayerDeath() {
    this.state = 'gameover';
    this.addShake(16);
    this.particles.burst(this.player.x, this.player.y, 34, {
      speed: 260, life: 0.9, size: 5, colors: ['#ffb347', '#ff6b5c', '#ffffff', '#7fd7ea']
    });
    this.ui.setOverlay('gameover');
  }

  onEnemyKilled(e) {
    this.kills++;
    let drop = 2;
    if (e.type === 'charger') drop = 3;
    else if (e.type === 'shooter') drop = 2;
    if (e.type === 'boss') drop = 40;
    if (e.isBoss) drop = 40;
    this.embers += drop;
    this.damageNumbers.add(e.x, e.y - 14, '◈' + drop, { color: '#ffd35e', life: 0.9, vy: -46 });

    /* 击杀类组合 */
    const m = (this.player && this.player.mods) ? this.player.mods : {};
    if (m.killBlast > 0) {
      this._explode(e.x, e.y, 56 + 12 * m.killBlast, 12 * m.killBlast, { color: '#ffd35e' });
    }
    if (m.freezeExplode > 0 && e.freezeT > 0) {
      this._explode(e.x, e.y, 82, 24, { color: '#8fd8ff', freeze: true });
    }
  }

  onRoomCleared(room) {
    if (room.type === ROOM_TYPE.BOSS) {
      this.ui.showClearBanner('守望者已陨落 · 触碰裂隙进入下一层');
      this.player.heal(35);
      this.addShake(10);
    } else if (room.isCombatRoom) {
      this.ui.showClearBanner();
      this.player.heal(room.type === ROOM_TYPE.ELITE ? 18 : 10);
    }
  }

  nextFloor() {
    this.floor++;
    this.transition = null;
    this.projectiles.length = 0;
    this.fx.length = 0;
    this.zones.length = 0;
    this.particles.clear();
    this.damageNumbers.clear();
    this.roomCache = {};
    this.map = new GameMap(this.seed, this.floor);
    this.room = this._roomFor(this.map.start);
    this.map.current = this.map.start;
    this.map.visit(this.map.start);
    this._placePlayerAtEntry('bottom');
    this.player.heal(20);
    this.ui.showBanner('第 ' + this.floor + ' 层',
      '回廊重新排列 · ' + this.map.cells.length + ' 间', 2.4);
  }

  /* ---------------------------------------------------------
     房间创建与进入
     --------------------------------------------------------- */
  _createRoom(cell) {
    const seedKey = this.seed + '#' + this.floor + '#' + cell.c + ',' + cell.r;
    const rng = new Rng(hashSeed(seedKey));
    const tier = (this.floor - 1) * 2 +
      (cell.type === ROOM_TYPE.ELITE ? 3 : 0) +
      (cell.branch ? 1 : 0);
    return new Room(this, {
      def: cell,
      index: cell.id,
      depth: this.floor - 1,
      tier: tier,
      connections: this.map.connectionsOf(cell),
      rng: rng,
      roomSeed: seedKey
    });
  }

  /* 取（或首次创建）房间实例：已存在则复用，保证房间状态持久化 */
  _roomFor(cell) {
    const key = this.floor + '#' + cell.c + ',' + cell.r;
    let room = this.roomCache[key];
    if (!room) {
      room = this._createRoom(cell);
      this.roomCache[key] = room;
    }
    return room;
  }

  _placePlayerAtEntry(side) {
    const pos = this._entryPosition(side);
    this.player.x = pos.x;
    this.player.y = pos.y;
    this.player.invuln = Math.max(this.player.invuln, 0.8);
    this.room.clampEntity(this.player, this.room.doorsOpen);
  }

  _entryPosition(side) {
    const cx = ARENA.x + ARENA.w / 2;
    const cy = ARENA.y + ARENA.h / 2;
    switch (side) {
      case 'top': return { x: cx, y: ARENA.y + 78 };
      case 'bottom': return { x: cx, y: ARENA.y + ARENA.h - 78 };
      case 'left': return { x: ARENA.x + 88, y: cy };
      default: return { x: ARENA.x + ARENA.w - 88, y: cy };
    }
  }

  _enterCell(cell, fromSide) {
    const alreadyVisited = this.map.isVisited(cell);
    this.map.current = cell;
    this.map.visit(cell);
    this.projectiles.length = 0;
    this.particles.clear();
    this.damageNumbers.clear();

    /* 复用已有房间实例：已清空的房间不会再刷敌人，已开过的宝箱不会重置 */
    this.room = this._roomFor(cell);
    this.room.onReenter();
    this._placePlayerAtEntry(fromSide ? OPPOSITE_DOOR[fromSide] : 'bottom');

    const meta = ROOM_META[cell.type];
    let sub;
    if (alreadyVisited) {
      if (cell.type === ROOM_TYPE.BOSS && this.room.state === 'clear') {
        sub = '守望者已陨落 · 触碰裂隙进入下一层';
      } else if (this.room.isCombatRoom && this.room.state !== 'clear') {
        sub = '返回之前的房间 · 战斗继续';
      } else if (cell.type === ROOM_TYPE.TREASURE || cell.type === ROOM_TYPE.SHOP ||
                 cell.type === ROOM_TYPE.EVENT) {
        sub = '已探索 · 开启过的物件保持原样';
      } else {
        sub = '已探索 · 房间保持清空状态';
      }
    } else if (cell.type === ROOM_TYPE.BOSS) sub = '守望者就在前方';
    else if (cell.type === ROOM_TYPE.TREASURE) sub = '按 E 开启宝箱';
    else if (cell.type === ROOM_TYPE.SHOP) sub = '按 E 购买强化';
    else if (cell.type === ROOM_TYPE.EVENT) sub = '按 E 触碰异象';
    else if (cell.type === ROOM_TYPE.ELITE) sub = '强力残形盘踞';
    else if (cell.type === ROOM_TYPE.START) sub = '走进门洞开始探索';
    else sub = '击败所有残形，门才会开启';
    this.ui.showBanner(meta.cn, sub, alreadyVisited ? 1.2 : 1.5);
  }

  /* 走进门洞 → 摄像机滑向相邻房间 */
  enterDoor(door) {
    if (this.transition) return;
    const target = this.map.neighbor(this.map.current, door.side);
    if (!target) return;
    this.transition = { t: 0, dur: 0.62, dir: door.dir, prevRoom: this.room };
    this._enterCell(target, door.side);
  }

  _updateTransition(dt) {
    const tr = this.transition;
    tr.t += dt;
    if (tr.t >= tr.dur) this.transition = null;
  }

  /* ---------------------------------------------------------
     投射物
     --------------------------------------------------------- */
  spawnProjectile(opt) {
    const p = new Projectile(opt);
    this.projectiles.push(p);
    return p;
  }

  /* =========================================================
     道具机制的战斗结算
     ========================================================= */

  /* 命中敌人：吸血 / 状态 / 击退 */
  _onHit(p, e, dmg, crit) {
    const player = this.player;
    if (p.burn > 0) e.applyStatus('burn', p.burn);
    if (p.poison > 0) e.applyStatus('poison', p.poison);
    if (p.slow > 0) e.applyStatus('slow', p.slow);
    if (p.freeze > 0 && chance(Math.min(0.75, 0.18 * p.freeze))) e.applyStatus('freeze', p.freeze);

    if (p.knockback > 0) {
      const ang = angleTo(p.x, p.y, e.x, e.y);
      const boost = (p.slowKnock > 0 && e.slowT > 0) ? 2 : 1;
      const force = 130 * p.knockback * boost;
      e.kx += Math.cos(ang) * force;
      e.ky += Math.sin(ang) * force;
    }

    if (p.lifesteal > 0 && !player.dead) {
      const mul = (crit && p.critVamp > 0) ? 3 : 1;
      player._lsAcc = (player._lsAcc || 0) + dmg * 0.08 * p.lifesteal * mul;
      if (player._lsAcc >= 1) {
        const g = Math.floor(player._lsAcc);
        player._lsAcc -= g;
        player.hp = Math.min(player.maxHp, player.hp + g);
      }
    }
  }

  /* 子弹结束使命（命中或寿命耗尽）时的一次性结算 */
  _bulletImpact(p, x, y, dmg, hitEnemy) {
    if (p.explode > 0) {
      const radius = 48 + 14 * p.explode + (p.homingExplode > 0 ? 22 : 0);
      this._explode(x, y, radius, dmg, {
        color: p.color,
        burn: p.burnExplode > 0 ? Math.max(1, p.burn) : 0,
        slow: p.slowExplode > 0,
        zone: p.slowExplode > 0
      });
    }
    if (p.split > 0 && p.splitLeft > 0) {
      this._spawnSplit(p, x, y, Math.atan2(p.vy, p.vx));
    }
    if (p.chain > 0) this._chain(p, x, y, dmg);
  }

  /* 范围爆炸 */
  _explode(x, y, radius, dmg, opt) {
    opt = opt || {};
    const color = opt.color || '#ff8a5c';
    this.particles.ring(x, y, color, Math.round(radius * 0.45), radius * 3.2);
    this.particles.burst(x, y, 16, {
      speed: 260, life: 0.55, size: 5, colors: [color, '#ffffff', '#ffd35e']
    });
    this.addShake(2.6);

    const mul = opt.dmgMul === undefined ? 0.6 : opt.dmgMul;
    const amount = Math.max(1, Math.round(dmg * mul));
    const list = this.room ? this.room.enemies : [];
    for (const e of list) {
      if (e.dead) continue;
      if (dist2(x, y, e.x, e.y) > radius * radius) continue;
      e.takeDamage(amount, x, y);
      this.damageNumbers.add(e.x, e.y - e.r - 6, amount, { color: color });
      if (opt.freeze) e.applyStatus('freeze', 1);
      if (opt.slow) e.applyStatus('slow', 1);
      if (opt.burn) e.applyStatus('burn', opt.burn);
    }
    if (opt.zone) this.zones.push({ x: x, y: y, r: radius * 0.9, life: 2.5, t: 0 });
  }

  /* 分裂碎片 */
  _spawnSplit(p, x, y, baseAngle) {
    const n = Math.min(8, p.split);
    const proto = defaultMods();
    for (let i = 0; i < n; i++) {
      const a = baseAngle + (i - (n - 1) / 2) * 0.44;
      const opt = {
        x: x, y: y, angle: a, speed: p.speed * 0.9,
        damage: p.damage, r: Math.max(2.5, p.r * 0.76),
        friendly: true, color: p.color, core: p.core,
        life: 0.85, game: this, splitLeft: 0, isChild: true
      };
      for (const k in proto) opt[k] = 0;
      opt.damageMul = (p.damageMul || 1) * 0.55;
      /* 毒素完整继承（毒染裂片）或减半继承 */
      opt.poison = p.poisonSplit > 0 ? p.poison : Math.ceil(p.poison / 2);
      opt.burn = p.burn;
      opt.slow = p.slow;
      opt.freeze = p.freeze;
      opt.knockback = p.knockback;
      opt.lifesteal = p.lifesteal;
      opt.homing = (p.splitHoming > 0 || p.homing > 0) ? Math.max(1, p.homing) : 0;
      this.spawnProjectile(opt);
    }
    this.particles.burst(x, y, 6, { speed: 150, life: 0.3, size: 3, color: p.color });
  }

  /* 链式电弧 */
  _chain(p, x, y, dmg) {
    const jumps = Math.min(4, p.chain);
    const color = p.chainBurn > 0 ? '#ff9d3c' : (p.chainPoison > 0 ? '#9ad14f' : '#7fe4ff');
    const used = [];
    let cx = x, cy = y;
    const list = this.room ? this.room.enemies : [];
    for (let j = 0; j < jumps; j++) {
      let best = null, bestD = 260 * 260;
      for (const e of list) {
        if (e.dead || used.indexOf(e) >= 0) continue;
        const d = dist2(cx, cy, e.x, e.y);
        if (d < bestD) { bestD = d; best = e; }
      }
      if (!best) break;
      this._zap(cx, cy, best.x, best.y, color);
      const amount = Math.max(1, Math.round(dmg * 0.55));
      best.takeDamage(amount, cx, cy);
      this.damageNumbers.add(best.x, best.y - best.r - 6, amount, { color: color });
      if (p.chainPoison > 0) best.applyStatus('poison', Math.max(1, Math.ceil(p.poison / 2)));
      if (p.chainBurn > 0) best.applyStatus('burn', Math.max(1, Math.ceil(p.burn / 2)));
      if (p.chainExplode > 0 && p.explode > 0) {
        this._explode(best.x, best.y, 40 + 14 * p.explode, amount, { color: color });
      }
      used.push(best);
      cx = best.x; cy = best.y;
    }
  }

  _zap(x1, y1, x2, y2, color) {
    this.fx.push({ type: 'zap', x1: x1, y1: y1, x2: x2, y2: y2, life: 0.18, max: 0.18, color: color || '#7fe4ff' });
  }

  /* 烬迹：身周灼烧 */
  burnAround(x, y, radius, dmg) {
    const list = this.room ? this.room.enemies : [];
    for (const e of list) {
      if (e.dead) continue;
      if (dist2(x, y, e.x, e.y) > radius * radius) continue;
      e.applyStatus('burn', 1);
      e.takeDot(Math.max(1, Math.round(dmg)), this.player);
    }
    if (Math.random() < 0.6) {
      this.particles.spawn(x + rand(-14, 14), y + rand(-8, 14), rand(-16, 16), rand(-60, -24),
        rand(0.25, 0.5), rand(2, 4), '#ff9d3c', { drag: 2.4 });
    }
  }

  _updateFx(dt) {
    for (let i = this.fx.length - 1; i >= 0; i--) {
      this.fx[i].life -= dt;
      if (this.fx[i].life <= 0) this.fx.splice(i, 1);
    }
    for (let i = this.zones.length - 1; i >= 0; i--) {
      const z = this.zones[i];
      z.life -= dt;
      z.t += dt;
      if (z.life <= 0) { this.zones.splice(i, 1); continue; }
      const list = this.room ? this.room.enemies : [];
      for (const e of list) {
        if (e.dead) continue;
        if (dist2(z.x, z.y, e.x, e.y) > z.r * z.r) continue;
        e.applyStatus('slow', 1);
        e.takeDot(6 * dt, this.player);
      }
    }
  }

  _drawZones(ctx) {
    for (const z of this.zones) {
      const a = 0.10 + 0.05 * Math.sin(z.t * 4);
      const g = ctx.createRadialGradient(z.x, z.y, 4, z.x, z.y, z.r);
      g.addColorStop(0, `rgba(90,169,255,${a + 0.10})`);
      g.addColorStop(1, 'rgba(90,169,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,210,255,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  _drawFx(ctx) {
    for (const f of this.fx) {
      const a = clamp(f.life / f.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 3.5;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      /* 折线电弧 */
      const seg = 5;
      ctx.moveTo(f.x1, f.y1);
      for (let i = 1; i < seg; i++) {
        const t = i / seg;
        const nx = lerp(f.x1, f.x2, t) + rand(-7, 7);
        const ny = lerp(f.y1, f.y2, t) + rand(-7, 7);
        ctx.lineTo(nx, ny);
      }
      ctx.lineTo(f.x2, f.y2);
      ctx.stroke();
      ctx.restore();
    }
  }

  _drawStatusRing(ctx, e) {
    let color = null;
    if (e.freezeT > 0) color = '#8fd8ff';
    else if (e.burnT > 0 && e.burnStack >= e.poisonStack) color = '#ff9d3c';
    else if (e.poisonT > 0) color = '#9ad14f';
    else if (e.slowT > 0) color = '#5aa9ff';
    if (!color) return;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 5, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 3, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  _updateProjectiles(dt) {
    const room = this.room;
    const player = this.player;

    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      p.update(dt);

      if (p.dead) {
        if (p.friendly && p.explode > 0) {
          const dmg = p.damage * (p.damageMul || 1);
          this._explode(p.x, p.y, 48 + 14 * p.explode, dmg, { color: p.color });
        }
        this.projectiles.splice(i, 1);
        continue;
      }

      /* 撞墙：反弹或消散 */
      if (room.hitsWall(p.x, p.y, p.r)) {
        const boomerang = p.orbit > 0;      // 回旋弹永远不会被墙吃掉
        if (p.bounce > 0 || boomerang) {
          room.bounceOffWalls(p);
          if (p.bounce > 0) p.bounce--;
          this.particles.burst(p.x, p.y, 4, {
            speed: 140, life: 0.24, size: 3, color: p.color, drag: 6
          });
          if (p.bounceHoming > 0) { p.homing = Math.max(1, p.homing); p.hitIds.length = 0; }
          if (p.endlessRefract > 0) p.pierce = Math.max(1, p.pierce);
          if (p.bounceExplode > 0 && p.explode > 0) {
            this._explode(p.x, p.y, 42 + 14 * p.explode, p.damage * (p.damageMul || 1), { color: p.color });
          }
          continue;
        }
        this.particles.burst(p.x, p.y, 5, {
          speed: 130, life: 0.26, size: 3, color: p.color, drag: 6
        });
        this.projectiles.splice(i, 1);
        continue;
      }

      if (p.friendly) {
        let hit = null;
        for (const e of room.enemies) {
          if (e.dead) continue;
          if (p.hitIds.indexOf(e) >= 0) continue;
          if (Collision.circleCircle(p.x, p.y, p.r, e.x, e.y, e.r)) { hit = e; break; }
        }
        if (hit) {
          const crit = chance(player.critChance);
          let dmg = p.damage * (p.damageMul || 1);
          if (crit) dmg *= player.critDamage;
          dmg = Math.max(1, Math.round(dmg));

          hit.takeDamage(dmg, p.x, p.y);
          this._onHit(p, hit, dmg, crit);

          this.damageNumbers.add(hit.x, hit.y - hit.r - 6, dmg, { crit: crit });
          this.particles.burst(p.x, p.y, crit ? 9 : 4, {
            speed: 180, life: 0.3, size: 3.2,
            color: crit ? '#ffd85e' : '#ffcf8a',
            dir: Math.atan2(p.vy, p.vx) + Math.PI, spread: 1.7
          });
          if (crit) this.addShake(2.4);

          /* 穿透 / 回旋：继续飞行 */
          if (p.pierce > 0 || p.orbit > 0) {
            p.hitIds.push(hit);
            if (p.pierce > 0 && !(p.orbitPierce > 0)) p.pierce--;
            if (p.burnPierce > 0) hit.applyStatus('burn', 1);
            if (p.freezePierce > 0) hit.applyStatus('freeze', Math.max(1, p.freeze));
            if (p.pierceSplit > 0 && p.splitLeft > 0) {
              this._spawnSplit(p, hit.x, hit.y, Math.atan2(p.vy, p.vx));
              p.splitLeft--;
            }
            continue;
          }

          this._bulletImpact(p, hit.x, hit.y, dmg, hit);
          this.projectiles.splice(i, 1);
          continue;
        }
      } else {
        if (!player.dead && Collision.circleCircle(p.x, p.y, p.r, player.x, player.y, player.r)) {
          player.takeDamage(p.damage, p.x, p.y);
          this.ui.hitVignette = 1;
          this.particles.burst(p.x, p.y, 6, {
            speed: 150, life: 0.3, size: 3.4, color: '#7fe4ff', drag: 5
          });
          this.projectiles.splice(i, 1);
          continue;
        }
      }
    }
  }

  addShake(v) {
    this.shake = Math.min(22, this.shake + v);
  }

  /* ---------------------------------------------------------
     更新
     --------------------------------------------------------- */
  update(dt) {
    this.time += dt;
    this.ui.update(dt);
    this.mouseWorld = this.input.toWorld();

    /* 触屏：首次触摸自动切换模式；瞄准摇杆直接改写成世界瞄准点 */
    if (this.input.touch.active && !this.touchMode) this._enableTouchMode();
    if (this.touchMode) {
      const ad = this.input.aimDir();
      if (ad && this.player) {
        this.mouseWorld = {
          x: this.player.x + ad.x * 300,
          y: this.player.y + ad.y * 300
        };
      }
    }

    if (this.input.wasPressed('KeyF')) this.toggleFullscreen();

    if (this.state === 'title') {
      if (this.input.wasPressed('Enter') || this.input.wasPressed('Space')) {
        this.startRun(this.ui.readSeedInput());
      }
      this.input.endFrame();
      return;
    }

    if (this.state === 'gameover') {
      if (this.input.wasPressed('KeyR') || this.input.wasPressed('Enter')) {
        this.startRun(this.ui.readSeedInput());
      }
      this.particles.update(dt);
      this.damageNumbers.update(dt);
      this.shake = Math.max(0, this.shake - dt * 45);
      this.input.endFrame();
      return;
    }

    if (this.state === 'paused') {
      if (this.input.wasPressed('Escape') || this.input.wasPressed('Enter')) this.resume();
      if (this.input.wasPressed('KeyR')) this.startRun(this.ui.readSeedInput());
      this.input.endFrame();
      return;
    }

    /* --- 游戏中 --- */
    if (this.input.wasPressed('Escape')) { this.pause(); this.input.endFrame(); return; }
    if (this.input.wasPressed('KeyR')) { this.startRun(this.ui.readSeedInput()); this.input.endFrame(); return; }

    /* 摄像机滑动期间：世界照常运转，只是不再触发新的门 */
    if (this.transition) this._updateTransition(dt);

    this.player.update(dt, this.input);
    this.room.update(dt);
    this._updateProjectiles(dt);
    this._updateFx(dt);
    this.particles.update(dt);
    this.damageNumbers.update(dt);
    this.shake = Math.max(0, this.shake - dt * 45);

    /* 交互物件 */
    this.nearProp = null;
    for (const pr of this.room.props) {
      if (!pr.used && pr.inRange(this.player)) { this.nearProp = pr; break; }
    }
    if (this.nearProp && this.input.wasPressed('KeyE')) this.nearProp.use();

    /* 走进门洞 → 下一间 */
    if (!this.transition) {
      const door = this.room.doorUnder(this.player.x, this.player.y);
      if (door) this.enterDoor(door);
    }

    this.input.endFrame();
  }

  /* ---------------------------------------------------------
     绘制
     --------------------------------------------------------- */
  _drawRoomScene(room, withPlayer) {
    const ctx = this.ctx;
    room.drawFloor(ctx);
    this._drawZones(ctx);
    room.drawProps(ctx);
    for (const e of room.enemies) e.draw(ctx);
    for (const e of room.enemies) if (e.hasStatus()) this._drawStatusRing(ctx, e);
    if (withPlayer) {
      this.player.draw(ctx);
      for (const p of this.projectiles) p.draw(ctx);
      this._drawFx(ctx);
      this.particles.draw(ctx);
      this.damageNumbers.draw(ctx);
    }
    room.drawWalls(ctx);
  }

  draw() {
    const ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#05070c';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    const sh = this.shake;
    ctx.save();
    if (sh > 0.05) ctx.translate(rand(-sh, sh), rand(-sh, sh));

    if (this.transition) {
      /* 摄像机沿行进方向滑动：旧房间滑出，新房间滑入 */
      const tr = this.transition;
      const t = easeInOutCubic(clamp(tr.t / tr.dur, 0, 1));
      const O = { x: tr.dir.x * VIEW_W, y: tr.dir.y * VIEW_H };

      ctx.save();
      ctx.translate(-O.x * t, -O.y * t);
      this._drawRoomScene(tr.prevRoom, false);
      ctx.restore();

      ctx.save();
      ctx.translate(O.x * (1 - t), O.y * (1 - t));
      this._drawRoomScene(this.room, true);
      ctx.restore();
    } else {
      this._drawRoomScene(this.room, true);
    }

    ctx.restore();

    this.ui.drawBanner(ctx);
    if (this.state !== 'title') this.ui.drawHUD(ctx);
    if (this.state === 'playing' && !this.transition) this.ui.drawCrosshair(ctx);
    if (this.touchMode) this.ui.drawTouchControls(ctx);
  }

  /* ---------------------------------------------------------
     主循环
     --------------------------------------------------------- */
  loop(ts) {
    const now = ts / 1000;
    if (this._last === undefined) this._last = now;
    let dt = now - this._last;
    this._last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    this._fpsAcc += dt;
    this._fpsFrames++;
    if (this._fpsAcc >= 0.5) {
      this.fps = Math.round(this._fpsFrames / this._fpsAcc);
      this._fpsAcc = 0;
      this._fpsFrames = 0;
    }

    this.update(dt);
    this.draw();

    const ctx = this.ctx;
    ctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(120,150,170,0.55)';
    ctx.fillText(`${this.fps} FPS`, VIEW_W - 26, VIEW_H - 18);
    ctx.textAlign = 'left';

    requestAnimationFrame((t) => this.loop(t));
  }

  start() {
    requestAnimationFrame((t) => this.loop(t));
  }
}

/* 门的对侧映射 */
const OPPOSITE_DOOR = {
  top: 'bottom',
  bottom: 'top',
  left: 'right',
  right: 'left'
};

</script>
<script>
/* ===========================================================
   main.js — 启动入口
   =========================================================== */
'use strict';

(function () {
  function boot() {
    const canvas = document.getElementById('game-canvas');
    if (!canvas) return;

    const game = new Game(canvas);

    /* 方便调试：控制台可直接访问 game */
    window.game = game;

    const fsBtn = document.getElementById('fs-btn');
    if (fsBtn) {
      fsBtn.addEventListener('click', () => {
        game.toggleFullscreen();
        fsBtn.blur();
      });
    }

    /* 竖屏提示：可以关掉，关掉后不再弹出 */
    const rhBtn = document.getElementById('rh-btn');
    if (rhBtn) {
      rhBtn.addEventListener('click', () => {
        game.rotateHintDismissed = true;
        const el = document.getElementById('rotate-hint');
        if (el) el.classList.add('hidden');
        rhBtn.blur();
      });
    }

    /* 任意位置的首次触摸都立刻切到触屏模式（包括标题面板上的点击） */
    const onFirstTouch = (e) => {
      if (e.pointerType && e.pointerType !== 'touch') return;
      game._enableTouchMode();
      window.removeEventListener('pointerdown', onFirstTouch, true);
    };
    window.addEventListener('pointerdown', onFirstTouch, true);

    /* 双击页面也可进入/继续（手机上手势兜底） */
    document.addEventListener('dblclick', (e) => {
      if (e.target && e.target.tagName === 'BUTTON') return;
      game.primaryAction();
    });

    game.start();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
