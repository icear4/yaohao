<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070c">
<title>残响回廊 · ECHO RIFT</title>
<style>
/* ===========================================================
   残响回廊 · ECHO RIFT  — 页面样式
   画布为 16:9 逻辑分辨率，由 JS 等比缩放填充窗口
   =========================================================== */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05070c;
  color: #cfd8e3;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;             /* 禁掉移动端滑动/缩放手势 */
  overscroll-behavior: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 40%, #101a24 0%, #070b11 55%, #04060a 100%);
}

#stage {
  position: absolute;
  left: 50%;
  top: 50%;
  margin-left: -640px;
  margin-top: -360px;
  width: 1280px;
  height: 720px;
  transform-origin: 50% 50%;      /* 由 JS 设置 scale，永远等比不拉伸 */
  border-radius: 10px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(120, 190, 220, 0.14),
    0 0 60px rgba(0, 0, 0, 0.85),
    0 0 120px rgba(40, 120, 140, 0.10);
  background: #05070c;
}

/* 触屏（手机 / 平板）：铺满整屏，去掉桌面装饰 */
body.touch-mode #stage {
  border-radius: 0;
  box-shadow: none;
}
body.touch-mode #fs-btn { display: none; }

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: none;
  image-rendering: auto;
  touch-action: none;
}

#ui-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* ---------- HUD 角落按钮（右下角，避开右上小地图） ---------- */
#fs-btn, #shake-btn {
  position: absolute;
  bottom: 14px;
  right: 16px;
  pointer-events: auto;
  padding: 7px 14px;
  font: 600 12px/1 "Segoe UI", "PingFang SC", system-ui, sans-serif;
  letter-spacing: 1px;
  color: #7fd7ea;
  background: rgba(12, 26, 34, 0.72);
  border: 1px solid rgba(90, 190, 215, 0.35);
  border-radius: 6px;
  cursor: pointer;
  transition: background .18s, color .18s, border-color .18s;
}
#fs-btn:hover, #shake-btn:hover {
  background: rgba(20, 48, 60, 0.92);
  color: #d8fbff;
  border-color: rgba(120, 230, 255, 0.7);
}

/* 抖动按钮排在全屏按钮左侧；触屏模式下全屏按钮隐藏，它补位 */
#shake-btn { right: 96px; }
body.touch-mode #shake-btn { right: 16px; }

/* ---------- 遮罩面板 ---------- */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  background: radial-gradient(circle at 50% 45%, rgba(8, 14, 20, .78) 0%, rgba(3, 5, 9, .94) 70%);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  transition: opacity .22s ease;
}
.overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.panel {
  width: min(560px, 82%);
  padding: 34px 40px 30px;
  text-align: center;
  border: 1px solid rgba(255, 168, 76, 0.22);
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(18, 22, 30, .92) 0%, rgba(9, 12, 17, .95) 100%);
  box-shadow: 0 18px 60px rgba(0, 0, 0, .7), inset 0 0 40px rgba(255, 150, 60, .05);
}

.ov-kicker {
  font: 600 10px/1 "Segoe UI", system-ui, sans-serif;
  letter-spacing: 4px;
  color: #6b7c8c;
  margin-bottom: 14px;
}

.ov-title-cn {
  margin: 0;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 10px;
  color: #ffcf8a;
  text-shadow: 0 0 24px rgba(255, 160, 60, .45), 0 0 60px rgba(255, 120, 40, .2);
}

.ov-title-en {
  margin-top: 6px;
  font: 700 13px/1 "Segoe UI", system-ui, sans-serif;
  letter-spacing: 8px;
  color: #4e6b78;
}

.ov-text {
  margin: 22px auto 26px;
  max-width: 420px;
  font-size: 13.5px;
  line-height: 1.85;
  color: #9fb0c0;
}

.primary-btn {
  pointer-events: auto;
  padding: 12px 34px;
  font: 700 15px/1 "Segoe UI", "PingFang SC", system-ui, sans-serif;
  letter-spacing: 3px;
  color: #1a1005;
  background: linear-gradient(180deg, #ffcb7a 0%, #f59b3c 100%);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 6px 22px rgba(255, 150, 50, .28);
  transition: transform .12s ease, box-shadow .18s ease, filter .18s ease;
}
.primary-btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.08);
  box-shadow: 0 10px 30px rgba(255, 160, 60, .42);
}
.primary-btn:active { transform: translateY(1px); }

.ov-hint {
  margin-top: 16px;
  font-size: 11.5px;
  letter-spacing: 1px;
  color: #5d6f7e;
}

/* ---------- Seed 输入 ---------- */
#seed-input {
  display: block;
  margin: 18px auto 0;
  width: 220px;
  padding: 9px 12px;
  text-align: center;
  font: 700 13px/1 "Segoe UI", system-ui, sans-serif;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #ffd28a;
  background: rgba(8, 12, 18, 0.85);
  border: 1px solid rgba(120, 190, 220, 0.28);
  border-radius: 6px;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
#seed-input::placeholder {
  color: #56687a;
  letter-spacing: 0.5px;
  font-weight: 600;
  text-transform: none;
}
#seed-input:focus {
  border-color: rgba(255, 190, 100, 0.7);
  box-shadow: 0 0 12px rgba(255, 170, 60, 0.22);
}

/* ===========================================================
   竖屏提示（在 #stage 之外，不随画布缩放）
   =========================================================== */
#rotate-hint {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(3, 5, 9, 0.94);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#rotate-hint.hidden { display: none; }

.rh-box {
  width: min(420px, 86%);
  padding: 30px 26px 24px;
  text-align: center;
  border: 1px solid rgba(255, 168, 76, 0.22);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(18, 22, 30, .95) 0%, rgba(9, 12, 17, .97) 100%);
}
.rh-icon {
  font-size: 46px;
  line-height: 1;
  color: #ffcf8a;
  animation: rh-rotate 2.4s ease-in-out infinite;
}
@keyframes rh-rotate {
  0%, 45% { transform: rotate(0deg); }
  70%, 100% { transform: rotate(90deg); }
}
.rh-title {
  margin-top: 16px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #ffcf8a;
}
.rh-sub {
  margin-top: 8px;
  font-size: 13.5px;
  line-height: 1.7;
  color: #9fb0c0;
}
#rh-btn {
  margin-top: 20px;
  padding: 10px 26px;
  font: 700 14px/1 "Segoe UI", "PingFang SC", system-ui, sans-serif;
  letter-spacing: 2px;
  color: #7fd7ea;
  background: rgba(12, 26, 34, 0.8);
  border: 1px solid rgba(90, 190, 215, 0.4);
  border-radius: 8px;
}

/* ===========================================================
   小屏排版：舞台整体被 scale 缩小，这里按比例放大字号补偿
   =========================================================== */
@media (max-height: 560px) {
  .panel { width: min(760px, 90%); padding: 22px 28px 20px; }
  .ov-kicker { font-size: 13px; margin-bottom: 10px; }
  .ov-title-cn { font-size: 60px; letter-spacing: 12px; }
  .ov-title-en { font-size: 17px; letter-spacing: 9px; }
  .ov-text { font-size: 18px; line-height: 1.75; margin: 16px auto 18px; max-width: 600px; }
  .primary-btn { padding: 16px 42px; font-size: 20px; }
  #seed-input { width: 300px; padding: 12px 14px; font-size: 16px; }
  .ov-hint { font-size: 15px; margin-top: 14px; }
}

@media (max-width: 560px) {
  .panel { width: 92%; padding: 24px 22px 20px; }
  .ov-title-cn { font-size: 46px; letter-spacing: 6px; }
  .ov-text { font-size: 15px; max-width: none; }
  #seed-input { width: 86%; }
  .primary-btn { padding: 14px 30px; font-size: 17px; }
}

/* ===========================================================
   Meta Progression 面板：角色 / 统计 / 解锁图鉴
   =========================================================== */
.panel.wide { width: min(880px, 94%); padding: 26px 30px 22px; }
.panel.wide .ov-title-cn { font-size: 34px; letter-spacing: 8px; }
.panel.wide .ov-text { max-width: 820px; margin: 16px auto 18px; }

.ov-actions {

  gap: 10px;
  justify-content: center;
  margin-top: 14px;
}
.ov-actions button {
  pointer-events: auto;
  padding: 8px 18px;
  font: 700 12px/1 "Segoe UI", "PingFang SC", system-ui, sans-serif;
  letter-spacing: 2px;
  color: #7fd7ea;
  background: rgba(12, 26, 34, 0.78);
  border: 1px solid rgba(90, 190, 215, 0.34);
  border-radius: 7px;
  cursor: pointer;
  transition: background .18s, color .18s, border-color .18s;
}
.ov-actions button:hover {
  background: rgba(20, 48, 60, 0.92);
  color: #d8fbff;
  border-color: rgba(120, 230, 255, 0.7);
}
.ov-actions button.danger {
  color: #ff8a8a;
  border-color: rgba(200, 90, 90, 0.4);
}
.ov-actions button.danger:hover {
  background: rgba(60, 22, 26, 0.9);
  border-color: rgba(255, 120, 120, 0.7);
}

/* ---------- 角色卡片 ---------- */
.char-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
  text-align: left;
}
.char-card {
  padding: 12px 14px 11px;
  border: 1px solid rgba(120, 190, 220, 0.18);
  border-radius: 9px;
  background: rgba(10, 16, 22, 0.72);
  cursor: pointer;
  transition: border-color .16s, background .16s, transform .12s;
}
.char-card:hover { transform: translateY(-2px); border-color: rgba(120, 230, 255, 0.5); }
.char-card.sel {
  border-color: rgba(255, 190, 100, 0.85);
  background: rgba(40, 28, 12, 0.5);
  box-shadow: inset 0 0 24px rgba(255, 160, 60, 0.12);
}
.char-card.locked { opacity: 0.55; cursor: not-allowed; }
.char-card.locked:hover { transform: none; border-color: rgba(120, 190, 220, 0.18); }
.cc-head { display: flex; align-items: baseline; gap: 8px; }
.cc-name { font-size: 17px; font-weight: 800; color: #ffcf8a; letter-spacing: 1px; }
.cc-en { font: 700 10px/1 system-ui, sans-serif; letter-spacing: 2px; color: #4e6b78; }
.cc-badge {
  margin-left: auto;
  padding: 3px 8px;
  font: 700 10px/1 system-ui, sans-serif;
  letter-spacing: 1px;
  color: #1a1005;
  background: #ffcb7a;
  border-radius: 4px;
}
.cc-badge.lock { color: #cbd6e0; background: rgba(90, 110, 130, 0.5); }
.cc-tag { margin-top: 5px; font-size: 12px; font-weight: 700; color: #7fd7ea; }
.cc-desc { margin-top: 5px; font-size: 12px; line-height: 1.6; color: #93a5b5; }
.cc-abil { margin-top: 6px; font-size: 11.5px; line-height: 1.6; color: #c08bff; }
.cc-abil b { color: #a06bff; }
.cc-stats { margin-top: 6px; font-size: 11.5px; color: #7f93a4; }
.cc-stats b { color: #ffd28a; }
.cc-cond { margin-top: 6px; font-size: 11px; color: #ff8a8a; }

/* ---------- 统计 ---------- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
}
.stat {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 9px 12px;
  border: 1px solid rgba(120, 190, 220, 0.15);
  border-radius: 7px;
  background: rgba(10, 16, 22, 0.66);
}
.stat span { font-size: 11.5px; color: #7f93a4; letter-spacing: 1px; }
.stat b { font-size: 16px; color: #ffd28a; }
.codex-note {
  margin-top: 12px;
  font-size: 12px;
  line-height: 1.7;
  color: #8fa3b5;
}
.codex-note b { color: #ffcf8a; }
.warn-box {
  padding: 16px;
  font-size: 13px;
  line-height: 1.8;
  color: #ffb0b0;
  border: 1px solid rgba(220, 100, 100, 0.35);
  border-radius: 8px;
  background: rgba(40, 12, 16, 0.5);
}
.row-btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
.cc-btn {
  pointer-events: auto;
  padding: 9px 20px;
  font: 700 12px/1 "Segoe UI", "PingFang SC", system-ui, sans-serif;
  letter-spacing: 2px;
  color: #7fd7ea;
  background: rgba(12, 26, 34, 0.8);
  border: 1px solid rgba(90, 190, 215, 0.35);
  border-radius: 7px;
  cursor: pointer;
}
.cc-btn.danger { color: #ff8a8a; border-color: rgba(200, 90, 90, 0.45); }

/* ---------- 解锁图鉴 ---------- */
.cdx-group { margin-bottom: 14px; text-align: left; }
.cdx-title {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #ffcf8a;
  border-bottom: 1px solid rgba(255, 190, 100, 0.2);
  padding-bottom: 5px;
  margin-bottom: 7px;
}
.cdx-title span { float: right; color: #7f93a4; font-weight: 600; letter-spacing: 0; }
.cdx-row {
  display: grid;
  grid-template-columns: 110px 1fr 120px 52px;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 6px;
  background: rgba(10, 16, 22, 0.5);
  margin-bottom: 4px;
}
.cdx-row.got { background: rgba(30, 46, 34, 0.5); }
.cdx-name { font-size: 12.5px; font-weight: 700; color: #9fb0c0; }
.cdx-row.got .cdx-name { color: #7dffb0; }
.cdx-cond { font-size: 11.5px; color: #7f93a4; }
.cdx-bar {
  height: 6px;
  border-radius: 3px;
  background: rgba(80, 100, 120, 0.3);
  overflow: hidden;
}
.cdx-bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #7fd7ea, #ffcb7a);
}
.cdx-pct { font-size: 11px; text-align: right; color: #7f93a4; }
.cdx-row.got .cdx-pct { color: #7dffb0; }

@media (max-width: 700px) {
  .cdx-row { grid-template-columns: 92px 1fr 46px; }
  .cdx-bar { display: none; }
}

</style>

<body>

<div id="stage">
  <canvas id="game-canvas" width="1280" height="720"></canvas>

  <div id="ui-layer">
    <button id="shake-btn" type="button">抖动 · 弱</button>
    <button id="fs-btn" type="button">全屏 · F</button>

    <div id="overlay" class="overlay">
      <div class="panel">
        <div class="ov-kicker" id="ov-kicker">ORIGINAL ROGUELIKE SHOOTER</div>
        <h1 class="ov-title-cn" id="ov-title-cn">残响回廊</h1>
        <div class="ov-title-en" id="ov-title-en">ECHO RIFT</div>
        <p class="ov-text" id="ov-text">
          星脉崩解之后，回廊在裂隙中生长。<br>
          徘徊其中的，是回声凝成的残形。<br><br>
          你是最后的拾火者，收集余烬，向更深处走。
        </p>
        <button class="primary-btn" id="ov-btn" type="button">开始探索</button>
        <input id="seed-input" type="text" maxlength="12" spellcheck="false"
               placeholder="输入 Seed（留空则随机）" autocomplete="off">
        <div class="ov-actions" id="ov-actions"></div>
        <div class="ov-hint" id="ov-hint">WASD 移动 · 鼠标瞄准 · 左键射击 · ESC 暂停 · F 全屏</div>
      </div>
    </div>
  </div>
</div>

<div id="rotate-hint" class="hidden">
  <div class="rh-box">
    <div class="rh-icon">▭</div>
    <div class="rh-title">横屏体验更佳</div>
    <div class="rh-sub">把设备转向横向，回廊会铺满整块屏幕</div>
    <button id="rh-btn" type="button">仍要竖屏</button>
  </div>
</div>

<script>
/* ===========================================================
   utils.js — 全局常量与数学 / 绘图工具
   =========================================================== */
'use strict';

/* 逻辑分辨率（所有游戏坐标都基于这个尺寸） */
const VIEW_W = 1280;
const VIEW_H = 720;

/* 房间墙厚与门宽 */
const WALL_T = 44;
const DOOR_W = 132;

/* 房间内部可行走区域 */
const ARENA = {
  x: WALL_T,
  y: WALL_T,
  w: VIEW_W - WALL_T * 2,
  h: VIEW_H - WALL_T * 2
};

const TAU = Math.PI * 2;

function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function chance(p) { return Math.random() < p; }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

function dist(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  return Math.sqrt(dx * dx + dy * dy);
}
function dist2(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  return dx * dx + dy * dy;
}
function angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }

/* 点到线段的最短距离（激光 / 冲刺轨迹的命中判定） */
function pointSegDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 <= 0.0001) return dist(px, py, x1, y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  return dist(px, py, x1 + dx * t, y1 + dy * t);
}

/* 最短弧的角度差（b - a），范围 -PI..PI */
function angleDelta(a, b) {
  return ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
}

/* 角度插值（走最短弧） */
function angleLerp(a, b, t) {
  let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}

/* 确定性哈希，用于地板花纹等（保证同一房间每次一致） */
function hash2(x, y) {
  const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return h - Math.floor(h);
}

/* 缓动 */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

/* 圆角矩形路径 */
function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/* 多边形路径（用于绘制楔形 / 棱形） */
function polygonPath(ctx, points) {
  ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
}

/* ===========================================================
   种子随机数系统
   —— 地图 / 房间类型 / 敌人 / 道具 / 宝箱 使用 Rng（可复现）
   —— 粒子、抖动等表现层随机继续用 Math.random，不影响复现性
   =========================================================== */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  str = String(str);
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

class Rng {
  constructor(seed) {
    const s = (typeof seed === 'number' ? seed : hashSeed(seed)) >>> 0;
    this.s = s === 0 ? 1 : s;
  }
  /* mulberry32 */
  next() {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + this.next() * (b - a); }
  int(a, b) { return Math.floor(a + this.next() * (b - a + 1)); }   // 闭区间
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  chance(p) { return this.next() < p; }
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  fork(salt) { return new Rng(hashSeed(this.s + '|' + String(salt))); }
}

const SEED_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function randomSeedString(len) {
  len = len || 6;
  let s = '';
  for (let i = 0; i < len; i++) {
    s += SEED_ALPHABET[Math.floor(Math.random() * SEED_ALPHABET.length)];
  }
  return s;
}

</script>
<script>
/* ===========================================================
   input.js — 键盘 / 鼠标输入管理器
   鼠标坐标会被换算回 1280x720 的逻辑世界坐标
   =========================================================== */
'use strict';

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = new Set();       // 当前按住
    this.pressed = new Set();    // 本帧刚按下（每帧末清空）
    this.mouse = { cx: 0, cy: 0, down: false };
    this.mouseWorld = { x: VIEW_W * 0.5, y: VIEW_H * 0.5 };
    this._mv = { x: 0, y: 0 };   // moveVector 的复用对象
    this.touch = new TouchControls(canvas);
    this._bind();
  }

  _bind() {
    const stopKeys = new Set([
      'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'KeyW', 'KeyA', 'KeyS', 'KeyD'
    ]);

    window.addEventListener('keydown', (e) => {
      if (stopKeys.has(e.code)) e.preventDefault();
      if (!this.keys.has(e.code)) this.pressed.add(e.code);
      this.keys.add(e.code);
    });

    window.addEventListener('keyup', (e) => {
      this.keys.delete(e.code);
    });

    window.addEventListener('blur', () => {
      this.keys.clear();
      this.mouse.down = false;
      if (this.touch) this.touch.releaseAll();
      if (this.onBlur) this.onBlur();
    });

    this.canvas.addEventListener('mousemove', (e) => {
      this.mouse.cx = e.clientX;
      this.mouse.cy = e.clientY;
    });

    this.canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        this.mouse.down = true;
        this.mouse.cx = e.clientX;
        this.mouse.cy = e.clientY;
        if (this.onMouseDown) this.onMouseDown();
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) this.mouse.down = false;
    });

    this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  isDown(code) { return this.keys.has(code); }
  wasPressed(code) { return this.pressed.has(code); }

  /* 移动向量：键盘方向键 / WASD 与虚拟摇杆合并，结果已归一化（长度 <= 1） */
  moveVector() {
    let mx = 0, my = 0;
    if (this.isDown('KeyA') || this.isDown('ArrowLeft')) mx -= 1;
    if (this.isDown('KeyD') || this.isDown('ArrowRight')) mx += 1;
    if (this.isDown('KeyW') || this.isDown('ArrowUp')) my -= 1;
    if (this.isDown('KeyS') || this.isDown('ArrowDown')) my += 1;

    const t = this.touch;
    if (t && t.move.active) { mx += t.move.x; my += t.move.y; }

    const len = Math.hypot(mx, my);
    if (len > 1) { mx /= len; my /= len; }
    this._mv.x = mx; this._mv.y = my;
    return this._mv;
  }

  /* 是否正在开火：鼠标左键 或 瞄准摇杆按住 */
  firing() {
    return this.mouse.down || !!(this.touch && this.touch.firing);
  }

  /* 触屏瞄准方向（单位向量），未使用摇杆时返回 null */
  aimDir() {
    const t = this.touch;
    if (!t || !t.aim.active) return null;
    if (t.aim.x === 0 && t.aim.y === 0) return null;
    const len = Math.hypot(t.aim.x, t.aim.y) || 1;
    return { x: t.aim.x / len, y: t.aim.y / len };
  }

  /* 把客户端坐标换算成逻辑世界坐标 */
  toWorld() {
    const r = this.canvas.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return this.mouseWorld;
    this.mouseWorld.x = (this.mouse.cx - r.left) * (VIEW_W / r.width);
    this.mouseWorld.y = (this.mouse.cy - r.top) * (VIEW_H / r.height);
    return this.mouseWorld;
  }

  /* 每帧末调用 */
  endFrame() {
    this.pressed.clear();
  }
}

</script>
<script>
/* ===========================================================
   touch.js — 移动端触控（虚拟双摇杆 + 屏幕按钮）
   左半屏：移动摇杆
   右半屏：瞄准摇杆（按住即持续射击）
   所有坐标都换算成 1280x720 的逻辑世界坐标，与画布缩放完全解耦
   =========================================================== */
'use strict';

class TouchControls {
  constructor(canvas) {
    this.canvas = canvas;
    this.active = false;             // 是否处于触屏模式（首次真实触摸后置真）
    this.radius = 84;                // 摇杆半径（逻辑坐标）
    this.deadZone = 0.12;            // 归一化死区
    this.firing = false;

    this.move = { id: null, x: 0, y: 0, ax: 0, ay: 0, active: false };
    this.aim = { id: null, x: 0, y: 0, ax: 0, ay: 0, active: false };

    this.buttonsFn = null;           // () => [{ id, x, y, w, h }]
    this.onButton = null;            // (id) => void

    this._bind();
  }

  /* 客户端坐标 → 逻辑世界坐标（画布被 CSS transform 缩放也能正确换算） */
  _toWorld(cx, cy) {
    const r = this.canvas.getBoundingClientRect();
    if (!r || r.width <= 0 || r.height <= 0) return { x: 0, y: 0 };
    return {
      x: (cx - r.left) * (VIEW_W / r.width),
      y: (cy - r.top) * (VIEW_H / r.height)
    };
  }

  _bind() {
    const c = this.canvas;
    if (!c || !c.addEventListener) return;

    c.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse') return;      // 鼠标走原有逻辑
      const p = this._toWorld(e.clientX, e.clientY);
      this.onDown(e.pointerId, p.x, p.y);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    window.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'mouse') return;
      const p = this._toWorld(e.clientX, e.clientY);
      this.onMove(e.pointerId, p.x, p.y);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    const up = (e) => { if (e.pointerType !== 'mouse') this.onUp(e.pointerId); };
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }

  /* ---------- 供事件与测试调用的三件套 ---------- */
  onDown(id, wx, wy) {
    this.active = true;

    /* 屏幕按钮优先：落在按钮上就不起摇杆 */
    const btns = this.buttonsFn ? this.buttonsFn() : [];
    for (let i = 0; i < btns.length; i++) {
      const b = btns[i];
      if (wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h) {
        if (this.onButton) this.onButton(b.id);
        return;
      }
    }

    if (wx < VIEW_W * 0.5) {
      if (this.move.id !== null) return;
      this.move.id = id;
      this.move.ax = wx; this.move.ay = wy;
      this.move.x = 0; this.move.y = 0; this.move.active = true;
    } else {
      if (this.aim.id !== null) return;
      this.aim.id = id;
      this.aim.ax = wx; this.aim.ay = wy;
      this.aim.x = 0; this.aim.y = 0; this.aim.active = true;
      this.firing = true;
    }
  }

  onMove(id, wx, wy) {
    const st = (id === this.move.id) ? this.move
      : (id === this.aim.id) ? this.aim : null;
    if (!st) return;

    const dx = wx - st.ax, dy = wy - st.ay;
    const len = Math.hypot(dx, dy);
    const mag = Math.min(1, len / this.radius);
    if (mag < this.deadZone || len <= 0) { st.x = 0; st.y = 0; return; }
    st.x = (dx / len) * mag;
    st.y = (dy / len) * mag;
  }

  onUp(id) {
    if (id === this.move.id) {
      this.move.id = null; this.move.active = false; this.move.x = 0; this.move.y = 0;
    }
    if (id === this.aim.id) {
      this.aim.id = null; this.aim.active = false; this.aim.x = 0; this.aim.y = 0;
      this.firing = false;
    }
  }

  releaseAll() {
    this.move.id = null; this.move.active = false; this.move.x = 0; this.move.y = 0;
    this.aim.id = null; this.aim.active = false; this.aim.x = 0; this.aim.y = 0;
    this.firing = false;
  }

  /* ---------- 绘制 ---------- */
  draw(ctx) {
    if (!this.active) return;
    this._stick(ctx, this.move, '127,215,234');
    this._stick(ctx, this.aim, '255,179,71');
  }

  _stick(ctx, st, rgb) {
    if (!st.active) return;
    const R = this.radius;
    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = 'rgba(' + rgb + ',0.16)';
    ctx.beginPath();
    ctx.arc(st.ax, st.ay, R, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = 'rgba(' + rgb + ',0.55)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.globalAlpha = 0.72;
    ctx.fillStyle = 'rgba(' + rgb + ',0.72)';
    ctx.beginPath();
    ctx.arc(st.ax + st.x * R, st.ay + st.y * R, R * 0.4, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

</script>
<script>
/* ===========================================================
   collision.js — 碰撞检测与分离
   全部基于「圆 vs 圆」「圆 vs 矩形」
   =========================================================== */
'use strict';

const Collision = {

  /* 圆 vs 圆：是否相交 */
  circleCircle(ax, ay, ar, bx, by, br) {
    const dx = bx - ax, dy = by - ay;
    const r = ar + br;
    return dx * dx + dy * dy <= r * r;
  },

  /* 圆 vs 矩形：是否相交 */
  circleRect(cx, cy, r, rect) {
    const nx = clamp(cx, rect.x, rect.x + rect.w);
    const ny = clamp(cy, rect.y, rect.y + rect.h);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  },

  /* 点是否在矩形内 */
  pointInRect(px, py, rect) {
    return px >= rect.x && px <= rect.x + rect.w &&
           py >= rect.y && py <= rect.y + rect.h;
  },

  /* 圆 vs 矩形：把圆推出矩形（就地修改实体 x/y，使用 entity.r 作为半径）
     返回 true 表示发生了推挤（被墙挡住） */
  resolveCircleRect(entity, rect) {
    const r = entity.r;
    const nx = clamp(entity.x, rect.x, rect.x + rect.w);
    const ny = clamp(entity.y, rect.y, rect.y + rect.h);
    let dx = entity.x - nx;
    let dy = entity.y - ny;
    let d2 = dx * dx + dy * dy;

    if (d2 > r * r) return false;

    if (d2 > 0.000001) {
      const d = Math.sqrt(d2);
      const push = r - d;
      entity.x += (dx / d) * push;
      entity.y += (dy / d) * push;
    } else {
      /* 圆心已在矩形内部：沿穿透最浅的轴弹出 */
      const leftPen = entity.x - rect.x;
      const rightPen = rect.x + rect.w - entity.x;
      const topPen = entity.y - rect.y;
      const botPen = rect.y + rect.h - entity.y;
      const m = Math.min(leftPen, rightPen, topPen, botPen);
      if (m === leftPen) entity.x = rect.x - r;
      else if (m === rightPen) entity.x = rect.x + rect.w + r;
      else if (m === topPen) entity.y = rect.y - r;
      else entity.y = rect.y + rect.h + r;
    }
    return true;
  },

  /* 矩形列表解算 */
  resolveAll(entity, rects) {
    let hit = false;
    for (let i = 0; i < rects.length; i++) {
      if (Collision.resolveCircleRect(entity, rects[i])) hit = true;
    }
    return hit;
  },

  /* 两个圆形实体互相分离（避免敌人叠在一起） */
  separate(a, b) {
    let dx = b.x - a.x, dy = b.y - a.y;
    let d2 = dx * dx + dy * dy;
    const r = a.r + b.r;
    if (d2 >= r * r) return;
    let d = Math.sqrt(d2);
    if (d < 0.0001) { dx = rand(-1, 1); dy = rand(-1, 1); d = Math.hypot(dx, dy) || 1; }
    const overlap = (r - d) * 0.5;
    const ux = dx / d, uy = dy / d;
    a.x -= ux * overlap; a.y -= uy * overlap;
    b.x += ux * overlap; b.y += uy * overlap;
  }
};

</script>
<script>
/* ===========================================================
   particles.js — 粒子系统 + 飘字伤害数字
   =========================================================== */
'use strict';

class Particle {
  constructor() { this.alive = false; }

  init(x, y, vx, vy, life, size, color, opt) {
    opt = opt || {};
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.size = size;
    this.color = color;
    this.drag = opt.drag !== undefined ? opt.drag : 3.2;
    this.shrink = opt.shrink !== undefined ? opt.shrink : true;
    this.glow = opt.glow !== undefined ? opt.glow : false;
    this.shape = opt.shape || 'circle';
    this.rot = opt.rot || 0;
    this.spin = opt.spin || 0;
    this.alive = true;
    return this;
  }

  update(dt) {
    this.life -= dt;
    if (this.life <= 0) { this.alive = false; return; }
    const k = Math.max(0, 1 - this.drag * dt);
    this.vx *= k;
    this.vy *= k;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rot += this.spin * dt;
  }

  draw(ctx) {
    const t = this.life / this.maxLife;
    const a = clamp(t, 0, 1);
    const s = this.shrink ? this.size * (0.25 + t * 0.75) : this.size;
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    if (this.shape === 'square') {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.fillRect(-s * 0.5, -s * 0.5, s, s);
      ctx.restore();
    } else if (this.shape === 'shard') {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.55, s * 0.7);
      ctx.lineTo(-s * 0.55, s * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(this.x, this.y, s * 0.5, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

class ParticleSystem {
  constructor(max) {
    this.max = max || 900;
    this.items = [];
    this.pool = [];
  }

  _get() {
    const p = this.pool.pop() || new Particle();
    return p;
  }

  spawn(x, y, vx, vy, life, size, color, opt) {
    if (this.items.length >= this.max) return null;
    const p = this._get().init(x, y, vx, vy, life, size, color, opt);
    this.items.push(p);
    return p;
  }

  /* 通用爆发 */
  burst(x, y, count, opt) {
    opt = opt || {};
    const speed = opt.speed || 140;
    const life = opt.life || 0.45;
    const size = opt.size || 4;
    const color = opt.color || '#ffb347';
    const dir = opt.dir !== undefined ? opt.dir : null;
    const spread = opt.spread !== undefined ? opt.spread : TAU;
    for (let i = 0; i < count; i++) {
      const a = dir !== null ? dir + rand(-spread * 0.5, spread * 0.5) : rand(0, TAU);
      const s = speed * rand(0.35, 1.15);
      this.spawn(
        x + rand(-3, 3), y + rand(-3, 3),
        Math.cos(a) * s, Math.sin(a) * s,
        life * rand(0.6, 1.25), size * rand(0.6, 1.35),
        opt.colors ? pick(opt.colors) : color,
        opt
      );
    }
  }

  /* 枪口火花 */
  muzzle(x, y, angle, color) {
    for (let i = 0; i < 5; i++) {
      const a = angle + rand(-0.32, 0.32);
      const s = rand(120, 320);
      this.spawn(x, y, Math.cos(a) * s, Math.sin(a) * s,
        rand(0.08, 0.19), rand(2.5, 5.5), i % 2 ? '#fff2c8' : color,
        { drag: 6, shape: 'circle' });
    }
  }

  /* 命中火花 */
  hitSpark(x, y, angle, color) {
    for (let i = 0; i < 7; i++) {
      const a = angle + rand(-1.0, 1.0);
      const s = rand(90, 260);
      this.spawn(x, y, Math.cos(a) * s, Math.sin(a) * s,
        rand(0.15, 0.34), rand(2, 4.5), color,
        { drag: 5, shape: 'shard', rot: a, spin: rand(-9, 9) });
    }
  }

  /* 死亡碎裂 */
  deathBurst(x, y, colors, scale) {
    scale = scale || 1;
    for (let i = 0; i < 16 * scale; i++) {
      const a = rand(0, TAU);
      const s = rand(60, 300) * scale;
      this.spawn(x, y, Math.cos(a) * s, Math.sin(a) * s,
        rand(0.3, 0.75), rand(2.5, 6.5) * scale, pick(colors),
        { drag: 3.0, shape: 'shard', rot: a, spin: rand(-12, 12) });
    }
    for (let i = 0; i < 5; i++) {
      this.spawn(x, y, rand(-20, 20), rand(-20, 20),
        rand(0.4, 0.8), rand(14, 26) * scale, 'rgba(255,255,255,0.10)',
        { drag: 2.2, shrink: false });
    }
  }

  /* 冲刺拖影 */
  trail(x, y, color, size) {
    this.spawn(x + rand(-4, 4), y + rand(-4, 4), rand(-20, 20), rand(-20, 20),
      rand(0.18, 0.36), size || 7, color, { drag: 4, shrink: true });
  }

  /* 环形冲击波（用碎片模拟） */
  ring(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU;
      this.spawn(x, y, Math.cos(a) * speed, Math.sin(a) * speed,
        rand(0.25, 0.45), rand(3, 5), color, { drag: 3.6 });
    }
  }

  update(dt) {
    const arr = this.items;
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i];
      p.update(dt);
      if (!p.alive) {
        arr[i] = arr[arr.length - 1];
        arr.pop();
        this.pool.push(p);
      }
    }
  }

  draw(ctx) {
    ctx.save();
    for (let i = 0; i < this.items.length; i++) this.items[i].draw(ctx);
    ctx.restore();
  }

  clear() {
    for (const p of this.items) this.pool.push(p);
    this.items.length = 0;
  }
}

/* -----------------------------------------------------------
   伤害飘字
   ----------------------------------------------------------- */
class DamageNumbers {
  constructor() { this.items = []; }

  add(x, y, value, opt) {
    opt = opt || {};
    this.items.push({
      x: x + rand(-7, 7),
      y: y - 10,
      vx: rand(-16, 16),
      vy: opt.vy !== undefined ? opt.vy : -64,
      life: opt.life || 0.72,
      maxLife: opt.life || 0.72,
      value: typeof value === 'number' ? Math.round(value) : value,
      crit: !!opt.crit,
      color: opt.color || (opt.crit ? '#ffd85e' : '#ffe9c0'),
      scale: opt.crit ? 1.55 : 1
    });
  }

  update(dt) {
    const arr = this.items;
    for (let i = arr.length - 1; i >= 0; i--) {
      const d = arr[i];
      d.life -= dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.vy += 78 * dt;      // 轻微下坠
      d.vx *= (1 - 1.6 * dt);
      if (d.life <= 0) { arr[i] = arr[arr.length - 1]; arr.pop(); }
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const d of this.items) {
      const t = d.life / d.maxLife;
      const a = clamp(t * 1.6, 0, 1);
      const size = (d.crit ? 22 : 15) * (0.75 + 0.25 * t) * d.scale / (d.crit ? 1.55 : 1);
      ctx.globalAlpha = a;
      ctx.font = `800 ${d.crit ? 24 : 16}px "Segoe UI", system-ui, sans-serif`;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.72)';
      ctx.strokeText(d.value, d.x, d.y);
      ctx.fillStyle = d.color;
      ctx.fillText(d.value, d.x, d.y);
    }
    ctx.restore();
  }

  clear() { this.items.length = 0; }
}

</script>
<script>
/* ===========================================================
   projectile.js — 投射物（玩家 / 敌人共用）
   =========================================================== */
'use strict';

class Projectile {
  constructor(opt) {
    this.x = opt.x;
    this.y = opt.y;
    this.vx = Math.cos(opt.angle) * opt.speed;
    this.vy = Math.sin(opt.angle) * opt.speed;
    this.r = opt.r || 5;
    this.damage = opt.damage || 10;
    this.friendly = !!opt.friendly;
    this.life = opt.life || 2.4;
    this.maxLife = this.life;
    this.color = opt.color || (this.friendly ? '#ffc65a' : '#7fe4ff');
    this.core = opt.core || '#ffffff';
    this.size = opt.size || 1;
    this.dead = false;
    this.spin = opt.spin !== undefined ? opt.spin : 0;
    this.rot = opt.angle;
    this.trail = [];
    this.trailMax = opt.trailMax !== undefined ? opt.trailMax : 6;

    /* ---- 道具机制快照（由 Player.shoot 拷贝进来） ---- */
    const proto = defaultMods();
    for (const k in proto) this[k] = opt[k] || 0;
    this.game = opt.game || null;
    this.speed = opt.speed || 0;
    this.damageMul = opt.damageMul || 1;
    this.splitLeft = opt.splitLeft || 0;
    this.isChild = !!opt.isChild;
    this.hitIds = [];                       // 穿透时避免重复命中
    this.rehitT = 0;                        // 回旋弹的重复命中间隔
    this.orbitDir = opt.orbitDir !== undefined ? opt.orbitDir : (chance(0.5) ? 1 : -1);
    this.omega = 2.2 * this.orbitDir;
  }

  /* 追踪：友军弹朝最近的敌人转向，敌方弹朝玩家缓慢转向（转向速率受限，可躲） */
  _steer(dt) {
    const g = this.game;
    if (!g) return;
    let tx, ty;
    if (this.friendly) {
      let best = null, bestD = 520 * 520;
      const list = g.room ? g.room.enemies : [];
      for (const e of list) {
        if (e.dead) continue;
        const d = dist2(this.x, this.y, e.x, e.y);
        if (d < bestD) { bestD = d; best = e; }
      }
      if (!best) return;
      tx = best.x; ty = best.y;
    } else {
      const p = g.player;
      if (!p || p.dead) return;
      tx = p.x; ty = p.y;
    }
    const cur = Math.atan2(this.vy, this.vx);
    const want = angleTo(this.x, this.y, tx, ty);
    const rate = Math.min(7.5, 2.4 + this.homing * 2.2) * dt;
    const na = cur + clamp(angleDelta(cur, want), -rate, rate);
    this.vx = Math.cos(na) * this.speed;
    this.vy = Math.sin(na) * this.speed;
  }

  /* 回旋：先划弧线，后半程折返飞回玩家 */
  _orbit(dt) {
    const cur = Math.atan2(this.vy, this.vx);
    let na;
    if (this.life < this.maxLife * 0.55 && this.game && this.game.player) {
      const p = this.game.player;
      const want = angleTo(this.x, this.y, p.x, p.y);
      const rate = 5.0 * dt;
      na = cur + clamp(angleDelta(cur, want), -rate, rate);
    } else {
      na = cur + this.omega * dt;
    }
    this.vx = Math.cos(na) * this.speed;
    this.vy = Math.sin(na) * this.speed;
  }

  update(dt) {
    this.trail.push(this.x, this.y);
    if (this.trail.length > this.trailMax * 2) this.trail.splice(0, 2);

    if (this.homing > 0) this._steer(dt);
    if (this.orbit > 0) {
      this._orbit(dt);
      /* 回旋弹可以反复命中同一目标 */
      this.rehitT -= dt;
      if (this.rehitT <= 0) {
        this.rehitT = this.orbitPierce > 0 ? 0.18 : 0.38;
        this.hitIds.length = 0;
      }
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rot += this.spin * dt;
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }

  draw(ctx) {
    const a = this.friendly ? Math.atan2(this.vy, this.vx) : this.rot;
    ctx.save();

    /* 拖影 */
    const n = this.trail.length / 2;
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / n;
      ctx.globalAlpha = 0.30 * t;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.trail[i * 2], this.trail[i * 2 + 1], this.r * 0.85 * t, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.translate(this.x, this.y);
    ctx.rotate(a);

    /* 外层光晕 */
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 2.4 * this.size, this.r * 1.35 * this.size, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    /* 弹体 */
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r * 1.55 * this.size, this.r * 0.95 * this.size, 0, 0, TAU);
    ctx.fill();

    /* 弹芯 */
    ctx.fillStyle = this.core;
    ctx.beginPath();
    ctx.ellipse(this.r * 0.2, 0, this.r * 0.72 * this.size, this.r * 0.5 * this.size, 0, 0, TAU);
    ctx.fill();

    ctx.restore();
  }
}

</script>
<script>
/* ===========================================================
   player.js — 玩家角色「拾火者」
   属性 / 移动 / 瞄准 / 射击 / 受伤 / 绘制
   =========================================================== */
'use strict';

class Player {
  constructor(game, x, y, charId) {
    this.game = game;

    /* ---- 角色（Meta 系统：不同基础属性 + 特殊能力，见 meta.js） ----
       未加载 meta.js 时为 null，一切走原来的默认数值（向后兼容） */
    this.char = (typeof CHARACTERS !== 'undefined')
      ? CharacterOf(charId || (game && game.charId)) : null;

    this.x = x;
    this.y = y;
    this.r = 15;

    /* ---- 基础属性（道具系统的叠加基准，只在这里写一次） ---- */
    this.base = {
      maxHp: 100,
      damage: 11,
      fireInterval: 0.17,
      moveSpeed: 262,
      bulletSpeed: 660,
      bulletRadius: 5,
      bulletCount: 1,
      critChance: 0.08,
      critDamage: 2.0,
      range: 1060,
      invulnTime: 0.9
    };
    /* 角色覆盖：高攻必然低血、高血必然低攻（Meta 不给净增益） */
    if (this.char && this.char.base) {
      for (const k in this.char.base) this.base[k] = this.char.base[k];
    }

    /* ---- 属性（由 Build.recompute() 每次重新写入） ---- */
    this.maxHp = this.base.maxHp;
    this.hp = this.base.maxHp;
    this.moveSpeed = this.base.moveSpeed;
    this.damage = this.base.damage;
    this.fireInterval = this.base.fireInterval;
    this.bulletSpeed = this.base.bulletSpeed;
    this.bulletRadius = this.base.bulletRadius;
    this.bulletCount = this.base.bulletCount;
    this.critChance = this.base.critChance;
    this.critDamage = this.base.critDamage;
    this.range = this.base.range;
    this.armor = 0;
    this.regen = 0;

    /* ---- Build（道具 / 组合） ---- */
    this.build = new Build(this);
    this.mods = this.build.mods;

    /* ---- 临时增益 / 诅咒 ---- */
    this.buffs = new BuffSystem(this);

    /* 角色自带机制（如星轨的回旋）要写进 Build，这里先算一次 */
    this.build.recompute();

    /* ---- 运行时状态 ---- */
    this.fireTimer = 0;
    this.invuln = 0;
    this.invulnTime = this.base.invulnTime;
    this.aim = -Math.PI / 2;
    this.moving = false;
    this.walkPhase = 0;
    this.recoil = 0;
    this.hurtFlash = 0;
    this.dead = false;
    this.shotsFired = 0;
    this.trailT = 0;      // 烬迹计时
    this.slowT = 0;       // 被泥沼等减速的剩余时间

    /* ---- 角色能力运行时状态（只有对应角色会用到） ---- */
    this.heat = 0;        // 灼刃：过热层数
    this.heatT = 0;       // 灼刃：停火倒计时
    this.wallT = 0;       // 磐盾：护壁剩余时间
    this.wallCd = 0;      // 磐盾：护壁冷却
    this.autoT = 2.0;     // 星轨：自动星弹倒计时
  }

  /* 取角色的能力钩子（没有就返回 null，走默认行为） */
  _abil(name) {
    if (!this.char) return null;
    if (typeof CHAR_ABILITIES === 'undefined') return null;
    const a = CHAR_ABILITIES[this.char.id];
    return (a && a[name]) ? a[name] : null;
  }

  /* 角色配色（没有角色时用原来的兜帽配色） */
  get skin() {
    return (this.char && this.char.colors) || {
      cloak: '#15333c', edge: '#2f6b74', core: '#ffb347',
      accent: '#7fd7ea', bullet: '#ffb347'
    };
  }

  /* 击杀回调（由 game.onEnemyKilled 调用） */
  onPlayerKill(e) {
    const f = this._abil('onKill');
    if (f) f(this, this.game, e);
  }

  /* 进入新一层（含开局第 1 层）回调 */
  onFloorStart() {
    const f = this._abil('onFloor');
    if (f) f(this, this.game);
  }

  /* 金币倍率（拾荒者） */
  get coinMul() { return (this.char && this.char.coinMul) || 1; }

  /* 被减速（取最长持续时间，不叠加） */
  applySlow(dur) {
    if (this.dead) return;
    this.slowT = Math.max(this.slowT, dur);
  }

  get slowFactor() { return this.slowT > 0 ? 0.55 : 1; }

  /* 拾取道具（所有入口统一走这里） */
  gainItem(itemId) {
    const it = this.build.add(itemId);
    if (!it) return null;
    this.game.ownedItems.push(itemId);
    return it;
  }

  get alive() { return !this.dead; }

  /* ---------------------------------------------------------
     更新
     --------------------------------------------------------- */
  update(dt, input) {
    if (this.dead) return;

    /* 减速计时 */
    if (this.slowT > 0) {
      this.slowT -= dt;
      if (Math.random() < dt * 8) {
        this.game.particles.spawn(
          this.x + rand(-10, 10), this.y + rand(-6, 10),
          rand(-8, 8), rand(-24, -6), rand(0.3, 0.6), rand(2, 4),
          'rgba(120,180,255,0.5)', { drag: 3 }
        );
      }
    }

    /* 移动（键盘 WASD/方向键 与 触屏虚拟摇杆统一走 Input.moveVector） */
    const v = input.moveVector();
    let mx = v.x, my = v.y;
    const vlen = Math.hypot(mx, my);

    this.moving = vlen > 0.001;
    if (this.moving) {
      if (vlen > 1) { mx /= vlen; my /= vlen; }
      const sp = this.moveSpeed * this.slowFactor;
      this.x += mx * sp * dt;
      this.y += my * sp * dt;
      this.walkPhase += dt * 11;
      /* 移动尘埃 */
      if (Math.random() < dt * 14) {
        this.game.particles.spawn(
          this.x - mx * 8 + rand(-4, 4), this.y - my * 8 + rand(-4, 4),
          -mx * rand(10, 40) + rand(-12, 12), -my * rand(10, 40) + rand(-12, 12),
          rand(0.18, 0.4), rand(2, 4), 'rgba(120,200,220,0.35)', { drag: 4 }
        );
      }
    }

    /* 瞄准 */
    const m = this.game.mouseWorld;
    this.aim = angleTo(this.x, this.y, m.x, m.y);

    /* 临时增益 / 诅咒计时 */
    this.buffs.update(dt);

    /* 生命回复 */
    if (this.regen > 0 && this.hp > 0 && this.hp < this.maxHp) {
      this._regenAcc = (this._regenAcc || 0) + this.regen * dt;
      if (this._regenAcc >= 1) {
        const g = Math.floor(this._regenAcc);
        this._regenAcc -= g;
        this.hp = Math.min(this.maxHp, this.hp + g);
      }
    }

    /* 烬迹：身周持续灼烧 */
    if (this.mods.trailFire > 0) {
      this.trailT -= dt;
      if (this.trailT <= 0) {
        this.trailT = 0.3;
        this.game.burnAround(this.x, this.y, 66, this.mods.trailFire * 3);
      }
    }

    /* 角色能力的每帧逻辑（过热衰减 / 护壁计时 / 自动星弹……） */
    const ab = this._abil('update');
    if (ab) ab(this, dt, this.game);

    /* 射击 */
    this.fireTimer -= dt;
    this.recoil = Math.max(0, this.recoil - dt * 9);
    if (input.firing() && this.fireTimer <= 0) {
      this.shoot();
      this.fireTimer = this.fireInterval;
    }

    /* 受伤后的无敌闪烁 */
    if (this.invuln > 0) this.invuln -= dt;
    if (this.hurtFlash > 0) this.hurtFlash = Math.max(0, this.hurtFlash - dt * 2.5);

    /* 与墙体 / 门的碰撞 */
    this.game.room.clampEntity(this, true);
  }

  /* ---------------------------------------------------------
     射击
     --------------------------------------------------------- */
  shoot() {
    const m = this.mods;
    const n = this.bulletCount;
    /* 角色伤害倍率（灼刃的过热） */
    const dm = this._abil('dmgMul');
    const cmul = dm ? dm(this) : 1;
    const spreadTotal = n > 1 ? 0.11 * (n - 1) : 0;
    const start = this.aim - spreadTotal * 0.5;
    const muzzleLen = this.r + 8;
    const life = this.range / this.bulletSpeed;
    const eff = this.build.shotEffects();

    for (let i = 0; i < n; i++) {
      const a = n > 1 ? start + (spreadTotal / (n - 1)) * i : this.aim;
      const px = this.x + Math.cos(a) * muzzleLen;
      const py = this.y + Math.sin(a) * muzzleLen;

      const opt = {
        x: px, y: py,
        angle: a,
        speed: this.bulletSpeed,
        damage: this.damage * cmul,
        r: this.bulletRadius,
        friendly: true,
        color: this.skin.bullet,
        core: '#fff6da',
        life: life,
        game: this.game,
        spin: m.orbit > 0 ? 9 : 0
      };
      /* 机制快照：一次拷贝，之后与 Build 解耦 */
      for (const k in eff) opt[k] = eff[k];
      opt.splitLeft = m.split;          // 剩余可分裂次数
      opt.isChild = false;
      opt.damageMul = 1;

      /* 外观随机制变化 */
      if (m.poison > 0) { opt.color = '#9ad14f'; opt.core = '#e8ffb0'; }
      else if (m.freeze > 0) { opt.color = '#8fd8ff'; opt.core = '#ffffff'; }
      else if (m.homing > 0) { opt.color = '#7fe4ff'; }
      else if (m.explode > 0) { opt.color = '#ff8a5c'; }

      this.game.spawnProjectile(opt);
    }

    this.shotsFired++;
    this.recoil = 1;
    const os = this._abil('onShoot');
    if (os) os(this, this.game);
    this.game.particles.muzzle(
      this.x + Math.cos(this.aim) * (this.r + 10),
      this.y + Math.sin(this.aim) * (this.r + 10),
      this.aim, this.skin.bullet
    );
  }

  /* ---------------------------------------------------------
     受伤
     --------------------------------------------------------- */
  takeDamage(amount, srcX, srcY) {
    if (this.dead || this.invuln > 0) return false;

    /* 角色减伤（磐盾的回声护壁） */
    const tm = this._abil('dmgTakenMul');
    if (tm) amount *= tm(this);

    const real = Math.max(1, Math.round(amount - (this.armor || 0)));
    this.hp -= real;
    this.invuln = this.invulnTime;
    this.hurtFlash = 1;
    this.game.addShake(4.5);

    /* 角色受伤钩子（护壁展开等） */
    const oh = this._abil('onHurt');
    if (oh) oh(this, this.game);

    const ang = angleTo(srcX, srcY, this.x, this.y);
    this.game.particles.burst(this.x, this.y, 12, {
      speed: 190, life: 0.4, size: 4, color: '#ff5d5d',
      dir: ang, spread: 2.2, colors: ['#ff5d5d', '#ff9a6a', '#ffd0a0']
    });
    this.game.damageNumbers.add(this.x, this.y - 18, amount, {
      color: '#ff7a7a', life: 0.85, vy: -52
    });

    /* 轻微击退 */
    const push = 46;
    this.x += Math.cos(ang) * push * 0.35;
    this.y += Math.sin(ang) * push * 0.35;
    this.game.room.clampEntity(this, true);

    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      this.game.onPlayerDeath();
    }
    return true;
  }

  heal(amount) {
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + amount);
    const gained = Math.round(this.hp - before);
    if (gained > 0) {
      this.game.damageNumbers.add(this.x, this.y - 26, '+' + gained, {
        color: '#7dffb0', life: 0.95, vy: -46
      });
      this.game.particles.ring(this.x, this.y, '#7dffb0', 14, 130);
    }
    return gained;
  }

  /* ---------------------------------------------------------
     绘制：兜帽斗篷 + 胸口火种核心 + 指向准星的射口
     --------------------------------------------------------- */
  draw(ctx) {
    if (this.dead) return;
    const blink = this.invuln > 0 && Math.floor(this.invuln * 16) % 2 === 0;
    const C = this.skin;
    const cid = this.char ? this.char.id : 'ember';

    ctx.save();
    ctx.translate(this.x, this.y);

    /* 磐盾：护壁展开时脚下一圈绿环 */
    if (this.wallT > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(this.game.time * 9);
      ctx.strokeStyle = '#7dffb0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, this.r * 1.75, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = '#7dffb0';
      ctx.fill();
      ctx.restore();
    }

    /* 灼刃：过热越高，脚下火环越亮 */
    if (this.heat > 0) {
      ctx.save();
      ctx.globalAlpha = 0.10 + 0.05 * (this.heat / 10);
      ctx.fillStyle = this.heat > 7 ? '#fff0c0' : '#ff6b3c';
      ctx.beginPath();
      ctx.arc(0, 0, this.r * (1.3 + 0.5 * (this.heat / 10)), 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    /* 影子 */
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath();
    ctx.ellipse(2, 9, this.r * 1.1, this.r * 0.58, 0, 0, TAU);
    ctx.fill();

    ctx.globalAlpha = blink ? 0.42 : 1;

    /* 背部推进光（移动时） */
    if (this.moving) {
      ctx.save();
      ctx.rotate(this.aim + Math.PI);
      ctx.globalAlpha = (blink ? 0.2 : 0.5) * (0.6 + 0.4 * Math.sin(this.walkPhase * 2));
      ctx.fillStyle = C.accent;
      ctx.beginPath();
      ctx.moveTo(this.r * 0.8, 0);
      ctx.lineTo(this.r * 2.0, -this.r * 0.45);
      ctx.lineTo(this.r * 2.0, this.r * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = blink ? 0.42 : 1;
    }

    /* 斗篷（六边形袍身） */
    ctx.save();
    ctx.rotate(this.aim);
    const wob = Math.sin(this.walkPhase) * (this.moving ? 1.6 : 0.4);
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      const rr = this.r * (1.06 + (i % 2 === 0 ? 0.05 : -0.03)) + wob * Math.cos(a);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    ctx.fillStyle = C.cloak;
    polygonPath(ctx, pts);
    ctx.fill();
    ctx.strokeStyle = C.edge;
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 肩部旋转环 */
    ctx.rotate(-this.aim);
    ctx.strokeStyle = C.accent;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.28, this.game.time * 1.4, this.game.time * 1.4 + Math.PI * 1.15);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.28, this.game.time * 1.4 + Math.PI, this.game.time * 1.4 + Math.PI * 1.75);
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* 角色标识（一眼分辨是谁） */
    ctx.save();
    ctx.rotate(this.game.time * 0.8);
    if (cid === 'cinder') {
      /* 灼刃：背后两片火羽 */
      ctx.fillStyle = '#ff6b3c';
      for (let s = -1; s <= 1; s += 2) {
        ctx.beginPath();
        ctx.moveTo(0, this.r * 0.5);
        ctx.lineTo(s * this.r * 1.0, this.r * 1.25);
        ctx.lineTo(s * this.r * 0.35, this.r * 0.75);
        ctx.closePath();
        ctx.fill();
      }
    } else if (cid === 'bulwark') {
      /* 磐盾：肩侧两块盾板 */
      ctx.fillStyle = '#3f7ba8';
      for (let s = -1; s <= 1; s += 2) {
        ctx.beginPath();
        ctx.arc(s * this.r * 0.95, 0, this.r * 0.42, 0, TAU);
        ctx.fill();
      }
    } else if (cid === 'orbiter') {
      /* 星轨：绕身的一颗星弹 */
      const ra = this.game.time * 2.4;
      ctx.fillStyle = '#d8b4ff';
      ctx.beginPath();
      ctx.arc(Math.cos(ra) * this.r * 1.45, Math.sin(ra) * this.r * 1.45, 3.4, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(Math.cos(ra + Math.PI) * this.r * 1.45, Math.sin(ra + Math.PI) * this.r * 1.45, 3.4, 0, TAU);
      ctx.fill();
    } else if (cid === 'scav') {
      /* 拾荒者：腰间晃动的钱袋微光 */
      ctx.fillStyle = '#ffd35e';
      ctx.beginPath();
      ctx.arc(this.r * 0.9, this.r * 0.5, 2.6, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-this.r * 0.9, -this.r * 0.5, 2.6, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    /* 射口（指向准星） */
    ctx.rotate(this.aim);
    const rc = this.recoil * 4;
    ctx.fillStyle = '#0d2229';
    roundRectPath(ctx, this.r * 0.35 - rc, -3.6, this.r * 1.15, 7.2, 3);
    ctx.fill();
    ctx.fillStyle = this.fireTimer > this.fireInterval - 0.07 ? '#fff6cf' : '#ff9d3c';
    roundRectPath(ctx, this.r * 1.25 - rc, -2.2, 5, 4.4, 2);
    ctx.fill();

    /* 胸口火种核心 */
    const pulse = 0.86 + 0.14 * Math.sin(this.game.time * 4.2);
    const g = ctx.createRadialGradient(0, 0, 0.5, 0, 0, this.r * 0.82 * pulse);
    g.addColorStop(0, '#fff4d2');
    g.addColorStop(0.42, C.core);
    g.addColorStop(1, 'rgba(255,120,40,0.05)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.82 * pulse, 0, TAU);
    ctx.fill();
    ctx.restore();

    /* 受击红闪 */
    if (this.hurtFlash > 0) {
      ctx.globalAlpha = this.hurtFlash * 0.55;
      ctx.fillStyle = '#ff4d4d';
      ctx.beginPath();
      ctx.arc(0, 0, this.r * 1.15, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
  }
}

/* ===========================================================
   Build —— 玩家当前持有的道具与最终属性
   =========================================================== */
class Build {
  constructor(player) {
    this.player = player;
    this.slots = [];           // [{ id, n }]
    this.mods = defaultMods();
    this.final = {};
    this.comboList = [];
  }

  add(id) {
    const it = ITEM_BY_ID[id];
    if (!it) return null;
    if (this.count(id) >= (it.max || 99)) return null;   // 达到堆叠上限
    const slot = this.slots.find(s => s.id === id);
    if (slot) slot.n++;
    else this.slots.push({ id: id, n: 1 });
    this.recompute();
    return it;
  }

  count(id) {
    const s = this.slots.find(x => x.id === id);
    return s ? s.n : 0;
  }

  has(id) { return this.count(id) > 0; }

  get length() { return this.slots.reduce((a, s) => a + s.n, 0); }

  /* 叠加计算：属性 → 机制 → 组合 → 写回玩家 */
  recompute() {
    if (!this.player) return;
    const p = this.player;
    const b = p.base;

    /* 1. 累加属性与机制 */
    const st = {
      maxHp: 0, damage: 0, damagePct: 0, fireRate: 0,
      moveSpeed: 0, moveSpeedPct: 0, bulletSpeedPct: 0,
      bulletRadius: 0, bulletCount: 0, range: 0,
      critChance: 0, critDamage: 0, dr: 0, invuln: 0, regen: 0
    };
    const md = defaultMods();
    for (const slot of this.slots) {
      const it = ITEM_BY_ID[slot.id];
      if (!it) continue;
      const n = Math.min(slot.n, it.max || 99);
      if (it.stats) for (const k in it.stats) st[k] = (st[k] || 0) + it.stats[k] * n;
      if (it.flags) for (const k in it.flags) md[k] = (md[k] || 0) + it.flags[k] * n;
    }

    /* 1b. 临时增益 / 诅咒（与道具完全叠加，来源见 buff.js） */
    if (p.buffs) {
      const bf = p.buffs.aggregate();
      for (const k in bf.stats) st[k] = (st[k] || 0) + bf.stats[k];
      for (const k in bf.mods) md[k] = (md[k] || 0) + bf.mods[k];
    }

    /* 1c. 角色自带机制（和道具 / 增益完全叠加，见 meta.js CHARACTERS.mods） */
    if (p.char && p.char.mods) {
      for (const k in p.char.mods) md[k] = (md[k] || 0) + p.char.mods[k];
    }

    /* 2. 最终属性（供组合条件判断） */
    const fin = {
      maxHp: Math.max(20, b.maxHp + st.maxHp),
      damage: Math.max(1, (b.damage + st.damage) * (1 + st.damagePct)),
      fireInterval: Math.max(0.05, b.fireInterval / (1 + Math.max(-0.7, st.fireRate))),
      moveSpeed: Math.max(90, (b.moveSpeed + st.moveSpeed) * (1 + st.moveSpeedPct)),
      bulletSpeed: Math.max(120, b.bulletSpeed * (1 + st.bulletSpeedPct)),
      bulletRadius: Math.max(2, b.bulletRadius + st.bulletRadius),
      bulletCount: Math.max(1, Math.round(b.bulletCount + st.bulletCount)),
      range: Math.max(200, b.range + st.range),
      critChance: clamp(b.critChance + st.critChance, 0, 0.9),
      critDamage: Math.max(1, b.critDamage + st.critDamage),
      dr: Math.max(0, st.dr),
      invuln: Math.max(0, st.invuln),
      regen: Math.max(0, st.regen)
    };

    /* 3. 组合判定 */
    this.comboList = [];
    for (const c of COMBOS) {
      let ok = true;
      if (c.need) for (const k in c.need) if ((md[k] || 0) < c.need[k]) { ok = false; break; }
      if (ok && c.needStat) {
        for (const k in c.needStat) if ((fin[k] || 0) < c.needStat[k]) { ok = false; break; }
      }
      if (!ok) continue;
      this.comboList.push(c);
      if (c.grant) for (const k in c.grant) md[k] = (md[k] || 0) + c.grant[k];
      if (c.grantStat) for (const k in c.grantStat) st[k] = (st[k] || 0) + c.grantStat[k];
    }

    /* 4. 写回玩家（保持既有字段语义不变） */
    const prevMax = p.maxHp;
    p.maxHp = Math.round(fin.maxHp);
    if (p.maxHp > prevMax) p.hp += (p.maxHp - prevMax);
    p.hp = Math.min(p.hp, p.maxHp);

    p.damage = fin.damage;
    p.fireInterval = fin.fireInterval;
    p.moveSpeed = fin.moveSpeed;
    p.bulletSpeed = fin.bulletSpeed;
    p.bulletRadius = fin.bulletRadius;
    p.bulletCount = fin.bulletCount;
    p.critChance = fin.critChance;
    p.critDamage = fin.critDamage;
    p.range = fin.range;
    p.armor = fin.dr;
    p.invulnTime = b.invulnTime + fin.invuln;
    p.regen = fin.regen;

    this.mods = md;
    p.mods = md;
    this.final = fin;
    return fin;
  }

  /* 供投射物使用的效果快照 */
  shotEffects() { return Object.assign({}, this.mods); }

  /* 该道具参与的所有组合（UI 悬停用） */
  combosOf(id) {
    const it = ITEM_BY_ID[id];
    if (!it) return [];
    const keys = Object.keys(it.flags || {});
    const out = [];
    for (const c of COMBOS) {
      if (!c.need) continue;
      for (const k in c.need) if (keys.indexOf(k) >= 0) { out.push(c); break; }
    }
    return out;
  }

  serialize() {
    return this.slots.map(s => s.id + 'x' + s.n).join(',') + '|' +
      this.comboList.map(c => c.id).join(',');
  }
}

/* ===========================================================
   抽取：按种子随机，尊重堆叠上限，尽量给没拿过的
   =========================================================== */
function pickItem(rng, build, opt) {
  opt = opt || {};
  const owned = build || { count: () => 0 };
  let pool = ITEMS.filter(it => opt.always !== it.id ? true : true);
  /* 未解锁的道具不在池里（Meta 解锁后自动加入，随机性不受影响） */
  pool = pool.filter(itemUnlocked);
  pool = pool.filter(it => owned.count(it.id) < (it.max || 99));
  if (!pool.length) pool = ITEMS.filter(itemUnlocked);

  /* 前两件优先给「立刻有感」的输出/机制件 */
  if (opt.early && pool.length > 3) {
    const hot = pool.filter(it => it.cat === 'attack' || it.cat === 'proj' || it.cat === 'special');
    if (hot.length) pool = hot;
  }
  /* 三成几率偏向玩家已经投入的方向，帮助成型 */
  if (opt.synergy && rng.chance(0.35)) {
    const cats = {};
    for (const s of (build ? build.slots : [])) {
      const it = ITEM_BY_ID[s.id];
      if (it) cats[it.cat] = (cats[it.cat] || 0) + s.n;
    }
    let best = null, bestN = 0;
    for (const k in cats) if (cats[k] > bestN) { bestN = cats[k]; best = k; }
    if (best) {
      const same = pool.filter(it => it.cat === best);
      if (same.length) pool = same;
    }
  }
  return rng.pick(pool);
}

/* Boss 奖励：随机一件强力道具
   —— 强力 = 稀有度高（max 小）+ 带机制（flags），且不与已堆满的重复 */
function pickStrongItem(rng, build) {
  const owned = build || { count: () => 0 };
  const avail = it => owned.count(it.id) < (it.max || 99);
  let pool = ITEMS.filter(it => avail(it) && itemUnlocked(it) &&
    (it.cat === 'attack' || it.cat === 'proj' || it.cat === 'special'));
  if (pool.length > 2) {
    const rare = pool.filter(it => (it.max || 99) <= 3);
    if (rare.length) pool = rare;
  }
  if (!pool.length) pool = ITEMS.filter(it => avail(it) && itemUnlocked(it));
  if (!pool.length) pool = ITEMS.slice();
  /* 偏向玩家已有方向，帮助成型（但仍受强力池限制） */
  if (rng.chance(0.4) && build && build.slots) {
    const cats = {};
    for (const s of build.slots) {
      const it = ITEM_BY_ID[s.id];
      if (it) cats[it.cat] = (cats[it.cat] || 0) + s.n;
    }
    let best = null, bestN = 0;
    for (const k in cats) if (cats[k] > bestN) { bestN = cats[k]; best = k; }
    if (best) {
      const same = pool.filter(it => it.cat === best);
      if (same.length) pool = same;
    }
  }
  return rng.pick(pool);
}

/* HUD 属性摘要 */
function playerStatsText(p) {
  return `伤害 ${p.damage.toFixed(0)} · 射速 ${(1 / p.fireInterval).toFixed(1)}/s · 弹数 ${p.bulletCount}` +
    ` · 暴击 ${Math.round(p.critChance * 100)}%`;
}

<script>
/* ===========================================================
   buff.js — 临时增益 / 诅咒（限时或永久）
   数据驱动：新增一个 buff 只需加一条数据对象
   结算并入 Build.recompute()，因此与道具系统完全叠加
   =========================================================== */
'use strict';

/* 常用增益 / 诅咒模板（商店、事件、特殊房共用） */
const BUFF_PRESETS = {
  stim:      { id: 'stim',      name: '战斗兴奋剂', kind: 'buff',  color: '#ff8a5c', dur: 30, stats: { damage: 6, damagePct: 0.25 } },
  haste:     { id: 'haste',     name: '疾行回响',   kind: 'buff',  color: '#7fe4ff', dur: 30, stats: { moveSpeed: 55 } },
  stoneskin: { id: 'stoneskin', name: '石肤',       kind: 'buff',  color: '#c8ff6a', dur: 30, stats: { dr: 22 } },
  fervor:    { id: 'fervor',    name: '狂热',       kind: 'buff',  color: '#ffd35e', dur: 30, stats: { fireRate: 0.45 } },
  bulwark:   { id: 'bulwark',   name: '壁垒',       kind: 'buff',  color: '#7dffb0', dur: 30, stats: { maxHp: 30 } },
  heavy:     { id: 'heavy',     name: '沉重诅咒',   kind: 'curse', color: '#c08bff', dur: 45, stats: { moveSpeed: -70 } },
  brittle:   { id: 'brittle',   name: '易碎诅咒',   kind: 'curse', color: '#c08bff', dur: 45, stats: { dr: -15 } },
  sluggish:  { id: 'sluggish',  name: '迟滞诅咒',   kind: 'curse', color: '#c08bff', dur: 40, stats: { fireRate: -0.30 } },
  frail:     { id: 'frail',     name: '虚弱诅咒',   kind: 'curse', color: '#c08bff', dur: 40, stats: { maxHp: -20 } }
};

class BuffSystem {
  constructor(player) {
    this.player = player;
    this.list = [];        // { id, name, desc, kind, color, stats, mods, dur, t }
  }

  /* def: { id,name,desc,kind,color,stats,mods,dur }   dur<=0 表示永久 */
  add(def) {
    if (!def) return null;
    const dur = def.dur === undefined ? 30 : def.dur;
    const b = {
      id: def.id || ('buff' + this.list.length),
      name: def.name || '回响',
      desc: def.desc || '',
      kind: def.kind || 'buff',
      color: def.color || '#7dffb0',
      stats: def.stats || null,
      mods: def.mods || null,
      dur: dur,
      t: dur
    };
    /* 同名最多叠 3 层，超过则刷新最旧一层的持续时间 */
    const same = this.list.filter(x => x.id === b.id);
    if (same.length >= 3) {
      same[0].t = Math.max(same[0].t, b.t);
    } else {
      this.list.push(b);
    }
    this.refresh();
    return b;
  }

  addPreset(key, durOverride) {
    const p = BUFF_PRESETS[key];
    if (!p) return null;
    const def = Object.assign({}, p);
    if (durOverride !== undefined) def.dur = durOverride;
    return this.add(def);
  }

  has(id) { return this.list.some(b => b.id === id); }

  remove(id) {
    const before = this.list.length;
    this.list = this.list.filter(b => b.id !== id);
    if (this.list.length !== before) this.refresh();
  }

  /* 清掉所有诅咒（商店净化类商品） */
  cleanseCurses() {
    const before = this.list.length;
    this.list = this.list.filter(b => b.kind !== 'curse');
    if (this.list.length !== before) this.refresh();
    return before - this.list.length;
  }

  update(dt) {
    if (!this.list.length) return;
    let expired = false;
    for (let i = this.list.length - 1; i >= 0; i--) {
      const b = this.list[i];
      if (b.dur <= 0) continue;             // 永久
      b.t -= dt;
      if (b.t <= 0) { this.list.splice(i, 1); expired = true; }
    }
    if (expired) this.refresh();
  }

  /* 汇总成 { stats, mods }，供 Build.recompute() 叠加 */
  aggregate() {
    const st = {}, md = {};
    for (const b of this.list) {
      if (b.stats) for (const k in b.stats) st[k] = (st[k] || 0) + b.stats[k];
      if (b.mods) for (const k in b.mods) md[k] = (md[k] || 0) + b.mods[k];
    }
    return { stats: st, mods: md };
  }

  refresh() {
    if (this.player && this.player.build) this.player.build.recompute();
  }

  clear() { this.list.length = 0; }

  serialize() { return this.list.map(b => b.id + '@' + Math.ceil(b.t)).join(','); }
}

</script>
<script>
/* ===========================================================
   props.js — 房间内的可交互物件
   宝箱 / 异象祭坛 / 商栈基座 / 层间裂隙
   全部原创，材质用 Canvas 绘制
   =========================================================== */
'use strict';

class Prop {
  constructor(game, x, y, opt) {
    opt = opt || {};
    this.game = game;
    this.x = x;
    this.y = y;
    this.r = opt.r || 20;
    this.used = false;
    this.animT = Math.random() * 6;
    this.label = opt.label || '交互';
    this.hint = '';
  }

  update(dt) { this.animT += dt; }

  inRange(player) {
    return dist(this.x, this.y, player.x, player.y) < this.r + player.r + 26;
  }

  use() { if (this.used) return false; this.used = true; return true; }

  /* 底座光环（所有物件共用） */
  drawBase(ctx, color, alpha) {
    const t = this.animT;
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 0.35 : alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    const rr = this.r + 8 + Math.sin(t * 2) * 2.5;
    ctx.beginPath();
    ctx.arc(this.x, this.y, rr, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  /* 头顶提示箭头 */
  drawMarker(ctx, color) {
    const t = this.animT;
    const y = this.y - this.r - 20 + Math.sin(t * 3) * 3;
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.85;
    polygonPath(ctx, [
      [this.x, y + 10],
      [this.x - 7, y - 2],
      [this.x + 7, y - 2]
    ]);
    ctx.fill();
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   宝箱（Treasure）
   ----------------------------------------------------------- */
class Chest extends Prop {
  constructor(game, x, y, rng, lesser) {
    super(game, x, y, { r: 22 });
    this.rng = rng;
    this.lesser = !!lesser;
    /* 道具来自数据驱动的道具表，按房间种子抽取 → 同 Seed 完全一致 */
    const build = game.player ? game.player.build : null;
    this.item = pickItem(rng, build, { synergy: true, early: (build ? build.length : 0) < 2 });
    this.label = '开启宝箱';
    this.openT = 0;
  }

  use() {
    if (!super.use()) return false;
    const p = this.game.player;
    const got = p.gainItem(this.item.id);
    if (!got) return false;                 // 已达堆叠上限
    this.game.ui.showBanner(got.name, got.desc, 2.6);
    this.game.damageNumbers.add(this.x, this.y - 30, this.item.name, {
      color: this.item.color, life: 1.3, vy: -40
    });
    this.game.particles.burst(this.x, this.y, 24, {
      speed: 200, life: 0.8, size: 5,
      colors: [this.item.color, '#ffffff', '#ffd35e']
    });
    this.game.particles.ring(this.x, this.y, this.item.color, 18, 180);
    return true;
  }

  update(dt) {
    super.update(dt);
    if (this.used && this.openT < 1) this.openT = Math.min(1, this.openT + dt * 3);
  }

  draw(ctx) {
    const t = this.animT;
    const open = this.openT;
    const col = this.used ? '#5d6f7e' : this.item.color;
    this.drawBase(ctx, col, 0.35);
    if (!this.used) this.drawMarker(ctx, col);

    ctx.save();
    ctx.translate(this.x, this.y);
    const bob = this.used ? 0 : Math.sin(t * 2.2) * 2;
    ctx.translate(0, bob);

    /* 箱体 */
    ctx.fillStyle = '#3a2a18';
    roundRectPath(ctx, -20, -10, 40, 22, 4);
    ctx.fill();
    ctx.strokeStyle = '#7a5a2a';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 箱盖（开启时抬起） */
    ctx.save();
    ctx.translate(0, -10 - open * 12);
    ctx.rotate(-open * 0.7);
    ctx.fillStyle = '#4a3520';
    roundRectPath(ctx, -21, -14, 42, 16, 6);
    ctx.fill();
    ctx.strokeStyle = '#8a6a32';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    /* 锁扣 / 内部光 */
    if (!this.used) {
      ctx.fillStyle = '#ffd35e';
      roundRectPath(ctx, -4, -4, 8, 8, 2);
      ctx.fill();
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t * 4);
      ctx.fillStyle = '#ffd35e';
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#ffd35e';
      ctx.beginPath();
      ctx.arc(0, -6, 10, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   Boss 遗物（Boss 房通关掉落）—— 必定是一件强力道具
   ----------------------------------------------------------- */
class BossRelic extends Prop {
  constructor(game, x, y, rng) {
    super(game, x, y, { r: 26 });
    this.rng = rng;
    const build = game.player ? game.player.build : null;
    this.item = pickStrongItem(rng, build);
    this.label = '取走首领遗物';
    this.openT = 0;
  }

  use() {
    if (!super.use()) return false;
    const p = this.game.player;
    const got = p.gainItem(this.item.id);
    if (!got) return false;
    this.game.ui.showBanner('遗物 · ' + got.name, got.desc, 3.2);
    this.game.damageNumbers.add(this.x, this.y - 32, this.item.name, {
      color: this.item.color, life: 1.5, vy: -42
    });
    this.game.particles.burst(this.x, this.y, 34, {
      speed: 240, life: 0.9, size: 6,
      colors: [this.item.color, '#ffffff', '#ffd35e']
    });
    this.game.particles.ring(this.x, this.y, this.item.color, 24, 220);
    this.game.addShake(3);
    return true;
  }

  update(dt) {
    super.update(dt);
    if (this.used && this.openT < 1) this.openT = Math.min(1, this.openT + dt * 2);
    /* 未拾取时持续散发星屑 */
    if (!this.used && Math.random() < dt * 12) {
      const a = Math.random() * TAU;
      this.game.particles.spawn(this.x + Math.cos(a) * 22, this.y + Math.sin(a) * 22,
        Math.cos(a) * 18, Math.sin(a) * 18 - 26, rand(0.5, 1.0), rand(2, 4),
        this.item.color, { drag: 1.2 });
    }
  }

  draw(ctx) {
    const t = this.animT;
    const col = this.used ? '#5d6f7e' : this.item.color;
    this.drawBase(ctx, col, 0.42);
    if (!this.used) this.drawMarker(ctx, col);

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.translate(0, this.used ? 0 : Math.sin(t * 2) * 3);

    /* 三柱残骸托起的光核 */
    ctx.strokeStyle = '#3a2a18';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i - 1) * 1.1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 12, Math.sin(a) * 12 + 8);
      ctx.lineTo(Math.cos(a) * 20, Math.sin(a) * 20 + 20);
      ctx.stroke();
    }

    /* 光核 */
    const rr = 13 + Math.sin(t * 3) * 1.6;
    const g = ctx.createRadialGradient(0, -2, 2, 0, -2, 30);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = this.used ? 0.35 : 1;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -2, 30, 0, TAU);
    ctx.fill();

    ctx.fillStyle = this.used ? '#4a5666' : '#ffffff';
    ctx.beginPath();
    ctx.arc(0, -2, rr * 0.5, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    /* 旋转棱框 */
    ctx.save();
    ctx.rotate(t * 0.9);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    polygonPath(ctx, [[0, -22], [19, 11], [-19, 11]]);
    ctx.stroke();
    ctx.restore();

    ctx.restore();

    /* 未拾取时显示道具名 */
    if (!this.used) {
      ctx.save();
      ctx.font = '700 12px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = col;
      ctx.fillText(this.item.name, this.x, this.y - 42);
      ctx.restore();
    }
  }
}

/* -----------------------------------------------------------
   异象祭坛（Event）—— 随机正负效果
   ----------------------------------------------------------- */
class Shrine extends Prop {
  constructor(game, x, y, rng) {
    super(game, x, y, { r: 24 });
    this.rng = rng;
    this.label = '触碰异象';
    this.outcome = this._roll();
  }

  _roll() {
    const rng = this.rng;
    const roll = rng.next();
    if (roll < 0.30) return { id: 'heal', name: '回响恩泽', desc: '生命完全回复', color: '#7dffb0' };
    if (roll < 0.55) return { id: 'power', name: '残响灌注', desc: '攻击力 +5，最大生命 -8', color: '#ff8a5c' };
    if (roll < 0.78) return { id: 'ember', name: '余烬涌流', desc: '获得 14 余烬', color: '#ffd35e' };
    return { id: 'risk', name: '裂焰契约', desc: '当前生命 -18，暴击率 +15%', color: '#c08bff' };
  }

  use() {
    if (!super.use()) return false;
    const p = this.game.player;
    const o = this.outcome;
    if (o.id === 'heal') p.hp = p.maxHp;
    else if (o.id === 'power') { p.damage += 5; p.maxHp = Math.max(30, p.maxHp - 8); p.hp = Math.min(p.hp, p.maxHp); }
    else if (o.id === 'ember') this.game.embers += 14;
    else if (o.id === 'risk') { p.critChance = Math.min(0.7, p.critChance + 0.15); p.takeDamage(18, this.x, this.y + 60); p.invuln = 0; }

    this.game.ui.showBanner(o.name, o.desc, 2.2);
    this.game.damageNumbers.add(this.x, this.y - 32, o.name, { color: o.color, life: 1.3, vy: -40 });
    this.game.particles.ring(this.x, this.y, o.color, 20, 200);
    return true;
  }

  update(dt) { super.update(dt); }

  draw(ctx) {
    const t = this.animT;
    const col = this.used ? '#5d6f7e' : this.outcome.color;
    this.drawBase(ctx, col, 0.3);
    if (!this.used) this.drawMarker(ctx, col);

    ctx.save();
    ctx.translate(this.x, this.y);

    /* 三根立柱 */
    ctx.strokeStyle = '#2c3446';
    ctx.lineWidth = 5;
    for (let i = 0; i < 3; i++) {
      const a = t * 0.5 + (i / 3) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 16, Math.sin(a) * 8);
      ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 8 - 26);
      ctx.stroke();
    }

    /* 悬浮晶体 */
    const fy = -34 + Math.sin(t * 2) * 3;
    ctx.save();
    ctx.translate(0, fy);
    ctx.rotate(t * 0.8);
    ctx.fillStyle = col;
    ctx.globalAlpha = this.used ? 0.35 : 0.9;
    polygonPath(ctx, [[0, -11], [8, 0], [0, 11], [-8, 0]]);
    ctx.fill();
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }
}

/* -----------------------------------------------------------
   商栈基座（Shop）—— 消耗余烬换取强化
   ----------------------------------------------------------- */
class Pedestal extends Prop {
  constructor(game, x, y, rng, cost) {
    super(game, x, y, { r: 20 });
    this.rng = rng;
    this.cost = cost;
    this.item = pickItem(rng, game.player ? game.player.build : null, { synergy: true });
    this.label = `购买 ${cost} 余烬`;
    this.denyT = 0;
  }

  canAfford() { return this.game.embers >= this.cost; }

  use() {
    if (this.used) return false;
    if (!this.canAfford()) {
      this.denyT = 0.6;
      this.game.damageNumbers.add(this.x, this.y - 28, '余烬不足', { color: '#ff7a7a', life: 0.9 });
      return false;
    }
    this.used = true;
    this.game.embers -= this.cost;
    const got = this.game.player.gainItem(this.item.id);
    if (!got) { this.used = false; this.game.embers += this.cost; return false; }
    this.game.ui.showBanner(got.name, got.desc, 2.6);
    this.game.damageNumbers.add(this.x, this.y - 30, this.item.name, {
      color: this.item.color, life: 1.3, vy: -40
    });
    this.game.particles.burst(this.x, this.y, 20, {
      speed: 180, life: 0.7, size: 4, colors: [this.item.color, '#ffffff', '#7fe4ff']
    });
    return true;
  }

  update(dt) {
    super.update(dt);
    if (this.denyT > 0) this.denyT -= dt;
  }

  draw(ctx) {
    const t = this.animT;
    const col = this.used ? '#4a5a66' : (this.canAfford() ? this.item.color : '#7a6a5a');
    this.drawBase(ctx, this.canAfford() && !this.used ? col : '#5d6f7e', 0.32);
    if (!this.used) this.drawMarker(ctx, col);

    ctx.save();
    ctx.translate(this.x, this.y);

    /* 基座 */
    ctx.fillStyle = '#1d2531';
    roundRectPath(ctx, -18, 0, 36, 14, 3);
    ctx.fill();
    ctx.strokeStyle = '#3c4a5e';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#161d27';
    roundRectPath(ctx, -12, -22, 24, 24, 3);
    ctx.fill();
    ctx.stroke();

    /* 商品 */
    if (!this.used) {
      const fy = -32 + Math.sin(t * 2.4) * 2.5;
      ctx.save();
      ctx.translate(0, fy);
      ctx.rotate(t * 0.9);
      ctx.fillStyle = this.item.color;
      ctx.globalAlpha = this.canAfford() ? 1 : 0.45;
      polygonPath(ctx, [[0, -9], [7, 0], [0, 9], [-7, 0]]);
      ctx.fill();
      ctx.restore();

      /* 价格 */
      ctx.globalAlpha = 1;
      ctx.font = '800 13px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = this.canAfford() ? '#ffd35e' : '#ff7a7a';
      ctx.fillText('◈' + this.cost, 0, 26);
    } else {
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#5d6f7e';
      ctx.beginPath(); ctx.arc(0, -18, 8, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

/* -----------------------------------------------------------
   层间裂隙（Boss 房通关后出现）
   ----------------------------------------------------------- */
class Portal extends Prop {
  constructor(game, x, y, label) {
    super(game, x, y, { r: 30 });
    this.label = label || '进入下一层';
  }

  use() {
    if (!super.use()) return false;
    this.game.particles.burst(this.x, this.y, 40, {
      speed: 300, life: 1.0, size: 5, colors: ['#ffd35e', '#ff8a5c', '#ffffff', '#7fe4ff']
    });
    this.game.nextFloor();
    return true;
  }

  draw(ctx) {
    const t = this.animT;
    ctx.save();
    ctx.translate(this.x, this.y);

    /* 外圈旋转符环 */
    ctx.strokeStyle = 'rgba(255,200,110,0.55)';
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 3; i++) {
      const a0 = t * (0.8 + i * 0.4) + (i / 3) * TAU;
      ctx.beginPath();
      ctx.arc(0, 0, 30 + i * 9, a0, a0 + Math.PI * 1.2);
      ctx.stroke();
    }

    /* 裂隙核心 */
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 34);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, '#ffd35e');
    g.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 34 + Math.sin(t * 3) * 3, 0, TAU);
    ctx.fill();

    ctx.restore();
    this.drawBase(ctx, '#ffd35e', 0.4);
  }
}
