<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>残响回廊 · ECHO RIFT</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="game-canvas" width="1280" height="720"></canvas>

  <div id="ui-layer">
    <button id="fs-btn" type="button">全屏 · F</button>

    <div id="overlay" class="overlay">
      <div class="panel">
        <div class="ov-kicker" id="ov-kicker">ORIGINAL ROGUELIKE SHOOTER</div>
        <h1 class="ov-title-cn" id="ov-title-cn">残响回廊</h1>
        <div class="ov-title-en" id="ov-title-en">ECHO RIFT</div>
        <p class="ov-text" id="ov-text">
          星脉崩解之后，回廊在裂隙中生长。<br>
          徘徊其中的，是回声凝成的残形。<br><br>
          你是最后的拾火者，收集余烬，向更深处走。
        </p>
        <button class="primary-btn" id="ov-btn" type="button">开始探索</button>
        <div class="ov-hint" id="ov-hint">WASD 移动 · 鼠标瞄准 · 左键射击 · ESC 暂停 · F 全屏</div>
      </div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/input.js"></script>
<script src="js/collision.js"></script>
<script src="js/particles.js"></script>
<script src="js/projectile.js"></script>
<script src="js/player.js"></script>
<script src="js/enemy.js"></script>
<script src="js/room.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
